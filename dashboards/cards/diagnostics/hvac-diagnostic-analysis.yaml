# HVAC Diagnostic Analysis — full-width markdown status card
# Dashboard: HVAC Diagnostics
# Consumes: hvac_furnace_cycle_mean_7d/sigma_7d/upper_bound/lower_bound/
#   data_count, hvac_furnace_short_cycle_pct_7d, hvac_furnace_min_per_cycle(_month),
#   hvac_ac_min_per_cycle/cycle_mean_7d/cycle_sigma_7d/short_cycle_pct_7d/
#   cycle_data_count, hvac_runtime_per_hdd_7_day(_mean)/upper_bound_1s/
#   lower_bound_1s/data_count, hvac_furnace_runtime_today, hvac_furnace_cycles_today,
#   hvac_chaining_index(_month), hvac_zone_balance_month, hvac_1f/2f_heat_runtime_today,
#   hvac_total_cycles_today, hvac_1f/2f_last_recovery_minutes, hvac_1f/2f_hold_setpoint,
#   hvac_hdd65_today, hvac_cdd65_today, hdd_cumulative_month_auto, cdd_cumulative_month_auto,
#   pirate_weather_temperature, hvac_furnace_running, hvac_ac_running,
#   hvac_pipeline_status (+ hdd_capture/cdd_capture/furnace_mpc_capture/ac_mpc_capture
#   attributes).
#
# 2026-09-14: Furnace Cycle Quality header and Short-cycle rate row now show a
# neutral ⚪ / "Furnace did not run in the 7-day window — no cycles to assess"
# instead of a false 🟢 "healthy"/"No short-cycle days" reading when
# mpc_samples < 3 (i.e. genuinely no cycle data, not a measured 0%). Mirrors
# the pattern the AC Cycle Quality section below already used. See
# CHANGELOG.md 2026-09-14.
type: markdown
content: |
  {# ── Live sensor reads ─────────────────────────────────────────── #} {% set outdoor       = states('sensor.pirate_weather_temperature')          | float(0) %} {% set hdd_today     = states('sensor.hvac_hdd65_today')                   | float(0) %} {% set cdd_today     = states('sensor.hvac_cdd65_today')                   | float(0) %} {% set hdd_mtd       = states('input_number.hdd_cumulative_month_auto')    | float(0) %} {% set cdd_mtd       = states('input_number.cdd_cumulative_month_auto')    | float(0) %}
  {# ── Furnace cycle quality ─────────────────────────────────────── #} {% set mpc_live      = states('sensor.hvac_furnace_min_per_cycle')         | float(0) %} {% set mpc_mean      = states('sensor.hvac_furnace_cycle_mean_7d')         | float(0) %} {% set mpc_sigma     = states('sensor.hvac_furnace_cycle_sigma_7d')        | float(0) %} {% set mpc_ucl       = states('sensor.hvac_furnace_cycle_upper_bound')     | float(0) %} {% set mpc_lcl       = states('sensor.hvac_furnace_cycle_lower_bound')     | float(0) %} {% set mpc_samples   = states('sensor.hvac_furnace_cycle_data_count')      | int(0) %} {% set short_pct_7d  = states('sensor.hvac_furnace_short_cycle_pct_7d')    | float(0) %} {% set mpc_mtd       = states('sensor.hvac_furnace_min_per_cycle_month')   | float(0) %}
  {# ── AC cycle quality ──────────────────────────────────────────── #} {% set ac_mpc_live   = states('sensor.hvac_ac_min_per_cycle')              | float(0) %} {% set ac_mpc_mean   = states('sensor.hvac_ac_cycle_mean_7d')              | float(0) %} {% set ac_mpc_sigma  = states('sensor.hvac_ac_cycle_sigma_7d')             | float(0) %} {% set ac_short_7d   = states('sensor.hvac_ac_short_cycle_pct_7d')         | float(0) %} {% set ac_samples    = states('sensor.hvac_ac_cycle_data_count')           | int(0) %}
  {# ── Runtime / efficiency ──────────────────────────────────────── #} {% set rt_hdd_7d     = states('sensor.hvac_runtime_per_hdd_7_day')          | float(0) %} {% set rt_hdd_mean   = states('sensor.hvac_runtime_per_hdd_7_day_mean')     | float(0) %} {% set rt_hdd_ucl    = states('sensor.hvac_runtime_per_hdd_upper_bound_1s')   | float(0) %} {% set rt_hdd_lcl    = states('sensor.hvac_runtime_per_hdd_lower_bound_1s')   | float(0) %} {% set rt_count      = states('sensor.hvac_runtime_per_hdd_data_count')    | int(0) %} {% set furn_runtime  = states('sensor.hvac_furnace_runtime_today')         | float(0) %} {% set furn_cycles   = states('sensor.hvac_furnace_cycles_today')          | int(0) %}
  {# ── Zone balance ──────────────────────────────────────────────── #} {% set chain         = states('sensor.hvac_chaining_index')                | float(0) %} {% set chain_mtd     = states('sensor.hvac_chaining_index_month')         | float(0) %} {% set zone_bal      = states('sensor.hvac_zone_balance_month')            | float(50) %} {% set rt_1f         = states('sensor.hvac_1f_heat_runtime_today')         | float(0) %} {% set rt_2f         = states('sensor.hvac_2f_heat_runtime_today')         | float(0) %} {% set calls_today   = states('sensor.hvac_total_cycles_today')            | int(0) %}
  {# ── Setback recovery ──────────────────────────────────────────── #} {% set rec_1f        = states('input_number.hvac_1f_last_recovery_minutes') | float(0) %} {% set rec_2f        = states('input_number.hvac_2f_last_recovery_minutes') | float(0) %} {% set hold_1f       = states('input_number.hvac_1f_hold_setpoint')        | float(67) %} {% set hold_2f       = states('input_number.hvac_2f_hold_setpoint')        | float(67) %}
  {# ── Pipeline status ───────────────────────────────────────────── #} {% set pipe_status   = states('sensor.hvac_pipeline_status') %} {% set hdd_ok        = state_attr('sensor.hvac_pipeline_status','hdd_capture') %} {% set cdd_ok        = state_attr('sensor.hvac_pipeline_status','cdd_capture') %} {% set fmpc_ok       = state_attr('sensor.hvac_pipeline_status','furnace_mpc_capture') %} {% set ampc_ok       = state_attr('sensor.hvac_pipeline_status','ac_mpc_capture') %}
  {# ── Derived flags ─────────────────────────────────────────────── #} {% set mpc_in_ctrl   = mpc_samples >= 3 and mpc_lcl <= mpc_mean <= mpc_ucl %} {% set rt_in_ctrl    = rt_count >= 3 and rt_hdd_lcl <= rt_hdd_7d <= rt_hdd_ucl %} {% set heating_on    = is_state('binary_sensor.hvac_furnace_running', 'on') %} {% set cooling_on    = is_state('binary_sensor.hvac_ac_running', 'on') %} {% set mode_word     = 'heating' if heating_on else ('cooling' if cooling_on else 'idle') %}
  {# ── Overall health score (0-4 issues) ────────────────────────── #} {% set issues = namespace(n=0) %} {% if short_pct_7d >= 60 %}{% set issues.n = issues.n + 1 %}{% endif %} {% if rt_count >= 3 and rt_hdd_7d > rt_hdd_ucl %}{% set issues.n = issues.n + 1 %}{% endif %} {% if pipe_status == 'fault' %}{% set issues.n = issues.n + 1 %}{% endif %} {% if ac_samples >= 3 and ac_short_7d >= 60 %}{% set issues.n = issues.n + 1 %}{% endif %}
  <div style="font-family:'Roboto',sans-serif; line-height:1.55; max-width:920px;">
  <h2 style="border-bottom:2px solid #444; padding-bottom:5px; margin-bottom:6px; font-size:1.05em;"> 🩺 Diagnostic Analysis — {{ '🟢 All systems normal' if issues.n == 0 else ('🟡 ' ~ issues.n ~ ' item' ~ ('s' if issues.n > 1 else '') ~ ' need attention') if issues.n <= 2 else '🔴 Multiple issues — review below' }} </h2> <p style="color:#666; font-size:0.80em; margin:0 0 12px 0;"> Furnace {{ '▶ running' if heating_on else '◼ idle' }} · AC {{ '▶ running' if cooling_on else '◼ idle' }} · {{ outdoor }}°F outdoor · HDD today {{ hdd_today | round(1) }} · CDD today {{ cdd_today | round(1) }} · Updated {{ now().strftime('%H:%M') }} </p>
  {# ── FURNACE CYCLE QUALITY ─────────────────────────────────────── #} <h3 style="margin:0 0 4px 0; font-size:0.95em;"> {{ '⚪' if mpc_samples < 3 else ('🟢' if short_pct_7d < 30 else ('🟡' if short_pct_7d < 60 else '🔴')) }} Furnace Cycle Quality </h3> <table style="width:100%; border-collapse:collapse; font-size:0.86em; margin-bottom:10px;"> <tr style="color:#888; border-bottom:1px solid #333;"> <td style="padding:3px 8px; width:26%;">Metric</td> <td style="padding:3px 8px; width:18%;">Value</td> <td style="padding:3px 8px;">Interpretation</td> </tr> <tr style="border-bottom:1px solid #222;"> <td style="padding:4px 8px; color:#aaa;">Live min/cycle</td> <td style="padding:4px 8px; font-weight:bold;"> {{ mpc_live | round(1) if mpc_live > 0 else '—' }}{{ ' min' if mpc_live > 0 else '' }} </td> <td style="padding:4px 8px; color:#888;"> {{ '🟢 healthy cycle in progress' if mpc_live >= 8 and heating_on else ('🔴 short cycle — under 8 min' if mpc_live > 0 and mpc_live < 8 and heating_on else 'furnace not currently running') }} </td> </tr> <tr style="border-bottom:1px solid #222;"> <td style="padding:4px 8px; color:#aaa;">7-day mean</td> <td style="padding:4px 8px; font-weight:bold;"> {{ mpc_mean | round(1) if mpc_mean > 0 else '—' }}{{ ' min' if mpc_mean > 0 else '' }} </td> <td style="padding:4px 8px; color:#888;"> {% if mpc_samples < 3 %} ⚪ Insufficient data ({{ mpc_samples }}/3 minimum days) {% elif mpc_mean >= 10 %} 🟢 Optimal range — steady-state combustion {% elif mpc_mean >= 8 %} 🟢 Acceptable — above 8-min threshold {% elif mpc_mean >= 6 %} 🟡 Borderline — approaching short-cycle losses {% else %} 🔴 Short-cycling confirmed — check differential settings {% endif %} </td> </tr> <tr style="border-bottom:1px solid #222;"> <td style="padding:4px 8px; color:#aaa;">SPC bounds (7d)</td> <td style="padding:4px 8px; font-weight:bold;"> [{{ mpc_lcl | round(1) }}, {{ mpc_ucl | round(1) }}] </td> <td style="padding:4px 8px; color:#888;"> {% if mpc_samples < 3 %}⚪ Window not yet populated {% elif mpc_mean > mpc_ucl %}🔴 Above UCL — abnormally long cycles (verify sensor) {% elif mpc_mean < mpc_lcl %}🔴 Below LCL — confirm short-cycle correction is working {% else %}🟢 Mean within ±2σ control limits · σ={{ mpc_sigma | round(2) }} {% endif %} </td> </tr> <tr> <td style="padding:4px 8px; color:#aaa;">Short-cycle rate (7d)</td> <td style="padding:4px 8px; font-weight:bold; color:{{ '#888' if mpc_samples < 3 else ('#ff6b6b' if short_pct_7d >= 60 else ('#ffb300' if short_pct_7d >= 30 else '#81c784')) }};"> {{ '—' if mpc_samples < 3 else (short_pct_7d | round(0) | int(0) ~ '%') }} </td> <td style="padding:4px 8px; color:#888;"> {% if mpc_samples < 3 %} ⚪ Furnace did not run in the 7-day window — no cycles to assess {% elif short_pct_7d >= 75 %} 🔴 Severe — >75% of days below 8-min threshold · differential settings require review {% elif short_pct_7d >= 60 %} 🔴 High — majority of days short-cycling · verify Ecobee 1F=2.0°F 2F=1.5°F setting {% elif short_pct_7d >= 30 %} 🟡 Moderate — present on shoulder-season low-load days · expected with ECM furnace {% elif short_pct_7d > 0 %} 🟢 Low — within acceptable range for current outdoor conditions {% else %} 🟢 No short-cycle days in 7-day window {% endif %} </td> </tr> </table>
  {# ── AC CYCLE QUALITY ──────────────────────────────────────────── #} <h3 style="margin:0 0 4px 0; font-size:0.95em;"> {{ '⚪' if ac_samples == 0 else ('🟢' if ac_short_7d < 30 else ('🟡' if ac_short_7d < 60 else '🔴')) }} AC Cycle Quality </h3> <p style="font-size:0.86em; color:#888; margin:0 0 10px 8px;"> {% if ac_samples == 0 %} ⚪ No AC operation in 7-day window — no cycle data to assess. {% else %} 7d mean: <b>{{ ac_mpc_mean | round(1) }} min/cycle</b> · σ={{ ac_mpc_sigma | round(1) }} · {% if ac_mpc_mean >= 10 %} 🟢 Optimal range. {% elif ac_mpc_mean >= 8 %} 🟡 Borderline — approaching 10-min threshold. {% if ac_mpc_sigma > 4 %} High σ indicates overnight cycles are shorter than daytime runs.{% endif %} {% else %} 🔴 Short-cycling — compressor contactor wear risk. Verify 1F cool differential ≥ 2.0°F and overnight setpoint ≥ 78°F. {% endif %} Short-cycle rate: <b>{{ ac_short_7d | round(0) | int(0) }}%</b> {{ '🟢' if ac_short_7d < 30 else ('🟡' if ac_short_7d < 60 else '🔴') }} · {{ ac_samples }} sample days. {% endif %} </p>
  {# ── RUNTIME / HDD EFFICIENCY ──────────────────────────────────── #} <h3 style="margin:0 0 4px 0; font-size:0.95em;"> {{ '⚪' if rt_count < 3 else ('🟢' if rt_in_ctrl else ('🟡' if rt_hdd_7d <= rt_hdd_ucl else '🔴')) }} Runtime Efficiency (7-day SPC) </h3> <p style="font-size:0.86em; color:#888; margin:0 0 10px 8px;"> {% if rt_count < 3 %} ⚪ SPC window needs {{ 3 - rt_count }} more HDD day{{ 's' if (3 - rt_count) > 1 else '' }} to establish control limits. {% else %} Runtime/HDD: <b>{{ rt_hdd_7d | round(1) }} min/HDD</b> · Mean {{ rt_hdd_mean | round(1) }} · Bounds [{{ rt_hdd_lcl | round(1) }}, {{ rt_hdd_ucl | round(1) }}] · {% if rt_hdd_7d > rt_hdd_ucl %} 🔴 <b>Above UCL</b> — furnace working harder than its established norm. Primary suspects: dirty air filter, partially closed registers, or increased duct leakage. Check filter immediately; measure static pressure if filter is clean. {% elif rt_hdd_7d > rt_hdd_mean %} 🟡 Elevated — between mean and UCL. Current outdoor conditions may be driving higher load. Monitor for trend; no action if stable. {% elif rt_hdd_7d >= rt_hdd_lcl %} 🟢 In control — operating within established norms for this season. {% else %} 🔵 Below LCL — verify outdoor temperature sensor and HDD accumulator are updating correctly. {% endif %} {% endif %} </p>
  {# ── ZONE BALANCE AND CHAINING ─────────────────────────────────── #} <h3 style="margin:0 0 4px 0; font-size:0.95em;"> {{ '🟢' if (45 <= zone_bal <= 68) else '🟡' }} Zone Balance &amp; Chaining </h3> <p style="font-size:0.86em; color:#888; margin:0 0 10px 8px;"> <b>Zone balance MTD:</b> {{ zone_bal | round(1) }}% 2F load · {% if zone_bal > 68 %} 🔴 2F heavily dominant — verify 1F damper opens fully and check 1F duct runs. {% elif zone_bal > 58 %} 🟡 2F-dominant — typical for roof load on colonial; monitor for trend above 68%. {% elif zone_bal >= 45 %} 🟢 Balanced — normal 2-zone distribution. {% else %} 🟡 1F-dominant — check 2F thermostat response and zone damper. {% endif %} <br> <b>Chaining index today:</b> {{ chain | round(2) if chain > 0 else '—' }} (MTD: {{ chain_mtd | round(2) }}) · {% if chain_mtd >= 1.5 %} 🟢 Excellent — both zones frequently sharing single furnace ignitions. {% elif chain_mtd >= 1.3 %} 🟢 Good chaining — zones overlapping efficiently. {% elif chain_mtd >= 1.1 %} 🟡 Mostly sequential calls — limited zone heat sharing. {% else %} 🟡 Near 1.0 — essentially single-zone operation pattern this month. {% endif %} <br> Today: {{ furn_cycles }} ignitions · 1F {{ (rt_1f * 60) | round(0) | int(0) }} min · 2F {{ (rt_2f * 60) | round(0) | int(0) }} min · {{ calls_today }} zone calls · {{ furn_runtime | round(2) }}h furnace runtime. </p>
  {# ── SETBACK RECOVERY ──────────────────────────────────────────── #} <h3 style="margin:0 0 4px 0; font-size:0.95em;"> {{ '🟢' if (rec_1f > 0 and rec_1f < 25 and rec_2f > 0 and rec_2f < 35) else ('⚪' if rec_1f == 0 else '🟡') }} Setback Recovery </h3> <p style="font-size:0.86em; color:#888; margin:0 0 10px 8px;"> {% if rec_1f == 0 and rec_2f == 0 %} ⚪ No recovery data yet today — will populate after the next morning setback ramp. {% else %} <b>1F last recovery:</b> {{ rec_1f | round(1) }} min to {{ hold_1f }}°F · {% if rec_1f < 8 %}🟢 Fast — low overnight load{% elif rec_1f < 18 %}🟢 Normal{% elif rec_1f < 25 %}🟡 Slightly long — may reflect cold start or high setback depth{% else %}🔴 Long recovery — check zone damper and duct delivery{% endif %} · <b>2F last recovery:</b> {{ rec_2f | round(1) }} min to {{ hold_2f }}°F · {% if rec_2f < 12 %}🟢 Fast{% elif rec_2f < 25 %}🟢 Normal for 1,500 sq ft zone{% elif rec_2f < 35 %}🟡 Elevated — expected on cold mornings, verify no duct restriction{% else %}🔴 Long — inspect 2F zone damper and verify duct CFM{% endif %}. <br> Recovery time is proportional to setback depth and outdoor temperature; colder mornings will always produce longer values. Σ of 1F + 2F recovery > 50 min warrants investigation. Current total: <b>{{ (rec_1f + rec_2f) | round(0) | int(0) }} min</b> {{ '🟢' if (rec_1f + rec_2f) < 40 else ('🟡' if (rec_1f + rec_2f) < 50 else '🔴') }}. {% endif %} </p>
  {# ── PIPELINE INTEGRITY ────────────────────────────────────────── #} <h3 style="margin:0 0 4px 0; font-size:0.95em;"> {{ '🟢' if pipe_status == 'ok' else ('🟡' if pipe_status == 'degraded' else '🔴') }} Data Pipeline </h3> <p style="font-size:0.86em; color:#888; margin:0 0 6px 8px;"> Status: <b>{{ pipe_status | upper }}</b> · HDD {{ '✓' if hdd_ok == 'ok' else '✗' }} · CDD {{ '✓' if cdd_ok == 'ok' else '✗' }} · Furnace MPC {{ '✓' if fmpc_ok == 'ok' else '✗' }} · AC MPC {{ '✓' if ampc_ok == 'ok' else '✗' }} · {% if pipe_status == 'ok' %} All captures current — SPC window and monthly accumulators updating normally. {% elif pipe_status == 'degraded' %} 🟡 One or more captures stale — check <i>input_datetime.*_capture_last_ok</i> timestamps in Pipeline health panel above. SPC bounds may be based on incomplete data. {% else %} 🔴 Multiple captures failing — SPC analysis and monthly accumulators unreliable. Restart HA and verify automation triggers in Developer Tools. {% endif %} </p>
  </div>
grid_options:
  columns: full
