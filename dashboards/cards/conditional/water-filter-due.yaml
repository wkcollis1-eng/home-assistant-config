# Overview > Home, beside Add Salt! Shows only when there is something to do: the
# cartridge has reached its gallons, or the count was never started. "Never set"
# shows so an empty count cannot pass for a fresh cartridge (R8).
# Tap goes to the filter status card on the SDR Utility Meters view.
type: conditional
conditions:
  - condition: or
    conditions:
      - condition: state
        entity: binary_sensor.water_filter_change_due
        state: "on"
      - condition: state
        entity: binary_sensor.water_filter_change_due
        state: "unavailable"
card:
  type: custom:mushroom-template-card
  primary: >-
    {% if is_state('binary_sensor.water_filter_change_due', 'on') %}Water Filter!
    {% else %}Set Water Filter{% endif %}
  secondary: >-
    {% set gal = states('sensor.water_filter_gallons') | float(-1) %}
    {% if gal >= 0 %}{{ gal | round(0) | int(0) }} gal{% endif %}
  icon: mdi:filter
  color: red
  vertical: true
  features_position: bottom
  tap_action:
    action: navigate
    navigation_path: /sdr-utility-meters/sdr-meters
grid_options:
  columns: 3
  rows: 2
