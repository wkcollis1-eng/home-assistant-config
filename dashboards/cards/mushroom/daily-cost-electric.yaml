# Daily Electric Cost - Mushroom Template Card
# Shows estimated electric cost for today
# Dashboard: HVAC Performance, Billing & Cost
# round(2, default='—'): the sensor has an availability guard since 2026-10-11,
# and a bare round(2) on 'unavailable' is a template error [M, HA /api/template].
type: custom:mushroom-template-card
primary: "${{ states('sensor.hvac_daily_electric_cost_estimate') | round(2, default='—') }}"
secondary: Electric Cost Today
icon: mdi:flash
color: yellow
features_position: bottom
vertical: true
grid_options:
  columns: 6
  rows: 2
