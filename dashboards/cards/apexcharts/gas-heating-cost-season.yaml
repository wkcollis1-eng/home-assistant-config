# Gas Heating Cost — Season (Jul–Jun) — ApexCharts Card
# ======================================================
# Dashboards: Heating HVAC Diagnostics (default dashboard) AND Energy
# Performance > Weekly. The two live copies were identical on 2026-09-23;
# paste this over BOTH (card > Edit > Show code editor, replace all).
# Source of truth: input_number.gas_heat_{cs,ls,ls2}_1..12 (configuration.yaml,
# slot 1 = Jul .. 12 = Jun), written by automations.yaml
# archive_monthly_gas_heat_cost and rolled by reset_season_gas_heat_cost.
#
# THE X-AXIS IS A SEASON AXIS, NOT A CALENDAR DATE (fixed 2026-09-23).
# The original card had graph_span: 13months and no span, so its window was
# "the 13 months ending now" while both lines were drawn at the CURRENT
# season's dates (Jul .. next Jun). Only the elapsed months ever fell inside
# the window: in September the chart showed Aug 2025 .. Sep 2026 with the
# lines squeezed into the last three months, and the future months were
# drawn anyway, so the header read the FULL 12-slot sum, not season-to-date.
#
# apexcharts-card re-stamps the axis from its window on every refresh and
# apex_config.xaxis.min/max cannot override it (see
# spc-running-watts-control-chart.yaml). The window rules in the shipped
# www/community/apexcharts-card/apexcharts-card.js are:
#   span.start -> start = moment().startOf(span.start); end = start + graph_span
#   span.offset -> start and end both shifted by the offset (must be signed)
# There is no "season" unit, so the window is pinned to Jul 1 .. Jun 30 of
# (this calendar year - 1): startOf('year') - 184 d. 184 d = Jul..Dec, the
# same in every year. Jan 1 is EST and Jul 1 EDT, so the window actually opens
# at Jul 1 01:00; and graph_span 1y is 365.25 d, so a window that spans a
# Feb 29 closes Jun 30 07:00. Every point is clamped into [t0, t1].
# The generators then draw the REAL current season (s0, from now) and last
# season on that fixed axis. Only the month is meaningful, so the tooltip
# shows MMM with no year: any year it printed would be the axis's, not the
# data's.
#
# "This season" stops at the current month plus one closing point, with
# extend_to: false, so it never draws a flat line through future months and
# its header (the series' last point) is season-to-date - the same sum
# sensor.gas_heat_season_cost_current gives once the future slots are 0.
# "Last season" keeps all 12 months and the default extend_to (end); its
# header is the full last-season total.
#
# RESERVED IDENTIFIERS: the body runs as AsyncFunction('entity', 'start',
# 'end', 'hass', 'moment', body). Never declare start/end/entity/hass/moment -
# a SyntaxError leaves the card spinning forever with no error shown.
type: custom:apexcharts-card
header:
  show: true
  title: Gas Heating Cost — Season (Jul–Jun)
  show_states: true
  colorize_states: true
graph_span: 1y
span:
  start: year
  offset: -184d
yaxis:
  - min: 0
    decimals: 0
    apex_config:
      title:
        text: $ cumulative
apex_config:
  chart:
    height: 280
  xaxis:
    labels:
      format: MMM
  tooltip:
    x:
      format: MMM
series:
  - entity: sun.sun
    name: This season
    type: line
    curve: stepline
    color: '#c0392b'
    stroke_width: 3
    extend_to: false
    data_generator: |
      const now = new Date();
      const s0 = (now.getMonth() >= 6) ? now.getFullYear() : now.getFullYear() - 1;
      const t0 = new Date(start).getTime();
      const ax = new Date(t0).getFullYear();
      const t1 = new Date(end).getTime();
      const at = (i) => Math.min(Math.max(new Date(ax, 6 + (i - 1), 1).getTime(), t0), t1);
      const done = (now.getFullYear() - s0) * 12 + now.getMonth() - 6 + 1;
      let out = [], cum = 0;
      for (let i = 1; i <= done; i++) {
        const v = parseFloat(hass.states['input_number.gas_heat_cs_' + i]?.state) || 0;
        cum += v;
        out.push([at(i), Math.round(cum * 100) / 100]);
      }
      out.push([at(done + 1), Math.round(cum * 100) / 100]);
      return out;
  - entity: sun.sun
    name: Last season
    type: line
    curve: stepline
    color: '#95a5a6'
    stroke_width: 2
    data_generator: |
      const t0 = new Date(start).getTime();
      const ax = new Date(t0).getFullYear();
      const t1 = new Date(end).getTime();
      const at = (i) => Math.min(Math.max(new Date(ax, 6 + (i - 1), 1).getTime(), t0), t1);
      let out = [], cum = 0;
      for (let i = 1; i <= 12; i++) {
        const v = parseFloat(hass.states['input_number.gas_heat_ls_' + i]?.state) || 0;
        cum += v;
        out.push([at(i), Math.round(cum * 100) / 100]);
      }
      return out;
