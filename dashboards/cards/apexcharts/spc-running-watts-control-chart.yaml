        const t1 = new Date();
        t1.setHours(12, 0, 0, 0);
        const t0 = new Date(t1);
        t0.setDate(t0.getDate() - 6);
        return [[t0.getTime(), v], [t1.getTime(), v]];

# ------------------------------------------------------------------------
# Cooling Efficiency — kWh/CDD SPC
# ------------------------------------------------------------------------
- type: custom:apexcharts-card
  header:
    show: true
    title: Cooling Efficiency — kWh/CDD SPC
    show_states: true
    colorize_states: true
  # 8d window over 7 daily slots: the subgroups are laid out on the last 7
  # of them, so the chart is always full regardless of capture staleness.
  graph_span: 8d
  span:
    end: day
  yaxis:
    - id: spc
      decimals: 2
      apex_config:
        title:
          text: kWh per cooling degree day
  apex_config:
    chart:
      height: 280
    legend:
      show: true
      position: bottom
    tooltip:
      shared: true
      # The x value is subgroup position, not a date. Showing it would
      # assert a date the data does not support.
      x:
        show: false
    xaxis:
      labels:
        show: false
      axisTicks:
        show: false
      title:
        text: last 7 captured subgroups — oldest to newest
  series:
    # Header state reads the raw slot, not the availability-gated daily
    # sensor, so the last captured value always shows.
    - entity: input_number.cooling_kwh_cdd_day_1
      name: Daily subgroup (kWh/CDD)
      type: column
      color: "#2196F3"
      yaxis_id: spc
      float_precision: 2
      data_generator: |
        // X is subgroup POSITION, not a date — see the file header.
        const today = new Date();
        today.setHours(12, 0, 0, 0);
        const out = [];
        for (let i = 0; i < 7; i++) {
          const slot = hass.states['input_number.cooling_kwh_cdd_day_' + (i + 1)];
          const v = slot ? parseFloat(slot.state) : NaN;
          const t = new Date(today);
          t.setDate(t.getDate() - i);
          out.push([t.getTime(), (isFinite(v) && v > 0) ? v : null]);
        }
        return out.reverse();
    - entity: sensor.cooling_kwh_cdd_mean_7d
      name: Centre line (7d mean)
      type: line
      color: "#2e7d32"
      stroke_width: 2
      curve: straight
      yaxis_id: spc
      float_precision: 2
      data_generator: |
        const lim = hass.states['sensor.cooling_kwh_cdd_mean_7d'];
        const v = lim ? parseFloat(lim.state) : NaN;
        if (!isFinite(v)) { return []; }
        // t0/t1, not start/end — those are reserved params (see file header).
        const t1 = new Date();
        t1.setHours(12, 0, 0, 0);
        const t0 = new Date(t1);
        t0.setDate(t0.getDate() - 6);
        return [[t0.getTime(), v], [t1.getTime(), v]];
    - entity: sensor.cooling_kwh_cdd_upper
      name: UCL (+2σ)
      type: line
      color: "#c0504d"
      stroke_width: 1
      curve: straight
      yaxis_id: spc
      float_precision: 2
      data_generator: |
        const lim = hass.states['sensor.cooling_kwh_cdd_upper'];
        const v = lim ? parseFloat(lim.state) : NaN;
        if (!isFinite(v)) { return []; }
        // t0/t1, not start/end — those are reserved params (see file header).
        const t1 = new Date();
        t1.setHours(12, 0, 0, 0);
        const t0 = new Date(t1);
        t0.setDate(t0.getDate() - 6);
        return [[t0.getTime(), v], [t1.getTime(), v]];
    - entity: sensor.cooling_kwh_cdd_lower
      name: LCL (−2σ)
      type: line
      color: "#c0504d"
      stroke_width: 1
      curve: straight
      yaxis_id: spc
      float_precision: 2
      data_generator: |
        const lim = hass.states['sensor.cooling_kwh_cdd_lower'];
        const v = lim ? parseFloat(lim.state) : NaN;
        if (!isFinite(v)) { return []; }
        // t0/t1, not start/end — those are reserved params (see file header).
        const t1 = new Date();
        t1.setHours(12, 0, 0, 0);
        const t0 = new Date(t1);
        t0.setDate(t0.getDate() - 6);
        return [[t0.getTime(), v], [t1.getTime(), v]];
