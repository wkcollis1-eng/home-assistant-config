# SDR Meters — complete view
# Paste into: Edit dashboard → three-dot menu → Raw configuration editor,
# as one entry under `views:`.
#
# 2026-08-22: four R900 status cards added. Everything else is byte-identical
# to the view as it stood.
#
#   [new] Leak now banner        conditional, top of view — an active leak
#                                outranks meter health, so it sits above Health
#   [new] Leak days banner       conditional, top of view
#   [new] R900 status fields     after Raw counters, where the decode detail is
#   [new] Reading the leak fields
#
# Written in core cards only, matching the rest of this view — no mushroom, no
# HACS dependency. All 39 pre-existing entity ids were checked against the live
# instance before editing; all 39 resolve.
title: SDR Meters
path: sdr-meters
icon: mdi:radio-tower
cards:
  # ---------------------------------------------------------------- NEW
  # An active leak outranks everything else on this view, so it sits above
  # Health. Hidden entirely when LeakNow is 0 — and also when it is unknown or
  # unavailable, because a card that appears on `unknown` is a card you learn
  # to ignore. Conditions in a conditional card are ANDed.
  - type: conditional
    conditions:
      - entity: sensor.water_meter_leak_now
        state_not: "0"
      - entity: sensor.water_meter_leak_now
        state_not: "unknown"
      - entity: sensor.water_meter_leak_now
        state_not: "unavailable"
    card:
      type: markdown
      title: ⚠ Water leak reported NOW
      content: >
        The R900 `LeakNow` field reads
        **{{ states('sensor.water_meter_leak_now') }} of 3** — this is the
        past-24 h indicator, so water is running that the meter considers
        continuous.


        Lifetime volume {{ states('sensor.water_meter_volume') }} gal, today
        {{ states('sensor.water_daily') }} gal. Last decode
        {{ states('sensor.water_meter_age') }} min ago.


        Check fixtures before assuming a decode artefact — published R900 field
        ranges do not cover every observed value.

  - type: conditional
    conditions:
      - entity: sensor.water_meter_leak
        state_not: "0"
      - entity: sensor.water_meter_leak
        state_not: "unknown"
      - entity: sensor.water_meter_leak
        state_not: "unavailable"
    card:
      type: markdown
      title: Water — leak days in the last 35
      content: >
        `Leak` reads **{{ states('sensor.water_meter_leak') }}** day bin{{ 's' if
        states('sensor.water_meter_leak') | int(0) != 1 else '' }}. This counts
        across a 35-day window, so it stays non-zero for weeks after a leak that
        has already been fixed.


        It means "this meter has seen a leak recently", not "water is running
        now" — that is `LeakNow`, which currently reads
        **{{ states('sensor.water_meter_leak_now') }}**.
  # -------------------------------------------------------------- /NEW

  - type: entities
    title: Health
    show_header_toggle: false
    state_color: true
    entities:
      - entity: input_boolean.sdr_alerts_enabled
        name: Alerts enabled
        secondary_info: last-changed
      - type: divider
      - entity: binary_sensor.gas_meter_stale
        name: Gas — stale
      - entity: binary_sensor.water_meter_stale
        name: Water — stale
      - entity: binary_sensor.electric_meter_stale
        name: Electric — stale
      - type: divider
      - entity: sensor.gas_meter_age
        name: Gas — heard ago
      - entity: sensor.water_meter_age
        name: Water — heard ago
      - entity: sensor.electric_meter_age
        name: Electric — heard ago
  - type: markdown
    title: Commissioning notes
    content: >
      **Turn alerts OFF while you are unplugging things.**


      A frozen counter is the real failure mode — MQTT retains the last value,
      so the entity stays *available* with a stale number, which looks identical
      to zero consumption. "Heard ago" is the instrument; value change is not.


      Gas ticks once per ~1.3 furnace-hours in winter and once every 2–5 days in
      summer, so **never** set the gas threshold against value change — only
      against reception.
  - type: entities
    title: Raw counters (what the radio reports)
    show_header_toggle: false
    entities:
      - entity: sensor.gas_meter_reading
        name: Gas — raw count
        secondary_info: last-changed
      - entity: sensor.water_meter_reading
        name: Water — raw count
        secondary_info: last-changed
      - entity: sensor.electric_meter_reading
        name: Electric — raw count
        secondary_info: last-changed
      - type: divider
      - entity: sensor.gas_meter_last_seen
        name: Gas — last decode
      - entity: sensor.water_meter_last_seen
        name: Water — last decode
      - entity: sensor.electric_meter_last_seen
        name: Electric — last decode

  # ---------------------------------------------------------------- NEW
  # These four fields arrive as ATTRIBUTES on sensor.water_meter_reading above
  # and were surfaced as entities on 2026-08-22. Nothing changed upstream — the
  # data had been arriving since the add-on was configured; only the entities
  # were missing, which is why the leak alarm could never fire.
  - type: entities
    title: R900 status fields (water)
    show_header_toggle: false
    state_color: true
    entities:
      - entity: sensor.water_meter_leak_now
        name: Leak now — past 24 h (0–3)
        secondary_info: last-changed
      - entity: sensor.water_meter_leak
        name: Leak — day bins per 35 d (0–15)
        secondary_info: last-changed
      - entity: sensor.water_meter_backflow
        name: Backflow — past 35 d (0–3)
      - type: divider
      - type: section
        label: Diagnostic — encoding unconfirmed, nothing alarms on it
      - entity: sensor.water_meter_no_use
        name: No use — day bins (0–63)
      - type: divider
      - entity: automation.sdr_water_meter_leak_flag_set
        name: Leak alarm
      - entity: input_number.sdr_leak_hold_hours
        name: Leak flag hold (h)
  - type: markdown
    title: Reading the leak fields
    # `|` not `>`: the folded scalar joins consecutive lines with a space, which
    # collapses the table below onto one row. Every other markdown card in this
    # view is fine with `>` because none of them has a table.
    content: |
      Field widths and meanings are from `bemasher/rtlamr` `r900/r900.go` — the
      decoder that produces these attributes — not from a forum post:

      | field | bits | meaning |
      |---|---|---|
      | `LeakNow` | 2 | leak past 24 h, hi/lo |
      | `Leak` | 4 | day bins of leak |
      | `BackFlow` | 2 | backflow past 35 d, hi/lo |
      | `NoUse` | 6 | day bins of no use |

      **The two leak fields answer different questions.** `Leak` counts day bins
      across 35 days — "has this meter seen a leak recently". `LeakNow` is the
      past-24 h field — "is water running now". The alarm currently triggers on
      `Leak`, which is right for a "go look" notice and wrong for "act now";
      adding a second, louder path on `LeakNow` is CLAUDE.md P9.

      **`NoUse` is not trusted.** It reads 35 on a house consuming ~91 gal/day,
      which is not credible as 35 day bins of no use — either the bin encoding
      differs on R900 v4 or the field is offset. Published as a diagnostic only.

      **A stale decode is not a clean bill of health.** These fields are only as
      fresh as the last frame; check "Water — heard ago" in Health above before
      trusting a zero here.
  # -------------------------------------------------------------- /NEW

  # ---------------------------------------------------------------- NEW
  # Overnight minimum flow - the leak instrument. Added 2026-08-22.
  # Subgroup-ordered like the SPC charts, with ONE INVERSION from them: here
  # 0.00 gal/h is a PERFECT night and must plot, while -1 is the "no night
  # recorded" sentinel that draws a gap. The data_generators were executed in
  # node against five edge cases before shipping - including a week of zeros,
  # which the SPC `v > 0` test would have rendered as an empty chart.
  # Water — Overnight Minimum Flow
  # ==============================================================================
  # Dashboard: SDR Meters. Source of truth: packages/utility_meters.yaml.
  #
  # WHAT THIS INSTRUMENT IS. The minimum consumption across five hourly bins
  # between 00:00 and 05:00 local. Nobody is drawing water on purpose, so a
  # leak-free house reads 0.00-0.02 gal/h. A RISING MINIMUM is the leak signal —
  # not any single value — which is why the 7-night mean is on the chart and why
  # the bars matter less than their slope.
  #
  # WHY MINIMUM AND NOT TOTAL: the softener regenerates ~monthly at ~02:00 and
  # draws tens of gallons. It lands in one or two of five bins; the minimum comes
  # from a clean one. The maximum from the same capture is the regen detector.
  #
  # ------------------------------------------------------------------------------
  # THE ONE INVERSION — READ BEFORE EDITING THE JS.
  # Every other slot-buffer chart in this config treats 0 as "no valid subgroup
  # that day" and draws a gap for it. THIS BUFFER IS THE OPPOSITE: 0.00 gal/h is a
  # PERFECT night and must be plotted. The "no night recorded" sentinel is -1.
  # Test on `v >= 0`, never `v > 0`. Copying the SPC test would silently hide
  # every clean night and bias the chart toward looking leaky — the same inversion
  # already caught once in sensor.water_overnight_min_mean_7d.
  # ------------------------------------------------------------------------------
  #
  # X-AXIS IS SUBGROUP ORDER, NOT A DATE — same reasoning as
  # apexcharts/spc-running-watts-control-chart.yaml. day_1 is the most recent
  # captured night and the slots rotate only on a successful capture, so slot
  # index is not calendar age. Dates are suppressed so nothing on the chart
  # asserts one; the real capture stamp is in the detail rows below.
  #
  # RESERVED IDENTIFIERS in data_generator: the body is wrapped as
  #   AsyncFunction('entity','start','end','hass','moment', "'use strict'; "+body)
  # so declaring `const start`/`const end` is a SyntaxError that leaves the card
  # spinning on "loading" forever with no error. This file uses t0/t1.
  - type: vertical-stack
    cards:
      # --- loud only when it matters ------------------------------------------
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.water_overnight_leak_suspected
            state: "on"
        card:
          type: markdown
          title: ⚠ Overnight minimum flow is above threshold
          content: >
            Last night's minimum hourly bin was
            **{{ states('sensor.water_overnight_min_flow') }} gal/h** over
            {{ states('sensor.water_overnight_bins') }} valid bins, against a
            threshold of
            {{ states('input_number.water_overnight_leak_threshold') }} gal/h.


            With nobody drawing water, that is
            {{ (states('sensor.water_overnight_min_flow') | float(0) * 24) | round(1) }}
            gal/day. Check toilets first — a flapper seep is the usual cause at this
            magnitude. The 7-night mean is
            {{ states('sensor.water_overnight_min_mean_7d') }} gal/h; a RISING mean
            is the real signal.

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.water_overnight_capture_stale
            state: "on"
        card:
          type: markdown
          title: Overnight capture has not run
          content: >
            No usable night since
            {{ states('input_datetime.water_overnight_capture_last_ok') }}.
            A night needs {{ states('input_number.water_overnight_min_bins') }} of 5
            clean hourly bins; last night closed
            {{ states('sensor.water_overnight_bins') }}. The bars below are older
            than they look — the slots rotate only on a successful capture.

      # --- the trend, which is the actual instrument --------------------------
      - type: custom:apexcharts-card
        header:
          show: true
          title: Water — Overnight Minimum Flow
          show_states: true
          colorize_states: true
        # 8d window over 7 nightly slots, laid out on the last 7 day-slots so the
        # chart is always full regardless of capture staleness.
        graph_span: 8d
        span:
          end: day
        yaxis:
          - id: flow
            decimals: 3
            min: 0
            apex_config:
              title:
                text: gal/h (minimum hourly bin, 00:00-05:00)
        apex_config:
          chart:
            height: 260
          legend:
            show: true
            position: bottom
          tooltip:
            shared: true
            x:
              show: false
          xaxis:
            labels:
              show: false
            axisTicks:
              show: false
            title:
              text: last 7 captured nights — oldest to newest
        series:
          - entity: input_number.water_overnight_min_day_1
            name: Overnight min (gal/h)
            type: column
            color: "#1A89F5"
            yaxis_id: flow
            float_precision: 3
            data_generator: |
              // day_1 is the most recent captured night, day_7 the oldest. Laid out
              // on the last 7 day-slots of the window; axis dates are suppressed so
              // no date is asserted. See the file header.
              const today = new Date();
              today.setHours(12, 0, 0, 0);
              const out = [];
              for (let i = 0; i < 7; i++) {
                const slot = hass.states['input_number.water_overnight_min_day_' + (i + 1)];
                const v = slot ? parseFloat(slot.state) : NaN;
                const t = new Date(today);
                t.setDate(t.getDate() - i);
                // >= 0, NOT > 0. Zero is a PERFECT night here and must be plotted;
                // -1 is the "no night recorded" sentinel and draws a gap. This is
                // inverted from every SPC buffer chart in this config — see header.
                out.push([t.getTime(), (isFinite(v) && v >= 0) ? v : null]);
              }
              return out.reverse();

          - entity: sensor.water_overnight_min_mean_7d
            name: 7-night mean — watch the SLOPE
            type: line
            color: "#2e7d32"
            stroke_width: 2
            curve: straight
            yaxis_id: flow
            float_precision: 3
            data_generator: |
              // Flat reference from the CURRENT value, not recorder history: it
              // applies to the whole 7-night window, and reading history made the
              // line vanish on any day the sensor was unavailable.
              const m = hass.states['sensor.water_overnight_min_mean_7d'];
              const v = m ? parseFloat(m.state) : NaN;
              if (!isFinite(v)) { return []; }   // below 2 valid nights -> no line
              // t0/t1, not start/end — reserved params, see file header.
              const t1 = new Date();
              t1.setHours(12, 0, 0, 0);
              const t0 = new Date(t1);
              t0.setDate(t0.getDate() - 6);
              return [[t0.getTime(), v], [t1.getTime(), v]];

          - entity: input_number.water_overnight_leak_threshold
            name: Leak threshold
            type: line
            color: "#c0504d"
            stroke_width: 1
            curve: straight
            yaxis_id: flow
            float_precision: 2
            data_generator: |
              const th = hass.states['input_number.water_overnight_leak_threshold'];
              const v = th ? parseFloat(th.state) : NaN;
              if (!isFinite(v)) { return []; }
              const t1 = new Date();
              t1.setHours(12, 0, 0, 0);
              const t0 = new Date(t1);
              t0.setDate(t0.getDate() - 6);
              return [[t0.getTime(), v], [t1.getTime(), v]];

      # --- the numbers the chart deliberately does not assert ------------------
      - type: entities
        title: Last night
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.water_overnight_min_flow
            name: Minimum hourly bin
          - entity: sensor.water_overnight_min_mean_7d
            name: 7-night mean
          - entity: sensor.water_overnight_bins
            name: Valid bins (need 3 of 5)
          - entity: input_datetime.water_overnight_capture_last_ok
            name: Captured
          - type: divider
          - type: section
            label: The busiest bin — this is the softener
          - entity: sensor.water_overnight_max_flow
            name: Maximum hourly bin
          - entity: binary_sensor.water_softener_regen_last_night
            name: Regen detected
          - type: divider
          - entity: binary_sensor.water_overnight_leak_suspected
            name: Leak suspected
          - entity: input_number.water_overnight_leak_threshold
            name: Leak threshold (gal/h)
          - entity: input_number.water_regen_threshold_gal
            name: Regen threshold (gal)
          - entity: input_number.water_overnight_min_bins
            name: Minimum bins for a usable night
  # -------------------------------------------------------------- /NEW

  - type: entities
    title: Calibration — scale factors
    show_header_toggle: false
    entities:
      - entity: input_number.gas_meter_scale
        name: Gas — ft³ per count
      - entity: input_number.water_meter_scale
        name: Water — gal per count
      - entity: input_number.electric_meter_scale
        name: Electric — kWh per count
    footer:
      type: graph
      entity: sensor.water_meter_volume
      hours_to_show: 24
  - type: markdown
    title: How to calibrate
    content: >
      **Water (do this first).** Note the ProCoder register and the raw count.
      Draw 5 gal into a bucket. Note both again. `gal_per_count = Δgallons /
      Δcount`. Large volume kills the quantisation error.


      **Gas.** Note the odometer and raw count, wait for a few counts to
      accumulate, divide. Expect 100 — the 100G DLT requires a pulse weight of
      at least 100 ft³, matching your ×100 odometer.


      **Electric.** Compare the raw count against the meter LCD (was 30899 kWh).


      Field reports show transmitted values do not always map cleanly to the
      register face, so derive these rather than assuming.
  - type: entities
    title: Calibration — gas bill reconciliation
    show_header_toggle: false
    entities:
      - entity: input_number.gas_btu_factor
        name: BTU factor
      - entity: input_number.gas_pressure_factor
        name: Pressure correction
    footer:
      type: buttons
      entities:
        - entity: sensor.gas_meter_therms
          name: Therms
  - type: entities
    title: Engineering units
    show_header_toggle: false
    entities:
      - entity: sensor.gas_meter_volume
        name: Gas volume
      - entity: sensor.gas_meter_therms
        name: Gas therms
      - entity: sensor.water_meter_volume
        name: Water volume
      - entity: sensor.electric_meter_energy
        name: Electric energy
  - type: entities
    title: Live power & SEM cross-check
    show_header_toggle: false
    entities:
      # SEM only. The utility meter cannot produce an instantaneous figure -
      # its counter moves in 0.01 kWh steps every ~91 s - so this row has no
      # partner and must not be compared against one.
      - entity: sensor.sem_whole_home_power
        name: SEM — instantaneous (2 s, no utility equivalent)
      - type: divider
      # Matched at 10 min. Comparing these two IS meaningful.
      - entity: sensor.utility_electric_power_clean
        name: Utility — 10 min
      - entity: sensor.sem_whole_home_power_10min
        name: SEM — 10 min
      - type: divider
      # Matched at 60 min. This pair is the calibration check.
      - entity: sensor.utility_electric_power_avg
        name: Utility — 60 min mean (counter-derived)
      - entity: sensor.sem_whole_home_power_mean
        name: SEM — 60 min mean
      - type: divider
      - entity: sensor.sem_vs_utility_delta
        name: SEM − Utility
      - entity: sensor.sem_vs_utility_error
        name: SEM error
      - type: divider
      - entity: input_number.sem_compare_window_minutes
        name: Comparison window (reference)
  - type: history-graph
    title: SEM vs utility meter — 60 min means
    hours_to_show: 12
    entities:
      - entity: sensor.utility_electric_power_avg
        name: Utility (traceable)
      - entity: sensor.sem_whole_home_power_mean
        name: SEM
  - type: markdown
    title: Reading the cross-check
    content: >
      The utility meter is **revenue-grade and traceable**. Your 16 SEM CTs have
      never been checked against it. Positive error means SEM reads HIGH.


      **Compare long averages only.** The utility figure is a difference
      quotient over a 30–90 s decode interval with ~10 W of quantisation per
      count, so instantaneous disagreement means nothing. A stable offset over
      days is the real signal.


      **What an offset would mean:** a constant percentage points at CT
      calibration or a burden-resistor value. A constant *wattage* points at a
      load the SEM doesn't cover — a circuit with no CT on it. The two look
      different on this chart, which is why both delta and percent are shown.


      **Watch the trend, not the value.** A slowly growing error is CT drift,
      and that is the thing this instrument exists to catch.
  - type: glance
    title: Today
    show_state: true
    entities:
      - entity: sensor.gas_daily
        name: Gas
      - entity: sensor.water_daily
        name: Water
      - entity: sensor.utility_electric_daily
        name: Electric
  - type: glance
    title: This month
    show_state: true
    entities:
      - entity: sensor.gas_monthly
        name: Gas
      - entity: sensor.water_monthly
        name: Water
      - entity: sensor.utility_electric_monthly
        name: Electric
  - type: entities
    title: Staleness thresholds
    show_header_toggle: false
    entities:
      - entity: input_number.sdr_gas_stale_minutes
        name: Gas threshold
      - entity: input_number.sdr_water_stale_minutes
        name: Water threshold
      - entity: input_number.sdr_electric_stale_minutes
        name: Electric threshold
      - type: divider
      - entity: input_number.sdr_leak_hold_hours
        name: Leak flag hold
  - type: history-graph
    title: Reception age (min) — dongle health
    hours_to_show: 12
    refresh_interval: 60
    entities:
      - entity: sensor.gas_meter_age
        name: Gas
      - entity: sensor.water_meter_age
        name: Water
      - entity: sensor.electric_meter_age
        name: Electric
  - type: markdown
    title: Reading the reception-age chart
    content: >
      A healthy meter sawtooths: age climbs to the transmit interval, then drops
      to zero on each decode.


      **A rising baseline that never returns to zero is the degradation signal**
      — the dongle is being heard less often before it stops entirely. That is
      the failure you would otherwise never see coming, and it is why this chart
      is worth more than the counters above it.


      Water should sawtooth every 15–30 s. Electric similar if the AirPoint is
      programmed for SCM rather than Data on Demand. Gas depends on the 100G
      DLT's transmit interval, which is unknown until observed.
