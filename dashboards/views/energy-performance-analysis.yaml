          {# ── ECOBEE FORWARD PROJECTION ────────────────────────── #} <h3 style="margin-bottom:6px; margin-top:4px;">📈 Ecobee Forward Projection</h3> <div style="background:rgba(50,100,50,0.07); border-left:3px solid #4a8a4a; padding:10px 14px; border-radius:4px; margin-bottom:12px;"> <p style="margin:0 0 8px 0; font-size:0.87em; color:#9abf9a;"> The 90.3 CCF/1kHDD efficiency baseline and 480 BTU/hr-°F UA were established with 75–93% short-cycle rates baked in — reflecting ~83–85% effective seasonal AFUE, not the nominal 95%. With the Ecobee 1F/2F differential settings corrected, the first full heating season (Oct 2026 – Apr 2027) should produce measurably lower values on all four metrics below. The monthly short-cycle archive and runtime/HDD SPC window will be the leading indicators — watch for improvement by November 2026. </p> <table style="width:100%; border-collapse:collapse; font-size:0.86em;"> <tr style="color:#888; border-bottom:1px solid #334;"> <td style="padding:4px 10px; width:30%;">Metric</td> <td style="padding:4px 10px; width:30%;">Current (T6 Pro baseline)</td> <td style="padding:4px 10px; width:25%;">Expected (Ecobee, 1 season)</td> <td style="padding:4px 10px;">Driver</td> </tr> <tr style="border-bottom:1px solid #223;"> <td style="padding:5px 10px; color:#aaa;">Heating intensity</td> <td style="padding:5px 10px; font-weight:bold;">{{ eff_base }} CCF/1k HDD</td> <td style="padding:5px 10px; font-weight:bold; color:#81c784;">~80–83 CCF/1k HDD</td> <td style="padding:5px 10px; color:#888;">Purge losses eliminated</td> </tr> <tr style="border-bottom:1px solid #223;"> <td style="padding:5px 10px; color:#aaa;">Building UA</td> <td style="padding:5px 10px; font-weight:bold;">{{ ua_base }} BTU/hr-°F</td> <td style="padding:5px 10px; font-weight:bold; color:#81c784;">~440–460 BTU/hr-°F</td> <td style="padding:5px 10px; color:#888;">AFUE inflation removed from billing formula</td> </tr> <tr style="border-bottom:1px solid #223;"> <td style="padding:5px 10px; color:#aaa;">Effective seasonal AFUE</td> <td style="padding:5px 10px; font-weight:bold; color:#ff9966;">~83–85%</td> <td style="padding:5px 10px; font-weight:bold; color:#81c784;">~91–93%</td> <td style="padding:5px 10px; color:#888;">Longer cycles → steady-state combustion</td> </tr> <tr style="border-bottom:1px solid #223;"> <td style="padding:5px 10px; color:#aaa;">Annual heating gas</td> <td style="padding:5px 10px; font-weight:bold;">~599 CCF (2025)</td> <td style="padding:5px 10px; font-weight:bold; color:#81c784;">~500–530 CCF</td> <td style="padding:5px 10px; color:#888;">~67 CCF short-cycle waste eliminated</td> </tr> <tr> <td style="padding:5px 10px; color:#aaa;">Annual gas savings</td> <td style="padding:5px 10px; color:#666;">—</td> <td style="padding:5px 10px; font-weight:bold; color:#81c784;"> ~${{ (67 * gas_rate) | round(0) | int(0) }}–${{ (99 * gas_rate) | round(0) | int(0) }}/yr </td> <td style="padding:5px 10px; color:#888;">At ${{ gas_rate }}/CCF · 67–99 CCF range</td> </tr> </table> <p style="margin:8px 0 0 0; font-size:0.82em; color:#777; font-style:italic;"> Projection basis: 67 CCF/yr measured short-cycle waste (Jan–Apr 2025 Resideo data) · effective AFUE estimated from monthly min/cycle distribution · baseline report v1.2.1 (Jan 2026) · next formal review January 2027. When 2026–27 season data is available, update {{ eff_base }} CCF/1kHDD and {{ ua_base }} BTU/hr-°F baselines to reflect true Ecobee-era performance. </p> </div>
