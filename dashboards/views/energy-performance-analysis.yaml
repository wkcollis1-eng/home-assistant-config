# HAND-MAINTAINED - Energy Performance > Analysis view. LIVE: pasted 2026-09-23.
# 2026-09-23: built from .storage/lovelace.energy_performance (the live view) with
# ONE card changed, ARCHIVE ROLLUP: 12M HDD/CDD are BDL (ACIS) instead of the proxy
# hdd_archive_/cdd_archive_ sums, and the normals are the BDL 1991-2020 normals from
# sensor.climate_norms_today instead of 5270 / 650. A red line announces missing inputs.
# Paste AFTER the HA restart that loads the new climate_norms_today attributes.
# Paste: dashboard > pencil > Analysis tab > view menu > Edit in YAML > replace all.
title: Analysis
path: analysis
icon: mdi:chart-line
type: sections
max_columns: 2
sections:
  - type: grid
    column_span: 2
    cards:
      - type: markdown
        content: |
          {# ================================================================ #} {# 12-MONTH ROLLING METRICS — HEATING + COOLING                    #} {# ================================================================ #} {% set eff      = states('sensor.hvac_heating_efficiency_12m')  | float(0) %} {% set eff_base = states('input_number.heating_efficiency_baseline') | float(90.3) %} {% set eff_delta = ((eff / eff_base - 1) * 100) | round(1) %}
          {# 2025 billing-aligned reference from baseline report v1.2.1        #} {# Report uses KBDL HDD, billing-aligned DHW; calendar year 2025     #} {# Investigation threshold: >10% above 95.5 (>105 CCF/1kHDD)        #} {# Action threshold: >15% above 95.5 (>110 CCF/1kHDD)               #} {% set eff_base_2025      = 95.5 %} {% set eff_delta_2025     = ((eff / eff_base_2025 - 1) * 100) | round(1) %} {% set report_investigate = 105.0 %} {% set report_action      = 110.0 %}
          {% set ua       = states('sensor.hvac_building_load_ua_12m') | float(0) %} {% set ua_base  = states('input_number.building_ua_baseline') | float(480) %} {% set ua_delta = ((ua / ua_base - 1) * 100) | round(1) %} {% set ua_diff  = (ua - ua_base) | round(0) | int(0) %}
          {% set eui      = states('sensor.site_eui_estimate') | float(0) %} {% set eui_base = states('input_number.site_eui_baseline') | float(41.7) %} {% set eui_delta = ((eui / eui_base - 1) * 100) | round(1) %}
          {# ================================================================ #} {# ARCHIVE ROLLUP — gas, DHW, HDD, CDD, electric all 12 months     #} {# ================================================================ #} {% set months = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'] %} {% set ns = namespace(hdd_12m=0, cdd_12m=0, gas_12m=0, dhw_12m=0, elec_12m=0) %} {# 2026-09-23: 12M HDD/CDD are official BDL (ACIS, sensor.bdl_degree_days); they were the #} {# sums of the HA proxy input_number.hdd_archive_* / cdd_archive_* #} {% set ns.hdd_12m = state_attr('sensor.bdl_degree_days', 'trailing_12_sum') | float(0) %} {% set ns.cdd_12m = state_attr('sensor.bdl_degree_days', 'trailing_12_cdd_sum') | float(0) %} {% for m in months %}   {% set ns.gas_12m  = ns.gas_12m  + states('input_number.gas_archive_'          ~ m ~ '_ccf') | float(0) %} {% set ns.dhw_12m  = ns.dhw_12m  + states('input_number.dhw_archive_'          ~ m)         | float(0) %} {% set ns.elec_12m = ns.elec_12m + states('input_number.electric_archive_'     ~ m ~ '_kwh') | float(0) %} {% endfor %} {% set heat_ccf_12m = (ns.gas_12m - ns.dhw_12m) | round(1) %} {% set dhw_pct   = ((ns.dhw_12m  / ns.gas_12m)  * 100) | round(1) if ns.gas_12m  > 0 else 0 %} {% set heat_pct  = (100 - dhw_pct) | round(1) %} {% set gas_btu   = ns.gas_12m  * 103700 %} {% set elec_btu  = ns.elec_12m * 3412 %} {% set total_btu = gas_btu + elec_btu %} {% set gas_share  = ((gas_btu  / total_btu) * 100) | round(0) if total_btu > 0 else 0 %} {% set elec_share = ((elec_btu / total_btu) * 100) | round(0) if total_btu > 0 else 0 %}
          {# ================================================================ #} {# WEATHER CONTEXT                                                  #} {# ================================================================ #} {# 2026-09-23: BDL NCEI 1991-2020 annual normals (sensor.climate_norms_today). They were #} {# 5270 / 650: 5270 is the sum of a hard-coded monthly dict that matched no BDL normal. #} {% set hdd_normal = state_attr('sensor.climate_norms_today', 'annual_hdd_normal') | float(0) | round(0) | int(0) %} {% set cdd_normal = state_attr('sensor.climate_norms_today', 'annual_cdd_normal') | float(0) | round(0) | int(0) %} {% set hdd_vs_normal  = ((ns.hdd_12m / hdd_normal - 1) * 100) | round(1) if hdd_normal > 0 and ns.hdd_12m > 0 else 0 %} {% set cdd_vs_normal  = ((ns.cdd_12m / cdd_normal - 1) * 100) | round(1) if ns.cdd_12m > 0 and cdd_normal > 0 else 0 %} {% if 0 in [hdd_normal, cdd_normal, ns.hdd_12m, ns.cdd_12m] %}<p style="color:#ff6b6b;"><b>⚠️ BDL degree days unavailable</b> (sensor.bdl_degree_days trailing_12 / sensor.climate_norms_today normals) - every HDD/CDD comparison on this card is invalid until they return.</p>{% endif %} {% set hdd_vs_abs     = hdd_vs_normal | abs %} {% set cdd_vs_abs     = cdd_vs_normal | abs %}
          {# ================================================================ #} {# COST IMPLICATIONS                                                #} {# ================================================================ #} {% set gas_rate  = states('sensor.gas_effective_rate') | float(1.68) %} {% set elec_rate = 0.29 %}
          {# Heating — extra spend vs baseline over trailing 12M HDD #} {% set extra_ccf_eff  = ((eff - eff_base) / 1000 * ns.hdd_12m) | round(1) %} {% set extra_cost_eff = (extra_ccf_eff * gas_rate) | round(0) | int(0) %}
          {# UA forward-looking penalty at climate normal #} {% set ua_extra_btu_yr  = (ua - ua_base) * hdd_normal * 24 %} {% set ua_extra_ccf_yr  = (ua_extra_btu_yr / (103700 * 0.95)) | round(1) %} {% set ua_extra_cost_yr = (ua_extra_ccf_yr * gas_rate) | round(0) | int(0) %}
          {# ================================================================ #} {# COOLING EFFICIENCY — AC runtime/CDD 12M                         #} {# Computed inline: 12M CDD from archive, AC runtime from MTD      #} {# Note: full 12M AC runtime requires monthly archive — MTD proxy  #} {# until end-of-season monthly data is complete.                   #} {# ================================================================ #} {% set rt_per_cdd_7d    = states('sensor.hvac_runtime_per_cdd_7_day')      | float(0) %} {% set rt_per_cdd_mth   = states('sensor.hvac_runtime_per_cdd_month')      | float(0) %} {% set rt_cdd_upper     = states('sensor.hvac_runtime_per_cdd_upper_bound') | float(0) %} {% set rt_cdd_lower     = states('sensor.hvac_runtime_per_cdd_lower_bound') | float(0) %} {% set rt_cdd_mean      = states('sensor.hvac_runtime_per_cdd_7_day_mean') | float(0) %} {% set rt_cdd_count     = states('sensor.hvac_runtime_per_cdd_data_count') | int(0) %} {% set ac_runtime_mth   = states('sensor.hvac_ac_runtime_month')           | float(0) %} {% set ac_cycles_mth    = states('sensor.hvac_ac_cycles_month')            | int(0) %} {% set ac_mpc_7d        = states('sensor.hvac_ac_cycle_mean_7d')           | float(0) %} {% set ac_sigma_7d      = states('sensor.hvac_ac_cycle_sigma_7d')          | float(0) %} {% set ac_short_pct_7d  = states('sensor.hvac_ac_short_cycle_pct_7d')      | float(0) %} {% set cdd_mtd          = states('input_number.cdd_cumulative_month_auto') | float(0) %} {% set ac_rt_per_cdd_mtd = (ac_runtime_mth * 60 / cdd_mtd) | round(1) if cdd_mtd > 0 else 0 %}
          {# Cooling electric cost estimate (4-ton 14 SEER, 3.92 kW steady-state) #} {% set ac_kw_est        = 3.92 %} {% set ac_kwh_mth       = (ac_runtime_mth * ac_kw_est) | round(1) %} {% set ac_cost_mth      = (ac_kwh_mth * elec_rate) | round(2) %}
          {# ================================================================ #} {# DESIGN DAY HEAT LOSS                                             #} {# CT ASHRAE 99% design temp ≈ 3°F for East Hampton area           #} {# ================================================================ #} {% set design_outdoor   = 3 %} {% set design_indoor    = 70 %} {% set design_dt        = design_indoor - design_outdoor %} {% set heat_loss_now    = (ua      * design_dt) | round(0) | int(0) %} {% set heat_loss_base   = (ua_base * design_dt) | round(0) | int(0) %} {% set furnace_rate     = states('input_number.furnace_heating_rate_btu_hr') | float(100000) %} {% set furnace_output   = (furnace_rate * 0.95) | round(0) | int(0) %} {% set load_factor_now  = ((heat_loss_now  / furnace_output) * 100) | round(1) %} {% set load_factor_base = ((heat_loss_base / furnace_output) * 100) | round(1) %}
          {# ================================================================ #} {# OPERATING PATTERN — HEATING MTD                                  #} {# ================================================================ #} {% set rt_hdd_7d     = states('sensor.hvac_runtime_per_hdd_7_day')          | float(0) %} {% set rt_hdd_mth    = states('sensor.hvac_runtime_per_hdd_month')          | float(0) %} {% set rt_upper      = states('sensor.hvac_runtime_per_hdd_upper_bound_1s') | float(0) %} {% set rt_lower      = states('sensor.hvac_runtime_per_hdd_lower_bound_1s') | float(0) %} {% set rt_mean       = states('sensor.hvac_runtime_per_hdd_7_day_mean')     | float(0) %} {% set rt_count      = states('sensor.hvac_runtime_per_hdd_data_count')     | int(0) %} {% set mpc_month     = states('sensor.hvac_furnace_min_per_cycle_month')    | float(0) %} {% set chain_month   = states('sensor.hvac_chaining_index_month')           | float(1) %} {% set zone_bal      = states('sensor.hvac_zone_balance_month')             | float(50) %} {% set cycles_mth    = states('sensor.hvac_furnace_cycles_month_2')         | int(0) %} {% set runtime_mth   = states('sensor.hvac_furnace_runtime_month_2')        | float(0) %} {% set days_elapsed  = now().day %} {% set cycles_per_day = (cycles_mth / days_elapsed) | round(1) if days_elapsed > 0 else 0 %} {% set bp_ratio      = states('input_number.hdd_balance_point_ratio')       | float(0.844) %} {% set fp_heat       = states('input_number.fireplace_annual_heat_mmbtu')   | float(3.6) %}
          {# Furnace short cycle 7d #} {% set furnace_short_pct_7d = states('sensor.hvac_furnace_short_cycle_pct_7d') | float(0) %}
          {# ================================================================ #} {# ROOT CAUSE SYNTHESIS                                             #} {# Short-cycling inflates BOTH efficiency AND UA via two mechanisms:#} {#   1. Eff: purge/warm-up losses reduce effective AFUE below 0.95  #} {#   2. UA:  billing UA formula assumes 0.95 AFUE; low effective     #} {#           AFUE makes house appear leakier than it is             #} {# ================================================================ #}
          {# Effective AFUE estimate from monthly min/cycle (mpc_month) #} {% if mpc_month >= 10 or mpc_month == 0 %} {% set eff_afue_est        = 0.95 %} {% set short_cycle_severity = 'none' %} {% elif mpc_month >= 8 %} {% set eff_afue_est        = 0.90 %} {% set short_cycle_severity = 'mild' %} {% elif mpc_month >= 6 %} {% set eff_afue_est        = 0.855 %} {% set short_cycle_severity = 'moderate' %} {% else %} {% set eff_afue_est        = 0.81 %} {% set short_cycle_severity = 'severe' %} {% endif %}
          {# Short-cycle corrected UA: removes billing formula AFUE inflation #} {% set ua_corrected       = (ua * eff_afue_est / 0.95) | round(0) | int(0) %} {% set ua_corrected_delta = ((ua_corrected / ua_base - 1) * 100) | round(1) %} {% set ua_artifact        = (ua - ua_corrected) | round(0) | int(0) %}
          {# Estimated gas wasted to cycling losses this trailing 12M #} {% set purge_loss_frac  = ((0.95 - eff_afue_est) / 0.95) | round(3) %} {% set waste_ccf_12m    = (purge_loss_frac * heat_ccf_12m) | round(1) %} {% set waste_cost_12m   = (waste_ccf_12m * gas_rate) | round(0) | int(0) %}
          {# What % of the observed efficiency excess does cycling explain? #} {% set sc_explained_pct = ((waste_ccf_12m / extra_ccf_eff) * 100) | round(0) | int(0) if extra_ccf_eff > 0 else 0 %}
          {# Root cause flag: show synthesis box when both signals are present #} {% set root_cause_short_cycle = mpc_month > 0 and mpc_month < 9 and (eff_delta > 5 or ua_delta > 4) %}
          {# ── Heating SPC status ────────────────────────────── #} {% if rt_count < 3 %} {% set spc_icon   = '⚪' %} {% set spc_label  = 'Insufficient data (' ~ rt_count ~ ' days)' %} {% set spc_detail = '—' %} {% elif rt_hdd_7d > rt_upper %} {% set spc_icon   = '🔴' %} {% set spc_label  = 'OUT OF CONTROL — above +2σ upper bound' %} {% set spc_detail = rt_hdd_7d | round(1) ~ ' vs UCL ' ~ rt_upper | round(1) ~ ' · investigate filter and static pressure' %} {% elif rt_hdd_7d > rt_mean %} {% set spc_icon   = '🟡' %} {% set spc_label  = 'Elevated — between mean and +2σ' %} {% set spc_detail = rt_hdd_7d | round(1) ~ ' vs mean ' ~ rt_mean | round(1) ~ ' min/HDD' %} {% elif rt_hdd_7d >= rt_lower %} {% set spc_icon   = '🟢' %} {% set spc_label  = 'In control' %} {% set spc_detail = rt_hdd_7d | round(1) ~ ' within [' ~ rt_lower | round(1) ~ ', ' ~ rt_upper | round(1) ~ ']' %} {% else %} {% set spc_icon   = '🔵' %} {% set spc_label  = 'Below lower bound — verify sensors' %} {% set spc_detail = rt_hdd_7d | round(1) ~ ' vs lower ' ~ rt_lower | round(1) %} {% endif %}
          {# ── Cooling SPC status ────────────────────────────── #} {% if rt_cdd_count < 3 %} {% set cool_spc_icon  = '⚪' %} {% set cool_spc_label = 'Insufficient data (' ~ rt_cdd_count ~ ' CDD days)' %} {% set cool_spc_detail = '—' %} {% elif rt_per_cdd_7d > rt_cdd_upper %} {% set cool_spc_icon  = '🔴' %} {% set cool_spc_label = 'OUT OF CONTROL — above +2σ upper bound' %} {% set cool_spc_detail = rt_per_cdd_7d | round(1) ~ ' vs UCL ' ~ rt_cdd_upper | round(1) ~ ' · inspect filter, refrigerant charge, condenser coil' %} {% elif rt_per_cdd_7d > rt_cdd_mean %} {% set cool_spc_icon  = '🟡' %} {% set cool_spc_label = 'Elevated — between mean and +2σ' %} {% set cool_spc_detail = rt_per_cdd_7d | round(1) ~ ' vs mean ' ~ rt_cdd_mean | round(1) ~ ' min/CDD' %} {% elif rt_per_cdd_7d >= rt_cdd_lower %} {% set cool_spc_icon  = '🟢' %} {% set cool_spc_label = 'In control' %} {% set cool_spc_detail = rt_per_cdd_7d | round(1) ~ ' within [' ~ rt_cdd_lower | round(1) ~ ', ' ~ rt_cdd_upper | round(1) ~ ']' %} {% else %} {% set cool_spc_icon  = '🔵' %} {% set cool_spc_label = 'Below lower bound — verify sensors' %} {% set cool_spc_detail = rt_per_cdd_7d | round(1) ~ ' vs lower ' ~ rt_cdd_lower | round(1) %} {% endif %}
          {# ── Furnace cycle quality ─────────────────────────── #} {% if mpc_month >= 15 %} {% set cyc_icon  = '🟢' %} {% set cyc_label = 'Long cycles — minimal standby losses' %} {% elif mpc_month >= 10 %} {% set cyc_icon  = '🟢' %} {% set cyc_label = 'Optimal range' %} {% elif mpc_month >= 6 %} {% set cyc_icon  = '🟡' %} {% set cyc_label = 'Moderate — approaching short-cycle threshold' %} {% elif mpc_month > 0 %} {% set cyc_icon  = '🔴' %} {% set cyc_label = 'Short-cycling — elevated standby losses' %} {% else %} {% set cyc_icon  = '⚪' %} {% set cyc_label = 'No data' %} {% endif %}
          {# ── AC cycle quality ──────────────────────────────── #} {% if ac_mpc_7d == 0 %} {% set ac_cyc_icon  = '⚪' %} {% set ac_cyc_label = 'No AC operation in last 7 days' %} {% elif ac_mpc_7d >= 15 %} {% set ac_cyc_icon  = '🟢' %} {% set ac_cyc_label = 'Long cycles — efficient moisture removal, low compressor wear' %} {% elif ac_mpc_7d >= 10 %} {% set ac_cyc_icon  = '🟢' %} {% set ac_cyc_label = 'Optimal range (10–15 min)' %} {% elif ac_mpc_7d >= 8 %} {% set ac_cyc_icon  = '🟡' %} {% set ac_cyc_label = 'Borderline — approaching short-cycle threshold (10 min)' %} {% elif ac_mpc_7d > 0 %} {% set ac_cyc_icon  = '🔴' %} {% set ac_cyc_label = 'Short-cycling — compressor wear risk, poor dehumidification' %} {% else %} {% set ac_cyc_icon  = '⚪' %} {% set ac_cyc_label = 'No data' %} {% endif %}
          {# ── AC sigma assessment (pre-computed to avoid </td> leak) ── #} {% if ac_mpc_7d == 0 %} {% set ac_sigma_label = '⚪ No AC data' %} {% elif ac_sigma_7d > 5 %} {% set ac_sigma_label = '🟡 High variance — daytime cycles healthy, overnight short-cycling likely' %} {% elif ac_sigma_7d > 3 %} {% set ac_sigma_label = '🟡 Moderate variance — mixed day/night cycle lengths' %} {% else %} {% set ac_sigma_label = '🟢 Tight control — consistent cycle lengths' %} {% endif %}
          {# ── AC short-cycle rate ───────────────────────────── #} {% if ac_short_pct_7d == 0 or ac_mpc_7d == 0 %} {% set ac_short_icon  = '⚪' %} {% set ac_short_label = 'No AC data in window' %} {% elif ac_short_pct_7d >= 60 %} {% set ac_short_icon  = '🔴' %} {% set ac_short_label = ac_short_pct_7d | round(0) | int(0) ~ '% of days below 10-min threshold — check cool diff setting (currently 1.5°F recommended, consider 2.0°F for 1F)' %} {% elif ac_short_pct_7d >= 30 %} {% set ac_short_icon  = '🟡' %} {% set ac_short_label = ac_short_pct_7d | round(0) | int(0) ~ '% of days below 10-min threshold — monitor through peak season' %} {% else %} {% set ac_short_icon  = '🟢' %} {% set ac_short_label = ac_short_pct_7d | round(0) | int(0) ~ '% short-cycle days — within acceptable range' %} {% endif %}
          {# ── Zone balance (heating) ────────────────────────── #} {% if zone_bal >= 45 and zone_bal <= 58 %} {% set zone_icon  = '🟢' %} {% set zone_label = 'Balanced — normal for 2-zone colonial' %} {% elif zone_bal > 58 and zone_bal <= 68 %} {% set zone_icon  = '🟡' %} {% set zone_label = '2F-dominant — typical for roof load · monitor' %} {% elif zone_bal > 68 %} {% set zone_icon  = '🔴' %} {% set zone_label = '2F heavily dominant — check 1F damper and duct runs' %} {% else %} {% set zone_icon  = '🟡' %} {% set zone_label = '1F-dominant — check 2F thermostat and zone damper' %} {% endif %}
          {# ── Chaining index ────────────────────────────────── #} {% if chain_month >= 1.6 %} {% set chain_icon  = '🟢' %} {% set chain_label = 'Excellent overlap — zones sharing heat efficiently' %} {% elif chain_month >= 1.3 %} {% set chain_icon  = '🟢' %} {% set chain_label = 'Good zone chaining' %} {% elif chain_month >= 1.1 %} {% set chain_icon  = '🟡' %} {% set chain_label = 'Mostly sequential zone calls · limited heat sharing' %} {% else %} {% set chain_icon  = '🟡' %} {% set chain_label = 'Near 1.0 — essentially single-zone operation' %} {% endif %}
          {# ── Heating trend (7d vs MTD) ─────────────────────── #} {% set trend_pct = ((rt_hdd_7d / rt_hdd_mth - 1) * 100) | round(0) | int(0) if rt_hdd_mth > 0 else 0 %} {% if trend_pct > 15 %} {% set trend_icon  = '🔴' %} {% set trend_label = 'Degrading — 7d is ' ~ trend_pct ~ '% above MTD average' %} {% elif trend_pct > 5 %} {% set trend_icon  = '🟡' %} {% set trend_label = 'Slightly elevated — 7d is ' ~ trend_pct ~ '% above MTD' %} {% elif trend_pct < -15 %} {% set trend_icon  = '🟢' %} {% set trend_label = 'Improving — 7d is ' ~ (trend_pct | abs) ~ '% below MTD average' %} {% elif trend_pct < -5 %} {% set trend_icon  = '🟢' %} {% set trend_label = 'Trending better — 7d is ' ~ (trend_pct | abs) ~ '% below MTD' %} {% else %} {% set trend_icon  = '🟢' %} {% set trend_label = 'Stable — within ±5% of MTD' %} {% endif %}
          {# ── Cooling trend (7d vs MTD) ─────────────────────── #} {% set cool_trend_pct = ((rt_per_cdd_7d / rt_per_cdd_mth - 1) * 100) | round(0) | int(0) if rt_per_cdd_mth > 0 else 0 %} {% if cool_trend_pct > 15 %} {% set cool_trend_icon  = '🔴' %} {% set cool_trend_label = 'Degrading — 7d is ' ~ cool_trend_pct ~ '% above MTD average' %} {% elif cool_trend_pct > 5 %} {% set cool_trend_icon  = '🟡' %} {% set cool_trend_label = 'Slightly elevated — 7d is ' ~ cool_trend_pct ~ '% above MTD' %} {% elif cool_trend_pct < -5 %} {% set cool_trend_icon  = '🟢' %} {% set cool_trend_label = 'Improving — 7d is ' ~ (cool_trend_pct | abs) ~ '% below MTD' %} {% else %} {% set cool_trend_icon  = '🟢' %} {% set cool_trend_label = 'Stable — within ±5% of MTD' %} {% endif %}
