  - type: markdown
    title: Reading the cross-check
    content: |
      The utility meter is **revenue-grade and traceable**. Your 16 SEM CTs have never been checked against it. Positive error means SEM reads HIGH.

      **Compare long averages only.** The utility figure is a difference quotient over a 30–90 s decode interval with ~10 W of quantisation per count, so instantaneous disagreement means nothing. A stable offset over days is the real signal.

      **What an offset would mean:** a constant percentage points at CT calibration or a burden-resistor value. A constant *wattage* points at a load the SEM doesn't cover — a circuit with no CT on it. The two look different on this chart, which is why both delta and percent are shown.

      **Watch the trend, not the value.** A slowly growing error is CT drift, and that is the thing this instrument exists to catch.
  - type: history-graph
    title: Reception age (min) — dongle health
    hours_to_show: 12
    refresh_interval: 15
    entities:
    - entity: sensor.gas_meter_age
      name: Gas
    - entity: sensor.water_meter_age
      name: Water
    - entity: sensor.electric_meter_age
