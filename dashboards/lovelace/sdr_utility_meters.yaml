    - entity: input_number.water_meter_scale
      name: Water — gal per count
    - entity: input_number.electric_meter_scale
      name: Electric — kWh per count
    footer:
      type: graph
      entity: sensor.water_meter_volume
      hours_to_show: 24
  - type: markdown
    title: Reading the reception-age chart
    content: |
      A healthy meter sawtooths: age climbs to the transmit interval, then drops to zero on each decode.

      **A rising baseline that never returns to zero is the degradation signal** — the dongle is being heard less often before it stops entirely. That is the failure you would otherwise never see coming, and it is why this chart is worth more than the counters above it.

      Water should sawtooth every 15–30 s. Electric similar if the AirPoint is programmed for SCM rather than Data on Demand. Gas depends on the 100G DLT's transmit interval, which is unknown until observed.
