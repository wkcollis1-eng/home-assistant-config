        content: |
          No usable night since {{ states('input_datetime.water_overnight_capture_last_ok') }}. A night needs {{ states('input_number.water_overnight_min_bins') }} of 5 clean hourly bins; last night closed {{ states('sensor.water_overnight_bins') }}. The bars below are older than they look — the slots rotate only on a successful capture.
    - type: custom:apexcharts-card
      header:
        show: true
        title: Water — Overnight Minimum Flow
        show_states: true
        colorize_states: true
      graph_span: 8d
      span:
        end: day
      yaxis:
      - id: flow
        decimals: 3
        min: 0
        apex_config:
          title:
            text: gal/h (minimum hourly bin, 00:00-05:00)
      apex_config:
        chart:
          height: 260
        legend:
          show: true
          position: bottom
        tooltip:
          shared: true
          x:
            show: false
        xaxis:
          labels:
            show: false
          axisTicks:
            show: false
          title:
            text: last 7 captured nights — oldest to newest
      series:
      - entity: input_number.water_overnight_min_day_1
        name: Overnight min (gal/h)
        type: column
        color: '#1A89F5'
        yaxis_id: flow
        float_precision: 3
        data_generator: |
          // day_1 is the most recent captured night, day_7 the oldest. Laid out
          // on the last 7 day-slots of the window; axis dates are suppressed so
          // no date is asserted. See the file header.
          const today = new Date();
          today.setHours(12, 0, 0, 0);
          const out = [];
          for (let i = 0; i < 7; i++) {
            const slot = hass.states['input_number.water_overnight_min_day_' + (i + 1)];
            const v = slot ? parseFloat(slot.state) : NaN;
            const t = new Date(today);
            t.setDate(t.getDate() - i);
            // >= 0, NOT > 0. Zero is a PERFECT night here and must be plotted;
            // -1 is the "no night recorded" sentinel and draws a gap. This is
            // inverted from every SPC buffer chart in this config — see header.
            out.push([t.getTime(), (isFinite(v) && v >= 0) ? v : null]);
          }
          return out.reverse();
      - entity: sensor.water_overnight_min_mean_7d
        name: 7-night mean — watch the SLOPE
        type: line
        color: '#2e7d32'
        stroke_width: 2
        curve: straight
        yaxis_id: flow
        float_precision: 3
        data_generator: |
          // Flat reference from the CURRENT value, not recorder history: it
          // applies to the whole 7-night window, and reading history made the
          // line vanish on any day the sensor was unavailable.
          const m = hass.states['sensor.water_overnight_min_mean_7d'];
          const v = m ? parseFloat(m.state) : NaN;
          if (!isFinite(v)) { return []; }   // below 2 valid nights -> no line
          // t0/t1, not start/end — reserved params, see file header.
          const t1 = new Date();
          t1.setHours(12, 0, 0, 0);
          const t0 = new Date(t1);
          t0.setDate(t0.getDate() - 6);
          return [[t0.getTime(), v], [t1.getTime(), v]];
      - entity: input_number.water_overnight_leak_threshold
        name: Leak threshold
        type: line
        color: '#c0504d'
        stroke_width: 1
        curve: straight
        yaxis_id: flow
        float_precision: 2
        data_generator: |
          const th = hass.states['input_number.water_overnight_leak_threshold'];
          const v = th ? parseFloat(th.state) : NaN;
          if (!isFinite(v)) { return []; }
          const t1 = new Date();
          t1.setHours(12, 0, 0, 0);
          const t0 = new Date(t1);
          t0.setDate(t0.getDate() - 6);
          return [[t0.getTime(), v], [t1.getTime(), v]];
