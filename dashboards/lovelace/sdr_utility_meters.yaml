          With nobody drawing water, that is {{ (states('sensor.water_overnight_min_flow') | float(0) * 24) | round(1) }} gal/day. Check toilets first — a flapper seep is the usual cause at this magnitude. The 7-night mean is {{ states('sensor.water_overnight_min_mean_7d') }} gal/h; a RISING mean is the real signal.
    - type: conditional
