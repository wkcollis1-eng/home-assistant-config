    - type: markdown
      title: Outage Data
      content: |
        {% set ah   = states('sensor.ups_monitor_last_outage_ah') | float(0) %} {% set wh   = states('sensor.ups_monitor_last_outage_wh') | float(0) %} {% set dur  = states('sensor.ups_monitor_last_outage_duration') | float(0) %} {% set pct  = states('sensor.ups_monitor_last_outage_capacity_used') | float(0) %} {% set minv = states('sensor.ups_monitor_last_outage_min_voltage') | float(0) %} {% set strv = states('sensor.ups_monitor_last_outage_start_voltage') | float(0) %} {% set chrg = states('sensor.ups_monitor_last_recharge_peak_current') | float(0) %} {% set fltv = states('sensor.ups_monitor_last_float_voltage') | float(0) %} {% set cnt  = states('sensor.ups_monitor_total_outages') | int(0) %} {% set ir   = states('sensor.tv_room_ups_monitor_apparent_ri') | float(0) %} {% set ir_tc = states('sensor.ups_monitor_last_recharge_step_resistance') | float(0) %} {% set ah_o = states('sensor.ups_monitor_ah_delivered_this_outage') | float(0) %} {% set wh_o = states('sensor.ups_monitor_wh_delivered_this_outage') | float(0) %} {% set ah_l = states('sensor.ups_monitor_ah_delivered_lifetime') | float(0) %} {% set wh_l = states('sensor.ups_monitor_wh_delivered_lifetime') | float(0) %}
        **Last Outage**{% if cnt > 0 %} *(#{{ cnt }})*{% endif %}

        | Metric | Value |
        | :--- | ---: |
        | Duration | {{ dur | round(1) }} min |
        | Ah Used | {{ ah | round(4) }} Ah |
        | Wh Used | {{ wh | round(3) }} Wh |
        | Capacity Used | {{ pct | round(1) }}% of 4.18 Ah |
        | Start Voltage | {{ '%.3f V' | format(strv) if strv > 0 else '---' }} |
        | Min Voltage | {{ '%.3f V' | format(minv) if minv > 0 else '---' }} |
        | Peak Recharge | {{ '%.3f A' | format(chrg) if chrg > 0 else '---' }} |
        | Apparent Ri | {{ '%.1f mOhm' | format(ir) if ir > 0 else '---' }} |
        | Last Recharge Resistance | {{ '%.1f mOhm' | format(ir_tc) if ir_tc > 0 else '---' }} |

        ***
        **This Outage** *(live if on battery)*

        | Metric | Value |
        | :--- | ---: |
        | Ah | {{ ah_o | round(4) }} Ah |
        | Wh | {{ wh_o | round(3) }} Wh |

        ***
        **Lifetime Totals**

        | Metric | Value |
        | :--- | ---: |
        | Ah Delivered | {{ ah_l | round(2) }} Ah |
        | Wh Delivered | {{ wh_l | round(1) }} Wh |

        ***
        **PSU & Battery Health** *(baseline: Ri = 96.6 mΩ at 78 °F, May 2026)*

        | Metric | Value |
        | :--- | ---: |
        | Last Float Voltage | {{ '%.3f V' | format(fltv) if fltv > 0 else '---' }} |
        | Apparent Ri (raw) | {{ '%.1f mOhm' | format(ir) if ir > 0 else '---' }} |
        | Last Recharge Resistance | {{ '%.1f mOhm' | format(ir_tc) if ir_tc > 0 else '---' }} |
    column_span: 2
