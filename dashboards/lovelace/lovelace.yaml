  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: |
        ## 4 · Basement TH Node (SHT45) — CONTROL SENSOR
    - type: entities
      title: Basement TH Node — Live
      state_color: true
      entities:
      - entity: sensor.basement_th_node_basement_temperature
        name: Temperature (SHT45)
      - entity: sensor.basement_th_node_basement_humidity
        name: RH raw — CONTROL VAR
      - entity: sensor.basement_th_node_basement_humidity_smoothed
        name: RH smoothed (median-5)
      - entity: sensor.basement_th_node_basement_dew_point
        name: Dew point (native)
      - entity: sensor.basement_th_node_basement_absolute_humidity
        name: Absolute humidity
    - type: entities
      title: Node-native rates — RAW FIRMWARE OUTPUT, different convention
      state_color: true
      entities:
      - entity: sensor.basement_th_node_basement_moisture_removal_rate_30m
        name: Node moisture removal 30m (g/m³/h)
      - entity: sensor.basement_th_node_basement_rh_rate_15m
        name: Node ΔRH/h 15m
      - entity: sensor.basement_th_node_basement_rh_rate_30m
        name: Node ΔRH/h 30m
      - entity: sensor.basement_th_node_basement_temp_rate_30m
        name: Node ΔT/h 30m — °C/h, NOT °F/h
    - type: markdown
      content: |
        ℹ️ **These four are computed in ESPHome firmware, not by the canonical derivative set on card 2** — and as of 2026-08-24 they have been read against the firmware rather than guessed at. `esphome/basement-th-node.yaml` computes them as **60 s least-squares slopes over a 180-sample ring** (Rev 2.2, marked DIAGNOSTIC ONLY and explicitly barred from feeding control or the HA stall detector). A least-squares slope carries the **natural sign**, so negative = falling, the same convention as card 2. Only ONE real difference survives: the unit on the temperature rate.

        `basement_temp_rate_30m` in particular is in **°C/h**, because the node derives its slope from the SHT45's native Celsius reading while publishing temperature in °F. The dashboard now uses `sensor.basement_temp_rate` instead — a derivative taken in HA off the node's **°F** temperature, so it is °F/h at the root rather than scaled after the fact, and it shares one formula with every other rate.

        *For the record, since it is the thing people get wrong: a rate is a difference per unit time, so only the 9/5 scale applies and the +32 offset does not. 1 °C/h = 1.8 °F/h, and 0 °C/h = 0 °F/h — not 32.*

        **To retire this card**, change `t_rate_30` in `esphome/basement-th-node.yaml` to publish °C/h × 1.8 with `unit_of_measurement: "°F/h"`, or delete the four node rate sensors from firmware and rely on the HA-side set. The file is in the repo — this card previously said it "is not in hand", which had stopped anyone closing the question. Per the esp-firmware-validation gate, that edit is not done until `src/main.cpp.o` compiles with 0 errors; codegen alone does not compile lambdas.
    - type: entities
      title: Cross-Check — Control (SHT45) vs Validation (Shelly)
      state_color: true
      entities:
      - entity: binary_sensor.basement_rh_sensors_disagree
        name: Cross-check drift flag
      - type: divider
      - entity: sensor.basement_rh_delta_mean_24h
        name: ΔRH 24h mean (SHT45 − Shelly)
      - entity: sensor.basement_dp_delta_mean_24h
        name: ΔDewpoint 24h mean
      - entity: sensor.basement_temp_delta_mean_24h
        name: ΔTemp 24h mean
      - type: divider
      - entity: sensor.basement_rh_delta_sht45_vs_shelly
        name: ΔRH instantaneous (5-min sample)
      - entity: input_number.basement_rh_delta_tolerance
        name: Drift tolerance
    - type: custom:apexcharts-card
      header:
        show: true
        title: RH — Control (SHT45) vs Validation (Shelly) — guards the setpoint
        show_states: true
        colorize_states: true
      graph_span: 12h
      span:
        end: hour
      yaxis:
      - id: rh
        decimals: 1
        apex_config:
          title:
            text: '%RH'
      series:
      - entity: sensor.basement_th_node_basement_humidity
        name: SHT45 raw (what the delta measures)
        yaxis_id: rh
        type: line
        stroke_width: 2
        color: '#ff9800'
        group_by:
          func: avg
          duration: 5min
      - entity: sensor.shelly_temperature_humidity_humidity
        name: Shelly (validation only)
        yaxis_id: rh
        type: line
        stroke_width: 2
        color: '#1565c0'
        group_by:
          func: avg
          duration: 5min
    - type: custom:apexcharts-card
      header:
        show: true
        title: Dew Point — Control (SHT45) vs Validation (Shelly)
        show_states: true
        colorize_states: true
      graph_span: 12h
      span:
        end: hour
      yaxis:
      - id: dp
        decimals: 1
        apex_config:
          title:
            text: °F
      series:
      - entity: sensor.basement_th_node_basement_dew_point
        name: Control DP (SHT45, Magnus)
        yaxis_id: dp
        type: line
        stroke_width: 2
        color: '#ff9800'
        group_by:
          func: avg
          duration: 5min
      - entity: sensor.shelly_dew_point
        name: Validation DP (Shelly, Magnus)
        yaxis_id: dp
        type: line
        stroke_width: 2
        color: '#1565c0'
        group_by:
          func: avg
          duration: 5min
    - type: custom:apexcharts-card
      header:
        show: true
        title: Cross-Check Delta (SHT45 − Shelly) — is the bias stable?
        show_states: true
        colorize_states: true
      graph_span: 12h
      span:
        end: hour
      yaxis:
      - id: rh
        decimals: 2
        apex_config:
          title:
            text: '%RH  /  °F'
      apex_config:
        annotations:
          yaxis:
          - 'y': 0
            borderColor: '#2e7d32'
            strokeDashArray: 4
            label:
              text: agreement
              borderColor: '#2e7d32'
              style:
                color: '#ffffff'
                background: '#2e7d32'
      series:
      - entity: sensor.basement_rh_delta_sht45_vs_shelly
        name: ΔRH
        yaxis_id: rh
        type: line
        stroke_width: 1
        opacity: 0.4
        color: '#9e9e9e'
      - entity: sensor.basement_rh_delta_mean_24h
        name: ΔRH 24h mean
        yaxis_id: rh
