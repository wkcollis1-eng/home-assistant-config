- type: sections
  max_columns: 4
  icon: mdi:water-percent
  path: ''
  header:
    card:
      type: markdown
      text_only: true
      content: |
        # Dehumidifier Status
  badges:
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: sensor.dehumidifier_signal_strength
  - type: entity
    show_name: true
