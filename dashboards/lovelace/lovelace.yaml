        {% set pt_raw = states('input_number.dehumidifier_power_threshold') %}
        {% set pt_ok  = is_number(pt_raw) %}
        {% set pt = pt_raw | float(0) %}
        {% if on %}
        ## 🔧 LOCAL (UNIT) CONTROL — HA IS MONITORING ONLY

        {% if s_ok -%}
        **On for {{ hrs | round(1) }} h** of the {{ (lim | round(0)) if lim_ok else '⚠️ unreadable' }} h limit.
        {%- if hrs > lim %} ⛔ **OVERDUE — hand control back or raise the limit.**{% endif %}
        {%- else -%}
        ⚠️ Entry stamp unset — elapsed time unknown, so the overdue reminder cannot fire.
        {%- endif %}

        **The E080's onboard humidistat is the only controller.** HA holds the
        plug powered (min-off still honoured) and cannot switch it off.

        | Suspended | Still running |
        |---|---|
        | RH band start / stop | SHT45 node + all logging |
        | Mold ceiling force-on | Shelly cross-check |
        | Condensation guard | Compressor + power capture |
        | Max-runtime backstop | Duty, kWh, cost, SPC |
        | DP stall cut-out | Watchdog |
        | Dead-sensor cut-out | Every chart on this page |

        {# 2026-08-24: this paragraph asserted a flat 250 W and the ratios that go
           with it, while the helper had moved to 150. The two MEASUREMENTS are
           what is durable - 57.8 W fan-only and 454.7 W compressor, 17 runs /
           53.9 h - so those stay written down and the ratios are computed from
           whatever the helper currently holds. A number that can drift should
           never be typed into prose next to a live helper that supersedes it. #}
        {% if pt_ok -%}
        *The compressor gate `dehumidifier_power_threshold` reads **{{ pt | round(0) }} W**.
        Fan-only sampling measures ~57.8 W and the compressor ~454.7 W (17 runs /
        53.9 h, commissioning), so the gate sits {{ (pt / 57.8) | round(1) }}× above the
        blower and {{ (454.7 / pt) | round(1) }}× below the compressor, with ZERO mid-run
        excursions below it over that set.*
        {%- else -%}
        ⚠️ *`dehumidifier_power_threshold` is unreadable, so the compressor gate
        cannot be stated — and `binary_sensor.dehumidifier_compressor_active` is
        unavailable for the same reason, which reads as "not running" everywhere.*
        {%- endif %}
        {% else %}
        ✅ **HA control active** — RH band, mold ceiling, condensation guard and
        all four stop paths are live.
        {#- hrs is now-minus-stamp, i.e. how long ago local control was last ENTERED.
            It is NOT the duration of that run - the stamp is only written on entry,
            and nothing records the exit. Until 2026-08-24 this line read "last run
            ended after {{ hrs }} h", which rendered as 500.5 h for a stamp 20.9 days
            old. Stating the elapsed-since is the only claim this stamp supports. -#}
        {%- if s_ok %} Local control was last entered {{ (hrs / 24) | round(1) }} days ago; its duration is not recorded.{% endif %}
        {% endif %}
