- title: HVAC Performance
  path: hvac-performance
  icon: mdi:hvac
  type: sections
  max_columns: 2
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: custom:mushroom-template-card
      primary: '{{ states(''sensor.outdoor_temp_live'')|round(0) }}°F'
      secondary: Outside
      icon: mdi:thermometer
      color: '{% set temp = states(''sensor.outdoor_temp_live'')|float(50) %}{% if temp < 32 %}cyan{%
        elif temp < 50 %}blue{% elif temp < 70 %}green{% else %}orange{% endif %}'
      vertical: true
      features_position: bottom
      grid_options:
        columns: 3
        rows: 2
    - type: custom:mushroom-template-card
      primary: '{{ states(''sensor.hvac_hdd65_today'')|round(1) }}'
      secondary: HDD Today
      icon: mdi:snowflake
      color: blue
      vertical: true
      features_position: bottom
      grid_options:
        columns: 3
        rows: 2
