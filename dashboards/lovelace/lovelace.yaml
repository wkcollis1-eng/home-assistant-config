    - type: markdown
      title: Bank Status & Runtime
      content: |
        {% set st = states('sensor.battery_bank_monitor_bank_state') %}
        {% set ph = states('sensor.battery_bank_monitor_discharge_phase') %}
        {% set soc = states('sensor.battery_bank_monitor_state_of_charge') | float(-1) %}
        {% set rth = states('sensor.battery_bank_monitor_runtime_remaining') | float(-1) %}
        {% set rtd = states('sensor.battery_bank_monitor_runtime_remaining_days') | float(-1) %}

        {% set st_color =
          'cyan'   if 'CHARG' in st else
          'orange' if st == 'HEAVY_LOAD' else
          '#81C784' if st == 'DISCHARGING' else
          'red'    if st == 'FAULT' else
          'lime'   if st == 'IDLE' else 'silver' %}

        ### Bank: <font color="{{ st_color }}">{{ st }}</font> &nbsp;|&nbsp; SOC: <font color="{{ 'red' if soc <= 20 else 'lime' }}">{{ soc | round(1) }}%</font> &nbsp;|&nbsp; Phase: <font color="silver">{{ ph }}</font>

        {% if rth > 0 %}
        ### Runtime: <font color="{{ st_color }}">{{ rtd | round(1) }} days ({{ rth | round(1) }} h)</font>
        {% elif 'CHARG' in st %}
        ### Runtime: <font color="cyan">-- Charging</font>
        {% else %}
        ### Runtime: <font color="silver">-- Not discharging</font>
        {% endif %}

        | Phase | Voltage band | Meaning |
        | :--- | :---: | :--- |
        | <font color="silver">{{ '->' if ph in ['N/A', 'Unknown', 'unknown', 'unavailable'] }} Idle</font> | — | Not discharging (phase engages when I < −0.05 A) |
        | <font color="lime">{{ '->' if ph == 'Settling' }} Settling</font> | > 13.00 V | Post-charge OCV relaxation |
        | <font color="#81C784">{{ '->' if ph == 'Plateau' }} Plateau</font> | 12.65–13.00 V | Bulk of usable capacity |
        | <font color="orange">{{ '->' if ph == 'Knee' }} Knee</font> | 12.40–12.65 V | Prepare shutdown |
        | <font color="red">{{ '->' if ph == 'Cliff' }} Cliff</font> | < 12.40 V | Shut bank immediately |

        ***
        **Manual operating model:** no HA control of the bank. Operator reads SOC and shuts the bank at **~20% SOC**. The data is the safety system.
      grid_options:
        rows: auto
    - type: markdown
      title: Thresholds & Hardware Alerts
      content: |
        {% set v = states('sensor.battery_bank_monitor_battery_voltage') | float(0) | round(3) %}

        **Firmware alarms (2 s polled)**

        | Threshold | Trigger | Action |
        | :--- | :---: | :--- |
        | <font color="#FF9800">Warning</font> | < 12.40 V | Review load shedding |
        | <font color="#FF7043">Critical</font> | < 12.20 V | Shed non-essential loads |
        | <font color="#FF5722">EMERGENCY</font> | < 11.80 V | Shut inverter NOW |
        | <font color="#db4437">Overvoltage</font> | > 14.80 V | Charger fault — disconnect |

        **INA228 hardware alert limits (latched, GPIO5, independent of firmware)**

        | Register | Limit | Catches |
        | :--- | :---: | :--- |
        | BUVL | 12.20 V | Bus under-voltage |
        | BOVL | 14.80 V | Bus over-voltage |
        | SOVL | +250 A | Charge over-current |
        | SUVL | −250 A | Discharge over-current |
        | POL | 1500 W | Over-power |

        ***
        <center><font color="silver"><i>Current Voltage: {{ v }} V — INA228 reference (Shelly reads ~30 mV low)</i></font></center>
      grid_options:
        rows: auto
    - type: markdown
      title: Cycle & Charger Health
      content: |
        {% set ce = states('sensor.battery_bank_monitor_last_coulombic_efficiency') %}
        {% set cyc = states('sensor.battery_bank_monitor_total_full_charge_cycles') | int(0) %}
        {% set cvt = states('sensor.battery_bank_monitor_cv_absorption_time') %}
        {% set cve = states('sensor.battery_bank_monitor_cv_absorption_elapsed') %}
        {% set ahc = states('sensor.battery_bank_monitor_ah_charged_this_cycle') | float(0) %}
        {% set ahd = states('sensor.battery_bank_monitor_ah_discharged_this_cycle') | float(0) %}

        **This Cycle** *(since last full-charge anchor)*

        | Metric | Value |
        | :--- | ---: |
        | Ah Charged | {{ ahc | round(2) }} Ah |
        | Ah Discharged | {{ ahd | round(2) }} Ah |
        | Full-charge cycles | {{ cyc }} |
        | HW Net Charge (INA228 reg) | {{ states('sensor.basement_battery_bank_monitor_hw_net_charge_ina228') }} Ah |
        | Integration Δ (SW−HW) | {{ states('sensor.basement_battery_bank_monitor_cycle_integration_delta_sw_hw') }} Ah |
        | CV Absorption (live) | {{ cve if cve not in ['unknown', 'unavailable'] else '---' }} min |

        ***
        **Last Completed Cycle**

        | Metric | Value |
        | :--- | ---: |
        | Coulombic Efficiency | {{ ce if ce not in ['unknown', 'unavailable'] else '--- (needs full→full cycle)' }} |
        | Ah Charged | {{ states('sensor.battery_bank_monitor_last_cycle_ah_charged') }} |
        | Ah Discharged | {{ states('sensor.battery_bank_monitor_last_cycle_ah_discharged') }} |
        | Peak Charge I | {{ states('sensor.battery_bank_monitor_last_charge_peak_current') }} |
        | Peak Discharge I | {{ states('sensor.battery_bank_monitor_last_discharge_peak_current') }} |
        | Mean Discharge V | {{ states('sensor.battery_bank_monitor_last_discharge_mean_voltage') }} |
        | CV Absorption Time | {{ cvt if cvt not in ['unknown', 'unavailable'] else '---' }} min |
        | Unseen Drain | {{ states('sensor.battery_bank_monitor_last_unseen_drain') }} |

        ***
        **References:** validated capacity **397 Ah** (Oct 2025) · recon coulombic eff. **0.99** · self-discharge **~0%/month** (92-day study). *Absorption time trending up across months at comparable DoD = early capacity-fade indicator.*
      grid_options:
        rows: auto
    - type: markdown
      title: Outage Data
      content: |
        {% set ah = states('sensor.battery_bank_monitor_last_outage_ah') | float(0) %}
        {% set wh = states('sensor.battery_bank_monitor_last_outage_wh') | float(0) %}
        {% set dur = states('sensor.battery_bank_monitor_last_outage_duration') | float(0) %}
        {% set pavg = states('sensor.battery_bank_monitor_last_outage_average_power') | float(0) %}
        {% set ppk = states('sensor.battery_bank_monitor_last_outage_peak_power') | float(0) %}
        {% set cnt = states('sensor.battery_bank_monitor_total_outage_events') | int(0) %}
        {% set ah_o = states('sensor.battery_bank_monitor_outage_ah_this_event') | float(0) %}
        {% set wh_o = states('sensor.battery_bank_monitor_outage_wh_this_event') | float(0) %}

        **Last Outage**{% if cnt > 0 %} *(#{{ cnt }})*{% endif %}

        | Metric | Value |
        | :--- | ---: |
        | Duration | {{ (dur * 60) | round(1) }} min |
        | Ah Used | {{ ah | round(3) }} Ah |
        | Wh Used | {{ wh | round(2) }} Wh |
        | Capacity Used | {{ (ah / 397 * 100) | round(2) }}% of 397 Ah |
        | Avg Power | {{ pavg | round(1) }} W |
        | Peak Power | {{ ppk | round(1) }} W |

        ***
        **This Event** *(live if discharging)*

        | Metric | Value |
        | :--- | ---: |
        | Ah | {{ ah_o | round(3) }} Ah |
        | Wh | {{ wh_o | round(2) }} Wh |
      grid_options:
        rows: auto
