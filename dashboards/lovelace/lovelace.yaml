        yaxis_id: spc
        float_precision: 1
        data_generator: |
          // X is subgroup POSITION, not a date — see the file header.
          const today = new Date();
          today.setHours(12, 0, 0, 0);
          const out = [];
          for (let i = 0; i < 7; i++) {
            const slot = hass.states['input_number.hwh_recirc_running_watts_day_' + (i + 1)];
            const v = slot ? parseFloat(slot.state) : NaN;
            const t = new Date(today);
            t.setDate(t.getDate() - i);
            out.push([t.getTime(), (isFinite(v) && v > 0) ? v : null]);
          }
          return out.reverse();
      - entity: sensor.hwh_recirc_running_watts_mean_7d
        name: Centre line (7d mean)
        type: line
        color: '#2e7d32'
        stroke_width: 2
        curve: straight
        yaxis_id: spc
        float_precision: 1
        data_generator: |
          const lim = hass.states['sensor.hwh_recirc_running_watts_mean_7d'];
          const v = lim ? parseFloat(lim.state) : NaN;
          if (!isFinite(v)) { return []; }
          // t0/t1, not start/end — those are reserved params (see file header).
          const t1 = new Date();
          t1.setHours(12, 0, 0, 0);
          const t0 = new Date(t1);
          t0.setDate(t0.getDate() - 6);
          return [[t0.getTime(), v], [t1.getTime(), v]];
