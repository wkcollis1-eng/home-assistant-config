# GENERATED by scripts/export_dashboards.py - DO NOT HAND-EDIT.
# Source: .storage/lovelace.lovelace (UI-managed; HA loads that, never this file).
# Restore: dashboard > three-dot menu > Raw configuration editor,
#          select all, replace with everything below this header.
# 9 view(s).
#
title: Home
views:
- title: Home
  path: home
  icon: mdi:home
  type: sections
  max_columns: 2
  sections:
  - type: grid
    column_span: 2
    cards:
    - show_current: true
      show_forecast: true
      type: weather-forecast
      entity: weather.pirateweather
      forecast_type: daily
      grid_options:
        columns: 12
        rows: 6
      secondary_info_attribute: apparent_temperature
    - type: custom:apexcharts-card
      header:
        show: true
        title: Temperature Trend (48h)
        show_states: true
        colorize_states: true
      graph_span: 48h
      span:
        end: hour
      yaxis:
      - id: temp
        min: ~10
        max: ~80
        apex_config:
          tickAmount: 5
          title:
            text: °F
      apex_config:
        chart:
          height: 265
        legend:
          show: true
          position: bottom
        stroke:
          curve: smooth
      series:
      - entity: sensor.pirate_weather_temperature
        name: Pirate Weather
        color: '#E91E63'
        stroke_width: 3
        yaxis_id: temp
        show:
          in_header: true
      - entity: sensor.outdoor_temp_live
        name: Open-Meteo Live
        color: '#2196F3'
        stroke_width: 2
        yaxis_id: temp
      - entity: sensor.pirate_weather_feels_like
        name: Feels Like
        color: '#F7D88B'
        stroke_width: 1
        opacity: 0.7
        yaxis_id: temp
    - type: conditional
      conditions:
      - entity: binary_sensor.hvac_filter_change_alert
        state: 'on'
      card:
        type: custom:mushroom-template-card
        primary: Filter Due!
        icon: mdi:air-filter
        color: red
        vertical: true
        features_position: bottom
        tap_action:
          action: more-info
          entity: sensor.hvac_filter_hours_remaining
      grid_options:
        columns: 3
        rows: 2
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Power (Live)
    - type: custom:mushroom-entity-card
      entity: sensor.computer_outlet_current_consumption
      name: Computer
      icon: mdi:desktop-tower-monitor
      icon_color: blue
      fill_container: true
      layout: vertical
      grid_options:
        columns: 6
        rows: 2
    - type: custom:mushroom-template-card
      entity: switch.tv_room
      primary: |
        TV Room ({{ states('sensor.tv_room_current_consumption')|float(0)|round(0)  }} W)
      secondary: |
        {{ 'On' if is_state('switch.tv_room','on') else 'Off' }}
      icon: mdi:television
      tap_action:
        action: toggle
      icon_color: |
        {% set w = states('sensor.tv_room_current_consumption')|float(0) %} {% if w > 50 %} green {% elif w > 5 %} orange {% else %} grey {% endif %}
      vertical: true
      features_position: bottom
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Living Room
    - type: tile
      grid_options:
        rows: 2
      entity: sensor.living_room_tv_sonos_homatics_current_consumption
      vertical: true
      features_position: bottom
    - type: custom:mushroom-entity-card
      entity: switch.family_room_2
      name: Lamp 1
      icon: mdi:floor-lamp
      tap_action:
        action: toggle
      fill_container: true
      layout: vertical
      grid_options:
        columns: 3
        rows: 2
    - type: custom:mushroom-entity-card
      entity: switch.family_room_3
      name: Lamp 2
      icon: mdi:floor-lamp
      tap_action:
        action: toggle
      fill_container: true
      layout: vertical
      grid_options:
        columns: 3
        rows: 2
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Master Bedroom
      heading_style: title
    - type: custom:mushroom-entity-card
