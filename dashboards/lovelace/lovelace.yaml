    - type: markdown
      title: Estimated Runtime
      content: |
        {% set phase = states('sensor.ups_monitor_discharge_phase') %}
        {% set rt = states('sensor.ups_monitor_runtime_remaining_minutes') | float(-1) %}

        {% set phase_color =
          'cyan'    if phase in ['Charging', 'Float'] else
          'lime'    if phase == 'Settling' else
          '#81C784' if phase == 'Plateau' else
          'orange'  if phase == 'Knee' else
          'red'     if phase == 'Cliff' else 'silver' %}

        ### Status: <font color="{{ phase_color }}">{{ phase }}</font>

        {% if rt > 0 %}
        ### Runtime: <font color="{{ phase_color }}">{{ (rt // 60) | int(0) }}h {{ (rt % 60) | int(0) }}m</font>
        {% elif phase in ['Charging', 'Float'] %}
        ### Runtime: <font color="cyan">-- On AC Power</font>
        {% else %}
        ### Runtime: <font color="silver">-- Calculating...</font>
        {% endif %}

        | Phase | Voltage | Validated (May 2026) |
        | :--- | :---: | ---: |
        | <font color="cyan">{{ '->' if phase in ['Charging','Float'] }} Charging / Float</font> | > 13.15 V | -- |
        | <font color="lime">{{ '->' if phase == 'Settling' }} Settling</font> | 13.00–13.15 V | ~5 min |
        | <font color="#81C784">{{ '->' if phase == 'Plateau' }} Plateau</font> | 12.65–13.00 V | ~142 min |
        | <font color="orange">{{ '->' if phase == 'Knee' }} Knee</font> | 12.40–12.65 V | ~49 min |
        | <font color="red">{{ '->' if phase == 'Cliff' }} Cliff</font> | 11.80–12.40 V | ~17 min |

        ***
        <font color="#FF9800">HA Voltage Warning (Auto 2) at **12.40 V**</font>
        <font color="#F44336">HA Graceful Shutdown (Auto 3) on **cliff_imminent** — slope-based; typical V ≈ 12.45 V</font>
        <font color="#FF7043">HA Hard Fallback (Auto 4) at **12.20 V**</font>
        <font color="#FF5722">BP-65 Hard Cutoff at **11.80 V** (102 s spec delay)</font>
    - type: markdown
      title: UPS Thresholds
      content: |
        {% set v = states('sensor.ups_monitor_battery_voltage') | float(0) | round(3) %}
        {% set cliff = states('binary_sensor.ups_monitor_cliff_imminent') %}

        | Threshold | Trigger | Active |
        | :--- | :---: | :--- |
        | <font color="#00CA8B">PSU Float</font> | 13.30 V setpoint | {{ '→ Normal' if v >= 13.15 else '' }} |
        | <font color="#26C6DA">On-Battery (Auto 1)</font> | V < 13.15 V, 10 s | {{ '→ On Battery' if v < 13.15 and v > 12.40 else '' }} |
        | <font color="#FF9800">Voltage Warning (Auto 2)</font> | V < 12.40 V, 30 s + I<-0.10 A | {{ '→ Warning' if v <= 12.40 and v > 12.20 else '' }} |
        | <font color="#F44336">**Cliff Imminent (Auto 3)**</font> | slope<-10 mV/min, V<12.65, 60 s | {{ '→ Shutdown' if cliff == 'on' else '' }} |
        | <font color="#FF7043">Hard Fallback (Auto 4)</font> | V < 12.20 V, 10 s + I<-0.10 A | {{ '→ Emergency' if v <= 12.20 and v > 11.80 else '' }} |
        | <font color="#FF5722">BP-65 Hardware LVD</font> | V < 11.80 V, 12 s alarm + 90 s | {{ '→ Hard Cutoff' if v <= 11.80 else '' }} |

        ***
        <center><font color="silver"><i>Current Voltage: {{ v }} V</i></font></center>
      grid_options:
        rows: auto
