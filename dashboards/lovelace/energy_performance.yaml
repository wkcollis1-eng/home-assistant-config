# GENERATED by scripts/export_dashboards.py - DO NOT HAND-EDIT.
# Source: .storage/lovelace.energy_performance (UI-managed; HA loads that, never this file).
# Restore: dashboard > three-dot menu > Raw configuration editor,
#          select all, replace with everything below this header.
# 6 view(s).
#
title: Energy Performance
views:
  - title: Live
    path: live
    icon: mdi:gauge
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: custom:mushroom-template-card
            primary: '{{ states(''sensor.pirate_weather_temperature'') | round(1) }}°F'
            secondary: Outside
            icon: mdi:thermometer
            color: '{% set t = states(''sensor.pirate_weather_temperature'') | float(50) %} {{ ''cyan''
              if t < 32 else (''blue'' if t < 50 else (''green'' if t < 70 else ''orange'')) }}'
            features_position: bottom
            vertical: true
            grid_options:
              columns: 4
              rows: 3
          - type: custom:mushroom-template-card
            primary: '{{ states(''sensor.hvac_outdoor_temp_hartford_proxy'') | round(1) }}°F'
            secondary: '{{ states(''sensor.hvac_outdoor_weather_source'') }} proxy'
            icon: mdi:cloud-sync
            color: teal
            features_position: bottom
            vertical: true
            grid_options:
              columns: 4
              rows: 3
          - type: custom:mushroom-template-card
            primary: '{% set hdd = states(''sensor.hvac_hdd65_today'') | float(0) %} {% set cdd = states(''sensor.hvac_cdd65_today'')
              | float(0) %} {{ hdd | round(1) if hdd >= cdd else cdd | round(1) }}'
            secondary: '{% set hdd = states(''sensor.hvac_hdd65_today'') | float(0) %} {% set cdd = states(''sensor.hvac_cdd65_today'')
              | float(0) %} {{ ''HDD Today'' if hdd >= cdd else ''CDD Today'' }}'
            icon: |-
              {% if states('sensor.hvac_hdd65_today') | float(0) >= states('sensor.hvac_cdd65_today') | float(0) %}
                mdi:snowflake
              {% else %}
                mdi:sun-thermometer
              {% endif %}
            color: |-
              {% if states('sensor.hvac_hdd65_today') | float(0) >= states('sensor.hvac_cdd65_today') | float(0) %}
                blue
              {% else %}
                orange
              {% endif %}
            features_position: bottom
            vertical: true
            grid_options:
              columns: 4
              rows: 3
          - type: custom:mushroom-climate-card
            entity: climate.main_floor
            name: 1F Main Floor
            icon: mdi:home-floor-1
            show_temperature_control: false
            layout: vertical
            grid_options:
              columns: 6
              rows: 3
          - type: custom:mushroom-climate-card
            entity: climate.upstairs
            name: 2F Upstairs
            icon: mdi:home-floor-2
            show_temperature_control: false
            layout: vertical
            grid_options:
              columns: 6
              rows: 3
        theme: noctis
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            header:
              show: true
              title: Temperature & HVAC — 48h
              show_states: true
              colorize_states: true
            graph_span: 48h
            span:
              end: hour
            yaxis:
              - id: temp
                min: ~10
                max: ~80
                apex_config:
                  tickAmount: 5
                  title:
                    text: °F
              - id: hvac
                opposite: true
                min: 0
                max: 1.5
                show: false
            apex_config:
              chart:
                height: 280
              legend:
                show: true
                position: bottom
              stroke:
                curve: smooth
              tooltip:
                shared: true
            series:
              - entity: sensor.pirate_weather_temperature
                name: Outdoor
                color: '#E91E63'
                stroke_width: 3
                yaxis_id: temp
                show:
                  in_header: true
              - entity: climate.main_floor
                attribute: current_temperature
                name: 1F Indoor
                color: '#00CA8B'
                stroke_width: 2
                yaxis_id: temp
              - entity: climate.upstairs
                attribute: current_temperature
                name: 2F Indoor
                color: '#F7D88B'
                stroke_width: 2
                yaxis_id: temp
              - entity: sensor.pirate_weather_feels_like
                name: Feels Like
                color: '#FF9800'
                stroke_width: 1
                opacity: 0.6
                yaxis_id: temp
              - entity: binary_sensor.hvac_1f_call_for_heat
                name: 1F Heat
                type: area
                color: '#F97316'
                yaxis_id: hvac
                transform: 'return x === ''on'' ? 1 : 0;'
                opacity: 0.25
                stroke_width: 0
                show:
                  legend_value: false
              - entity: binary_sensor.hvac_2f_call_for_heat
                name: 2F Heat
                type: area
                color: '#FC937E'
                yaxis_id: hvac
                transform: 'return x === ''on'' ? 1 : 0;'
                opacity: 0.25
                stroke_width: 0
                show:
                  legend_value: false
              - entity: binary_sensor.hvac_ac_running
                name: AC
                type: area
                color: '#2196F3'
                yaxis_id: hvac
                transform: 'return x === ''on'' ? 1 : 0;'
                opacity: 0.25
                stroke_width: 0
                show:
                  legend_value: false
          - type: entities
            title: Cycles & runtime — today
            entities:
              - type: section
                label: Furnace
              - entity: sensor.hvac_furnace_min_per_cycle
                name: Min/cycle (live)
              - entity: sensor.hvac_furnace_runtime_today
                name: Runtime
              - entity: sensor.hvac_furnace_cycles_today
                name: Ignitions
              - entity: sensor.hvac_1f_heat_runtime_today
                name: 1F zone runtime
              - entity: sensor.hvac_2f_heat_runtime_today
                name: 2F zone runtime
              - entity: sensor.hvac_total_cycles_today
                name: Total zone calls
              - entity: sensor.hvac_chaining_index
                name: Chaining index
              - type: section
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Today — Heating
          - type: custom:mushroom-template-card
            primary: '{{ states(''sensor.hvac_total_heat_runtime_today'') | round(2) }}'
            secondary: Zone Demand (h)
            icon: mdi:fire
            color: green
            features_position: bottom
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            primary: '{{ states(''sensor.hvac_furnace_runtime_today'') | float(0) | round(2) }}'
            secondary: Furnace Runtime (h)
            icon: mdi:clock-outline
            color: teal
            features_position: bottom
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            primary: '{{ states(''sensor.hvac_furnace_cycles_today'') | int(0) }}'
            secondary: Furnace Cycles
            icon: mdi:refresh
            color: orange
            features_position: bottom
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            primary: '{{ states(''sensor.hvac_1f_heat_runtime_today'') | round(2) }}'
            secondary: 1F Heat (h)
            icon: mdi:home-floor-1
            color: orange
            features_position: bottom
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            primary: '{{ states(''sensor.hvac_2f_heat_runtime_today'') | round(2) }}'
            secondary: 2F Heat (h)
            icon: mdi:home-floor-2
            color: deep-orange
            features_position: bottom
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            primary: '{{ states(''sensor.hvac_total_cycles_today'') | int(0) }}'
            secondary: Zone Calls
            icon: mdi:fire
            color: teal
            features_position: bottom
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            primary: '{% set avg = states(''sensor.hvac_furnace_min_per_cycle'') | float(0) %} {{ "{:.2f}".format(avg)
              }} min'
            secondary: Furnace Min/Cycle
            icon: mdi:timer-cog
            icon_color: '{% set avg = states(''sensor.hvac_furnace_min_per_cycle'') | float(0) %} {{ ''red''
              if avg < 5 else (''orange'' if avg < 8 else ''green'') }}'
            features_position: bottom
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            primary: '{{ states(''sensor.hvac_chaining_index'') | float(0) | round(2) }}'
            secondary: Chaining Index
            icon: mdi:link-variant
            color: teal
            features_position: bottom
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: gauge
            entity: sensor.hvac_zone_balance_ratio_today
            name: Zone Balance (2F %)
            min: 0
            max: 100
            needle: true
            segments:
              - from: 0
                color: '#db4437'
              - from: 40
                color: '#43a047'
              - from: 60
                color: '#ff9800'
              - from: 75
                color: '#db4437'
            grid_options:
              columns: 6
              rows: 3
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Today — Cooling
          - type: custom:mushroom-template-card
            primary: '{{ states(''sensor.hvac_ac_runtime_today'') | float(0) | round(2) }}'
            secondary: AC Runtime (h)
            icon: mdi:air-conditioner
            color: blue
            features_position: bottom
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            primary: '{{ states(''sensor.hvac_ac_cycles_today'') | int(0) }}'
            secondary: AC Cycles
            icon: mdi:refresh
            color: blue
            features_position: bottom
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            primary: '{{ states(''sensor.hvac_ac_min_per_cycle'') | float(0) | round(1) }} min'
            secondary: AC Min/Cycle
            icon: mdi:timer-cog
            color: '{% set mpc = states(''sensor.hvac_ac_min_per_cycle'') | float(0) %} {{ ''red'' if
              mpc < 8 else (''orange'' if mpc < 12 else ''green'') }}'
            features_position: bottom
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            primary: '{{ states(''sensor.hvac_1f_cool_runtime_today'') | float(0) | round(2) }}'
            secondary: 1F Cool (h)
            icon: mdi:home-floor-1
            color: light-blue
            features_position: bottom
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            primary: '{{ states(''sensor.hvac_2f_cool_runtime_today'') | float(0) | round(2) }}'
            secondary: 2F Cool (h)
            icon: mdi:home-floor-2
            color: cyan
            features_position: bottom
            vertical: true
            grid_options:
              columns: 4
              rows: 2
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: System Status
          - type: custom:mushroom-template-card
            primary: '{{ ''ALERT'' if is_state(''binary_sensor.hvac_short_cycling_alert_1f'',''on'') else
              ''OK'' }}'
            secondary: 1F Cycling
            icon: mdi:air-conditioner
            color: '{{ ''red'' if is_state(''binary_sensor.hvac_short_cycling_alert_1f'',''on'') else
              ''green'' }}'
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            primary: '{{ ''ALERT'' if is_state(''binary_sensor.hvac_short_cycling_alert_2f'',''on'') else
              ''OK'' }}'
            secondary: 2F Cycling
            icon: mdi:air-conditioner
            color: '{{ ''red'' if is_state(''binary_sensor.hvac_short_cycling_alert_2f'',''on'') else
              ''green'' }}'
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            primary: '{{ ''ALERT'' if is_state(''binary_sensor.hvac_ac_short_cycling_alert'',''on'') else
              ''OK'' }}'
            secondary: AC Cycling
            icon: mdi:air-conditioner
            color: '{{ ''red'' if is_state(''binary_sensor.hvac_ac_short_cycling_alert'',''on'') else
              ''green'' }}'
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            primary: '{{ states(''sensor.hvac_pipeline_status'') | upper }}'
            secondary: Pipeline
            icon: mdi:database-check
            color: '{% set s = states(''sensor.hvac_pipeline_status'') %} {{ ''green'' if s == ''ok''
              else (''orange'' if s == ''degraded'' else ''red'') }}'
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            primary: '{% set f = states(''counter.automation_failures_24h'') | int(0) %} {{ f }} failure{{
              ''s'' if f != 1 else '''' }}'
            secondary: Automations 24h
            icon: '{{ ''mdi:robot'' if states(''counter.automation_failures_24h'') | int(0) == 0 else
              ''mdi:robot-dead'' }}'
            color: '{% set f = states(''counter.automation_failures_24h'') | int(0) %} {{ ''green'' if
              f == 0 else (''orange'' if f <= 2 else ''red'') }}'
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: conditional
            conditions:
              - entity: sensor.hvac_outdoor_weather_source
                state: Open-Meteo
            card:
              type: custom:mushroom-template-card
              primary: Weather Fallback
              secondary: Open-Meteo Active
              icon: mdi:weather-cloudy-alert
              color: amber
              vertical: true
            grid_options:
              columns: 4
              rows: 2
  - title: Weekly
    path: weekly
    icon: mdi:calendar-week
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Cycle Quality — 7-Day
          - type: custom:apexcharts-card
            header:
              show: true
              title: Furnace Min/Cycle — 7d Rolling
              show_states: true
              colorize_states: true
            graph_span: 14d
            span:
              end: day
            yaxis:
              - id: primary
                min: 0
                apex_config:
                  tickAmount: 5
                  title:
                    text: min/cycle
            apex_config:
              chart:
                height: 260
              legend:
                show: true
                position: bottom
              stroke:
                curve: smooth
              annotations:
                yaxis:
                  - 'y': 8
                    borderColor: '#ff6b6b'
                    strokeDashArray: 4
                    label:
                      text: 8 min threshold
                      style:
                        color: '#ff6b6b'
                        background: transparent
            series:
              - entity: sensor.hvac_furnace_cycle_upper_bound
                name: UCL (+2σ)
                color: '#95a5a6'
                stroke_width: 1
                yaxis_id: primary
                extend_to: now
                show:
                  legend_value: false
                group_by:
                  func: last
                  duration: 1d
              - entity: sensor.hvac_furnace_cycle_lower_bound
                name: LCL (-2σ)
                color: '#95a5a6'
                stroke_width: 1
                yaxis_id: primary
                extend_to: now
                show:
                  legend_value: false
                group_by:
                  func: last
                  duration: 1d
              - entity: sensor.hvac_furnace_min_per_cycle_week
                name: Avg Min/Cycle
                color: '#FF8C00'
                stroke_width: 3
                yaxis_id: primary
                extend_to: now
                show:
                  in_header: true
                group_by:
                  func: last
                  duration: 1d
          - type: custom:apexcharts-card
            header:
              title: Min/Cycle Bar — Last 7 Days (Furnace + AC)
              show: true
              show_states: false
            graph_span: 8d
            span:
              end: day
            apex_config:
              chart:
                type: bar
                height: 318
              plotOptions:
                bar:
                  columnWidth: 65%
                  borderRadius: 3
                  dataLabels:
                    position: top
              dataLabels:
                enabled: true
                offsetY: -18
                style:
                  fontSize: 10px
                formatter: |
                  EVAL:function(val) { return (val !== null && val > 0) ? val.toFixed(1) : ''; }
              xaxis:
                type: datetime
                labels:
                  format: MM/dd
              yaxis:
                min: 0
                max: 40
                tickAmount: 6
                title:
                  text: min/cycle
              annotations:
                yaxis:
                  - 'y': 8
                    borderColor: '#FF4560'
                    strokeDashArray: 4
                    label:
                      text: Furnace ≤8 min
                      position: left
                      offsetX: 8
                      style:
                        color: '#FF4560'
                        background: transparent
                        fontSize: 11px
              colors:
                - '#FF8C00'
                - '#00B4D8'
              legend:
                show: true
                position: top
              tooltip:
                'y':
                  formatter: |
                    EVAL:function(val) { return (val !== null && val > 0) ? val.toFixed(1) + ' min/cycle' : 'No data'; }
            series:
              - name: Furnace
                entity: input_number.furnace_min_per_cycle_day_7
                data_generator: |
                  const now = new Date();
                  const result = [];
                  for (let i = 6; i >= 0; i--) {
                    const d = new Date(now);
                    d.setDate(d.getDate() - (i + 1));
                    d.setHours(20, 0, 0, 0);
                    const slot = i + 1;
                    const raw = parseFloat(hass.states[`input_number.furnace_min_per_cycle_day_${slot}`]?.state);
                    result.push([d.getTime(), (raw > 0) ? raw : null]);
                  }
                  return result;
              - name: AC
                entity: input_number.ac_min_per_cycle_day_7
                data_generator: |
                  const now = new Date();
                  const result = [];
                  for (let i = 6; i >= 0; i--) {
                    const d = new Date(now);
                    d.setDate(d.getDate() - (i + 1));
                    d.setHours(20, 0, 0, 0);
                    const slot = i + 1;
                    const raw = parseFloat(hass.states[`input_number.ac_min_per_cycle_day_${slot}`]?.state);
                    result.push([d.getTime(), (raw > 0) ? raw : null]);
                  }
                  return result;
          - type: custom:apexcharts-card
            header:
              show: true
              title: Gas Heating Cost — Season (Jul–Jun)
              show_states: true
              colorize_states: true
            graph_span: 13months
            yaxis:
              - min: 0
                decimals: 0
                apex_config:
                  title:
                    text: $ cumulative
            apex_config:
              chart:
                height: 280
              xaxis:
                labels:
                  format: MMM
              tooltip:
                x:
                  format: MMM yyyy
            series:
              - entity: sun.sun
                name: This season
                type: line
                curve: stepline
                color: '#c0392b'
                stroke_width: 3
                data_generator: |
                  const now = new Date();
                  const y = (now.getMonth() >= 6) ? now.getFullYear() : now.getFullYear() - 1;
                  let out = [], cum = 0;
                  for (let i = 1; i <= 12; i++) {
                    const v = parseFloat(hass.states['input_number.gas_heat_cs_' + i]?.state) || 0;
                    cum += v;
                    out.push([new Date(y, 6 + (i - 1), 1).getTime(), Math.round(cum * 100) / 100]);
                  }
                  return out;
              - entity: sun.sun
                name: Last season
                type: line
                curve: stepline
                color: '#95a5a6'
                stroke_width: 2
                data_generator: |
                  const now = new Date();
                  const y = (now.getMonth() >= 6) ? now.getFullYear() : now.getFullYear() - 1;
                  let out = [], cum = 0;
                  for (let i = 1; i <= 12; i++) {
                    const v = parseFloat(hass.states['input_number.gas_heat_ls_' + i]?.state) || 0;
                    cum += v;
                    out.push([new Date(y, 6 + (i - 1), 1).getTime(), Math.round(cum * 100) / 100]);
                  }
                  return out;
          - type: custom:apexcharts-card
            header:
              show: true
              title: Gas Heating Cost — Calendar Year
              show_states: true
              colorize_states: true
            graph_span: 1y
            span:
              start: year
            yaxis:
              - min: 0
                decimals: 0
                apex_config:
                  title:
                    text: $ cumulative
            apex_config:
              chart:
                height: 280
              xaxis:
                labels:
                  format: MMM
              tooltip:
                x:
                  format: MMM yyyy
            series:
              - entity: sun.sun
                name: This year
                type: line
                curve: stepline
                color: '#2980b9'
                stroke_width: 3
                data_generator: |
                  const now = new Date();
                  const Y = now.getFullYear();
                  const s0 = (now.getMonth() >= 6) ? Y : Y - 1;
                  const pick = (ss) => ss === s0 ? 'cs' : ss === s0 - 1 ? 'ls' : ss === s0 - 2 ? 'ls2' : null;
                  let out = [], cum = 0;
                  for (let M = 1; M <= 12; M++) {
                    const ss = (M >= 7) ? Y : Y - 1;
                    const arr = pick(ss);
                    const slot = (M >= 7) ? M - 6 : M + 6;
                    const v = arr ? (parseFloat(hass.states['input_number.gas_heat_' + arr + '_' + slot]?.state) || 0) : 0;
                    cum += v;
                    out.push([new Date(Y, M - 1, 1).getTime(), Math.round(cum * 100) / 100]);
                  }
                  return out;
              - entity: sun.sun
                name: Last year
                type: line
                curve: stepline
                color: '#95a5a6'
                stroke_width: 2
                data_generator: |
                  const now = new Date();
                  const Y = now.getFullYear();
                  const LY = Y - 1;
                  const s0 = (now.getMonth() >= 6) ? Y : Y - 1;
                  const pick = (ss) => ss === s0 ? 'cs' : ss === s0 - 1 ? 'ls' : ss === s0 - 2 ? 'ls2' : null;
                  let out = [], cum = 0;
                  for (let M = 1; M <= 12; M++) {
                    const ss = (M >= 7) ? LY : LY - 1;
                    const arr = pick(ss);
                    const slot = (M >= 7) ? M - 6 : M + 6;
                    const v = arr ? (parseFloat(hass.states['input_number.gas_heat_' + arr + '_' + slot]?.state) || 0) : 0;
                    cum += v;
                    out.push([new Date(Y, M - 1, 1).getTime(), Math.round(cum * 100) / 100]);
                  }
                  return out;
      - type: grid
        column_span: 2
        cards:
          - type: glance
            title: Furnace SPC — 7d
            show_name: true
            show_state: true
            show_icon: false
            columns: 3
            entities:
              - entity: sensor.hvac_furnace_cycle_mean_7d
                name: Mean
              - entity: sensor.hvac_furnace_cycle_sigma_7d
                name: σ
              - entity: sensor.hvac_furnace_cycle_data_count
                name: Samples
              - entity: sensor.hvac_furnace_cycle_lower_bound
                name: LCL (-2σ)
              - entity: sensor.hvac_furnace_cycle_upper_bound
                name: UCL (+2σ)
              - entity: sensor.hvac_furnace_short_cycle_pct_7d
                name: Short %
          - type: glance
            title: AC SPC — 7d
            show_name: true
            show_state: true
            show_icon: false
            columns: 3
            entities:
              - entity: sensor.hvac_ac_cycle_mean_7d
                name: Mean
              - entity: sensor.hvac_ac_cycle_sigma_7d
                name: σ
              - entity: sensor.hvac_ac_cycle_data_count
                name: Samples
              - entity: sensor.hvac_ac_cycle_lower_bound
                name: LCL (-2σ)
              - entity: sensor.hvac_ac_cycle_upper_bound
                name: UCL (+2σ)
              - entity: sensor.hvac_ac_short_cycle_pct_7d
                name: Short %
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Efficiency — 7-Day SPC
          - type: custom:apexcharts-card
            header:
              show: true
