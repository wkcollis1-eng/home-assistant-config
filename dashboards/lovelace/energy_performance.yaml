            apex_config:
              chart:
                type: bar
                height: 240
              plotOptions:
                bar:
                  columnWidth: 55%
                  borderRadius: 3
                  dataLabels:
                    position: top
              dataLabels:
                enabled: true
                offsetY: -18
                style:
                  fontSize: 11px
                formatter: |
                  EVAL:function(val) { return (val !== null && val > 0) ? val.toFixed(1) : '—'; }
              xaxis:
                type: category
                categories:
                  - Jan
                  - Feb
                  - Mar
                  - Apr
                  - May
                  - Jun
                  - Jul
                  - Aug
                  - Sep
                  - Oct
                  - Nov
                  - Dec
              yaxis:
                min: 0
                max: 20
                tickAmount: 4
                title:
                  text: min/cycle
