              {% if p1.items | length == 0 and p2.items | length == 0 %} <div style="background:rgba(50,120,50,0.1); border-left:3px solid #4caf50; padding:8px 12px; border-radius:4px; margin-bottom:8px;"> <b style="color:#81c784;">✅ All metrics within acceptable range — no action required.</b> </div> {% endif %}

              {# ── ECOBEE FORWARD PROJECTION ────────────────────────── #} <h3 style="margin-bottom:6px; margin-top:4px;">📈 Ecobee Forward Projection</h3> <div style="background:rgba(50,100,50,0.07); border-left:3px solid #4a8a4a; padding:10px 14px; border-radius:4px; margin-bottom:12px;"> <p style="margin:0 0 8px 0; font-size:0.87em; color:#9abf9a;"> The 90.3 CCF/1kHDD efficiency baseline and 480 BTU/hr-°F UA were established with 75–93% short-cycle rates baked in — reflecting ~83–85% effective seasonal AFUE, not the nominal 95%. With the Ecobee 1F/2F differential settings corrected, the first full heating season (Oct 2026 – Apr 2027) should produce measurably lower values on all four metrics below. The monthly short-cycle archive and runtime/HDD SPC window will be the leading indicators — watch for improvement by November 2026. </p> <table style="width:100%; border-collapse:collapse; font-size:0.86em;"> <tr style="color:#888; border-bottom:1px solid #334;"> <td style="padding:4px 10px; width:30%;">Metric</td> <td style="padding:4px 10px; width:30%;">Current (T6 Pro baseline)</td> <td style="padding:4px 10px; width:25%;">Expected (Ecobee, 1 season)</td> <td style="padding:4px 10px;">Driver</td> </tr> <tr style="border-bottom:1px solid #223;"> <td style="padding:5px 10px; color:#aaa;">Heating intensity</td> <td style="padding:5px 10px; font-weight:bold;">{{ eff_base }} CCF/1k HDD</td> <td style="padding:5px 10px; font-weight:bold; color:#81c784;">~80–83 CCF/1k HDD</td> <td style="padding:5px 10px; color:#888;">Purge losses eliminated</td> </tr> <tr style="border-bottom:1px solid #223;"> <td style="padding:5px 10px; color:#aaa;">Building UA</td> <td style="padding:5px 10px; font-weight:bold;">{{ ua_base }} BTU/hr-°F</td> <td style="padding:5px 10px; font-weight:bold; color:#81c784;">~440–460 BTU/hr-°F</td> <td style="padding:5px 10px; color:#888;">AFUE inflation removed from billing formula</td> </tr> <tr style="border-bottom:1px solid #223;"> <td style="padding:5px 10px; color:#aaa;">Effective seasonal AFUE</td> <td style="padding:5px 10px; font-weight:bold; color:#ff9966;">~83–85%</td> <td style="padding:5px 10px; font-weight:bold; color:#81c784;">~91–93%</td> <td style="padding:5px 10px; color:#888;">Longer cycles → steady-state combustion</td> </tr> <tr style="border-bottom:1px solid #223;"> <td style="padding:5px 10px; color:#aaa;">Annual heating gas</td> <td style="padding:5px 10px; font-weight:bold;">~599 CCF (2025)</td> <td style="padding:5px 10px; font-weight:bold; color:#81c784;">~500–530 CCF</td> <td style="padding:5px 10px; color:#888;">~67 CCF short-cycle waste eliminated</td> </tr> <tr> <td style="padding:5px 10px; color:#aaa;">Annual gas savings</td> <td style="padding:5px 10px; color:#666;">—</td> <td style="padding:5px 10px; font-weight:bold; color:#81c784;"> ~${{ (67 * gas_rate) | round(0) | int(0) }}–${{ (99 * gas_rate) | round(0) | int(0) }}/yr </td> <td style="padding:5px 10px; color:#888;">At ${{ gas_rate }}/CCF · 67–99 CCF range</td> </tr> </table> <p style="margin:8px 0 0 0; font-size:0.82em; color:#777; font-style:italic;"> Projection basis: 67 CCF/yr measured short-cycle waste (Jan–Apr 2025 Resideo data) · effective AFUE estimated from monthly min/cycle distribution · baseline report v1.2.1 (Jan 2026) · next formal review January 2027. When 2026–27 season data is available, update {{ eff_base }} CCF/1kHDD and {{ ua_base }} BTU/hr-°F baselines to reflect true Ecobee-era performance. </p> </div>
              {# ── MODEL PARAMETERS FOOTER ──────────────────────────── #} <p style="color:#555; font-size:0.78em; margin-top:14px; padding-top:6px; border-top:1px solid #333; line-height:1.8;"> <b>Heating model:</b> UA baseline {{ ua_base }} BTU/hr-°F · Efficiency baseline {{ eff_base }} CCF/1k HDD · AFUE 0.95 · BP ratio {{ bp_ratio }} · Fireplace {{ fp_heat }} MMBTU/yr · Furnace input {{ furnace_rate | round(0) | int(0) }} BTU/hr · Gas ${{ gas_rate }}/CCF · HDD normal {{ hdd_normal }} · <b>Cooling model:</b> 4-ton 14 SEER · 3.92 kW steady-state · Electric ${{ elec_rate }}/kWh · CDD normal {{ cdd_normal }} · Setpoint 76°F · Floor area 2,440 ft² </p>
              </div>
            grid_options:
              columns: full
              rows: auto
        theme: noctis
    cards: []
  - title: Engineering
    path: engineering
    icon: mdi:cog
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Baseline Constants — Edit
          - type: tile
            entity: input_number.heating_efficiency_baseline
            name: Efficiency (CCF/1k HDD)
            icon: mdi:fire-cog
            color: orange
            features:
              - type: numeric-input
                mode: box
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: input_number.building_ua_baseline
            name: Building UA (BTU/hr-°F)
            icon: mdi:home-thermometer-outline
            color: teal
            features:
              - type: numeric-input
                mode: box
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: input_number.site_eui_baseline
            name: Site EUI (kBTU/ft²-yr)
            icon: mdi:gauge
            color: indigo
            features:
              - type: numeric-input
                mode: box
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: input_number.balance_point_baseline
            name: Balance Point (°F)
            icon: mdi:thermometer-lines
            color: grey
            features:
              - type: numeric-input
                mode: box
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: input_number.annual_hdd_baseline
            name: Annual HDD Normal
            icon: mdi:snowflake-thermometer
            color: cyan
            features:
              - type: numeric-input
                mode: box
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: input_number.furnace_heating_rate_btu_hr
            name: Furnace Rate (BTU/hr)
            icon: mdi:fire-cog
            color: deep-orange
            features:
              - type: numeric-input
                mode: box
            grid_options:
              columns: 6
              rows: 2
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Data Pipeline Health
          - type: entities
            title: Pipeline Status
            entities:
              - type: attribute
                entity: sensor.hvac_pipeline_status
                attribute: hdd_capture
                name: HDD capture
                icon: mdi:snowflake
              - type: attribute
                entity: sensor.hvac_pipeline_status
                attribute: cdd_capture
                name: CDD capture
                icon: mdi:sun-thermometer
              - type: attribute
                entity: sensor.hvac_pipeline_status
                attribute: furnace_mpc_capture
                name: Furnace MPC capture
                icon: mdi:sine-wave
              - type: attribute
                entity: sensor.hvac_pipeline_status
                attribute: ac_mpc_capture
                name: AC MPC capture
                icon: mdi:sine-wave
              - type: attribute
                entity: sensor.hvac_pipeline_status
                attribute: monthly_tracking
                name: Monthly tracking
                icon: mdi:calendar-check
              - entity: input_datetime.hdd_capture_last_ok
                name: HDD last OK
                icon: mdi:clock-check
              - entity: input_datetime.furnace_cycle_capture_last_ok
                name: Furnace MPC last OK
                icon: mdi:clock-check
              - entity: input_datetime.cdd_capture_last_ok
                name: CDD last OK
                icon: mdi:clock-check
              - entity: input_datetime.ac_min_per_cycle_capture_last_ok
                name: AC MPC last OK
                icon: mdi:clock-check
          - type: custom:mushroom-template-card
            primary: '{{ states(''sensor.hdd_valid_days_7d'') }} / 7 Days'
            secondary: HDD Pipeline History
            icon: mdi:calendar-check
            color: green
            vertical: true
            grid_options:
              columns: 5
              rows: 2
          - type: custom:mushroom-template-card
            primary: '{{ states(''sensor.hvac_runtime_per_hdd_data_count'') }} HDD / {{ states(''sensor.hvac_runtime_per_cdd_data_count'')
              }} CDD'
            secondary: Runtime Pipeline (7d samples)
            icon: mdi:chart-timeline-variant
            color: green
            vertical: true
            grid_options:
              columns: 7
              rows: 2
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Trend Charts
          - type: custom:apexcharts-card
            header:
              show: true
              title: Heating Efficiency — 12M Rolling
              show_states: true
            graph_span: 365d
            span:
              end: day
            yaxis:
              - id: primary
                apex_config:
                  tickAmount: 5
                  title:
                    text: CCF/1k HDD
            apex_config:
              chart:
                height: 260
              stroke:
                curve: stepline
              legend:
                show: true
                position: bottom
            series:
              - entity: sensor.hvac_heating_efficiency_12m
                name: Efficiency (12M)
                color: '#27ae60'
                stroke_width: 3
                yaxis_id: primary
                extend_to: now
                show:
                  in_header: true
                group_by:
                  func: last
                  duration: 1d
                statistics:
                  type: mean
                  period: day
              - entity: input_number.heating_efficiency_baseline
                name: Baseline
                color: '#e74c3c'
                stroke_width: 2
                opacity: 0.7
                yaxis_id: primary
                extend_to: now
                show:
                  legend_value: false
                group_by:
                  func: last
                  duration: 1d
                data_generator: |
                  // Flat reference line, drawn from the CURRENT value across the span rather
                  // than from recorder history. purge_keep_days is 14, so a 365d history read
                  // left 351 days blank. An input_number has no state_class and therefore no
                  // long-term statistics, so `statistics:` cannot cover it - but a constant
                  // does not need history. Same idiom as the SPC control limits.
                  // t0/t1, not start/end: those are reserved parameter names.
                  const v = parseFloat(hass.states['input_number.heating_efficiency_baseline']?.state);
                  if (!isFinite(v)) { return []; }
                  const t1 = new Date();
                  const t0 = new Date(t1.getTime() - 365 * 24 * 3600 * 1000);
                  return [[t0.getTime(), v], [t1.getTime(), v]];
          - type: custom:apexcharts-card
            header:
              show: true
              title: Efficiency vs Weather Load — 14d
              show_states: true
            graph_span: 14d
            span:
              end: day
            yaxis:
              - id: efficiency
                min: 0
                apex_config:
                  tickAmount: 5
                  title:
                    text: min/HDD
              - id: hdd
                opposite: true
                min: 0
                apex_config:
                  tickAmount: 5
                  title:
                    text: HDD
            apex_config:
              chart:
                height: 260
              legend:
                show: true
                position: bottom
            series:
              - entity: sensor.hvac_runtime_per_hdd_7_day
                name: Runtime/HDD (7d)
                color: '#3498db'
                stroke_width: 3
                yaxis_id: efficiency
                extend_to: now
                show:
                  in_header: true
                group_by:
                  func: last
                  duration: 1d
              - entity: sensor.hvac_hdd65_today
                name: Daily HDD
                type: column
                color: '#9b59b6'
                opacity: 0.6
                yaxis_id: hdd
                group_by:
                  func: last
                  duration: 1d
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Climate Norms Reference
          - type: custom:mushroom-template-card
            primary: '{{ states(''sensor.expected_temperature_today'') }}°F'
            secondary: Normal Temp Today
            icon: mdi:thermometer
            color: orange
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            primary: '{{ state_attr(''sensor.expected_temperature_today'', ''tmin'') }}–{{ state_attr(''sensor.expected_temperature_today'',
              ''tmax'') }}°F'
            secondary: Normal Range
            icon: mdi:thermometer-lines
            color: grey
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            primary: '{{ state_attr(''sensor.expected_hdd_today'', ''p10'') }}–{{ state_attr(''sensor.expected_hdd_today'',
              ''p90'') }}'
            secondary: HDD Band p10–p90
            icon: mdi:chart-bell-curve
            color: cyan
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            primary: '{{ state_attr(''sensor.climate_norms_today'', ''samples'') }} years'
            secondary: Climate Data Basis
            icon: mdi:database
            color: grey
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: custom:apexcharts-card
            header:
              show: true
              title: HDD Actual vs Expected — 7d
            graph_span: 7d
            span:
              end: day
            yaxis:
              - id: hdd
                min: 0
                apex_config:
                  title:
                    text: HDD
            apex_config:
              chart:
                height: 200
              legend:
                show: true
                position: bottom
            series:
              - entity: sensor.hvac_hdd65_today
                name: Actual HDD
                type: column
                color: '#3498db'
                yaxis_id: hdd
                group_by:
                  func: last
                  duration: 1d
              - entity: sensor.expected_hdd_today
                name: Expected HDD
                type: line
                color: '#e74c3c'
                stroke_width: 3
                yaxis_id: hdd
                group_by:
                  func: last
                  duration: 1d
          - type: custom:apexcharts-card
            header:
              show: true
              title: Efficiency Deviation Index — 7d
            graph_span: 7d
            span:
              end: day
            yaxis:
              - id: pct
                apex_config:
                  tickAmount: 5
                  title:
                    text: '%'
            apex_config:
              chart:
                height: 200
              annotations:
                yaxis:
                  - 'y': 0
                    borderColor: '#4CAF50'
                    strokeDashArray: 0
                  - 'y': 15
                    borderColor: '#F44336'
                    strokeDashArray: 4
              legend:
                show: true
                position: bottom
            series:
              - entity: sensor.efficiency_deviation_index
                name: Deviation
                color: '#9C27B0'
                stroke_width: 3
                yaxis_id: pct
                extend_to: now
                group_by:
                  func: last
                  duration: 1d
cards: []
theme: noctis
