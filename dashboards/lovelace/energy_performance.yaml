              {# ── BUILDING ENVELOPE — UA ───────────────────────────── #} <h3 style="margin-bottom:4px;"> {{ '🔴' if ua_delta > 10 else ('🟡' if ua_delta > 5 else '🟢') }} Building Envelope — UA </h3> <table style="width:100%; border-collapse:collapse; font-size:0.88em; margin-bottom:4px;"> <tr style="color:#888; border-bottom:1px solid #333;"> <td style="padding:4px 8px;">Measured (12M)</td> <td style="padding:4px 8px;">Baseline</td> <td style="padding:4px 8px;">Δ vs Baseline</td> <td style="padding:4px 8px;">Annual Extra CCF*</td> <td style="padding:4px 8px;">Annual Extra Cost*</td> </tr> <tr style="font-weight:bold;"> <td style="padding:4px 8px;">{{ ua }} BTU/hr-°F</td> <td style="padding:4px 8px;">{{ ua_base }} BTU/hr-°F</td> <td style="padding:4px 8px; color:{{ '#ff6b6b' if ua_delta > 10 else ('#ffb300' if ua_delta > 5 else '#81c784') }};"> {{ '+' if ua_delta > 0 }}{{ ua_delta }}% ({{ '+' if ua_diff > 0 }}{{ ua_diff }} BTU/hr-°F) </td> <td style="padding:4px 8px;">{{ ua_extra_ccf_yr }} CCF</td> <td style="padding:4px 8px;">${{ ua_extra_cost_yr }}/yr</td> </tr> </table> <p style="font-size:0.82em; color:#888; margin:2px 0 4px 8px;">*At {{ hdd_normal }} HDD normal · ${{ gas_rate }}/CCF · 0.95 AFUE</p> <p style="font-size:0.84em; color:#aaa; margin:4px 0 4px 8px;"> <b>Design Day ({{ design_outdoor }}°F outdoor):</b> Current heat loss <b>{{ heat_loss_now | int(0) }} BTU/hr</b> ({{ load_factor_now }}% of furnace) · Baseline <b>{{ heat_loss_base | int(0) }} BTU/hr</b> ({{ load_factor_base }}%) · Furnace output <b>{{ furnace_output | int(0) }} BTU/hr</b> </p> <p style="font-size:0.84em; color:#888; margin:0 0 12px 8px; font-style:italic;"> UA measures heat loss per °F of indoor-outdoor delta — independent of weather, billing periods, and fuel prices. A rising UA trend is the most reliable early indicator of envelope degradation. Note: UA is derived from heating season data only; summer envelope performance (solar gain, infiltration under AC pressure) is not captured in this metric. </p>
              {# ── SITE EUI ─────────────────────────────────────────── #} <h3 style="margin-bottom:4px;"> {{ '🔴' if eui_delta > 8 else ('🟡' if eui_delta > 4 else '🟢') }} Site Energy Use Intensity </h3> <p style="font-size:0.88em; margin:4px 0 4px 8px;"> <b>{{ eui }} kBTU/ft²-yr</b> vs {{ eui_base }} baseline · <span style="color:{{ '#ff6b6b' if eui_delta > 8 else ('#ffb300' if eui_delta > 4 else '#81c784') }}; font-weight:bold;"> {{ '+' if eui_delta > 0 }}{{ eui_delta }}% </span> deviation · 12M inputs: Gas <b>{{ ns.gas_12m | round(0) | int(0) }} CCF</b> ({{ gas_share }}% of site energy) + Electric <b>{{ ns.elec_12m | round(0) | int(0) }} kWh</b> ({{ elec_share }}%) </p> <p style="font-size:0.84em; color:#888; margin:0 0 12px 8px; font-style:italic;"> EUI is not weather-normalized. Gas is {{ gas_share }}% of site energy — EUI tracks heating efficiency directionally but compressor electricity (estimated {{ ac_kwh_mth | round(0) | int(0) }} kWh MTD for AC) is embedded in the electric figure and rises with CDD, partially offsetting low-HDD electric efficiency gains. </p>
