>{{ cycles_per_day }} cycles/day · {{ runtime_mth | round(1) }}h total · {{ days_elapsed }} days elapsed</td> </tr> <tr style="border-bottom:1px solid #222;"> <td style="padding:5px 8px; color:#aaa;">Chaining Index (MTD)</td> <td style="padding:5px 8px; font-weight:bold;">{{ chain_month | round(2) }}</td> <td style="padding:5px 8px;">{{ chain_icon }} {{ chain_label }}</td> </tr> <tr> <td style="padding:5px 8px; color:#aaa;">Zone Balance (MTD)</td> <td style="padding:5px 8px; font-weight:bold;">{{ zone_bal | round(1) }}% 2F</td> <td style="padding:5px 8px;">{{ zone_icon }} {{ zone_label }}</td> </tr> </table>
