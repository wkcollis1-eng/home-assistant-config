 solid #222;"> <td style="padding:5px 8px; color:#aaa;">AC Runtime (MTD)</td> <td style="padding:5px 8px; font-weight:bold;">{{ ac_runtime_mth | round(1) }}h</td> <td style="padding:5px 8px; color:#888;">{{ ac_cycles_mth }} cycles · est. {{ ac_kwh_mth | round(0) | int(0) }} kWh · ${{ ac_cost_mth }}</td> </tr> <tr> <td style="padding:5px 8px; color:#aaa;">MTD AC cost/CDD</td> <td style="padding:5px 8px; font-weight:bold;">${{ ((ac_cost_mth / cdd_mtd) | round(2)) if cdd_mtd > 0 else '—' }}/CDD</td> <td style="padding:5px 8px; color:#888;">{{ 'at $' ~ elec_rate ~ '/kWh · ' ~ (cdd_mtd | round(1)) ~ ' MTD CDD' if cdd_mtd > 0 else 'CDD=0 MTD' }}</td> </tr> </table>
              {# ── ROOT CAUSE SYNTHESIS (conditional on short-cycle signature) ── #} {% if root_cause_short_cycle %} <h3 style="margin-bottom:6px;">🔍 Root Cause Synthesis</h3> <div style="background:rgba(80,80,180,0.07); border-left:3px solid #6677cc; padding:10px 14px; border-radius:4px; margin-bottom:12px;"> <p style="margin:0 0 8px 0; font-size:0.90em; font-weight:bold; color:#99aaee;"> The elevated efficiency and UA readings share a single root cause: <span style="color:#ccddff;">short-cycle combustion losses reducing effective seasonal AFUE from 0.95 to ~{{ eff_afue_est }}</span>. </p> <table style="width:100%; border-collapse:collapse; font-size:0.86em; margin-bottom:8px;"> <tr style="color:#888; border-bottom:1px solid #334;"> <td style="padding:3px 8px;">Metric</td> <td style="padding:3px 8px;">As reported</td> <td style="padding:3px 8px;">Short-cycle corrected</td> <td style="padding:3px 8px;">Artifact</td> <td style="padding:3px 8px;">Interpretation</td> </tr> <tr style="border-bottom:1px solid #223;"> <td style="padding:4px 8px; color:#aaa;">Seasonal AFUE</td> <td style="padding:4px 8px; font-weight:bold; color:#ff9966;">0.95 (nominal)</td> <td style="padding:4px 8px; font-weight:bold; color:#ffbb77;">~{{ eff_afue_est }}</td> <td style="padding:4px 8px; color:#888;">−{{ ((0.95 - eff_afue_est) * 100) | round(0) | int(0) }}pp</td> <td style="padding:4px 8px; color:#aaa;">Avg {{ mpc_month | round(1) }} min/cycle → {{ short_cycle_severity }} purge losses</td> </tr> <tr style="border-bottom:1px solid #223;"> <td style="padding:4px 8px; color:#aaa;">Gas wasted (12M)</td> <td style="padding:4px 8px; font-weight:bold; color:#ff9966;">{{ waste_ccf_12m }} CCF</td> <td style="padding:4px 8px; font-weight:bold; color:#81c784;">0 CCF</td> <td style="padding:4px 8px; color:#888;">${{ waste_cost_12m }}</td> <td style="padding:4px 8px; color:#aaa;">{{ sc_explained_pct }}% of {{ extra_ccf_eff }} CCF efficiency excess explained</td> </tr> <tr style="border-bottom:1px solid #223;"> <td style="padding:4px 8px; color:#aaa;">Building UA</td> <td style="padding:4px 8px; font-weight:bold; color:{{ '#ff9966' if ua_delta > 8 else '#ffbb77' }};">{{ ua }} BTU/hr-°F (+{{ ua_delta }}%)</td> <td style="padding:4px 8px; font-weight:bold; color:{{ '#81c784' if ua_corrected_delta <= 3 else '#ffbb77' }};">{{ ua_corrected }} BTU/hr-°F ({{ '+' if ua_corrected_delta > 0 }}{{ ua_corrected_delta }}%)</td> <td style="padding:4px 8px; color:#888;">+{{ ua_artifact }} BTU/hr-°F</td> <td style="padding:4px 8px; color:#aaa;">{{ 'Envelope at baseline after correction — no degradation' if ua_corrected_delta <= 3 else 'Residual elevation — monitor after cycling improves' }}</td> </tr> </table> <p style="margin:4px 0 0 0; font-size:0.84em; color:#aaa;"> <b>Mechanism:</b> The billing UA formula (<i>UA = gas × BTU/CCF × AFUE ÷ (HDD × 24)</i>) assumes nominal 0.95 AFUE. When short cycles deliver {{ ((0.95 - eff_afue_est) * 100) | round(0) | int(0) }}pp less heat per CCF burned, the formula attributes the shortfall to a leakier envelope rather than combustion inefficiency — inflating the UA reading by +{{ ua_artifact }} BTU/hr-°F. After the Ecobee differential changes (1F: 2.0°F, 2F: 1.5°F), expect both metrics to migrate toward baseline within one heating season. <br><br> <b>Rolling window context (baseline report v1.2.1):</b> The 2025 billing-aligned calendar year was <b>95.5 CCF/1k HDD</b> — within the ±7% CV range. The higher 12M rolling figure reflects Jan–Apr 2026 being 9.6% colder than Jan–Apr 2025, not additional degradation. Report investigation threshold: <b>105 CCF/1k HDD</b>. </p> </div> {% endif %}
