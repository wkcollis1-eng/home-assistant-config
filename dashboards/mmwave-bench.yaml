# =============================================================================
# DASHBOARD (YAML MODE) — mmWave bench rig
# -----------------------------------------------------------------------------
# THIS FILE IS LIVE, and it is the only dashboard file here that is.
#
# Everything in dashboards/lovelace/ is an EXPORT generated by
# scripts/export_dashboards.py from .storage — HA never reads those, they are a
# record for git. This file is the opposite: HA loads it directly, because
# configuration.yaml registers it under `lovelace: dashboards:` with
# `mode: yaml`. It deliberately does NOT live in dashboards/lovelace/, so that
# the "generated, do not hand-edit" rule on that directory stays true.
#
# CONSEQUENCE, and it is the whole point: edit dashboards/views/
# view-mmwave-bench.yaml and the change is live on the next browser refresh.
# No pasting into the raw configuration editor, no export step afterwards, and
# no drift between what git holds and what the dashboard shows.
#
# SECOND CONSEQUENCE, and it is the cost: a yaml-mode dashboard CANNOT be
# edited in the HA UI — the pencil is gone, and any change must come through
# the file. That is the correct trade for a bench rig whose entire discipline
# is "the YAML is the record" (R9). Do NOT apply this pattern to a dashboard
# somebody needs to tweak by hand; the Overview dashboard stays storage-mode
# for exactly that reason.
#
# PATH RESOLUTION — corrected 2026-09-07, after HA rejected the first attempt.
# Inside a Lovelace dashboard file the !include path is relative to THIS FILE'S
# DIRECTORY, not to the config root. configuration.yaml's own includes
# (automations.yaml, packages, themes) ARE config-root-relative, and assuming
# the same rule applied here produced:
#
#   "/config/dashboards/mmwave-bench.yaml", line 29, column 5: Unable to read
#   file /config/dashboards/dashboards/views/view-mmwave-bench.yaml
#
# — the `dashboards/` segment doubled. This file lives in /config/dashboards/,
# so the view is reached as views/view-mmwave-bench.yaml. Two include contexts,
# two different base directories; do not carry one rule across to the other.
#
# -----------------------------------------------------------------------------
# !! EDITING THE VIEW IS NOT ENOUGH — TOUCH THIS FILE TOO !!
#
# HA caches a yaml-mode dashboard against the mtime of THIS file, the one named
# in `lovelace: dashboards: filename:`. It does NOT look at the mtime of
# anything this file !includes. So editing views/view-mmwave-bench.yaml alone
# changes nothing on screen: HA compares this file's timestamp, finds it
# unchanged, and serves the cached parse from the last restart.
#
# Measured 2026-09-07: the view was updated at 17:28:33 with a new button; this
# file still read 15:54:30; the dashboard kept rendering the 15:54 card and no
# amount of browser refreshing helped, because the staleness was server-side.
#
# SO: after editing the view, touch this file (any edit will do, or
# `touch dashboards/mmwave-bench.yaml`), then reload the page. A full HA
# restart also works and is what you would otherwise reach for by mistake.
# -----------------------------------------------------------------------------
# =============================================================================
views:
  - !include views/view-mmwave-bench.yaml
