# ===============================================================
# AUTOMATION FAILURE TRACKING
# ===============================================================
- id: track_automation_failures
  alias: "Track Automation Failures"
  description: "Captures automation errors from system log for monitoring"
  mode: queued
  max: 10
  trigger:
    - platform: event
      event_type: system_log_event
      event_data:
        level: ERROR
  condition:
    - condition: template
      value_template: >
        {% set source = trigger.event.data.source | default('') | lower %}
        {% set message = trigger.event.data.message | default('') | lower %}
        {{ 'automation' in source or 'automation' in message }}
  action:
    - service: counter.increment
      entity_id: counter.automation_failures_24h
    - service: input_text.set_value
      target:
        entity_id: input_text.last_automation_failure
      data:
        value: >
          {{ now().strftime('%H:%M') }} - {{ trigger.event.data.source | default('Unknown') | truncate(50) }}: {{ trigger.event.data.message | default('') | truncate(150) }}
    - service: persistent_notification.create
      data:
        title: "🔴 Automation Failed"
        message: >
          **Source:** {{ trigger.event.data.source | default('Unknown') }}

          **Error:** {{ trigger.event.data.message | default('No message') }}

          **Time:** {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
        notification_id: "automation_failure_{{ now().timestamp() | int(0) }}"

- id: reset_automation_failure_counter
  alias: "Reset Automation Failure Counter"
  description: "Resets failure counter at midnight"
  trigger:
    - platform: time
      at: "00:00:00"
  action:
    - service: counter.reset
      entity_id: counter.automation_failures_24h
    - service: input_text.set_value
      target:
        entity_id: input_text.last_automation_failure
      data:
        value: ""


# ---------------------------------------------------------------
# UPS AUTOMATION 1 OF 5 — Outage Start Notification
# ---------------------------------------------------------------
# Trigger: on_battery transitions OFF → ON (grid power lost).
# Debounce is handled inside ESPHome (delayed_on filter on the
# binary sensor) — no additional HA-side delay is required here.
# Condition: sensor not in unknown/unavailable guards against a
# spurious state-change event during HA restart or OTA.
# ---------------------------------------------------------------
- id: ups_outage_start_v3
  alias: "UPS: Outage Start — On Battery"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.ups_monitor_on_battery
      # from: guard (2026-07-03): without it, unavailable->on after an ESPHome
      # reconnect (XB7 VAP-cycling dropouts) fires a false outage alert.
      from: "off"
      to: "on"
  condition:
    - condition: template
      value_template: >
        {{ states('binary_sensor.ups_monitor_on_battery') not in ['unknown', 'unavailable'] }}
  action:
    - service: notify.mobile_app_bills_iphone
      data:
        title: "🔴 Power Outage — On Battery"
        message: >
          Grid power lost. UPS running on battery.
          Voltage: {{ states('sensor.ups_monitor_battery_voltage') | float(0) | round(2) }}V
          at {{ now().strftime('%H:%M:%S') }}.
          Outage #{{ states('sensor.ups_monitor_total_outages') | int(0) }}.

# ---------------------------------------------------------------
# UPS AUTOMATION 2 OF 5 — Voltage Warning Notification
# ---------------------------------------------------------------
# Trigger: voltage_warning transitions OFF → ON (V < 12.40V / Cliff entry).
# NOTE: voltage_warning also triggers Auto 3 (graceful shutdown) as
# secondary path. cliff_imminent is the primary and typically fires
# ~3 min earlier. This notification fires concurrently — it is
# informational only and does not block the shutdown sequence.
#
# ESPHome threshold: warning_voltage = 12.40V.
# Runtime estimate included when available; gracefully degraded
# when sensor.ups_monitor_runtime_remaining_minutes is 'unknown'.
# Condition: on_battery must be ON to suppress spurious firing
# during startup voltage settling on a fully-charged battery.
# ---------------------------------------------------------------
- id: ups_voltage_warning_v3
  alias: "UPS: Voltage Warning — Cliff Entry"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.ups_monitor_voltage_warning
      to: "on"
  condition:
    - condition: state
      entity_id: binary_sensor.ups_monitor_on_battery
      state: "on"
  action:
    - service: notify.mobile_app_bills_iphone
      data:
        title: "⚠️ UPS Battery Warning — Cliff Entry (12.40V)"
        message: >
          Battery voltage below 12.40V — entering Cliff phase.
          Voltage: {{ states('sensor.ups_monitor_battery_voltage') | float(0) | round(2) }}V.
          {% set rt = states('sensor.ups_monitor_runtime_remaining_minutes') %}
          {% if rt not in ['unknown', 'unavailable', 'none'] and rt | float(-1) > 0 %}
          Runtime remaining: ~{{ rt | float(0) | round(0) | int(0) }} min.
          {% else %}
          Runtime: estimating…
          {% endif %}
          Cliff duration ~10 min at the measured 2.089A load
          (was ~17 min at 1.18A, validated May 2026).
          Graceful shutdown initiating.

# ---------------------------------------------------------------
# UPS AUTOMATION 3 OF 5 — Graceful Shutdown
# ---------------------------------------------------------------
# Fires on WHICHEVER trigger arrives first:
#   • cliff_imminent  → ON  (EMA slope < −10 mV/min sustained 60s — PRIMARY, validated May 2026)
#   • voltage_warning → ON  (V ≤ 12.40V — Cliff entry; secondary, fires ~3 min after cliff_imminent)
#   • runtime_remaining_minutes < 8   (coulomb-counter derived estimate — structural backup only)
#
# Validated cliff timing (INA260, May 2026):
#   Cliff phase: ~17 min from 12.40V to BP-65 LVD (11.80V) at 1.18 A;
#                ~10 min [D] at the 2.089 A load measured 2026-08-29.
#   Slope: −30 mV/min at cliff entry, accelerating to −58 mV/min at LVD.
#   Host shutdown sequence: 6 s observed (host_shutdown 13:40:11, last sample
#                13:40:17). The '~15 min' this block used to claim was a budget.
#   cliff_imminent fired at ~12.43V — margin still ample at the new load.
#
# Why cliff_imminent is the primary trigger (validated May 2026):
#   cliff_imminent fired at 13:39:41 UTC (V=12.431), ~3 min before voltage_warning
#   would have fired at ~13:42:22 UTC. Runtime estimator was 2.7× optimistic at
#   trigger (reported 50.8 min; actual ~19 min remaining) — runtime path alone
#   would not have provided adequate warning. voltage_critical (Auto 4) was not
#   exercised; V did not cross 12.20V until 8 min after HA was already down.
#
# Runtime estimator note:
#   Linear formula is 2.7× optimistic at cliff trigger (Section 3.5, May 2026 report).
#   < 8 min estimated ≈ ~3 min actual at that factor. This path is a structural
#   last-resort backup, not a reliable standalone trigger. cliff_imminent is primary.
#
# Four-layer protection chain:
#   Layer A — ESPHome binary sensor: debounced (30s delayed_on in firmware)
#   Layer B — on_battery condition: prevents boot-time spurious firing
#   Layer C — 30s stability delay + dual revalidation before shutdown:
#             (a) on_battery still ON, (b) at least one trigger still active
#   Layer D — mode: single: only one graceful-shutdown attempt allowed;
#             voltage_critical (Auto 4) is the backstop if this fires and
#             shutdown fails or takes longer than expected
# Hardware backstop: BP-65 LVD at 11.80V is always active.
# ---------------------------------------------------------------
- id: ups_graceful_shutdown_v3
  alias: "UPS: Graceful Shutdown — Warning, Cliff, or < 8 min Runtime"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.ups_monitor_voltage_warning
      to: "on"
      id: warning_trigger
    - platform: state
      entity_id: binary_sensor.ups_monitor_cliff_imminent
      to: "on"
      id: cliff_trigger
    - platform: numeric_state
      entity_id: sensor.ups_monitor_runtime_remaining_minutes
      below: 8
      id: runtime_trigger
    # Belt (2026-07-03): the three triggers above are edge-based. If a run
    # aborts at the 30 s recheck (e.g. a momentary on_battery blip) while
    # warning/cliff/runtime are already latched, no new edge ever fires. This
    # periodic trigger re-evaluates the same conditions once a minute; when
    # not on battery it is a no-op.
    - platform: time_pattern
      minutes: "/1"
      id: periodic_check
  condition:
    - condition: state
      entity_id: binary_sensor.ups_monitor_on_battery
      state: "on"
    - condition: template
      value_template: >
        {{ states('binary_sensor.ups_monitor_on_battery') not in ['unknown', 'unavailable'] }}
    # Gate for the periodic belt: only proceed when a shutdown condition
    # actually holds (edge triggers imply their own condition; the belt must
    # check explicitly or it would notify every minute on battery).
    - condition: template
      value_template: >
        {% if trigger.id != 'periodic_check' %}
          true
        {% else %}
          {% set warning = states('binary_sensor.ups_monitor_voltage_warning') %}
          {% set cliff = states('binary_sensor.ups_monitor_cliff_imminent') %}
          {% set rt = states('sensor.ups_monitor_runtime_remaining_minutes') | float(-1) %}
          {{ warning == 'on' or cliff == 'on' or (rt > 0 and rt < 8) }}
        {% endif %}
  action:
    # Notify immediately — record exists even if shutdown follows in 30 s.
    - service: notify.mobile_app_bills_iphone
      data:
        title: "🔴 UPS: Graceful Shutdown Initiating"
        message: >
          {% if trigger.id == 'warning_trigger' %}
          Cliff entry threshold reached (12.40V). ~10 min to BP-65 LVD
          at the current 26.8W load.
          {% elif trigger.id == 'cliff_trigger' %}
          Cliff imminent — slope below −10 mV/min.
          {% else %}
          Runtime below 8 minutes.
          {% endif %}
          Voltage: {{ states('sensor.ups_monitor_battery_voltage') | float(0) | round(2) }}V.
          {% set rt = states('sensor.ups_monitor_runtime_remaining_minutes') %}
          {% if rt not in ['unknown', 'unavailable', 'none'] and rt | float(-1) > 0 %}
          Runtime remaining: ~{{ rt | float(0) | round(0) | int(0) }} min.
          {% endif %}
          Host shutting down in 30 s.

    # 30s stability buffer.
    # At ~12.43V the cliff is ~10 min at the 2.089 A load (was ~17 min at 1.18 A),
    # so 30 s now costs ~5% of the shutdown window rather than <3%. Kept: the
    # observed shutdown takes 6 s, and the bounce-abort this delay buys is worth
    # more than 30 s of a 600 s margin.
    # A brief recovery bounce will abort shutdown at the revalidation step.
    - delay: "00:00:30"

    # Revalidation (a): if on_battery cleared during delay, grid restored — abort.
    - condition: state
      entity_id: binary_sensor.ups_monitor_on_battery
      state: "on"

    # Revalidation (b): at least one trigger condition must still be active.
    # Includes voltage_warning so a brief cliff bounce does not abort a valid
    # warning-triggered shutdown.
    - condition: template
      value_template: >
        {% set warning = states('binary_sensor.ups_monitor_voltage_warning') %}
        {% set cliff   = states('binary_sensor.ups_monitor_cliff_imminent') %}
        {% set rt      = states('sensor.ups_monitor_runtime_remaining_minutes') | float(-1) %}
        {{ warning == 'on' or cliff == 'on' or (rt > 0 and rt < 8) }}

    # Full OS shutdown — clean cold boot on power restore.
    - service: hassio.host_shutdown

# ---------------------------------------------------------------
# UPS AUTOMATION 4 OF 5 — Hard Fallback Shutdown (voltage_critical)
# ---------------------------------------------------------------
# Fires if voltage_critical → ON and graceful shutdown (Auto 3)
# has not yet completed (e.g. the 30s delay is still running,
# hassio.host_shutdown call failed, or HA is unresponsive).
#
# This is the final HA software safety net above BP-65 hardware LVD.
# ESPHome threshold: critical_voltage = 12.20V.
# At 12.20V: ~10 min to BP-65 LVD at 1.18 A; ~6 min [D] at the 2.089 A load.
# May 6 measured: V<12.20 at 13:48:07 → BP-65 trip ~13:58:30 = ~10.4 min.
# (Slope steepens −34→−58 mV/min through this window; linear projection overstates the time.)
#
# No stability delay — at 12.20V every second counts.
# Hardware backstop: BP-65 cuts at 11.80V with 0.40V margin below SW cutoff.
#
# May 2026 validation: This automation was NOT exercised — V did not cross
# 12.20V until 13:48:07, 8 min after HA was already down via the cliff_imminent
# path. Remains unvalidated by deliberate test; see Section 7.1 recommendations.
# ---------------------------------------------------------------
- id: ups_critical_shutdown_v3
  alias: "UPS: Hard Fallback Shutdown — Voltage Critical"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.ups_monitor_voltage_critical
      to: "on"
  condition:
    - condition: state
      entity_id: binary_sensor.ups_monitor_on_battery
      state: "on"
  action:
    - service: notify.mobile_app_bills_iphone
      data:
        title: "🔴 UPS CRITICAL — Emergency Shutdown"
        message: >
          Voltage critical threshold (12.20V) reached. ~6 min to BP-65 LVD
          at the current 26.8W load.
          Voltage: {{ states('sensor.ups_monitor_battery_voltage') | float(0) | round(2) }}V.
          Host performing emergency shutdown NOW.
          BP-65 hardware LVD at 11.80V is the final backstop.

    # Immediate shutdown — no delay at this voltage level.
    - service: hassio.host_shutdown

# ---------------------------------------------------------------
# UPS AUTOMATION 5 OF 5 — AC Restored Notification
# ---------------------------------------------------------------
# Trigger: on_battery transitions ON → OFF (grid power restored).
# Reports last-outage statistics from ESPHome flash-persisted sensors
# written by ESPHome at the moment on_battery goes OFF.
#
# New sensors available from INA260 upgrade (May 2026):
#   last_outage_min_voltage    — lowest voltage reached (replaces log hunting)
#   last_outage_start_voltage  — confirms full float vs partial SOC at outage start
#   last_recharge_peak_current — PSU CC-limit health indicator
#   total_outages              — persistent event counter
#
# Condition: sensor not in unknown/unavailable guards against spurious
# state-change during HA restart while battery is at float.
# ---------------------------------------------------------------
- id: ups_ac_restored_v3
  alias: "UPS: AC Restored — Grid Power Returned"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.ups_monitor_on_battery
      # from: guard (2026-07-03): unavailable->off on every ESPHome reconnect
      # previously fired a spurious "AC Restored" with garbage outage stats.
      from: "on"
      to: "off"
  condition:
    - condition: template
      value_template: >
        {{ states('binary_sensor.ups_monitor_on_battery') not in ['unknown', 'unavailable'] }}
  action:
    - service: notify.mobile_app_bills_iphone
      data:
        title: "✅ AC Restored — Grid Power Returned"
        message: >
          Grid power restored at {{ now().strftime('%H:%M:%S') }}.

          Outage #{{ states('sensor.ups_monitor_total_outages') | int(0) }}
          Duration: {{ states('sensor.ups_monitor_last_outage_duration') | int(0) }} min
          Ah delivered: {{ states('sensor.ups_monitor_last_outage_ah') | float(0) | round(3) }} Ah
          Wh delivered: {{ states('sensor.ups_monitor_last_outage_wh') | float(0) | round(2) }} Wh
          Capacity used: {{ states('sensor.ups_monitor_last_outage_capacity_used') | float(0) | round(1) }}%
          Start voltage: {{ states('sensor.ups_monitor_last_outage_start_voltage') | float(0) | round(3) }}V
          Min voltage: {{ states('sensor.ups_monitor_last_outage_min_voltage') | float(0) | round(3) }}V
          Peak recharge: {{ states('sensor.ups_monitor_last_recharge_peak_current') | float(0) | round(2) }}A
          Battery now: {{ states('sensor.ups_monitor_battery_voltage') | float(0) | round(2) }}V



