# rtlamr2mqtt add-on config — REVISED 2026-08-24 after reading rtlamr v0.9.5
# (the version the add-on Dockerfile pins: go install github.com/bemasher/rtlamr@v0.9.5)
# and re-measuring all three meters over 24 h of InfluxDB last_seen timestamps.
#
# Errors from the 2026-08-22 pass are kept below rather than deleted (R13).
#
# ERROR 1 — "set listen_mode: true". DO NOT. In this add-on listen_mode is a
#   DISCOVERY mode, not a continuous-publishing mode. meter_reader.py:
#       if self.listen_mode:
#           if meter_id not in self._seen_ids: ... logger.info('New meter | ID ...')
#       else:
#           self.reading_queue.put_nowait(reading)     # <-- only here
#   In listen_mode readings are never enqueued, so NOTHING is published to MQTT.
#   config.py confirms the intent and forces sleep_for = 0 when listen_mode is set.
#
# ERROR 2 — "remove -unique=true". Removing it does nothing. buildcmd.py adds it
#   as the DEFAULT unless custom_parameters already contains a -unique flag:
#       if not has_prefix('-unique', custom_args):
#           args.append('-unique=true')
#   The override must be explicit: -unique=false.
#
# ERROR 3 (NEW, 2026-08-24) — "rtltcp: -s <rate> sets the sample rate."
#   IT DOES NOT. rtlamr overrides it over the rtl_tcp control socket on connect.
#   main.go, after Connect():
#       cfg := rcvr.d.Cfg                    // SampleRate = DataRate * ChipLength
#       flag.Visit(...)                      // only -samplerate changes cfg here
#       rcvr.SetCenterFreq(cfg.CenterFreq)
#       rcvr.SetSampleRate(uint32(cfg.SampleRate))   // <-- UNCONDITIONAL
#   and protocol/decode.go Allocate():
#       d.Cfg.SampleRate = d.Cfg.DataRate * d.Cfg.ChipLength  // 32768 * symbollength
#   rtltcp.go maps that to rtl_tcp command 2 (sampleRate), so whatever rtl_tcp was
#   started with is replaced. The 2026-08-23 experiment that moved rtltcp -s from
#   2048000 to 2359296 therefore compared 2359296 against 2359296. It was recorded
#   as "no effect, a null result". It was not a null result — it was a no-op, and
#   the hourly capture series confirms it: no step at 08-23 21:16.
#   The real knob is -symbollength. See the trade table below.

general:
  sleep_for: 0            # UNCHANGED. The whole 2026-08-22 fix; do not raise it
                          # without accepting the capture-rate cost below.
  verbosity: info         # debug turned out to be UNNECESSARY, 2026-08-25.
                          # The plan was one debug start to read "CenterFreq:"
                          # out of rtlamr's startup dump. Not needed: the add-on
                          # logs the full rtlamr command line at info, and every
                          # value in that dump is derived from the flags with no
                          # branch - Allocate() is SampleRate = DataRate *
                          # ChipLength, and -centerfreq overrides unconditionally
                          # in main.go's flag.Visit. So the command line IS the
                          # proof. Use debug only to read output rtlamr computes
                          # rather than is told, e.g. GainCount.
                          # It will NOT reveal rtl_tcp sample loss at any level:
                          # nothing drains that stdout after 'listening...'.
  listen_mode: false      # UNCHANGED. See ERROR 1 - this must stay false.

custom_parameters:
  # >>> EXPERIMENT RUNNING - deployed 2026-08-25, symbollength 72 -> 80 <<<
  # ONE variable: bandwidth. 32768*80 = 2,621,440 Hz, +/-1.311 MHz, x1.111 the
  # control. -centerfreq and -unique are unchanged; the rtltcp -s move is a
  # no-op on the result (ERROR 3) and is only kept matched so rtl_tcp starts
  # where rtlamr is about to put it instead of retuning during startup.
  #
  #   CONTROL   symbollength 72, 24 h of 2026-08-24, and the 2026-08-25 pin
  #             test showed the -centerfreq pin itself changes nothing:
  #               electric 27.7%   gas ~25%   water 67.3%
  #               host 12.72 W     SDR 4.30 W
  #
  #   PREDICTED symbollength 80 (capture scales linearly with bandwidth for scm,
  #             because scm losses are memoryless - see MEASURED below):
  #               electric 30.8%   gas 27.8%
  #               host 13.00 W     SDR 4.59 W
  #               water  NOT PREDICTED. Its losses are phase-structured, not
  #                      memoryless, so widening either leaves the three good
  #                      phases alone or lights a new one as a STEP. Measure it,
  #                      do not model it.
  #
  #   REVERT IF electric lands well short of 30.8%. Above ~2.4 Msps an RTL-SDR
  #             commonly drops samples, which breaks the linearity the whole
  #             table rests on. NOTE YOU CANNOT SEE THAT LOSS IN THE ADD-ON LOG:
  #             rtl_tcp reports backlog with "ll+, now N" on a stdout nobody
  #             drains after the 'listening...' ready pattern, at any verbosity.
  #             The capture rate IS the instrument. Revert = restore the two
  #             lines below to 72 / 2359296.
  rtltcp: -s 2621440      # Cosmetic only (see ERROR 3), but KEEP IT MATCHED to
                          # 32768 * symbollength so rtl_tcp starts at the rate
                          # rtlamr is about to demand and the override is a no-op
                          # instead of a retune during startup.

  # !!! 915500000 WAS DEPLOYED 12:03-16:20 EDT 2026-08-25 AND REVERTED: IT KILLS
  # !!! THE GAS METER. Frames per wall-clock minute, 132 min vs 12 min:
  # !!!     gas       1.05/min -> 0.25/min  (0.24x)  max gap 466 s
  # !!!     electric  1.87/min -> 2.09/min  (1.12x)
  # !!!     water     1.23/min -> 1.17/min  (0.95x)
  # !!! binary_sensor.gas_meter_stale tripped and gas gaps ran past its 300 s
  # !!! threshold. At 915.5 the 6 MHz analog window is 912.5-918.5 MHz; at
  # !!! 912.38 it is 909.38-915.38. The gas ERT - an American Meter AL-425
  # !!! module, a different device from the Vision electric meter - lives in the
  # !!! LOW part of the band we tuned away from. Trading 76% of gas for 12% of
  # !!! electric is not a trade worth making on a live alarm.
  # !!! The 915.5 run is still worth every minute: it proved the water 14 s grid
  # !!! and the parity filter, and that knowledge does not require staying there.
  rtlamr: -unique=false -symbollength=80 -centerfreq=912380000
  #
  # -unique=false   MUST be explicit, not absent (ERROR 2). The rtlamr UniqueFilter
  #                 suppresses any frame whose checksum matches the previous one
  #                 from that id. With sleep_for: 0 the process never restarts, so
  #                 that map persists and a flat meter would go silent - freezing
  #                 last_seen, climbing _age past sdr_water_stale_minutes, and
  #                 gating off automation.sdr_water_meter_leak_now.
  #
  # -symbollength   Currently 80 (EXPERIMENT above); 72 is the rtlamr DEFAULT
  #                 (flags.go:43) and the control value. Stating it explicitly is
  #                 deliberate: it is the only knob that sets sample rate, and
  #                 therefore the only knob that sets BOTH received bandwidth and
  #                 CPU. Legal values are exactly 8, 32, 40, 48, 56, 64, 72, 80,
  #                 88, 96 - anything else is log.Fatal("invalid symbollength").
  #
  # -centerfreq=912380000   THE NEW LINE, AND THE REASON FOR THIS REVISION.
  #                 Without it the tuned frequency is CHOSEN AT RANDOM on every
  #                 add-on start. protocol/decode.go RegisterProtocol():
  #                     // Take the largest value for each protocol. Some values
  #                     // are simply overridden
  #                     d.Cfg.CenterFreq = p.Cfg().CenterFreq        // OVERRIDE
  #                     d.Cfg.DataRate   = max(d.Cfg.DataRate,   ...)
  #                     d.Cfg.ChipLength = max(d.Cfg.ChipLength, ...)
  #                 CenterFreq is assigned, not maxed - so the LAST protocol
  #                 registered wins. And registration walks a Go map:
  #                     for name := range msgType { ... RegisterProtocol(p) }
  #                     type StringMap map[string]bool
  #                 Go randomises map iteration order by design. buildcmd.py emits
  #                 -msgtype=scm,scm,r900, which collapses to a 2-key map, so on
  #                 every start the receiver tunes either
  #                     scm/scm.go:44   CenterFreq: 912600155
  #                     r900/r900.go:62 CenterFreq: 912380000
  #                 at 50/50 - a 220,155 Hz difference decided by a coin flip.
  #                 With sleep_for: 0 the process never restarts, so whichever it
  #                 landed on is frozen in until the next add-on restart.
  #
  #                 VALUE NOW 915500000, deployed 2026-08-25 12:03 EDT. It is
  #                 the centre of BOTH meters' documented hop ranges (electric
  #                 909.59-921.78 -> 915.685; water 910-920 -> 915.0), and it
  #                 immediately broke the water meter's 28 s parity filter -
  #                 see PRIMARY SOURCES and the WATER note. rtlamr's two built-in
  #                 centres are both ~3 MHz below where these meters live, which
  #                 is the single most consequential finding in this file.
  #
  #                 SUPERSEDED VALUE: 912380000 (the r900 built-in). Rationale
  #                 recorded because the reasoning was sound and the outcome was
  #                 not: SCM losses are memoryless (see MEASURED below),
  #                 which means only the WIDTH of the window matters for scm, not
  #                 where it sits. R900 losses are phase-structured - a small set
  #                 of discrete channels - so position DOES matter for water, and
  #                 912380000 is the value that protects the position-sensitive
  #                 protocol at no modelled cost to the other two.
  #
  #                 TESTED 2026-08-25, AND THE RATIONALE TURNED OUT TO BE MOOT.
  #                 Deployed 08:16:10; one hour against same-clock-hour controls
  #                 on the two prior days:
  #                    electric  29.1%  vs  30.8% / 29.8%
  #                    gas       26.3%  vs  26.2% / 25.1%
  #                    water     67.4%  vs  67.5% / 68.5%
  #                 Nothing moved. On a common epoch the R900 phase structure is
  #                 unchanged and the SAME ABSOLUTE PHASE is still dead (0/25),
  #                 with the partial phase still at 40%. So 220,155 Hz is not the
  #                 mechanism for any of the three meters, and the dead R900
  #                 channel is NOT explained by the scm-vs-r900 centre frequency.
  #                 A pre-registered prediction that water would reach 87-88% on
  #                 four live phases - from a 4.5 min sample reading 87.5% - was
  #                 FALSIFIED. That sample's binomial P was 0.22; withholding was
  #                 correct. Recorded rather than quietly dropped (R13).
  #                 The choice of value is therefore harmless but unmotivated:
  #                 keep 912380000 because it is measured no-regression, not
  #                 because the reasoning above was borne out. The REASON to pin
  #                 stands untouched - determinism - and is now load-bearing for
  #                 the UPS outage automation, which restarts the add-on after
  #                 every power cut and would otherwise re-roll the tuning.
  #                 And the sweep needs MHz-scale steps: 220 kHz is demonstrably
  #                 too small to test anything.
  #                 CAN YOU CHECK WHICH ONE IT IS ON RIGHT NOW? NO - AND THAT IS
  #                 PART OF THE DEFECT, NOT A GAP IN THE INVESTIGATION.
  #                 An earlier draft of this file said the add-on log "carries a
  #                 literal CenterFreq: <n> line". It does not, at the configured
  #                 verbosity, and the live log disproved it on 2026-08-24 (R13).
  #                 rtlamr does print its final config - main.go calls
  #                 rcvr.d.Log() immediately before the slog "GainCount" line -
  #                 but the add-on consumes those lines inside
  #                 ProcessManager._wait_for_ready(), whose ready_pattern for
  #                 rtlamr IS 'GainCount', and emits each one with logger.debug:
  #                     line = line_bytes.decode(...).strip()
  #                     if line:
  #                         self._recent_lines.append(line)
  #                         logger.debug('%s: %s', self.name, line)
  #                     if self.ready_pattern in line:
  #                         return True
  #                 At verbosity: info those are dropped and unrecoverable -
  #                 _recent_lines is only ever dumped by _log_recent_output(),
  #                 which runs on timeout or early exit, i.e. never on success.
  #                 verbosity: debug WOULD print it. But reading it costs an
  #                 add-on restart, and a restart RE-ROLLS THE COIN. So the value
  #                 a debug restart reveals is the new draw, never the one that
  #                 produced the measurements below. The tuning of a run in
  #                 progress is unobservable in principle.
  #                 THE ONLY WAY TO KNOW IS TO PIN IT. Set verbosity: debug for
  #                 the single start that applies this change, confirm the log
  #                 reads CenterFreq: 912380000, then set verbosity back to info.
  #                 (debug adds ~1 line per frame, ~5.6k/day, so it is fine for a
  #                 confirmation window and not something to leave on.)

mqtt:
  ha_autodiscovery_topic: homeassistant
  ha_status_topic: homeassistant/status
  base_topic: rtlamr
  discovery_interval: 300
  tls_enabled: false

# THE ACTUAL HARDWARE, from nameplate photos 2026-08-25 (Bill). Recorded because
# every RF conclusion in this file depends on it and it had been ASSUMED before.
#
#   ELECTRIC  Vision Metering VM1991 "Vision HP-RF", CL200 240V 3W, Cat
#             VM-2E2B1P, FW 4.159.B, 9/21, meter SN 10626149.
#             RADIO: Hunt Technologies "AirPoint".  FCC ID Y8E-VM1991.
#             ERT id 43344099 (on the radio barcode).
#             *** THIS IS NOT AN ITRON ERT. *** Earlier entries in this file
#             reasoned from "Itron 50/51/52/53ESS, 909.6-921.8 MHz, 50 channels".
#             That is a DIFFERENT VENDOR'S METER and does not describe this one.
#             It emits SCM-compatible frames - rtlamr decodes it and the id
#             matches the barcode - but its channel plan is unknown here and the
#             8.51 MHz "implied hop span" was fitted, never sourced. The FCC test
#             report (fcc.report/FCC-ID/Y8E-VM1991/1636707) has the real numbers;
#             both FCC mirrors 403 automated fetches, so it needs a browser.
#   GAS       American Meter / Honeywell AL-425, Connecticut Natural Gas,
#             MAOP 10 PSI, ANSI 400, meter 561309 / 16F278598, set 2021.
#             ERT module id 20109304.
#   WATER     Neptune R900 v4, model R900M, ProCoder R900i, mfg 09/17/21,
#             SN 1571014090.  FCC ID P2SR900M, IC 4171B-R900M.
#             CONFIRMED FROM THE MANUAL 2026-08-25, and it is a problem. The
#             Neptune R900 MIU guide states the transmit period TWICE:
#               Specifications: "Every 14 seconds - standard mobile message"
#               Glossary: "transmission time ... default is approximately
#                          fourteen (14) seconds. Custom time is not available."
#             Measured here: 28.000 s, 2,077 gaps, rms 0.001 slots, and ZERO
#             14 s gaps ever observed. 28 = 2 x 14 exactly.
#             *** CONFIRMED 2026-08-25 12:03 EDT BY RETUNING TO 915.5 MHz. ***
#             THE 28 s GRID WAS AN ARTIFACT OF THE TUNING, NOT A PROPERTY OF THE
#             METER. Within 140 s of moving -centerfreq from 912380000 to
#             915500000 the water gaps read 42.012, 41.991, 41.967, 14.022 s -
#             3.001, 2.999, 2.998 and 1.002 slots on a 14.00 s grid, implying a
#             base period of 13.997 s. A 14 s gap is IMPOSSIBLE on a 28 s grid.
#             THE PARITY TEST, which is the strongest result in this file
#             because it is structural rather than a rate estimate:
#                 912.380 MHz   0 odd-multiple-of-14 gaps in 2,077
#                 915.500 MHz   3 odd-multiple-of-14 gaps in 3
#             Rule-of-three puts the old rate at <= 3/2077 = 0.00144, so
#             P(all 3 odd | old regime) <= 0.00144^3 = 3.0e-9.
#             At 912.380 the receiver was a PERFECT PARITY FILTER on this meter -
#             2,077 for 2,077 even-indexed transmissions - and at 915.500 that
#             filter is gone.
#             SO THE REAL WATER CAPTURE WAS ~33.6%, NOT 67.3%. Every water figure
#             in this file stated on the 28 s grid HALVES:
#                 24 h baseline      67.3% -> 33.6%
#                 pre-pin window     67.7% -> 33.9%
#                 symlen 80 @912.38  57.5% -> 28.8%
#             and the "5-phase structure" was really a 10-phase structure.
#             The mechanism is not established. r900.go runs Reed-Solomon and
#             drops bad frames silently, so a variant payload on alternate
#             transmissions would vanish without trace. The cheap route was
#             checked and closed: r900bcd is Parser{r900.NewParser(...)} - the
#             same parser and the same preamble - so adding it finds nothing.
#             The 5-phase structure would then really be a 10-phase structure.
#             Settling this needs the IQ capture, or a decoder that logs
#             preamble hits that fail RS.
#
# GEOMETRY (Bill, 2026-08-25). Antenna: bundle mast on the magnetic base, on a
# METAL END TABLE (so it does have a ground plane), 2nd floor, ~3 ft from the PC.
#   electric  ~15 ft below, ~10 ft horizontal  -> ~18 ft slant. VERY CLOSE.
#   gas       opposite side of the house       -> worst path, lowest capture.
#   water     basement, 2 floors down          -> bad path, yet 3 of 5 phases
#                                                 at 99-100%.
# WHAT THE GEOMETRY IMPLIES, AND IT REVERSES AN ASSUMPTION. Free-space loss at
# 915 MHz over 5.5 m is ~46 dB, so the electric meter is almost certainly the
# STRONGEST signal in the band at this antenna. Its ~30% capture therefore
# cannot be a weak-signal problem. The opposite is now plausible: at that range
# an RTL-SDR with tuner AGC can be driven into compression, and short ERT bursts
# make the AGC pump - which would also hurt gas and water, since the AGC is
# shared. So the -tunergain experiment should be run FIXED, and possibly
# DOWNWARD, not upward. Water holding 99-100% on three phases through two floors
# is further evidence its dead phase is frequency-driven, not margin-driven.

meters:
  - id: 20109304
    protocol: scm
    name: gas_meter
    unit_of_measurement: ft³
    icon: mdi:fire
  - id: 43344099
    protocol: scm
    name: electric_meter
    unit_of_measurement: kWh
    icon: mdi:flash
  - id: 1571014090
    protocol: r900
    name: water_meter
    unit_of_measurement: gal
    icon: mdi:water

# ---------------------------------------------------------------------------
# MEASURED 2026-08-24 - 24 h of InfluxDB sensor.*_meter_last_seen write times.
# That series is the frame arrival log: with -unique=false every decode
# republishes, and last_seen is a timestamp so it changes on every frame.
# (Do NOT use mean(sensor.*_meter_age) for this - InfluxDB writes on state
# change, not on a clock, so that mean is biased. It reads ~12.7 s for water
# against a true time-weighted 23.5 s.)
#
#   meter     protocol  transmit grid   capture   loss structure
#   electric  scm        11.42 s         27.7%    geometric, chi2=4.7 on 7 dof
#   gas       scm        30.0  s         46.7%    structured, not yet explained
#   water     r900       28.00 s         67.3%    5-phase; never 2 misses in a row
#
# THE ELECTRIC METER LOSSES ARE MEMORYLESS, AND THAT IS THE WHOLE FINDING.
# Observed vs geometric(p=0.2771) for gaps of k transmissions:
#       k        1     2     3     4     5     6     7     8
#       obs    573   420   309   218   178   107    72    57
#       exp    581   420   304   220   159   115    83    60
# A weak link fades, and fading is correlated in time, so a signal-limited
# receiver clusters its misses - an excess at high k. There is no excess. Each
# transmission is independently missed with the same probability regardless of
# what happened to the one before it. That rules out, without needing to know
# the mechanism: antenna gain, antenna placement, tuner gain/AGC, USB or CPU
# sample loss, and collisions with the other meters. None of those produce a
# clean geometric tail.
#
# ^^^ THAT LAST SENTENCE IS OVERSTATED, AND THE ERROR IS MINE. Corrected
# 2026-08-25 (R13). The argument was: fading is correlated in TIME, so a
# signal-limited link clusters its misses; there is no clustering; therefore not
# signal-limited. That holds for a FIXED-FREQUENCY link. It does not hold here,
# because the transmitter HOPS. On a frequency-hopping link, frequency-selective
# fading gives every transmission an independent draw of path attenuation - so
# per-hop SNR varies independently and the losses look MEMORYLESS IN TIME even
# when they are entirely a margin problem.
# So the geometric fit rules out time-correlated fading. It does NOT rule out
# sensitivity, and therefore does not rule out antenna, placement or gain.
# STILL SOUND: losses are independent per transmission, and the mechanism is
# per-hop rather than a slow environmental drift.
# WITHDRAWN: "antenna work has no measured headroom to recover the electric
# meter" was NOT established by this data. -tunergain is back on the table as a
# real experiment - rtlamr defaults to tuner AGC (main.go
# `if !gainFlagSet { rcvr.SetGainMode(true) }`, and rtltcp SetGainMode(true)
# sends tunerGainMode=0, i.e. AUTO).
#
# WHAT FORCED THE CORRECTION: the symbollength 80 run.
#
#   FIRST READ, 5.7 min / 30 slots: 56.7% capture, a 2.18x rise in electric
#   frames/min, P = 0.0008. That number was a lucky run on top of a real effect
#   and it did not hold - recorded rather than quietly replaced (R13).
#
#   AT 42 min, hour-matched against pooled symlen-72 controls on 08-23/08-24:
#     electric  81/213 = 38.0%  vs control 122/421 = 29.0%  ratio 1.31x  P=0.0028
#     gas       42/160 = 26.2%  vs control  81/318 = 25.5%  ratio 1.03x  P=0.44
#     water     51/ 87 = 58.6%  vs control 114/171 = 66.7%  ratio 0.88x  P(<=)=0.071
#   against a bandwidth ratio of 1.111x and a linear prediction of 30.8%.
#
# So capture is still NOT pure bandwidth/hop-span geometry - but only MILDLY
# superlinear (1.31x on 1.111x), not the 2x the first sample suggested. The
# LOGIC of the correction above is unaffected: memoryless losses genuinely do
# not rule out sensitivity on a hopping link, whatever the size of this effect.
# The EMPIRICAL WEIGHT behind it is much smaller than first written.
#
# AND WATER WENT DOWN, which the linear model does not predict at all. On a
# common epoch no phase was gained or lost; the three reliable phases degraded
# together, 99.2/100.0/99.2% -> 88.9/88.9/89.5%. That is frames being missed on
# channels that were previously near-perfect, not a coverage change.
# NOTE the obvious explanation FAILS: sample loss above 2.4 Msps would tax all
# three meters uniformly, and gas is flat at 1.03x. A uniform drop does not fit.
# What does fit electric-up / gas-flat / water-down is FILTER SHAPE - librtlsdr
# sets the R820T2 IF bandwidth to the sample rate, so changing it moves the
# passband ripple and gain profile, not just the width, and different meters'
# channels sit differently under the new response.
# Not separable without the IQ capture.
#
# UPDATED at 1.87 h, hour-matched against the SAME clock window on 08-23/08-24:
#   electric  207/589 = 35.1%  vs 335/1172 = 28.6%   1.23x   P(>=) = 0.00032
#   gas       116/447 = 26.0%  vs 224/ 890 = 25.2%   1.03x   P     = 0.37
#   water     138/240 = 57.5%  vs 320/ 478 = 66.9%   0.86x   P(<=) = 0.00140
# THE WATER DECLINE IS NOW ESTABLISHED. It read p=0.071 at 42 min and 0.0014 at
# 1.87 h - recorded because the earlier line called it "neither established nor
# dismissable" and that is no longer true (R13).
# So symbollength 80 is a REAL TRADE, both halves significant: electric +23%,
# water -14%, gas unchanged. Neither is operationally at risk - water at 57.5%
# is a ~49 s mean gap against a 10-minute LeakNow hold, 12x margin - so this is
# a preference between instruments, not a safety question.
# AND THE CHOICE IS BINARY. Because the tuner threshold sits at 2,430,000 Hz and
# 72 is the largest legal symbollength beneath it, there is no intermediate
# setting: 72 (water 67%, electric 29%) or 80 (water 57%, electric 35%).
# DO -tunergain FIRST. If AGC pumping off the very close electric meter is
# costing frames, a fixed gain could move BOTH meters and would change this
# decision rather than being decided by it.
#
# FOUND 2026-08-25 AFTER THE ABOVE WAS WRITTEN, and it reframes the whole run:
# 72 -> 80 IS NOT AN 11% BANDWIDTH STEP. IT CROSSES A TUNER CONFIG BOUNDARY.
# librtlsdr passes the SAMPLE RATE as the tuner bandwidth -
#     dev->tuner->set_bw(dev, dev->bw > 0 ? dev->bw : dev->rate)
# and tuner_r82xx.c r82xx_set_bandwidth() is a branch ladder, not continuous:
#     static const int r82xx_if_low_pass_bw_table[] = { 1700000, ... };
#     #define FILT_HP_BW1 350000
#     #define FILT_HP_BW2 380000
#     } else if (bw > r82xx_if_low_pass_bw_table[0] + FILT_HP_BW1 + FILT_HP_BW2) {
#             // BW: 6 MHz
#             reg_0a = 0x10; reg_0b = 0x6b; priv->int_freq = 3570000;
# The threshold is 1,700,000 + 350,000 + 380,000 = 2,430,000 Hz.
#     symbollength 72 -> 2,359,296  BELOW  -> fine-grained LPF, IF ~2.30 MHz
#     symbollength 80 -> 2,621,440  ABOVE  -> 6 MHz filter,    IF  3.57 MHz
# 72 is the largest legal symbollength under the threshold (2430000/32768 = 74.2),
# so EVERY step above 72 lands in the 6 MHz configuration.
#
# CONSEQUENCE: at symbollength >= 80 the ANALOG filter is 2.3x wider than the
# ADC samples, so out-of-band ERT channels ALIAS into the digital passband while
# ~4 dB more noise comes with them. That is the shape of the result:
# electric UP (aliased channels add coverage for a hopping transmitter),
# water DOWN (nothing to gain in coverage, pays the noise), gas FLAT.
# It is NOT "11% more bandwidth" and the linear trade table above should not be
# read as governing anything at 80 or higher.
#
# YOU CANNOT SEPARATE THESE THROUGH rtl_tcp. rtlsdr_set_tuner_bandwidth() exists
# in librtlsdr (librtlsdr.c:1010) but rtl_tcp implements commands 0x01-0x0e and
# NONE of them is set-tuner-bandwidth, so dev->bw is always 0 and the filter is
# welded to the sample rate. Adding one case to that switch is a ~5 line fork and
# would allow the clean 2x2: {2.36, 2.62 Msps} x {2.4, 6 MHz filter}, which is
# the experiment that actually separates aliased coverage from noise penalty.
#
# Two candidates for the electric gain, not separable from this data:
#   (a) TUNER FILTER SHAPE. librtlsdr sets the R820T2 IF bandwidth to the sample
#       rate (`dev->tuner->set_bw(dev, dev->bw > 0 ? dev->bw : dev->rate)`) and
#       that filter is not brick-wall. Widening moves the roll-off outward, so
#       channels attenuated at the edge come up to full strength - a step, not a
#       proportional gain.
#   (b) PROCESSING GAIN. symbollength IS samples-per-chip, so 80 vs 72 integrates
#       11% more samples in the matched filter, ~0.45 dB. Small - but if many
#       transmissions sat near the detection threshold, a small SNR gain flips a
#       disproportionate number. That is a SENSITIVITY effect: exactly what the
#       withdrawn sentence claimed could not be happening.
