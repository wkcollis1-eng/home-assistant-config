# meter's counter only advances every 86 s. A second dongle would buy the same
# nothing. STOP TUNING THE RADIO. The remaining wins are elsewhere: compare SEM
# to the utility at 15-min or hourly windows rather than 5-min (+/-14% -> +/-4.8%
# -> +/-1.2%, free), raise sdr_gas_stale_minutes from 5 to ~15, and deploy the
# UPS outage automation.
#
# THE OPTIMISATION THAT FOLLOWS. Electric has roughly 2.7x surplus over its own
# 86 s counter tick and that surplus is WASTED - it cannot improve SEM agreement.
# Gas is the binding constraint. So the correct move for these priorities is to
# spend electric's surplus on gas: tune LOWER, toward where the gas ERT lives,
# and accept it as long as electric's mean gap stays comfortably under 86 s.
# Candidate: -centerfreq=911500000 (Nyquist 910.19-912.81, analog 908.5-914.5 at
# symlen 80). ACCEPT IF gas frames/min rises and electric mean gap stays < 60 s.
# REVERT IF electric mean gap approaches 86 s, because past that point you start
# missing genuine counter ticks and the SEM comparison degrades for real.
#
# THE TRADE TABLE. Sample rate = 32768 * symbollength, exactly. Bandwidth and
# CPU both scale with it, and for scm so does capture (capture = BW / hop span).
# Predicted capture = 27.7% * symbollength/72. CPU delta measured at 72 is
# +13.0 pp of whole-host processor_use (2.6% baseline 08-14..08-20 -> 15.6% on
# 08-23/24), scaled linearly.
#
#   symlen   sample rate    bandwidth    elec capture   SDR W   host W   $/yr vs now
#      32     1,048,576     +/-0.52 MHz     12.3%        2.87    11.29    -3.63
#      48     1,572,864     +/-0.79 MHz     18.5%        3.45    11.86    -2.18
#      56     1,835,008     +/-0.92 MHz     21.5%        3.73    12.15    -1.45
#      64     2,097,152     +/-1.05 MHz     24.6%        4.02    12.43    -0.73
#      72     2,359,296     +/-1.18 MHz     27.7%*       4.30*   12.72*    0.00   <- now
#      80     2,621,440     +/-1.31 MHz     30.8%        4.59    13.01    +0.73
#      88     2,883,584     +/-1.44 MHz     33.8%        4.87    13.29    +1.45
#      96     3,145,728     +/-1.57 MHz     36.9%        5.16    13.58    +2.18
#   (* = measured. rtltcp -s should be set to the sample rate column.)
#
# WATTS, MEASURED 2026-08-24 from sensor.ha_n100_pc_current_consumption - the
# Kasa plug on the host, ~15,000 samples/day. This replaces the earlier note
# that wattage "could not be measured": monitoring_load is the wrong sensor
# (host + UPS outlet + router on one feed), the PC plug is the right one.
#
#   no SDR       (08-15..08-20)  8.416 W   n=93,394
#   sleep_for:60 (~50% duty)    11.433 W   -> +3.017 W
#   sleep_for:0  (100% duty)    12.719 W   -> +4.303 W
#
# Two duty points solve the load into fixed and rate-proportional parts,
# delta = F + V*duty:  V = 2.572 W, F = 1.731 W.
#
# THAT FIXED 1.73 W IS THE TUNER THAT NEVER POWERS DOWN, NOW MEASURED. The
# 2026-08-22 entry reasoned that SIGKILL runs no cleanup, so rtlsdr_cancel_async()
# and rtlsdr_close() never execute and librtlsdr's tuner power-down never runs -
# and flagged it explicitly as "reasoning from how signals work, not measured".
# It is measured now: 1.73 W of the SDR load survives a sleep window in which
# both processes are dead. The reasoning was right.
#
# LIMITS (R11): F/V rest on two duty points and the CHANGELOG's ~50% duty figure
# for sleep_for: 60. Scaling V with symbollength assumes CPU and USB power are
# proportional to sample rate, which is plausible and NOT measured - only the 72
# row is real. The 8.416 W baseline is a true no-SDR figure: it is flat to
# +/-0.03 W across 08-10..08-20 and the add-on first ran on 08-21.
#
# librtlsdr accepts anything in 900001..3200000 (librtlsdr.c
# rtlsdr_set_sample_rate), so 96 is legal at the driver. Whether USB 2.0
# sustains it is a separate question the driver does not answer: above ~2.4 Msps
# dropped samples are common, and dropped samples would break the linearity in
# the table. That is precisely why 96 is an EXPERIMENT with a falsifiable
# prediction (36.9%) and not a recommendation. If capture lands well short of
# 36.9%, the link is dropping samples and the answer is to go back to 72.
#
# BUT 36.9% IS A PROJECTION, NOT A CEILING, AND THE MODEL UNDER IT IS SHAKY.
# Added 2026-08-24 rather than leaving the figure looking harder than it is.
# capture = BW / hop span is fitted to ONE measured point, which is what sets
# the 8.51 MHz denominator. Published ERT channel-plan figures do not agree:
# 50 channels over 909.6-921.8 MHz is a 12.2 MHz span, which predicts 19.3% at
# the current 2.359 MHz - against 27.7% measured. Receiving 43% MORE than the
# published plan predicts admits only two explanations:
#   (a) this meter's hop set is narrower than 12.2 MHz, or
#   (b) the hop distribution is NON-UNIFORM and the window currently sits in a
#       favourable part of it.
# (b) breaks the assumption the whole table rests on. Under uniform hopping only
# the WIDTH of the window matters and position is irrelevant; under (b) position
# matters too, possibly more than width. On the 12.2 MHz reading the ceiling at
# symbollength 96 is 25.8% - WORSE than today - which would mean the surplus is
# coming from placement and widening would partly throw it away.
#
# The geometric fit does NOT settle this. It proves the misses are independent
# in TIME; it says nothing about how the hop set is distributed in FREQUENCY. A
# non-uniform hop set still yields geometric gaps, because p is just the summed
# probability of the in-window channels.
#
# A burst test was attempted and is INCONCLUSIVE (recorded so it is not re-run
# in the belief it settled something). One source claims a transmission repeats
# the packet on several frequencies inside one second. Counting InfluxDB points
# per distinct last_seen timestamp gave exactly 1.000 for all three meters - but
# that is tautological: last_seen has 1 s resolution, so same-second decodes
# carry an identical value, produce no HA state change, and write one point
# regardless. The test discriminates nothing. The real instrument is the add-on
# log at verbosity: debug, where "Published reading" lines carry milliseconds.
#
# THE DONGLE (Bill, 2026-08-24): Nooelec NESDR SMArt v5. RTL2832U + R820T2,
# 0.5 PPM TCXO, aluminium enclosure, vendor-rated "up to 3.2 MSPS".
# Three consequences, and none of them were assumed before he said which it is:
#
#  1. 3.2 MSPS IS THE CHIP CEILING, NOT A WORKING RATE. symbollength 96 asks for
#     3,145,728 Hz - 98.3% of the rated maximum. STEP TO 80 (2,621,440 Hz) FIRST,
#     not 96. It is the same experiment with the same sign, 11% more bandwidth
#     for ~0.29 W, and it leaves headroom to attribute a bad result to the change
#     rather than to the dongle falling off a cliff. Only go to 96 if 80 is clean.
#
#  2. THE TCXO IS THE ONE PIECE OF GOOD NEWS FOR THE SWEEP. 0.5 PPM at 912 MHz
#     is +/-456 Hz, against ~240 kHz channel spacing - three orders of margin. So
#     the tuned window really lands where -centerfreq says, sweep steps are
#     accurate, -freqcorrection is unnecessary, and thermal drift cannot smear
#     the result. A stock 1-2 PPM dongle would still be fine here; the TCXO just
#     removes the question.
#
#  3. THE ALUMINIUM ENCLOSURE PARTLY ANSWERS THE ORIGINAL sleep_for ARGUMENT.
#     sleep_for: 60 was set to cut dongle heat and extend life. This part is
#     already heatsinked, which is most of what a duty cycle was buying - and the
#     watts say the duty cycle costs $10.93/yr of capture to save nothing.
#
# A LATENT STALL HAZARD, RELEVANT TO PUSHING THE SAMPLE RATE UP. rtl_tcp reports
# consumer backlog by printf from inside its USB callback (rtl_tcp.c:189,
# "ll+, now %d"), and it silently discards the OLDEST queued buffer once the
# queue reaches llbuf_num+2 (default 500+2) - the drop itself prints nothing.
# Meanwhile the add-on drains rtl_tcp's stdout only until the 'listening...'
# ready pattern: MeterReader holds self.rtltcp purely for lifecycle (stop,
# start_with_retry, is_alive) and never calls read_line on it. So the pipe has
# roughly 64 KiB of OS buffer plus asyncio's StreamReader high-water mark, and
# then rtl_tcp blocks writing to a pipe nobody reads - inside the callback that
# services USB. That is self-amplifying: backlog -> prints -> full pipe ->
# blocked callback -> more backlog.
# On a healthy system it never fires, because the print is in the `else` branch
# taken only when the queue is non-empty, and a consumer that keeps up leaves it
# empty. It becomes reachable exactly when the rate is pushed past what the host
# can consume. Code path verified; whether it manifests here is NOT verified.
# The instrument already exists: all three *_meter_age staleness detectors would
# catch the silence.
#
# THEREFORE THE SWEEP OUTRANKS THE HARDWARE. Sweeping -centerfreq across
# 910-920 MHz is free, costs one restart per point, and discriminates directly:
# flat capture => uniform hopping, 36.9% is real, and only more spectrum helps;
# varying capture => position is a live knob. That knob has been randomised at
# every restart for the life of this install, which is why it has never shown up
# in any measurement taken here.
#
# THE CPU PERCENTAGE WAS A MISLEADING PROXY FOR COST, AND THE WATTS REVERSE THE
# RECOMMENDATION. 2.6% -> 15.6% of an N100 sounds like something worth chasing.
# It is 4.30 W, $10.93/yr at $0.29/kWh, against a 200 W quiet-house baseline -
# 2.2% of baseline power and 0.56% of the annual electricity bill. And the
# ENTIRE dynamic range of the symbollength knob is about 2.3 W:
#
#   72 -> 32   more than halves electric capture (27.7% -> 12.3%)   saves 1.43 W  = $3.63/yr
#   72 -> 96   predicted to lift it 27.7% -> 36.9%                  costs 0.86 W  = $2.18/yr
#
# Those are not close trades. There is nothing here worth saving, and the watts
# are better spent buying capture than hoarded. If CPU headroom on the host is
# the real constraint that is a different argument and the table still serves
# it - but it should be made as a CPU argument, not an energy one.
#
# HEAT IS A SEPARATE QUESTION AND THE WATTS DO NOT SETTLE IT. sleep_for was
# originally set to extend dongle life, not to save electricity, and
# system_monitor_processor_temperature moved ~128 -> ~146 F across the change.
# The dongle exposes no temperature through librtlsdr, so the instrument for
# that remains the one the SDR view already documents: a rising *_meter_age
