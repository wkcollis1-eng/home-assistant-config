# Pipelines that cannot currently be monitored, and why. ha_audit.py reports
# these as WARN rather than FAIL so the list stays visible without blocking.
gaps:
  # Pipelines that write buffer slots but never record a success timestamp,
  # so no stale detector can be written for them at all. All four were
  # closed on 2026-08-21; an empty list here is the goal state.
  no_stamp: []
  # These record a stamp, so a detector is a few lines of template away.
  stamp_but_no_detector: []
