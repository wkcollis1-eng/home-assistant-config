# =============================================================================
# pipelines.yaml — the declaration of every daily-capture data pipeline.
#
# NOT Home Assistant config. HA loads configuration.yaml and packages/ only;
# this file sits at the repo root and is read by scripts/, never by HA.
#
# WHY IT EXISTS. Until 2026-08-21 the same facts were restated in five places
# — the capture automation, the sensor templates, the dashboard card,
# CLAUDE.md §ENTITIES, and scripts/spc_validator.py — and they drifted. Three
# examples found while building this file, all real:
#
#   1. CLAUDE.md's "EOD TIMING SEQUENCE — FROZEN" lists 9 entries. There are
#      19 capture automations. Undocumented: capture_daily_cdd 23:55:15,
#      capture_daily_ac_min_per_cycle 23:55:30, capture_daily_runtime_per_cdd
#      23:56:45, capture_daily_dehumidifier_cost 23:59:30,
#      capture_daily_ac_cost 23:59:45. And archive_monthly_hdd has drifted
#      from the documented 23:58:00 to 23:58:15. A frozen schedule that does
#      not list most of its timers cannot prevent the collision it exists to
#      prevent.
#   2. Stale-detector coverage could not be established by name: matching
#      "capture_daily_cdd" to "cdd_capture_stale" by string similarity gives
#      false joins. The real relationship is the stamp entity the detector
#      READS, which is why `stamp` below is the join key.
#   3. 4 pipelines write buffers but stamp nothing, so their liveness cannot
#      be monitored even in principle. See `gaps` at the bottom.
#
# CONSUMERS
#   scripts/ha_audit.py          — checks the invariants below hold
#   scripts/spc_buffer_export.py — backs up every `buffer` entity nightly
#
# MAINTENANCE. Derived fields (automation, at, stamp, buffer, stale_detector)
# were extracted FROM the config, not typed from memory, and ha_audit.py
# re-derives and compares them on every run — so this file cannot silently
# drift from reality the way the five copies it replaces did.
# =============================================================================

pipelines:
  archive_monthly_cdd:
    label: "cdd"
    kind: accumulator
    defined_in: "automations.yaml"
    at: "23:58:30"
    stamp: "input_datetime.cdd_archive_last_ok"
    season: "cooling"
    stale_detector: "binary_sensor.cdd_monthly_archive_stale"
    buffer_slots: 0
    dynamic_buffer: true   # entity ids are built from templates at runtime
  archive_monthly_gas_heat_cost:
    label: "gas heat cost"
    kind: accumulator
    defined_in: "automations.yaml"
    at: null
    stamp: "input_datetime.gas_heat_cost_archive_last_ok"
    season: "heating"
    stale_detector: "binary_sensor.gas_heat_cost_archive_stale"
    buffer_slots: 0
