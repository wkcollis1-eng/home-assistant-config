      - input_number.dehumidifier_duty_day_5
      - input_number.dehumidifier_duty_day_6
      - input_number.dehumidifier_duty_day_7
      - input_number.dehumidifier_kwh_day_1
      - input_number.dehumidifier_kwh_day_2
      - input_number.dehumidifier_kwh_day_3
      - input_number.dehumidifier_kwh_day_4
      - input_number.dehumidifier_kwh_day_5
      - input_number.dehumidifier_kwh_day_6
      - input_number.dehumidifier_kwh_day_7
  capture_daily_water_overnight:
    label: "Water overnight minimum flow"
    kind: leak
    defined_in: "packages/utility_meters.yaml"
    # Six marks 00:00:45..05:00:45 give five hourly bins; the manifest records
    # the first, which is the reset mark. The others are 01/02/03/04/05 :00:45.
    at: "00:00:45"
    stamp: "input_datetime.water_overnight_capture_last_ok"
    season: "none"
    stale_detector: "binary_sensor.water_overnight_capture_stale"
    buffer_slots: 7
    # This buffer INVERTS the SPC convention. 0.00 gal/h is a PERFECT night and
    # must count as data; -1 means "no night recorded". ha_audit reads both.
    empty_sentinel: -1
    # Seven identical 0.00 nights is a real measurement of a leak-free house,
    # not the fabricated-constant signature repeated-buffer exists to catch.
    benign_repeat: 0
    buffer:
      - input_number.water_overnight_min_day_1
      - input_number.water_overnight_min_day_2
      - input_number.water_overnight_min_day_3
      - input_number.water_overnight_min_day_4
      - input_number.water_overnight_min_day_5
      - input_number.water_overnight_min_day_6
      - input_number.water_overnight_min_day_7
    guard:
      # The guard is subgroup SIZE, not a value band: a night is usable when
      # enough clean hourly bins closed. There is no upper band because the
      # softener regen is expected to blow past any value you would pick - the
      # minimum is what makes that harmless.
      source: "sensor.water_meter_volume"
      live_source: "sensor.water_overnight_min_flow"
      activity: "input_number.water_night_bins"
      activity_min: 3
    limits:
      - sensor.water_overnight_min_mean_7d
    chart: "dashboards/cards/utilities/water-overnight-min-flow.yaml"
