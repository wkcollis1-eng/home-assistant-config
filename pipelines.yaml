    buffer:
      - input_number.ac_min_per_cycle_day_1
      - input_number.ac_min_per_cycle_day_2
      - input_number.ac_min_per_cycle_day_3
      - input_number.ac_min_per_cycle_day_4
      - input_number.ac_min_per_cycle_day_5
      - input_number.ac_min_per_cycle_day_6
      - input_number.ac_min_per_cycle_day_7
  capture_daily_ac_watts:
    label: "AC running watts"
    kind: spc
    defined_in: "packages/spc.yaml"
    at: "23:59:00"
    stamp: "input_datetime.ac_spc_last_capture"
    seed_stamp: "input_datetime.ac_spc_last_seed"
    season: "cooling"
    stale_detector: "binary_sensor.ac_spc_capture_stale"
    buffer_slots: 7
    buffer:
      - input_number.ac_running_watts_day_1
      - input_number.ac_running_watts_day_2
      - input_number.ac_running_watts_day_3
      - input_number.ac_running_watts_day_4
      - input_number.ac_running_watts_day_5
      - input_number.ac_running_watts_day_6
      - input_number.ac_running_watts_day_7
    guard:
      source: "sensor.ac_running_watts_latched"
      live_source: "sensor.ac_running_watts_24h"
      band: [500, 5000]
      activity: "sensor.ac_runtime_today"
      activity_min: 0.5
    limits:
      - sensor.ac_running_watts_mean_7d
      - sensor.ac_running_watts_sigma_7d
      - sensor.ac_running_watts_upper
      - sensor.ac_running_watts_lower
    chart: "dashboards/cards/apexcharts/spc-running-watts-control-chart.yaml"
  capture_daily_cdd:
    label: "cdd"
    kind: accumulator
    defined_in: "automations.yaml"
    at: "23:55:15"
    stamp: "input_datetime.cdd_capture_last_ok"
    season: "cooling"
