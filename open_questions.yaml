    (ESPHome wifi_info) would answer it permanently and make any future roam
    visible, but it is only worth adding if there is more than one AP to tell
    apart.
  answered: >-
    2026-09-22, Bill: both the bank monitor and the basement TH node are on the
    basement router, a Netgear R6400. Three radios carry "Lake Poco" - the
    Xfinity modem (2nd-floor guest bedroom), a Netgear RS1000 (2nd-floor master
    bedroom) and the R6400 (basement). He also supplied the two moves the data
    had been trying to read: 2026-09-21 ~13:00 ET he put a box under the
    basement router, lifting it ~4" off the shelf; 2026-09-22 ~14:00 ET he
    moved it ~3 ft west, now ~6 ft from the bank monitor.

    Consequence 1: the -7.1 dB step in the monitor's RSSI during 09-21
    14:00-20:00 ET is the box lift, not a roam. A BSSID sensor is no longer
    needed to answer "which AP" - he has - though with three radios one would
    still make a future roam visible. Demoted to optional.

    Consequence 2, and it is the one that reorders the remedies. The two moves
    are a three-level dose-response on the noise [M, 15-min windows, sd of
    sensor.battery_bank_monitor_battery_current, fraction of windows below
    8 mA]:
      A  on the metal shelf, 28.8" from the monitor:  55/720 = 0.076, median sd 14.7 mA
      B  +4" box lift, 31.2":                         29/96  = 0.302, median sd 16.7 mA
      C  moved 3 ft west, 72":                         8/8   = 1.000, median sd  6.4 mA
    Fisher A vs B p 3.7e-9; B vs C p 1.5e-4; A vs C p 2.1e-9. AUTOCORRELATION
    CAVEAT: B and C are single contiguous blocks and the sd series is
    autocorrelated, so those p-values overstate. A-to-B is the well-powered
    step - 96 windows across a full day/night cycle. C rested on 120 min of the
    240 min run-length rule set in the entry above at the time of writing.

    THE NOISE TRACKS THE ROUTER'S PHYSICAL PROXIMITY TO THE METAL SHELF AND THE
    SENSE LEADS, NOT THE RF LEVEL AT THE MONITOR'S ANTENNA. The lift moved the
    monitor's RSSI -7.1 dB and the move moved it +1.3 dB - opposite directions -
    while the noise fell at BOTH steps, so RSSI is not the mediator. The lift
    also added only 2.4" of straight-line distance [D: sqrt(20^2+24^2) = 31.2"
    vs sqrt(16^2+24^2) = 28.8", +8%], which no far-field argument turns into a
    4.0x change in quiet fraction [D: 0.302/0.076, Fisher p 3.7e-9 above] - but
    taking the router off the shared metal shelf does. Near-field or conducted
    coupling through the shelf structure into the INA228 differential pair is
    the [I] that fits both steps; it has not been tested directly.

    Remedy order that follows: (1) the router stays off and away from the metal
    shelf - done, free, and the largest measured lever; (2) route the sense
    leads away from the shelf, twist the pair, ferrite; (3) a capacitor across
    VIN+/VIN- at the breakout with NO series resistor. The separate display-on
    effect (sd 1.7-4.8 mA while the panel is lit, n=7, Wilcoxon p 0.016) is NOT
    explained by any of this and still needs the remote-display-switch test.

