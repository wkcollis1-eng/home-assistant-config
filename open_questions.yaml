- asked: 2026-09-05
  question: >-
    Are the office and the family room on the same Ecobee zone (climate.main_floor),
    or different zones?
  blocks: >-
    The blower covariate in sensor.mmw_office_cal_class and
    sensor.mmw_family_cal_class, which is what separates design-doc collection A
    (quiet room) from collection B (HVAC running). Both currently read
    climate.main_floor. If one room is on the upstairs zone, its cal_class
    records the wrong blower state and every MOVE threshold derived from that
    data is wrong in the direction that produces false triggers - the exact
    failure S5.3 calls "the one people skip".
  answered: >-
    2026-09-05, Bill: family room is on climate.main_floor, office is on
    climate.upstairs. Different zones - so the single-zone assumption was wrong
    for the office and is now corrected in sensor.mmw_office_cal_class.

    He also volunteered that each thermostat carries motion/occupancy sensors.
    Resolved against the registry: binary_sensor.main_floor_motion /
    _occupancy and binary_sensor.upstairs_motion / _occupancy, all four on
    homekit_controller - NOT the ecobee cloud integration, so they are local
    HomeKit accessory events (about a second) rather than a 3-minute poll.

    Used as an INDEPENDENT WITNESS, never in the control path. PIR cannot see a
    motionless person, which is the entire reason the radar exists; putting it
    in the lighting path would reintroduce the failure R1 exists to prevent.
    What it buys instead:
    (1) binary_sensor.mmw_<room>_empty_corroborated - the empty class
    restricted to intervals where two independent sensors agree the room is
    empty. E_clutter is a tail percentile, so a few contaminated samples move
    it. DEMONSTRATED on synthetic data: 10 minutes of mislabelled occupancy
    inside a 90-minute empty run drove E_clutter 15.5 -> 58.5 and SM 1.86 ->
    0.49, condemning a good gate as "OVERLAP - STOP TUNING". With
    --corroborate the contamination is dropped and the gate is usable. That
    false stop would have sent me to move a sensor that was fine.
    (2) The label-contradiction detector is now non-circular - it no longer
    asks the instrument being calibrated whether its own training data is
    mislabelled.
    (3) binary_sensor.mmw_<room>_dropout_candidate - thermostat occupied,
    radar empty for 10 min. Candidate only; the thermostat is elsewhere on the
    floor and its occupancy holds. But it is the only dropout evidence that
    does not come from the radar itself.

- asked: 2026-09-05
  question: >-
    Is there anything ELSE in the office that reports to Home Assistant and
    changes when you are in there - a PC or monitor on a metered plug, a desk
    lamp, a door sensor, anything?
  blocks: >-
    An independent witness for the OFFICE empty class. You confirmed the
    upstairs Ecobee is too far from the office to see it, so
    binary_sensor.mmw_office_empty_corroborated and _dropout_candidate have been
    DELETED rather than left in - a witness that cannot see the room does not
    abstain, it perjures: with you sitting motionless at the desk it would have
    certified the room EMPTY and stamped the contaminated interval as validated.

    The family room keeps its thermostat cross-check. The office now has none,
    and E_clutter for that node rests entirely on the labelling being right. The
    demonstrated cost: on synthetic data, 10 min of mislabelled occupancy inside
    a 90 min empty run drove E_clutter 15.5 -> 58.5 and condemned a good gate.

    Anything with a state that correlates with you being at the desk would do -
    it does not need to be a presence sensor, only independent of the radar. If
    the answer is "nothing", say so and the office collection proceeds on
    labelling discipline alone, with that recorded as a known weakness rather
    than discovered at analysis time.
  answered: >-
    2026-09-06, Bill: nothing. No other device in the office senses presence.

    So the office node has NO independent witness and none can be manufactured.
    Recorded as a known weakness rather than left to surface during analysis:

    (1) E_clutter for the office rests entirely on labelling discipline. There
    is no --corroborate run available for that room, and the label-contradiction
    detector is circular by necessity - it asks the radar whether the radar's own
    training labels are wrong. It catches the gross case and nothing subtler.

    (2) Consequence for the collection: the office needs its empty-class
    intervals to be DELIBERATE rather than incidental. A scheduled block with
    the door shut beats hours of "probably empty" - the office SPC window at
    03:10 already produces exactly that, and it is now the PRIMARY empty source
    for that node rather than a secondary one.

    (3) The family room keeps its main_floor thermostat cross-check, so the two
    nodes are calibrated to different evidential standards. That asymmetry
    belongs in the S5.8 baseline so a later reader does not assume both were
    corroborated.

    Not blocking. The office collection proceeds; the weakness is documented,
    and if the two nodes ever disagree about method, the family room result is
    the one with corroboration behind it.
