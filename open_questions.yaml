# R14 made mechanical: every question asked of Bill lives here until he answers.
#
# ha_audit.py WARNs `open-question` for every entry whose `answered:` is absent
# or null, with the days outstanding, and the session protocol reads the audit
# verdict aloud at start-up - so an unanswered question surfaces at the top of
# every session by a mechanism that does not depend on any session remembering.
#
# Fields:
#   asked:     YYYY-MM-DD, the date the question was first put to him
#   question:  one line, answerable in a sentence. If it needs a paragraph to
#              ask, it is not a physical-fact question and does not belong here.
#   blocks:    what stays unbuilt until he answers
#   answered:  his answer, plus the date. Absent or null means outstanding.

- asked: 2026-08-26
  question: >-
    On the LiFePO4 bank, what is connected to the busbars on the LOAD side of
    the DROK shunt right now - is the Shelly Plus Uni still wired to the bank,
    is the DROK panel meter still there, is the Giandel inverter connected but
    off? And does the monitor's own supply (TB1 BATT_RAW / GND) land on the
    busbars, or directly on the battery posts?
  blocks: >-
    Attribution of the measured 7.4 mA quiescent drain in
    reports/LiFePO4_Report_2026-08-26.md S7.
  answered: >-
    2026-08-26, Bill: Shelly RETIRED. DROK panel meter RETIRED. Giandel inverter
    CONNECTED BUT OFF. INA228 monitor POWERED FROM THE BUSBARS.

    Consequence, and it inverts what the arithmetic suggested: in the low-side
    topology the monitor's return runs through the shunt, so the monitor's own
    consumption is INSIDE the measurement, not outside it. With everything else
    retired or off, the monitor is the only load on the bus - so the measured
    7.4 mA / 99 mW IS the monitor, and the bank's own external parasitic load is
    effectively nil.

    This also corrects a firmware [I] to an [M]: the header of
    battery-bank-monitor.yaml assumes "Monitor ~100 mA = 8% of inverter standby"
    in its survival-sleep note. Measured [M], it is 7.4 mA over 41 d / 1.79 M
    samples - so the assumption is 14x high [D: 100 / 7.4]. Survival sleep is
    even less necessary than that note argued.

    NOTE the inference I had queued and did not publish was WRONG in direction:
    from "commissioning says the monitor draws ~100 mA" and "total measured is
    7.4 mA" I had reasoned the monitor must sit upstream of the shunt. Both
    premises were fine; the ~100 mA was the bad one, and it was an [I] wearing
    an [M]'s clothes. R14 earned its keep here - the question cost him one line
    and would have cost me a wrong published claim.

- asked: 2026-08-26
  question: >-
    Did anything change on or near the LiFePO4 bank on 2026-08-04 around
    2:30 PM ET - a device plugged in or unplugged, a meter connected, a charger
    left attached? And again around 2026-08-19?
  blocks: >-
    Explanation of the +2.9 mA step in quiescent drain in
    reports/LiFePO4_Report_2026-08-26.md S7.
  answered: >-
    2026-08-26, Bill: "around August 4 I did REWIRE the battery bank, eliminated
    stacked lugs. If I moved the ina228 from a lug you should see a short blip in
    the data feed." No load was added or removed.

    That settles the branch on physical grounds rather than statistical ones.
    Nothing was added to the bus, the monitor did not reboot (32 days continuous
    uptime spans 2026-08-04), and no firmware changed - so a genuine rise of
    +2.88 mA on a 5.90 mA base [M; +49% D] has nothing to come from. What DID
    happen is that joints in the shunt's own current path were unbolted and
    re-landed. The step is +2.88 mA, which at
    the 375 uOhm DROK shunt is 1.08 uV - the same order as the 0.9 uV
    shunt-channel offset measured at commissioning (Tier 2, inputs shorted).
    Disturbing and re-seating dissimilar-metal joints shifts thermal EMF by
    exactly this much.

    So: INSTRUMENT OFFSET SHIFT, not a load change. Recorded in the report S7 as
    the favoured branch on physical grounds, with the residual uncertainty stated.

    Two things I checked that did NOT decide it, recorded so nobody re-runs them:
      1. The "blip" is not diagnostic. There are 82 gaps >20 s in the 2 s feed
         across the 41-day window, ~2/day, from WiFi dropouts. The two on Aug 4
         (36.1 s at 14:43:29 ET, 39.7 s at 14:48:45 ET) sit right at the step and
         are slightly longer than the 25-27 s norm, but they are not outside it.
         Suggestive, not evidence.
      2. The voltage record CANNOT settle it. The obvious test - "a step of
         8.78/5.90 = 1.49x [D] in load must make the voltage fall proportionally
         faster" - is confounded, because Aug 4 is day 19 post-charge and at
         tau2 = 3.3 d the relaxation tail still contributes more mV/day there
         than the drain does. A joint fit of
         two exponentials plus a broken linear term is degenerate: it returns a
         POSITIVE pre-step slope, which is impossible in storage. No clean
         pre-step window exists, so the test cannot be done retrospectively.
      3. Still worth doing for the aging trend: short the INA228 inputs and
         re-measure the offset at operating die temperature. It now serves as
         confirmation and as a new post-rewire zero, not as the tie-breaker.

- asked: 2026-08-26
  question: >-
    Was the Giandel 1500 W inverter actually replaced around 07:00 on
    2026-07-05, i.e. is the unit tested at commissioning a different physical
    inverter from the one the Shelly-era study measured?
  blocks: >-
    A provenance break across the whole study. If yes, the "Inverter efficiency
    90.3% @ 440 W" figure carried in README.md, docs/index.md and every
    Shelly-era report belongs to a unit that no longer exists, and must be
    labelled by unit rather than carried forward. It would also mean the
    commissioning report's 87-94% provisional efficiency and its two
    inverter-overload trips describe a replacement roughly 8 days old, which
    changes how those trips should be read (break-in behaviour of a new unit vs
    a characteristic of the model).

    Source of the claim is a transcript of a DIFFERENT Claude conversation that
    Bill pasted on 2026-08-26, in which he wrote "main was on since 10 pm and
    stays on until I have to replace the inverter around 7 am". That is his own
    words but second-hand to this thread and about a different project's
    analysis, so it is NOT good enough to publish a provenance correction on.
    Asked directly 2026-08-26; he replied about the SEM meter without answering,
    so re-asked the same day per R14.
  answered: >-
    2026-08-26, Bill: "inverter failed when we started the coffee maker ~6-7am.
    surge between fridge and coffee maker blew the inverter's fuses. had to swap
    out inverters."

    YES - the commissioning-tested Giandel is a DIFFERENT PHYSICAL UNIT from the
    one the Shelly-era study measured. Every pre-2026-07-05 inverter figure,
    including "90.3% @ 440 W", belongs to a unit that no longer exists and must
    be labelled by unit rather than carried forward.

    THE FAILURE MODE IS THE BIGGER FINDING, and it is not bad luck. Measured on
    the SEM's 2 s feed over 45 days [M, 2026-07-12 to 2026-08-26, n=735,124
    aligned 2 s samples]:
      fridge          peak 2365 W, running median 107.5 W [M, n=1,379,612]
                      -> 22x inrush [D: 2365/107.5]
      coffee maker    peak 1755 W, running median 1039 W   -> resistive
      MAX SIMULTANEOUS fridge+coffee 3328 W [M, 2026-08-24 06:43:08 ET]
      = 2.2x the Giandel's 1500 W nameplate [D: 3328/1500]
      = 274-297 A at the DC bus at 12.9 V [D, inverter eta 87-94%]
      -> exceeds the INA228 SUVL hardware limit of -250 A; that alert would latch

    Frequency: 361 two-second samples over 1500 W on 34 distinct days out of 45
    [M] - i.e. most days. 58% fall in 05:00-07:59 [M], and all five samples over
    2500 W are in 05:00-06:59. The coffee hour.

    So the July 5 event recurs on a near-daily schedule. It is invisible while
    the grid carries it, and becomes a failure only when the bank and inverter
    are carrying the load - which is precisely the unattended moment the system
    exists for. The dashboard already warns "Individual peaks - taken at
    different moments, do NOT add these"; this is the case where they coincided.

    Blocks nothing further. Feeds a new report section and an operational
    recommendation: during an outage the coffee circuit must be shed, or the
    inverter must be sized for the coincident peak rather than the running load.

- asked: 2026-08-31
  question: >-
    Does the U3V70A boost take its 12 V input from the BP-65 LOAD output (i.e.
    behind the 11.80 V low-voltage disconnect, like the XB7), or from the raw
    battery bus ahead of it?
  blocks: >-
    Whether the pack is protected below LVD now that the boost is a ~2 A load.
    If the boost sits ahead of the BP-65, the LVD cannot shed it, the ESP's
    survival-sleep entry window (-0.30 A < I < +0.20 A, which keys on the
    load-collapse signature) can never be satisfied, and the pack keeps
    draining to BMS cutoff - the one outcome the V1.7 survival design says
    actually damages the battery. Also blocks the boost-subsystem analysis
    section on post-shutdown behaviour.
  answered: >-
    2026-08-31, Bill: "12 V input from the BP-65 load output."

    Closes favourably. The LVD sheds the boost with the XB7, so the pack is
    still protected below 11.80 V and the ESP's survival-sleep entry window is
    intact - the post-trip load collapse is now 2.09 A -> ~0.04 A instead of
    1.18 A -> ~0.04 A, which lands further inside the -0.30/+0.20 A window than
    the design assumed, not closer to its edge. No firmware change needed.

    Two consequences worth recording: the BP-65 now switches 2.09 A [M] rather
    than 1.18 A (rated 65 A, immaterial), and its 12.8 V / 30 s reconnect now
    soft-starts the boost into a cold N100 - the boost brief's V2 test case,
    still unmeasured, but structurally always AC-present, because the bus can
    only climb to 12.8 V with the PSU live. DR-1 therefore holds by
    construction on the reconnect path even with no EN fitted.

- asked: 2026-08-31
  question: >-
    On the ASRock N100DC-ITX, is BIOS "Restore on AC/Power Loss" actually set
    to "Power On"? And with HA shut down (host in soft-off) does the barrel
    jack still read ~18 V?
  blocks: >-
    The unattended-recovery conclusion. With no EN/FET fitted, the 18 V rail
    stays live through hassio.host_shutdown, so the host sees no power-loss
    edge when AC returns and will not auto-boot unless the outage ran long
    enough for the BP-65 LVD to collapse the rail. Confirming the BIOS setting
    and the live-rail-after-shutdown fact settles whether that gap is real.
  answered: >-
    2026-08-31, Bill: "Bios set at Restore on AC/Power Loss = Power On."

    This CONFIRMS the gap rather than clearing it, and upgrades it from [I] to
    [D]. The BIOS half is correct; what is missing is the power-cycle edge it
    waits for. With no EN and the boost fed from the LVD-protected bus, the
    18 V rail is live whenever the bus is live [D, topology], so
    hassio.host_shutdown leaves the board in S5 with DC still applied and
    nothing for the BIOS to act on. Recovery therefore requires a rail
    collapse, and the only thing that collapses it is the BP-65 LVD at 11.80 V.

      long outage           LVD trips, AC returns, BP-65 reconnects, boost
                            restarts, board sees fresh DC, boots. Works.
      AC back after the     rail never dropped, host stays in S5, HA is down
      shutdown but before   until someone presses the button.
      LVD

    Window width [D]: post-shutdown bus load falls to ~15 W (XB7 12.2 W +
    monitor 0.5 W + N100 S5 through the boost), so the remaining cliff span is
    ~17 min, at the tail of a ~2 h outage.

    Fitting the EN/FET closes it: a latched EN-low shed IS the power-cycle
    edge, and re-enable on confirmed AC return produces exactly one clean boot.
    That is a second, independent argument for the EN work that the boost brief
    does not make - it argues EN on BMS grounds (DR-1) only.

