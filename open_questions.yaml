    An independent witness for the OFFICE empty class. You confirmed the
    upstairs Ecobee is too far from the office to see it, so
    binary_sensor.mmw_office_empty_corroborated and _dropout_candidate have been
    DELETED rather than left in - a witness that cannot see the room does not
    abstain, it perjures: with you sitting motionless at the desk it would have
    certified the room EMPTY and stamped the contaminated interval as validated.

    The family room keeps its thermostat cross-check. The office now has none,
    and E_clutter for that node rests entirely on the labelling being right. The
    demonstrated cost: on synthetic data, 10 min of mislabelled occupancy inside
    a 90 min empty run drove E_clutter 15.5 -> 58.5 and condemned a good gate.

    Anything with a state that correlates with you being at the desk would do -
