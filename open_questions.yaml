- asked: 2026-09-05
  question: >-
    What device will actually switch the office lamp and the family room
    lights - a smart plug, a smart bulb, or a wall relay - and does it report
    its own state back to HA?
  blocks: >-
    Deployment of packages/mmwave_presence.yaml. There is no light.* entity in
    ENTITIES.md; the only switchable load in the registry is
    switch.dehumidifier. The automations call homeassistant.turn_on/turn_off so
    any domain works once the id is known, but R4a (manual intervention detected
    independently of the presence automation) needs a device that REPORTS state.
    A dumb lamp on a non-reporting plug needs current sensing, which changes the
    BOM, so this decides hardware and not just an entity id.
  answered: >-
    2026-09-05, Bill: family room is switch.family_room_2 and
    switch.family_room_3. Office lamp TBD.

    Resolved against core.entity_registry: both are TP-Link Kasa HS103 plugs on
    the tplink integration - switch.family_room_2 is named "Lamp 1"
    (68:FF:7B:DC:3C:D0), switch.family_room_3 is "Lamp 2" (68:FF:7B:DC:61:D7).
    A THIRD HS103 named just "Family Room" (switch.family_room, 10.0.0.10)
    exists in the same room and is deliberately left alone.

    Three consequences, all now in packages/mmwave_presence.yaml:
    (1) R4a is satisfiable - tplink reports real switch state, so no current
    sensing and no BOM change. But it POLLS, so S4.3's 2 s command window is
    too tight for this device and would read our own commands as manual
    intervention; it is now input_number.mmw_<room>_cmd_window, default 10 s,
    to be set from the A8 measurement.
    (2) HS103 has no energy monitoring (that is HS110/KP115), so there is no
    current-sensing fallback - not needed, but worth recording.
    (3) The alarm flashes a MECHANICAL RELAY. 0.5 s half-periods are not
    deliverable over Wi-Fi and every cycle is two relay operations; retimed to
    1.5 s and the default flash count cut from 10 to 6.

    Also corrects an error of mine: I wrote that switch.dehumidifier was the
    only switchable load "in the registry". It was the only one in ENTITIES.md,
    which is a curated subset. The registry holds 1,784 entities.

