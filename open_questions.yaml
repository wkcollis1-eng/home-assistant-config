  answered: >-
    2026-09-22, Bill: the P20's LiFePO4 mode offers 5 A / 10 A / 20 A, and 5 A
    is the setting for this 10 Ah pack (meets RQ-1's 5.0 A). Repair/pulse is
    lead-acid only, not offered in LiFePO4 mode. He asks instead whether the
    HDR-30-15 can do the whole charge and the top-off without harming the
    pack or the PSU - "prove it to me".

    R13, 2026-09-22: the "drop the P20" recommendation above was WRONG. It
    treated the HDR-30-15 running in overload for a whole bulk phase as rev
    0.4's accepted job, and the HDR-60-12's recharge as precedent. HDR-30-SPEC
    (2026-04-03) p.2 classes overload as a "fault condition" ("Constant
    current limiting within 50% ~ 100% rated output voltage, recovers
    automatically after fault condition is removed"), and the p.3 derating
    curve rates load to 100% only. The HDR-60-12 precedent was a transient of
    minutes (09-15 README, n=1), not hours. Reversed: the P20 at 5 A does the
    bulk; the HDR-30-15 does the top-off hold only.
