# packages/billing_overview.yaml
# Backing entities for Energy Performance > "Cost Overview"
# (dashboards/views/cost-overview.yaml). Everything is on a BILLING-PERIOD
# basis, not calendar months (Bill, 2026-09-22):
#
#   CURRENT PERIOD  consumption since the utility's last meter read, from the
#                   SDR revenue meters. The unit price beside it is the last
#                   bill's all-in rate, READ from sensor.electricity_effective_rate
#                   / sensor.gas_effective_rate, never recomputed (R10)
#   LAST PERIOD     the latest bill - the existing input_number.*_bill_* helpers
#   YEAR TO DATE    bills whose STATEMENT month is Jan..M of year Y (M and Y
#                   from the latest statement date) vs the same months of Y-1
#
# PERIOD START. input_datetime.*_bill_date holds the STATEMENT date, not the
# meter-read date (Bill, 2026-09-22), so the read date is its own helper.
# billing_period_start_lookup stores the SDR meter's long-term statistic at
# 12:00 local on that date; consumption = live meter - stored start. Noon
# because the read time within the day is unknown, so the start is off by at
# most half a day's use. It ZEROES the start before looking up, so a failed or
# empty lookup (date before SDR commissioning 2026-08-21, SDR deaf that hour,
# a future date) leaves the period sensor UNAVAILABLE - never a plausible
# number carried over from the previous period (R8). The period sensor is
# also unavailable once a newer statement is entered against an old read date.
#
# PRIOR-YEAR ARCHIVE. The 12 electric/gas_archive_<mon>_* slots carry no year,
# so each Save Bill overwrites the same month one year earlier. Save Bill
# (automations.yaml) now moves that older value into *_archive_ly_<mon>_*
# first. input_text.<utility>_archive_years records the year each main slot
# holds (Jan..Dec, comma-separated), so a repeat press, or a corrected re-save
# of a month already saved this year, never rolls this year onto last year.
# A slot more than one year old rolls in as 0, which YTD reports as missing.
#
# SEED (2026-09-22). _ly_ Jan..Sep and the year lists came from
# Residential-HVAC-Performance-Baseline-/data/monthly_summary.csv, which is
# keyed by statement month like the archive: its 2026-01..06 rows equal the
# live Jan..Jun slots, and its 2025-09 row equals the *_last_year helpers. NOT
# monthly_electricity_eversource.csv - that one is keyed by SERVICE month, one
# month earlier. _ly_ Oct..Dec stay 0: no statement-month data for 2024 in a
# trusted keying. The Oct..Dec 2026 saves fill them before YTD reads them.
#
# LIMITS (stated, not papered over):
#  - Between typing a new statement date and pressing Save, YTD already spans
#    that month and lists it in missing_months (the slot is still last year's).
#  - Two statements dated in one calendar month collide in one slot - the
#    archive's existing design. Statements land ~10th (electric) and ~15th
#    (gas), so that takes 10+ days of drift.
#  - A change to input_number.*_meter_scale mid-period rescales the live
#    meter but not the stored start, so the period figure jumps.

input_datetime:
  # The bill's service-period END (meter read), not the statement date.
  electricity_meter_read_date:
    name: "Electric Meter Read Date"
    has_date: true
    has_time: false
    icon: mdi:calendar-check

  gas_meter_read_date:
    name: "Gas Meter Read Date"
    has_date: true
    has_time: false
    icon: mdi:calendar-check

input_text:
  # Year held by each <utility>_archive_<mon>_* slot, Jan..Dec. Written only by
  # the Save Bill automations; seeded 2026-09-22.
  electric_archive_years:
    name: "Electric archive slot years"
    max: 100
    icon: mdi:calendar-range

  gas_archive_years:
    name: "Gas archive slot years"
    max: 100
    icon: mdi:calendar-range

input_number:
  # SDR meter reading at 12:00 on the meter-read date. Written only by
  # billing_period_start_lookup; 0 = no valid start (period sensor unavailable).
  electric_period_start_kwh:
    name: "Electric meter at period start"
    min: 0
    max: 10000000
    step: 0.01
    mode: box
    unit_of_measurement: "kWh"

  gas_period_start_ft3:
    name: "Gas meter at period start"
    min: 0
    max: 100000000
    step: 1
    mode: box
    unit_of_measurement: "ft³"

  # Prior-year archive: the same statement month one year before the matching
