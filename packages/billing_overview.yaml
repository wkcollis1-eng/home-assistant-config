template:
  - sensor:
      - name: "Electric Billing Period kWh"
        unique_id: electric_billing_period_kwh
        unit_of_measurement: "kWh"
        icon: mdi:flash
        availability: >
          {% set v = states('sensor.electric_meter_energy') %}
          {% set s = states('input_number.electric_period_start_kwh') | float(0) %}
          {% set r = state_attr('input_datetime.electricity_meter_read_date', 'timestamp') %}
          {% set b = state_attr('input_datetime.electricity_bill_date', 'timestamp') %}
          {% set n = states('input_number.electricity_bill_days') | float(30) %}
          {{ v not in ['unknown','unavailable','none','']
             and is_state('binary_sensor.electric_meter_stale', 'off')
             and r is number and s > 0 and v | float(0) >= s
             and (b is not number or (b - r) / 86400 < n) }}
        state: >
          {% set v = states('sensor.electric_meter_energy') %}
          {{ (v | float(0) - states('input_number.electric_period_start_kwh') | float(0)) | round(1)
             if v not in ['unknown','unavailable','none',''] else 0 }}
        attributes:
          period_start: "{{ states('input_datetime.electricity_meter_read_date') }}"
          days: >
            {% set r = state_attr('input_datetime.electricity_meter_read_date', 'timestamp') %}
            {{ ((now().timestamp() - r) // 86400) | int(0) if r is number else none }}

      - name: "Gas Billing Period CCF"
        unique_id: gas_billing_period_ccf
        unit_of_measurement: "CCF"
        icon: mdi:fire
        availability: >
          {% set v = states('sensor.gas_meter_volume') %}
          {% set s = states('input_number.gas_period_start_ft3') | float(0) %}
          {% set r = state_attr('input_datetime.gas_meter_read_date', 'timestamp') %}
          {% set b = state_attr('input_datetime.gas_bill_date', 'timestamp') %}
          {% set n = states('input_number.gas_bill_days') | float(30) %}
          {{ v not in ['unknown','unavailable','none','']
             and is_state('binary_sensor.gas_meter_stale', 'off')
             and r is number and s > 0 and v | float(0) >= s
             and (b is not number or (b - r) / 86400 < n) }}
        # 1 CCF = 100 ft3; the start is stored in the meter's own unit (ft3).
        state: >
          {% set v = states('sensor.gas_meter_volume') %}
          {{ ((v | float(0) - states('input_number.gas_period_start_ft3') | float(0)) / 100) | round(2)
             if v not in ['unknown','unavailable','none',''] else 0 }}
        attributes:
          period_start: "{{ states('input_datetime.gas_meter_read_date') }}"
          days: >
            {% set r = state_attr('input_datetime.gas_meter_read_date', 'timestamp') %}
            {{ ((now().timestamp() - r) // 86400) | int(0) if r is number else none }}

      # "Year to date" is defined ONCE per utility (R10): the state is YTD $,
      # and consumption and the last-year figures are attributes over the same
      # month range. A slot counts only if input_text.*_archive_years says it
      # holds the statement year; every other month in range is listed in
      # missing_months. Last year counts a _ly_ slot only if it is > 0.
      - name: "Electric Bills YTD"
        unique_id: electric_bills_ytd
        unit_of_measurement: "$"
        icon: mdi:flash
        availability: >
          {{ state_attr('input_datetime.electricity_bill_date', 'month') is number
             and states('input_text.electric_archive_years').split(',') | count == 12 }}
        state: >
          {% set mo = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'] %}
          {% set m = state_attr('input_datetime.electricity_bill_date', 'month') | int(0) %}
          {% set y = state_attr('input_datetime.electricity_bill_date', 'year') | string %}
          {% set ys = states('input_text.electric_archive_years').split(',') %}
          {% set ns = namespace(t=0.0) %}
          {% for i in range(m) %}{% if i < ys | count and ys[i] == y %}{% set ns.t = ns.t + states('input_number.electric_archive_' ~ mo[i] ~ '_amount') | float(0) %}{% endif %}{% endfor %}
          {{ ns.t | round(2) }}
        attributes:
          year: "{{ state_attr('input_datetime.electricity_bill_date', 'year') }}"
          through: >
            {% set m = state_attr('input_datetime.electricity_bill_date', 'month') | int(0) %}
            {{ ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m - 1] if m > 0 else none }}
          kwh: >
            {% set mo = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'] %}
            {% set m = state_attr('input_datetime.electricity_bill_date', 'month') | int(0) %}
            {% set y = state_attr('input_datetime.electricity_bill_date', 'year') | string %}
            {% set ys = states('input_text.electric_archive_years').split(',') %}
            {% set ns = namespace(t=0.0) %}
            {% for i in range(m) %}{% if i < ys | count and ys[i] == y %}{% set ns.t = ns.t + states('input_number.electric_archive_' ~ mo[i] ~ '_kwh') | float(0) %}{% endif %}{% endfor %}
            {{ ns.t | round(0) }}
          cost_last_year: >
            {% set mo = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'] %}
            {% set m = state_attr('input_datetime.electricity_bill_date', 'month') | int(0) %}
            {% set ns = namespace(t=0.0) %}
            {% for i in range(m) %}{% set ns.t = ns.t + states('input_number.electric_archive_ly_' ~ mo[i] ~ '_amount') | float(0) %}{% endfor %}
            {{ ns.t | round(2) }}
          kwh_last_year: >
            {% set mo = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'] %}
            {% set m = state_attr('input_datetime.electricity_bill_date', 'month') | int(0) %}
            {% set ns = namespace(t=0.0) %}
            {% for i in range(m) %}{% set ns.t = ns.t + states('input_number.electric_archive_ly_' ~ mo[i] ~ '_kwh') | float(0) %}{% endfor %}
            {{ ns.t | round(0) }}
          missing_months: >
            {% set mo = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'] %}
            {% set m = state_attr('input_datetime.electricity_bill_date', 'month') | int(0) %}
            {% set y = state_attr('input_datetime.electricity_bill_date', 'year') | string %}
            {% set ys = states('input_text.electric_archive_years').split(',') %}
            {% set ns = namespace(miss=[]) %}
            {% for i in range(m) %}{% if not (i < ys | count and ys[i] == y) %}{% set ns.miss = ns.miss + [mo[i]] %}{% endif %}{% endfor %}
            {{ ns.miss }}
          missing_months_last_year: >
            {% set mo = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'] %}
            {% set m = state_attr('input_datetime.electricity_bill_date', 'month') | int(0) %}
            {% set ns = namespace(miss=[]) %}
            {% for i in range(m) %}{% if states('input_number.electric_archive_ly_' ~ mo[i] ~ '_amount') | float(0) <= 0 %}{% set ns.miss = ns.miss + [mo[i]] %}{% endif %}{% endfor %}
            {{ ns.miss }}

      - name: "Gas Bills YTD"
        unique_id: gas_bills_ytd
        unit_of_measurement: "$"
        icon: mdi:fire
        availability: >
          {{ state_attr('input_datetime.gas_bill_date', 'month') is number
             and states('input_text.gas_archive_years').split(',') | count == 12 }}
        state: >
          {% set mo = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'] %}
          {% set m = state_attr('input_datetime.gas_bill_date', 'month') | int(0) %}
          {% set y = state_attr('input_datetime.gas_bill_date', 'year') | string %}
          {% set ys = states('input_text.gas_archive_years').split(',') %}
          {% set ns = namespace(t=0.0) %}
          {% for i in range(m) %}{% if i < ys | count and ys[i] == y %}{% set ns.t = ns.t + states('input_number.gas_archive_' ~ mo[i] ~ '_amount') | float(0) %}{% endif %}{% endfor %}
          {{ ns.t | round(2) }}
        attributes:
          year: "{{ state_attr('input_datetime.gas_bill_date', 'year') }}"
          through: >
            {% set m = state_attr('input_datetime.gas_bill_date', 'month') | int(0) %}
            {{ ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m - 1] if m > 0 else none }}
          ccf: >
            {% set mo = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'] %}
            {% set m = state_attr('input_datetime.gas_bill_date', 'month') | int(0) %}
            {% set y = state_attr('input_datetime.gas_bill_date', 'year') | string %}
            {% set ys = states('input_text.gas_archive_years').split(',') %}
            {% set ns = namespace(t=0.0) %}
            {% for i in range(m) %}{% if i < ys | count and ys[i] == y %}{% set ns.t = ns.t + states('input_number.gas_archive_' ~ mo[i] ~ '_ccf') | float(0) %}{% endif %}{% endfor %}
            {{ ns.t | round(0) }}
          cost_last_year: >
            {% set mo = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'] %}
            {% set m = state_attr('input_datetime.gas_bill_date', 'month') | int(0) %}
            {% set ns = namespace(t=0.0) %}
            {% for i in range(m) %}{% set ns.t = ns.t + states('input_number.gas_archive_ly_' ~ mo[i] ~ '_amount') | float(0) %}{% endfor %}
            {{ ns.t | round(2) }}
          ccf_last_year: >
            {% set mo = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'] %}
            {% set m = state_attr('input_datetime.gas_bill_date', 'month') | int(0) %}
            {% set ns = namespace(t=0.0) %}
            {% for i in range(m) %}{% set ns.t = ns.t + states('input_number.gas_archive_ly_' ~ mo[i] ~ '_ccf') | float(0) %}{% endfor %}
            {{ ns.t | round(0) }}
          missing_months: >
            {% set mo = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'] %}
            {% set m = state_attr('input_datetime.gas_bill_date', 'month') | int(0) %}
            {% set y = state_attr('input_datetime.gas_bill_date', 'year') | string %}
            {% set ys = states('input_text.gas_archive_years').split(',') %}
            {% set ns = namespace(miss=[]) %}
            {% for i in range(m) %}{% if not (i < ys | count and ys[i] == y) %}{% set ns.miss = ns.miss + [mo[i]] %}{% endif %}{% endfor %}
            {{ ns.miss }}
          missing_months_last_year: >
            {% set mo = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'] %}
            {% set m = state_attr('input_datetime.gas_bill_date', 'month') | int(0) %}
            {% set ns = namespace(miss=[]) %}
            {% for i in range(m) %}{% if states('input_number.gas_archive_ly_' ~ mo[i] ~ '_amount') | float(0) <= 0 %}{% set ns.miss = ns.miss + [mo[i]] %}{% endif %}{% endfor %}
            {{ ns.miss }}

automation:
  - id: billing_period_start_lookup
    alias: "Billing Period Start - Meter Lookup"
    description: >
      Stores the SDR revenue meter's long-term statistic at 12:00 on the
      utility's meter-read date as the start of the billing period in
      progress. Zeroes the start first, so any failure leaves the
      sensor.*_billing_period_* entity unavailable rather than stale, and
      notifies only when no statistic exists for that hour.
    mode: queued
    max: 4
    triggers:
      - trigger: state
        entity_id: input_datetime.electricity_meter_read_date
        not_to:
          - unknown
          - unavailable
        id: electric
      - trigger: state
        entity_id: input_button.save_electric_bill
        not_to:
          - unknown
          - unavailable
        id: electric
      - trigger: state
        entity_id: input_datetime.gas_meter_read_date
        not_to:
          - unknown
          - unavailable
        id: gas
      - trigger: state
        entity_id: input_button.save_gas_bill
        not_to:
          - unknown
          - unavailable
        id: gas
    actions:
      - variables:
          read_entity: >
            {{ 'input_datetime.electricity_meter_read_date' if trigger.id == 'electric'
               else 'input_datetime.gas_meter_read_date' }}
          stat_id: >
            {{ 'sensor.electric_meter_energy' if trigger.id == 'electric'
               else 'sensor.gas_meter_volume' }}
          start_entity: >
            {{ 'input_number.electric_period_start_kwh' if trigger.id == 'electric'
               else 'input_number.gas_period_start_ft3' }}
          read_date: "{{ states(read_entity) }}"
      - action: input_number.set_value
        target:
          entity_id: "{{ start_entity }}"
        data:
          value: 0
      - condition: template
        value_template: "{{ read_date not in ['unknown', 'unavailable', 'none', ''] }}"
      # Naive times are local: recorder.get_statistics passes them through
      # dt_util.as_utc, which assumes DEFAULT_TIME_ZONE (core 2026.9.3).
      - action: recorder.get_statistics
        data:
          statistic_ids:
            - "{{ stat_id }}"
          start_time: "{{ read_date }} 12:00:00"
          end_time: "{{ read_date }} 13:00:00"
          period: hour
          types:
            - state
        response_variable: stats
      # No statistic for that hour returns {} with the id key ABSENT, not [].
      - variables:
          rows: "{{ stats.statistics.get(stat_id, []) }}"
          start_value: >
            {{ rows[0].state | float(0) if rows | count > 0 and rows[0].state is defined else 0 }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ start_value | float(0) > 0 }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: "{{ start_entity }}"
                data:
                  value: "{{ start_value | float(0) }}"
        default:
          - action: persistent_notification.create
            data:
              notification_id: "billing_period_start_{{ trigger.id }}"
              title: "Billing period start not found"
              message: >
                No long-term statistic for {{ stat_id }} at 12:00 on
                {{ read_date }}, so the {{ trigger.id }} current-period card on
                Cost Overview stays unavailable. Check the meter read date
                against the bill's service period, then re-enter it or press
                Save Bill to retry.
