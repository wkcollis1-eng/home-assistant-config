  hvac_2f_setback_active:
    name: "HVAC 2F Setback Active"
    icon: mdi:thermometer-minus
  hvac_1f_recovering:
    name: "HVAC 1F Recovering"
    icon: mdi:thermometer-plus
  hvac_2f_recovering:
    name: "HVAC 2F Recovering"
    icon: mdi:thermometer-plus

# ===============================================================
# INPUT NUMBER HELPERS
