              level: warning
              message: >
                Runtime/HDD capture skipped - Furnace_runtime={{ states('sensor.hvac_furnace_runtime_today') }},
                HDD_today={{ states('sensor.hvac_hdd65_today') }},
                Runtime_per_HDD={{ states('sensor.hvac_total_runtime_per_hdd_today') }}
  # ===============================================================
  # FURNACE MIN/CYCLE TRACKING - Daily capture at 11:56:15 PM
  # ===============================================================
  - id: capture_daily_furnace_min_per_cycle
    alias: "Capture Daily Furnace Min/Cycle"
    description: "Records daily furnace min/cycle for 7-day std dev calculation"
    mode: single
    trigger:
      - platform: time
        at: "23:56:15"
    action:
      - variables:
          capture_stamp: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      # 2026-10-10: liveness stamp, every run (see configuration.yaml
      # furnace_cycle_capture_last_run).
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.furnace_cycle_capture_last_run
        data:
          datetime: "{{ capture_stamp }}"
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {% set min_per_cycle = states('sensor.hvac_furnace_min_per_cycle') %}
                  {% set furnace_cycles = states('sensor.hvac_furnace_cycles_today') %}
                  {% set furnace_runtime = states('sensor.hvac_furnace_runtime_today') %}
                  {% set val = min_per_cycle | float(-1) %}
                  {# Upstream validation: need at least 2 cycles for meaningful average #}
                  {# 2026-10-10: >= 2 -> >= 1 (Bill). A one-cycle day is a real
                     measurement, not a thin average. 10-08 was one 26.8 min cycle
                     and was skipped, 10-10 (one 28.5 min cycle by 09:00) would
                     have been, and the buffer sat at 2 values, short of the 3
                     furnace_mpc_pipeline_healthy needs [M]. #}
                  {% set cycles_ok = furnace_cycles | int(0) >= 1 %}
                  {# Value validation: min/cycle must be in valid range #}
                  {% set values_ok = is_number(min_per_cycle) and 0 < val <= 60 %}
                  {{ cycles_ok and values_ok }}
            sequence:
              - variables:
                  todays_min_per_cycle: "{{ states('sensor.hvac_furnace_min_per_cycle') | float(0) }}"
                  d1: "{{ states('input_number.furnace_min_per_cycle_day_1') | float(0) }}"
                  d2: "{{ states('input_number.furnace_min_per_cycle_day_2') | float(0) }}"
                  d3: "{{ states('input_number.furnace_min_per_cycle_day_3') | float(0) }}"
                  d4: "{{ states('input_number.furnace_min_per_cycle_day_4') | float(0) }}"
                  d5: "{{ states('input_number.furnace_min_per_cycle_day_5') | float(0) }}"
                  d6: "{{ states('input_number.furnace_min_per_cycle_day_6') | float(0) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.furnace_min_per_cycle_day_7
                data:
                  value: "{{ d6 }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.furnace_min_per_cycle_day_6
                data:
                  value: "{{ d5 }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.furnace_min_per_cycle_day_5
                data:
                  value: "{{ d4 }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.furnace_min_per_cycle_day_4
                data:
                  value: "{{ d3 }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.furnace_min_per_cycle_day_3
                data:
                  value: "{{ d2 }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.furnace_min_per_cycle_day_2
                data:
                  value: "{{ d1 }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.furnace_min_per_cycle_day_1
                data:
                  value: "{{ todays_min_per_cycle }}"
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.furnace_cycle_capture_last_ok
                data:
                  datetime: "{{ capture_stamp }}"
        default:
          - variables:
              d1: "{{ states('input_number.furnace_min_per_cycle_day_1') | float(0) }}"
              d2: "{{ states('input_number.furnace_min_per_cycle_day_2') | float(0) }}"
              d3: "{{ states('input_number.furnace_min_per_cycle_day_3') | float(0) }}"
              d4: "{{ states('input_number.furnace_min_per_cycle_day_4') | float(0) }}"
              d5: "{{ states('input_number.furnace_min_per_cycle_day_5') | float(0) }}"
              d6: "{{ states('input_number.furnace_min_per_cycle_day_6') | float(0) }}"
          - service: input_number.set_value
            target:
              entity_id: input_number.furnace_min_per_cycle_day_7
            data:
              value: "{{ d6 }}"
          - service: input_number.set_value
            target:
              entity_id: input_number.furnace_min_per_cycle_day_6
            data:
              value: "{{ d5 }}"
          - service: input_number.set_value
            target:
              entity_id: input_number.furnace_min_per_cycle_day_5
            data:
              value: "{{ d4 }}"
          - service: input_number.set_value
            target:
              entity_id: input_number.furnace_min_per_cycle_day_4
            data:
              value: "{{ d3 }}"
          - service: input_number.set_value
            target:
              entity_id: input_number.furnace_min_per_cycle_day_3
            data:
              value: "{{ d2 }}"
          - service: input_number.set_value
            target:
              entity_id: input_number.furnace_min_per_cycle_day_2
            data:
              value: "{{ d1 }}"
          - service: input_number.set_value
            target:
              entity_id: input_number.furnace_min_per_cycle_day_1
            data:
              value: 0
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.furnace_cycle_capture_last_ok
            data:
              datetime: "1970-01-01 00:00:00"
          - service: system_log.write
            data:
              level: info
              message: >
                Furnace min/cycle capture skipped — Cycles={{ states('sensor.hvac_furnace_cycles_today') }},
                Min_per_cycle={{ states('sensor.hvac_furnace_min_per_cycle') }}. Zero written to shift window.
          # 2026-10-10 (Bill: bell only when it ran). With cycles_ok at >= 1, a
          # skip on a day the furnace cycled means the value itself failed
          # (non-numeric, or outside 0-60 min) - a real miss, so say so here.
          # A day with no cycles is "furnace didn't run", not a fault (09-14),
          # and stays silent; furnace_cycle_capture_stale still DISPLAYS it.
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ states('sensor.hvac_furnace_cycles_today') | int(0) >= 1 }}"
                sequence:
                  - service: persistent_notification.create
                    data:
                      notification_id: furnace_cycle_capture_skipped
                      title: "⚠️ Furnace Min/Cycle Not Captured"
                      message: >
                        The furnace ran today but its min/cycle was not captured
                        (zero written to day_1).
                        Cycles={{ states('sensor.hvac_furnace_cycles_today') }},
                        Min_per_cycle={{ states('sensor.hvac_furnace_min_per_cycle') }}
                        (guard: numeric and 0 < value <= 60).
            default: []
  # ===============================================================
  # MONTHLY REPORT TRACKING - Daily capture at 11:56:30 PM
  # ===============================================================
  - id: capture_daily_monthly_tracking
    alias: "Capture Daily Monthly Tracking"
    description: "Accumulates HDD/CDD, outdoor temp, expected runtime, and furnace/zone metrics for monthly report"
    mode: single
    trigger:
      - platform: time
        at: "23:56:30"
    action:
      - variables:
          capture_stamp: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      # Snapshot ALL daily values before any updates (atomic capture)
      - variables:
          todays_high: "{{ states('input_number.outdoor_temp_daily_high') | float(0) }}"
          todays_low: "{{ states('input_number.outdoor_temp_daily_low') | float(0) }}"
          todays_mean: "{{ ((todays_high + todays_low) / 2) | round(1) }}"
          todays_expected: "{{ states('sensor.expected_runtime_today') | float(0) }}"
          current_temp_sum: "{{ states('input_number.outdoor_temp_sum_month') | float(0) }}"
          current_days: "{{ states('input_number.outdoor_temp_days_month') | int(0) }}"
          current_expected_sum: "{{ states('input_number.expected_runtime_sum_month') | float(0) }}"
          # HDD/CDD daily values (moved from capture_daily_hdd to unify timing)
          todays_hdd: "{{ states('sensor.hvac_hdd65_today') | float(0) }}"
          todays_cdd: "{{ states('sensor.hvac_cdd65_today') | float(0) }}"
          hdd_month_acc: "{{ states('input_number.hdd_cumulative_month_auto') | float(0) }}"
          hdd_year_acc: "{{ states('input_number.hdd_cumulative_year_auto') | float(0) }}"
          cdd_month_acc: "{{ states('input_number.cdd_cumulative_month_auto') | float(0) }}"
          cdd_year_acc: "{{ states('input_number.cdd_cumulative_year_auto') | float(0) }}"
          # Furnace/zone daily values (from history_stats "today" sensors)
          furnace_runtime_today: "{{ states('sensor.hvac_furnace_runtime_today') | float(0) }}"
          furnace_cycles_today: "{{ states('sensor.hvac_furnace_cycles_today') | int(0) }}"
          zone_1f_runtime_today: "{{ states('sensor.hvac_1f_heat_runtime_today') | float(0) }}"
          zone_2f_runtime_today: "{{ states('sensor.hvac_2f_heat_runtime_today') | float(0) }}"
          zone_1f_cycles_today: "{{ states('sensor.hvac_1f_heat_cycles_today') | int(0) }}"
          zone_2f_cycles_today: "{{ states('sensor.hvac_2f_heat_cycles_today') | int(0) }}"
          # Current accumulators
          furnace_runtime_acc: "{{ states('input_number.furnace_runtime_month_acc') | float(0) }}"
          furnace_cycles_acc: "{{ states('input_number.furnace_cycles_month_acc') | int(0) }}"
          zone_1f_runtime_acc: "{{ states('input_number.zone_1f_runtime_month_acc') | float(0) }}"
          zone_2f_runtime_acc: "{{ states('input_number.zone_2f_runtime_month_acc') | float(0) }}"
          zone_1f_cycles_acc: "{{ states('input_number.zone_1f_cycles_month_acc') | int(0) }}"
          zone_2f_cycles_acc: "{{ states('input_number.zone_2f_cycles_month_acc') | int(0) }}"
          # AC cooling daily values
          ac_runtime_today: "{{ states('sensor.hvac_ac_runtime_today') | float(0) }}"
          ac_cycles_today: "{{ states('sensor.hvac_ac_cycles_today') | int(0) }}"
          zone_1f_cool_runtime_today: "{{ states('sensor.hvac_1f_cool_runtime_today') | float(0) }}"
          zone_2f_cool_runtime_today: "{{ states('sensor.hvac_2f_cool_runtime_today') | float(0) }}"
          zone_1f_cool_cycles_today: "{{ states('sensor.hvac_1f_cool_cycles_today') | int(0) }}"
          zone_2f_cool_cycles_today: "{{ states('sensor.hvac_2f_cool_cycles_today') | int(0) }}"
          # AC cooling accumulators
          ac_runtime_acc: "{{ states('input_number.ac_runtime_month_acc') | float(0) }}"
          ac_cycles_acc: "{{ states('input_number.ac_cycles_month_acc') | int(0) }}"
          zone_1f_cool_runtime_acc: "{{ states('input_number.zone_1f_cool_runtime_month_acc') | float(0) }}"
          zone_2f_cool_runtime_acc: "{{ states('input_number.zone_2f_cool_runtime_month_acc') | float(0) }}"
          zone_1f_cool_cycles_acc: "{{ states('input_number.zone_1f_cool_cycles_month_acc') | int(0) }}"
          zone_2f_cool_cycles_acc: "{{ states('input_number.zone_2f_cool_cycles_month_acc') | int(0) }}"
          # AC cooling yearly accumulators
          ac_runtime_year_acc: "{{ states('input_number.ac_runtime_year_acc') | float(0) }}"
          ac_cycles_year_acc: "{{ states('input_number.ac_cycles_year_acc') | int(0) }}"
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ todays_high > -49 and todays_low < 149 and
                     is_number(todays_hdd) and is_number(todays_cdd) and
                     0 <= todays_hdd <= 65 and 0 <= todays_cdd <= 50 }}
            sequence:
              # ── TIMESTAMP FIRST ──────────────────────────────────────────
              # Set before ANY accumulator updates so captured_today flips
              # atomically for all month sensors (HDD + runtime + cycles).
              # Brief dip (accumulators missing today) affects numerator and
              # denominator equally, keeping the efficiency ratio stable.
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.monthly_tracking_capture_last_ok
                data:
                  datetime: "{{ capture_stamp }}"
              # ── HDD/CDD accumulators (moved from capture_daily_hdd) ─────
              - service: input_number.set_value
                target:
                  entity_id: input_number.hdd_cumulative_month_auto
                data:
                  value: "{{ (hdd_month_acc + todays_hdd) | round(1) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.cdd_cumulative_month_auto
                data:
                  value: "{{ (cdd_month_acc + todays_cdd) | round(1) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.hdd_cumulative_year_auto
                data:
                  value: "{{ (hdd_year_acc + todays_hdd) | round(1) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.cdd_cumulative_year_auto
                data:
                  value: "{{ (cdd_year_acc + todays_cdd) | round(1) }}"
              # ── Outdoor temp tracking ────────────────────────────────────
              - service: input_number.set_value
                target:
                  entity_id: input_number.outdoor_temp_sum_month
                data:
                  value: "{{ current_temp_sum + todays_mean }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.outdoor_temp_days_month
                data:
                  value: "{{ current_days + 1 }}"
              # ── Furnace/zone accumulators (immune to recorder purge) ─────
              - service: input_number.set_value
                target:
                  entity_id: input_number.furnace_runtime_month_acc
                data:
                  value: "{{ (furnace_runtime_acc + furnace_runtime_today) | round(2) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.furnace_cycles_month_acc
                data:
                  value: "{{ furnace_cycles_acc + furnace_cycles_today }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.zone_1f_runtime_month_acc
                data:
                  value: "{{ (zone_1f_runtime_acc + zone_1f_runtime_today) | round(2) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.zone_2f_runtime_month_acc
                data:
                  value: "{{ (zone_2f_runtime_acc + zone_2f_runtime_today) | round(2) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.zone_1f_cycles_month_acc
                data:
                  value: "{{ zone_1f_cycles_acc + zone_1f_cycles_today }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.zone_2f_cycles_month_acc
                data:
                  value: "{{ zone_2f_cycles_acc + zone_2f_cycles_today }}"
              # ── AC cooling accumulators ──────────────────────────────────
              - service: input_number.set_value
                target:
                  entity_id: input_number.ac_runtime_month_acc
                data:
                  value: "{{ (ac_runtime_acc + ac_runtime_today) | round(2) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.ac_cycles_month_acc
                data:
                  value: "{{ ac_cycles_acc + ac_cycles_today }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.zone_1f_cool_runtime_month_acc
                data:
                  value: "{{ (zone_1f_cool_runtime_acc + zone_1f_cool_runtime_today) | round(2) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.zone_2f_cool_runtime_month_acc
                data:
                  value: "{{ (zone_2f_cool_runtime_acc + zone_2f_cool_runtime_today) | round(2) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.zone_1f_cool_cycles_month_acc
                data:
                  value: "{{ zone_1f_cool_cycles_acc + zone_1f_cool_cycles_today }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.zone_2f_cool_cycles_month_acc
                data:
                  value: "{{ zone_2f_cool_cycles_acc + zone_2f_cool_cycles_today }}"
              # ── AC cooling yearly accumulators ───────────────────────────
              - service: input_number.set_value
                target:
                  entity_id: input_number.ac_runtime_year_acc
                data:
                  value: "{{ (ac_runtime_year_acc + ac_runtime_today) | round(2) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.ac_cycles_year_acc
                data:
                  value: "{{ ac_cycles_year_acc + ac_cycles_today }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.expected_runtime_sum_month
                data:
                  value: "{{ current_expected_sum + todays_expected }}"
              - service: system_log.write
                data:
                  message: >
                    Monthly tracking captured: HDD={{ todays_hdd }}, CDD={{ todays_cdd }},
                    mean={{ todays_mean }}°F, furnace={{ furnace_runtime_today }}h,
                    expected={{ todays_expected }}h, AC={{ ac_runtime_today }}h
                  level: info
        default:
          - service: system_log.write
            data:
              level: warning
              message: >
                Monthly tracking SKIPPED - invalid temp or degree-day data.
                high={{ todays_high }}, low={{ todays_low }},
                HDD={{ todays_hdd }}, CDD={{ todays_cdd }}.
                Accumulators NOT updated. Check outdoor proxy sensor.
  # RUNTIME PER CDD TRACKING - Daily capture at 11:56:45 PM
  # ===============================================================
  - id: capture_daily_runtime_per_cdd
    alias: "Capture Daily Runtime per CDD"
    description: "Shifts 7-day runtime/CDD sliding window for cooling efficiency tracking"
    mode: single
    trigger:
      - platform: time
        at: "23:56:45"
    action:
      - variables:
          capture_stamp: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          ac_runtime: "{{ states('sensor.hvac_ac_runtime_today') }}"
          todays_cdd: "{{ states('sensor.hvac_cdd65_today') | float(0) }}"
          upstream_ok: "{{ ac_runtime not in ['unknown', 'unavailable'] and
                           todays_cdd > 0 }}"
          todays_ratio: >
            {% if upstream_ok %}
              {% set rt_min = ac_runtime | float(0) * 60 %}
              {{ (rt_min / todays_cdd) | round(1) }}
            {% else %}
              -1
            {% endif %}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ upstream_ok and todays_ratio >= 0 }}"
            sequence:
              - variables:
                  d1: "{{ states('input_number.runtime_per_cdd_day_1')|float(0) }}"
                  d2: "{{ states('input_number.runtime_per_cdd_day_2')|float(0) }}"
                  d3: "{{ states('input_number.runtime_per_cdd_day_3')|float(0) }}"
                  d4: "{{ states('input_number.runtime_per_cdd_day_4')|float(0) }}"
                  d5: "{{ states('input_number.runtime_per_cdd_day_5')|float(0) }}"
                  d6: "{{ states('input_number.runtime_per_cdd_day_6')|float(0) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.runtime_per_cdd_day_7
                data:
                  value: "{{ d6 }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.runtime_per_cdd_day_6
                data:
                  value: "{{ d5 }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.runtime_per_cdd_day_5
                data:
                  value: "{{ d4 }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.runtime_per_cdd_day_4
                data:
                  value: "{{ d3 }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.runtime_per_cdd_day_3
                data:
                  value: "{{ d2 }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.runtime_per_cdd_day_2
                data:
                  value: "{{ d1 }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.runtime_per_cdd_day_1
                data:
                  value: "{{ todays_ratio }}"
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.runtime_per_cdd_capture_last_ok
                data:
                  datetime: "{{ capture_stamp }}"
              - service: system_log.write
                data:
                  message: "Runtime/CDD sliding window captured: ratio={{ todays_ratio }} min/CDD"
                  level: info
        default:
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.runtime_per_cdd_capture_last_ok
            data:
              datetime: "1970-01-01 00:00:00"
          - service: system_log.write
            data:
              level: warning
              message: >
                Runtime/CDD capture skipped - AC_runtime={{ ac_runtime }},
                CDD={{ todays_cdd }}
  # ===============================================================
  # MONTHLY/YEARLY RESETS - With startup catch-up
  # ===============================================================
  - id: reset_monthly_hdd
    alias: "Reset Monthly HDD/CDD"
    description: "Resets month counters on day 1, with startup catch-up if HA was down"
    mode: single
    trigger:
      - platform: time
        at: "00:01:00"
        id: scheduled
      - platform: homeassistant
        event: start
        id: startup
    condition:
      - condition: template
        value_template: >
          {# Guard keyed to a dedicated reset stamp (gas-season pattern), NOT to
             hdd_cumulative_month_auto == 0 — that value is legitimately 0 at the
             end of July (Jul 2025 archived 0.0 HDD), which silently skipped the
             Aug 1 reset of all 17 accumulators. Fixed 2026-07-03.
             Semantics: on day 1 (scheduled 00:01 or startup catch-up any hour),
             reset iff the stamp is absent or from a different month/year. The
             stamp is written FIRST in the action, so a re-trigger after a
             partial run cannot double-reset (values are already 0; idempotent),
             and a completed run cannot repeat. #}
          {% set last = states('input_datetime.monthly_reset_last_ok') %}
          {% if now().day != 1 %}
            false
          {% elif last in ['unknown', 'unavailable'] or last[:4] == '1970' %}
            true
          {% else %}
            {% set lr = last | as_datetime | as_local %}
            {{ not (lr.year == now().year and lr.month == now().month) }}
          {% endif %}
    action:
      # Stamp FIRST — the guard above keys on this, making the reset once-per-month
      # regardless of how the accumulators happen to look.
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.monthly_reset_last_ok
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.hdd_cumulative_month_auto
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.cdd_cumulative_month_auto
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.outdoor_temp_sum_month
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.outdoor_temp_days_month
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.expected_runtime_sum_month
        data:
          value: 0
      # Keep last month's furnace hours before they are zeroed below:
      # archive_monthly_gas_heat_cost needs them to prove a bill period had no
      # heating (2026-10-18). Unreadable -> 1000 (the max), never a false 0.
      - service: input_number.set_value
        target:
          entity_id: input_number.furnace_runtime_last_month
        data:
          value: "{{ states('input_number.furnace_runtime_month_acc') | float(1000) }}"
      # Reset furnace/zone monthly accumulators
      - service: input_number.set_value
        target:
          entity_id: input_number.furnace_runtime_month_acc
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.furnace_cycles_month_acc
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.zone_1f_runtime_month_acc
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.zone_2f_runtime_month_acc
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.zone_1f_cycles_month_acc
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.zone_2f_cycles_month_acc
        data:
          value: 0
      # Reset AC cooling monthly accumulators
      - service: input_number.set_value
        target:
          entity_id: input_number.ac_runtime_month_acc
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.ac_cycles_month_acc
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.zone_1f_cool_runtime_month_acc
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.zone_2f_cool_runtime_month_acc
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.zone_1f_cool_cycles_month_acc
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.zone_2f_cool_cycles_month_acc
        data:
          value: 0
      # Archive closing month's MPC stats before reset
      # Month index used to select the right archive slot
      - variables:
          closing_month: "{{ (now() - timedelta(days=1)).strftime('%b') | lower }}"
      - service: input_number.set_value
        target:
          entity_id: >
            input_number.furnace_mpc_archive_{{ closing_month }}
        data:
          value: >
            {{ states('sensor.hvac_furnace_cycle_mean_7d') | float(0) }}
      - service: input_number.set_value
        target:
          entity_id: >
            input_number.furnace_mpc_sigma_archive_{{ closing_month }}
        data:
          value: >
            {{ states('sensor.hvac_furnace_cycle_sigma_7d') | float(0) }}
      - service: input_number.set_value
        target:
          entity_id: >
            input_number.furnace_short_cycle_archive_{{ closing_month }}
        data:
          value: >
            {{ states('sensor.hvac_furnace_short_cycle_pct_7d') | float(0) }}
      - service: system_log.write
        data:
          message: "Monthly HDD/CDD, furnace, and AC cooling accumulators reset completed (trigger: {{ trigger.id }})"
          level: info
  - id: reset_yearly_hdd
    alias: "Reset Yearly HDD/CDD"
    description: "Resets year counters on Jan 1, with startup catch-up if HA was down"
    mode: single
    trigger:
      - platform: time
        at: "00:02:00"
        id: scheduled
      - platform: homeassistant
        event: start
        id: startup
    condition:
      - condition: template
        value_template: >
          {% set last_ok = states('input_datetime.hdd_capture_last_ok') %}
          {% set year_val = states('input_number.hdd_cumulative_year_auto')|float(0) %}
          {% if not (now().month == 1 and now().day == 1) %}
            false
          {% elif year_val == 0 %}
            {# Already reset, don't reset again #}
            false
          {% elif now().hour < 3 %}
            {# Normal window: always reset #}
            true
          {% elif last_ok not in ['unknown', 'unavailable', '1970-01-01 00:00:00'] %}
            {# Late startup: only reset if last capture was previous year #}
            {% set last_capture = last_ok | as_datetime | as_local %}
            {{ last_capture.year != now().year }}
          {% else %}
            false
          {% endif %}
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.hdd_cumulative_year_auto
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.cdd_cumulative_year_auto
        data:
          value: 0
      # Reset AC cooling yearly accumulators
      - service: input_number.set_value
        target:
          entity_id: input_number.ac_runtime_year_acc
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.ac_cycles_year_acc
        data:
          value: 0
      - service: system_log.write
        data:
          message: "Yearly HDD/CDD reset completed (trigger: {{ trigger.id }})"
          level: info

  # ===============================================================
  # MONTHLY HDD / CDD ARCHIVE: RETIRED 2026-09-23
  # archive_monthly_hdd (23:58:15) and archive_monthly_cdd (23:58:30, mirrored it
  # for cooling season analysis) copied hdd/cdd_cumulative_month_auto (which
  # already included the last day, added at 23:56:30) into
  # input_number.hdd_archive_<m> / cdd_archive_<m> on the last day of the month,
  # for rolling 12-month efficiency calculations. Those read official BDL
  # (sensor.bdl_degree_days) since the 2026-09-23 audit, so nothing read the archive.
  # ===============================================================
  # ===============================================================
  # ALERT AUTOMATIONS
  # ===============================================================
  # DISABLED: Fixed-threshold CCF/1kHDD alert replaced by runtime/HDD ±2σ monitoring
  # Furnace-level short cycling alert (replaces per-zone alerts)
  - id: notify_short_cycling_furnace
    alias: "Notify Short Cycling Furnace"
    trigger:
      - platform: state
        entity_id: binary_sensor.hvac_furnace_short_cycling_alert
        to: "on"
    action:
      - service: persistent_notification.create
        data:
          title: "⚠️ Short Cycling Alert"
          message: >
            Furnace avg cycle: {{ states('sensor.hvac_furnace_min_per_cycle') | round(1) }} min
            ({{ states('sensor.hvac_furnace_cycles_today') }} cycles today).
            Check air filter or thermostat settings.
  # ===============================================================
  # REMINDER AUTOMATIONS
  # ===============================================================
  - id: daily_hvac_summary
    alias: "Daily HVAC Summary"
    trigger:
      - platform: time
        at: "22:00:00"
    condition:
      - condition: template
        value_template: >
          {{ states('sensor.hvac_hdd65_today') | float(0) > 0 or
             states('sensor.hvac_cdd65_today') | float(0) > 0 }}
    action:
      - service: persistent_notification.create
        data:
          title: "📊 Daily HVAC Summary"
          message: >
            {% if states('sensor.hvac_hdd65_today') | float(0) > 0 %}
            🔥 Heating: HDD={{ states('sensor.hvac_hdd65_today') }}
            Runtime={{ states('sensor.hvac_total_heat_runtime_today') }}h
            {% endif %}
            {% if states('sensor.hvac_cdd65_today') | float(0) > 0 %}
            ❄️ Cooling: CDD={{ states('sensor.hvac_cdd65_today') }}
            AC Runtime={{ states('sensor.hvac_ac_runtime_today') }}h
            {% endif %}
            Zone Balance: {{ states('sensor.hvac_zone_balance_ratio_today') }}%
  # ===============================================================
  # FILTER TRACKING AUTOMATIONS (HARDENED)
  # ===============================================================
  - id: accumulate_filter_runtime
    alias: "Accumulate Filter Runtime"
    description: "Add daily runtime to filter hours at end of day"
    mode: single
    trigger:
      - platform: time
        at: "23:58:00"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ (is_number(states('sensor.hvac_total_heat_runtime_today')) and
                      states('sensor.hvac_total_heat_runtime_today')| float(0) >= 0) or
                     (is_number(states('sensor.hvac_ac_runtime_today')) and
                      states('sensor.hvac_ac_runtime_today')| float(0) >= 0) }}
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.hvac_filter_runtime_hours
                data:
                  value: >
                    {{ (states('input_number.hvac_filter_runtime_hours')|float(0) +
                        states('sensor.hvac_total_heat_runtime_today')|float(0) +
                        states('sensor.hvac_ac_runtime_today')|float(0))|round(2) }}
        default:
          - service: system_log.write
            data:
              message: "Filter runtime capture skipped - sensor unavailable: {{ states('sensor.hvac_total_heat_runtime_today') }}"
              level: warning
  - id: reset_filter_runtime_button
    alias: "Reset Filter Runtime"
    description: "Reset filter runtime when button pressed"
    trigger:
      - platform: state
        entity_id: input_button.reset_filter_runtime
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.hvac_filter_runtime_hours
        data:
          value: 0
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.hvac_filter_last_changed
        data:
          date: "{{ now().strftime('%Y-%m-%d') }}"
      - service: persistent_notification.create
        data:
          title: "Filter Reset"
          message: "Filter runtime reset to 0 hours. Change date recorded."
  - id: notify_filter_change_due
    alias: "Notify Filter Change Due"
    trigger:
      - platform: state
        entity_id: binary_sensor.hvac_filter_change_alert
        to: "on"
    action:
      - service: persistent_notification.create
        data:
          title: "HVAC Filter Change Due"
          message: "Filter has {{ states('input_number.hvac_filter_runtime_hours') | round(0) }} runtime hours. Time to replace!"

  # ===============================================================
  # SETBACK & RECOVERY TRACKING
  # Simple state machine: IDLE → SETBACK_ACTIVE → RECOVERING → IDLE
  # Self-correcting: template triggers survive restarts, timeouts clear stuck state
  # ===============================================================
  # --- SETBACK START (1F) ---
  - id: hvac_1f_setback_start
    alias: "1F Setback Start"
    mode: single
    trigger:
      - platform: state
        entity_id: climate.main_floor
        attribute: temperature
        for:
          seconds: 5
    condition:
      - condition: template
        value_template: >
          {% set from_t = trigger.from_state.attributes.temperature | float(-999) %}
          {% set to_t = trigger.to_state.attributes.temperature | float(-999) %}
          {{ from_t > 50 and to_t > 50 and (from_t - to_t) >= 1 }}
      - condition: state
        entity_id: input_boolean.hvac_1f_setback_active
        state: "off"
      - condition: template
        value_template: "{{ now().hour >= 18 }}"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.hvac_1f_setback_active
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.hvac_1f_recovering
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.hvac_1f_setback_start
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.hvac_1f_hold_setpoint
        data:
          value: "{{ trigger.from_state.attributes.temperature | float(67) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.hvac_1f_setback_setpoint
        data:
          value: "{{ trigger.to_state.attributes.temperature | float(62) }}"
  # --- SETBACK START (2F) ---
  - id: hvac_2f_setback_start
    alias: "2F Setback Start"
    mode: single
    trigger:
      - platform: state
        entity_id: climate.upstairs
        attribute: temperature
        for:
          seconds: 5
    condition:
      - condition: template
        value_template: >
          {% set from_t = trigger.from_state.attributes.temperature | float(-999) %}
          {% set to_t = trigger.to_state.attributes.temperature | float(-999) %}
          {{ from_t > 50 and to_t > 50 and (from_t - to_t) >= 1 }}
      - condition: state
        entity_id: input_boolean.hvac_2f_setback_active
        state: "off"
      - condition: template
        value_template: "{{ now().hour >= 18 }}"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.hvac_2f_setback_active
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.hvac_2f_recovering
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.hvac_2f_setback_start
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.hvac_2f_hold_setpoint
        data:
          value: "{{ trigger.from_state.attributes.temperature | float(67) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.hvac_2f_setback_setpoint
        data:
          value: "{{ trigger.to_state.attributes.temperature | float(62) }}"
  # --- SETBACK LOWERED (captures mid-cycle drops, e.g. utility DR events) ---
  - id: hvac_1f_setback_lowered
    alias: "1F Setback Lowered"
    mode: single
    trigger:
      - platform: state
        entity_id: climate.main_floor
        attribute: temperature
        for:
          seconds: 5
    condition:
      - condition: state
        entity_id: input_boolean.hvac_1f_setback_active
        state: "on"
      - condition: template
        value_template: >
          {% set to_t = trigger.to_state.attributes.temperature | float(-999) %}
          {% set stored = states('input_number.hvac_1f_setback_setpoint') | float(999) %}
          {{ to_t > 50 and to_t < stored }}
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.hvac_1f_setback_setpoint
        data:
          value: "{{ trigger.to_state.attributes.temperature | float(62) }}"
  - id: hvac_2f_setback_lowered
    alias: "2F Setback Lowered"
    mode: single
    trigger:
      - platform: state
        entity_id: climate.upstairs
        attribute: temperature
        for:
          seconds: 5
    condition:
      - condition: state
        entity_id: input_boolean.hvac_2f_setback_active
        state: "on"
      - condition: template
        value_template: >
          {% set to_t = trigger.to_state.attributes.temperature | float(-999) %}
          {% set stored = states('input_number.hvac_2f_setback_setpoint') | float(999) %}
          {{ to_t > 50 and to_t < stored }}
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.hvac_2f_setback_setpoint
        data:
          value: "{{ trigger.to_state.attributes.temperature | float(62) }}"
  # --- RECOVERY START (1F) ---
  # Template trigger: fires when setpoint returns to comfort AND house is still cold.
  # Re-evaluates at HA startup → self-healing after restarts.
  - id: hvac_1f_recovery_start
    alias: "1F Recovery Start"
    mode: single
    trigger:
      - platform: template
        value_template: >
          {% set active = is_state('input_boolean.hvac_1f_setback_active', 'on') %}
          {% set not_rec = is_state('input_boolean.hvac_1f_recovering', 'off') %}
          {% set live = state_attr('climate.main_floor', 'temperature') | float(0) %}
          {% set hold = states('input_number.hvac_1f_hold_setpoint') | float(0) %}
          {% set current = states('sensor.main_floor_current_temperature') | float(0) %}
          {{ active and not_rec and hold > 50 and live >= (hold - 0.5) and current < (hold - 0.5) }}
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.hvac_1f_recovering
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.hvac_1f_recovery_start
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.hvac_1f_recovery_start_temp
        data:
          value: >
            {{ state_attr('climate.main_floor',
               'current_temperature') | float(65) }}
  # --- RECOVERY START (2F) ---
  - id: hvac_2f_recovery_start
    alias: "2F Recovery Start"
    mode: single
    trigger:
      - platform: template
        value_template: >
          {% set active = is_state('input_boolean.hvac_2f_setback_active', 'on') %}
          {% set not_rec = is_state('input_boolean.hvac_2f_recovering', 'off') %}
          {% set live = state_attr('climate.upstairs', 'temperature') | float(0) %}
          {% set hold = states('input_number.hvac_2f_hold_setpoint') | float(0) %}
          {% set current = states('sensor.upstairs_current_temperature') | float(0) %}
          {{ active and not_rec and hold > 50 and live >= (hold - 0.5) and current < (hold - 0.5) }}
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.hvac_2f_recovering
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.hvac_2f_recovery_start
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.hvac_2f_recovery_start_temp
        data:
          value: >
            {{ state_attr('climate.upstairs',
               'current_temperature') | float(65) }}
  # --- RECOVERY END (1F) ---
  # Template trigger with for: 5 min — current temp reaches comfort target.
  # Also re-evaluates at HA startup → self-healing.
  - id: hvac_1f_recovery_end
    alias: "1F Recovery End"
    mode: single
    trigger:
      - platform: template
        value_template: >
          {% set recovering = is_state('input_boolean.hvac_1f_recovering', 'on') %}
          {% set current = states('sensor.main_floor_current_temperature') | float(0) %}
          {% set target = states('input_number.hvac_1f_hold_setpoint') | float(0) %}
          {{ recovering and target > 50 and current >= (target - 1.0) }}
        for:
          minutes: 5
    condition:
      - condition: state
        entity_id: input_boolean.hvac_1f_setback_active
        state: "on"
      - condition: state
        entity_id: input_boolean.hvac_1f_recovering
        state: "on"
    action:
      - variables:
          recovery_minutes: >
            {# minus 5: the trigger's for: 5min debounce means now() is 5 min
               after the zone actually reached hold-1.0degF; without the
               correction every recovery read ~5 min long (8-17% on min/degF).
               Floored at 0. Fixed 2026-07-03. #}
            {% set start = states('input_datetime.hvac_1f_recovery_start') %}
            {% if start not in ['unknown', 'unavailable'] %}
              {{ [(((now() - (start | as_datetime | as_local)).total_seconds() / 60) - 5) | round(1), 0] | max }}
            {% else %}0{% endif %}
          degrees_to_recover: >
            {% set hold = states('input_number.hvac_1f_hold_setpoint') | float(0) %}
            {% set st = states('input_number.hvac_1f_recovery_start_temp') | float(0) %}
            {{ [(hold - st), 0.1] | max | round(1) }}
      - service: input_number.set_value
        target:
          entity_id: input_number.hvac_1f_last_recovery_minutes
        data:
          value: "{{ [recovery_minutes | float(0), 300] | min }}"
      - choose:
          # ha_maintenance_mode FIRST: choose: runs the first option whose
          # conditions all pass, so this pre-empts the append. Kept as its own
          # branch rather than folded into the validity template below, because
          # a maintenance skip is NOT a data fault and must not be logged as
          # one. It is still a permanent hole - no retry, no stale detector -
          # so it logs at warning, not info.
          - conditions:
              - condition: state
                entity_id: input_boolean.ha_maintenance_mode
                state: "on"
            sequence:
                - service: system_log.write
                  data:
                    level: warning
                    message: >
                      1F setback CSV append SKIPPED - ha_maintenance_mode is on. This recovery is not recorded and will not retry.
          - conditions:
              - condition: template
                value_template: >
                  {{ recovery_minutes | float(0) > 0 and
                     recovery_minutes | float(0) <= 300 and
                     degrees_to_recover | float(0) >= 0.5 }}
            sequence:
              - service: shell_command.appendsetbacklog_1f
        default:
          - service: system_log.write
            data:
              level: warning
              message: >
                Skipped 1F setback CSV: recovery_min={{ recovery_minutes }},
                deg_to_recover={{ degrees_to_recover }}
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.hvac_1f_recovering
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.hvac_1f_setback_active
  # --- RECOVERY END (2F) ---
  # 1.25°F threshold (cathedral ceiling asymptote)
  - id: hvac_2f_recovery_end
    alias: "2F Recovery End"
    mode: single
    trigger:
      - platform: template
        value_template: >
          {% set recovering = is_state('input_boolean.hvac_2f_recovering', 'on') %}
          {% set current = states('sensor.upstairs_current_temperature') | float(0) %}
          {% set target = states('input_number.hvac_2f_hold_setpoint') | float(0) %}
          {{ recovering and target > 50 and current >= (target - 1.25) }}
        for:
          minutes: 5
    condition:
      - condition: state
        entity_id: input_boolean.hvac_2f_setback_active
        state: "on"
      - condition: state
        entity_id: input_boolean.hvac_2f_recovering
        state: "on"
    action:
      - variables:
          recovery_minutes: >
            {# minus 5: see 1F note — corrects the for: 5min debounce bias. #}
            {% set start = states('input_datetime.hvac_2f_recovery_start') %}
            {% if start not in ['unknown', 'unavailable'] %}
              {{ [(((now() - (start | as_datetime | as_local)).total_seconds() / 60) - 5) | round(1), 0] | max }}
            {% else %}0{% endif %}
          degrees_to_recover: >
            {% set hold = states('input_number.hvac_2f_hold_setpoint') | float(0) %}
            {% set st = states('input_number.hvac_2f_recovery_start_temp') | float(0) %}
            {{ [(hold - st), 0.1] | max | round(1) }}
      - service: input_number.set_value
        target:
          entity_id: input_number.hvac_2f_last_recovery_minutes
        data:
          value: "{{ [recovery_minutes | float(0), 300] | min }}"
      - choose:
          # ha_maintenance_mode FIRST: choose: runs the first option whose
          # conditions all pass, so this pre-empts the append. Kept as its own
          # branch rather than folded into the validity template below, because
          # a maintenance skip is NOT a data fault and must not be logged as
          # one. It is still a permanent hole - no retry, no stale detector -
          # so it logs at warning, not info.
          - conditions:
              - condition: state
                entity_id: input_boolean.ha_maintenance_mode
                state: "on"
            sequence:
                - service: system_log.write
                  data:
                    level: warning
                    message: >
                      2F setback CSV append SKIPPED - ha_maintenance_mode is on. This recovery is not recorded and will not retry.
          - conditions:
              - condition: template
                value_template: >
                  {{ recovery_minutes | float(0) > 0 and
                     recovery_minutes | float(0) <= 300 and
                     degrees_to_recover | float(0) >= 0.5 }}
            sequence:
              - service: shell_command.appendsetbacklog_2f
        default:
          - service: system_log.write
            data:
              level: warning
              message: >
                Skipped 2F setback CSV: recovery_min={{ recovery_minutes }},
                deg_to_recover={{ degrees_to_recover }}
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.hvac_2f_recovering
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.hvac_2f_setback_active

  # ===============================================================
  # SELF-CORRECTION: Stuck-state safety valves
  # ===============================================================
  # Setback active >14h without recovery starting → force clear
  - id: hvac_1f_setback_stuck_clear
    alias: "1F Setback Stuck Clear"
    trigger:
      - platform: state
        entity_id: input_boolean.hvac_1f_setback_active
        to: "on"
        for:
          hours: 14
    condition:
      - condition: state
        entity_id: input_boolean.hvac_1f_recovering
        state: "off"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.hvac_1f_setback_active
      - service: system_log.write
        data:
          level: warning
          message: "1F setback latch stuck 14h without recovery — force cleared"
  - id: hvac_2f_setback_stuck_clear
    alias: "2F Setback Stuck Clear"
    trigger:
      - platform: state
        entity_id: input_boolean.hvac_2f_setback_active
        to: "on"
        for:
          hours: 14
    condition:
      - condition: state
        entity_id: input_boolean.hvac_2f_recovering
        state: "off"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.hvac_2f_setback_active
      - service: system_log.write
        data:
          level: warning
          message: "2F setback latch stuck 14h without recovery — force cleared"
  # Recovery active >4h → recovery failed to complete, force clear
  - id: hvac_1f_recovery_stuck_clear
    alias: "1F Recovery Stuck Clear"
    trigger:
      - platform: state
        entity_id: input_boolean.hvac_1f_recovering
        to: "on"
        for:
          hours: 4
    action:
      - service: system_log.write
        data:
          level: warning
          message: >
            1F recovery stuck 4h — force cleared.
            start_temp={{ states('input_number.hvac_1f_recovery_start_temp') }},
            hold={{ states('input_number.hvac_1f_hold_setpoint') }},
            current={{ states('sensor.main_floor_current_temperature') }}
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.hvac_1f_recovering
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.hvac_1f_setback_active
  - id: hvac_2f_recovery_stuck_clear
    alias: "2F Recovery Stuck Clear"
    trigger:
      - platform: state
        entity_id: input_boolean.hvac_2f_recovering
        to: "on"
        for:
          hours: 4
    action:
      - service: system_log.write
        data:
          level: warning
          message: >
            2F recovery stuck 4h — force cleared.
            start_temp={{ states('input_number.hvac_2f_recovery_start_temp') }},
            hold={{ states('input_number.hvac_2f_hold_setpoint') }},
            current={{ states('sensor.upstairs_current_temperature') }}
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.hvac_2f_recovering
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.hvac_2f_setback_active
  # Midnight audit: clear any stale recovering latches at 1 AM
  - id: hvac_setback_midnight_audit
    alias: "Setback Midnight Audit"
    trigger:
      - platform: time
        at: "01:00:00"
    condition:
      - condition: or
        conditions:
          - condition: state
            entity_id: input_boolean.hvac_1f_recovering
            state: "on"
          - condition: state
            entity_id: input_boolean.hvac_2f_recovering
            state: "on"
    action:
      # Per-zone (2026-07-03): the old blanket clear wiped BOTH zones'
      # setback_active even when only one was stuck recovering — the healthy
      # zone (in normal overnight setback) then lost its morning recovery log.
      - variables:
          stuck_1f: "{{ is_state('input_boolean.hvac_1f_recovering', 'on') }}"
          stuck_2f: "{{ is_state('input_boolean.hvac_2f_recovering', 'on') }}"
      - if:
          - condition: template
            value_template: "{{ stuck_1f }}"
        then:
          - service: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.hvac_1f_recovering
                - input_boolean.hvac_1f_setback_active
      - if:
          - condition: template
            value_template: "{{ stuck_2f }}"
        then:
          - service: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.hvac_2f_recovering
                - input_boolean.hvac_2f_setback_active
      - service: system_log.write
        data:
          level: warning
          message: >
            Midnight audit: cleared stuck recovery latch(es) at 1 AM.
            1F stuck={{ stuck_1f }}, 2F stuck={{ stuck_2f }} (only stuck zones
            cleared; the other zone's overnight setback state is preserved).
  # ===============================================================
  # EFFICIENCY ALERTS
  # ===============================================================
  - id: notify_runtime_per_hdd_high
    alias: "Notify Runtime per HDD High"
    trigger:
      - platform: state
        entity_id: binary_sensor.hvac_runtime_per_hdd_high_alert
        to: "on"
    action:
      - service: persistent_notification.create
        data:
          title: "HVAC Efficiency Warning"
          message: >
            Runtime per HDD is {{ states('sensor.hvac_runtime_per_hdd_7_day') }} min/HDD,
            which exceeds upper bound ({{ states('sensor.hvac_runtime_per_hdd_upper_bound_1s') }} = mean + 2σ).
            Check for air leaks, filter condition, or thermostat issues.
  - id: notify_runtime_per_hdd_low
    alias: "Notify Runtime per HDD Low"
    trigger:
      - platform: state
        entity_id: binary_sensor.hvac_runtime_per_hdd_low_alert
        to: "on"
    action:
      - service: persistent_notification.create
        data:
          title: "HVAC Efficiency Notice"
          message: >
            Runtime per HDD is {{ states('sensor.hvac_runtime_per_hdd_7_day') }} min/HDD,
            which is below lower bound ({{ states('sensor.hvac_runtime_per_hdd_lower_bound_1s') }} = mean - 2σ).
            System running more efficiently than expected.
  - id: notify_ac_short_cycling
    alias: "Notify AC Short Cycling"
    description: "Alert when AC compressor is short cycling (<8 min/cycle)"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.hvac_ac_short_cycling_alert
        to: "on"
        for:
          minutes: 15
    action:
      - service: persistent_notification.create
        data:
          title: "AC Short Cycling Alert"
          message: >
            AC compressor is short cycling: {{ states('sensor.hvac_ac_min_per_cycle') }} min/cycle
            (threshold: 8 min). Cycles today: {{ states('sensor.hvac_ac_cycles_today') }}.
            Check refrigerant charge, filter, and thermostat settings.
          notification_id: ac_short_cycling
  - id: notify_runtime_per_cdd_high
    alias: "Notify Runtime per CDD High"
    description: "Alert when runtime/CDD 7-day ratio exceeds mean+2σ upper bound"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.hvac_runtime_per_cdd_high_alert
        to: "on"
        for:
          hours: 2
    action:
      - service: persistent_notification.create
        data:
          title: "Runtime/CDD High Alert"
          message: >
            AC runtime/CDD ratio {{ states('sensor.hvac_runtime_per_cdd_7_day') }} min/CDD
            exceeds upper bound {{ states('sensor.hvac_runtime_per_cdd_upper_bound') }} (mean + 2σ).
            Possible causes: dirty filter, low refrigerant, high humidity load, or degraded equipment.
          notification_id: runtime_per_cdd_high
  - id: notify_runtime_per_cdd_low
    alias: "Notify Runtime per CDD Low"
    description: "Alert when runtime/CDD 7-day ratio falls below mean-2σ lower bound"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.hvac_runtime_per_cdd_low_alert
        to: "on"
        for:
          hours: 2
    action:
      - service: persistent_notification.create
        data:
          title: "Runtime/CDD Low Alert"
          message: >
            AC runtime/CDD ratio {{ states('sensor.hvac_runtime_per_cdd_7_day') }} min/CDD
            is below lower bound {{ states('sensor.hvac_runtime_per_cdd_lower_bound') }} (mean - 2σ).
            Possible causes: very low humidity, sensor fault, or unusually efficient conditions.
          notification_id: runtime_per_cdd_low
  - id: notify_cdd_capture_stale
    alias: "Notify CDD Capture Stale"
    description: "Alert when CDD sliding window capture has not succeeded in 26+ hours"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.cdd_capture_stale
        to: "on"
        for:
          hours: 2
    action:
      - service: persistent_notification.create
        data:
          title: "CDD Capture Stale"
          message: >
            CDD capture has not succeeded in over 26 hours.
            Last OK: {{ states('input_datetime.cdd_capture_last_ok') }}.
            Check outdoor proxy sensor and capture_daily_cdd automation.
          notification_id: cdd_capture_stale
  - id: notify_runtime_per_cdd_capture_stale
    alias: "Notify Runtime per CDD Capture Stale"
    description: "Alert when runtime/CDD sliding window capture has not succeeded in 26+ hours"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.runtime_per_cdd_capture_stale
        to: "on"
        for:
          hours: 2
    action:
      - service: persistent_notification.create
        data:
          title: "Runtime/CDD Capture Stale"
          message: >
            Runtime/CDD capture has not succeeded in over 26 hours.
            Last OK: {{ states('input_datetime.runtime_per_cdd_capture_last_ok') }}.
            Check AC runtime sensor and capture_daily_runtime_per_cdd automation.
          notification_id: runtime_per_cdd_capture_stale
  # ===============================================================
  # CSV REPORT GENERATION
  # ===============================================================
  - id: csv_daily_report
    alias: "CSV Daily Report"
    description: "Append daily HVAC data to CSV at 23:57 (after HDD capture)"
    trigger:
      - platform: time
        at: "23:57:00"
    action:
      - variables:
          outdoor_high: "{{ states('input_number.outdoor_temp_daily_high') | float(-50) }}"
          outdoor_low: "{{ states('input_number.outdoor_temp_daily_low') | float(150) }}"
          hdd_today: "{{ states('sensor.hvac_hdd65_today') | float(-1) }}"
          runtime_today_min: "{{ (states('sensor.hvac_furnace_runtime_today') | float(-1)) * 60 }}"
      - choose:
          # ha_maintenance_mode FIRST: choose: runs the first option whose
          # conditions all pass, so this pre-empts the append. Kept as its own
          # branch rather than folded into the validity template below, because
          # a maintenance skip is NOT a data fault and must not be logged as
          # one. It is still a permanent hole - no retry, no stale detector -
          # so it logs at warning, not info.
          - conditions:
              - condition: state
                entity_id: input_boolean.ha_maintenance_mode
                state: "on"
            sequence:
                - service: system_log.write
                  data:
                    level: warning
                    message: >
                      Daily CSV append SKIPPED - ha_maintenance_mode is on. One row lost, no retry, no stale detector. Re-run shell_command.appenddailycsv by hand once maintenance is over.
          - conditions:
              - condition: template
                value_template: >
                  {{ outdoor_high > -49 and outdoor_low < 149 and
                     outdoor_high >= outdoor_low and
                     hdd_today >= 0 and hdd_today <= 65 and
                     runtime_today_min >= 0 and runtime_today_min <= 1440 }}
            sequence:
              - service: shell_command.appenddailycsv
              - service: system_log.write
                data:
                  message: "Daily CSV report appended"
                  level: info
        default:
          - service: system_log.write
            data:
              level: warning
              message: >
                Daily CSV append skipped due to invalid data:
                high={{ outdoor_high }}, low={{ outdoor_low }},
                hdd={{ hdd_today }}, runtime_min={{ runtime_today_min | round(1) }}
  - id: csv_monthly_report
    alias: "CSV Monthly Report"
    description: "Append monthly HVAC data to CSV on last day of month at 23:58:45"
    trigger:
      - platform: time
        at: "23:58:45"
    condition:
      - condition: template
        value_template: "{{ (now() + timedelta(days=1)).day == 1 }}"
    action:
      - variables:
          days_count: "{{ states('input_number.outdoor_temp_days_month') | int(0) }}"
          total_hdd: "{{ states('input_number.hdd_cumulative_month_auto') | float(-1) }}"
          runtime_hours: "{{ states('sensor.hvac_furnace_runtime_month_2') | float(-1) }}"
          runtime_per_hdd: "{{ states('sensor.hvac_runtime_per_hdd_month') | float(-1) }}"
          last_tracking_ok: "{{ states('input_datetime.monthly_tracking_capture_last_ok') }}"
          captured_today: >
            {% set dt = states('input_datetime.monthly_tracking_capture_last_ok') %}
            {{ dt not in ['unknown', 'unavailable', '1970-01-01 00:00:00'] and
               dt[:10] == now().strftime('%Y-%m-%d') }}
      - choose:
          # ha_maintenance_mode FIRST: choose: runs the first option whose
          # conditions all pass, so this pre-empts the append. Kept as its own
          # branch rather than folded into the validity template below, because
          # a maintenance skip is NOT a data fault and must not be logged as
          # one. It is still a permanent hole - no retry, no stale detector -
          # so it logs at warning, not info.
          - conditions:
              - condition: state
                entity_id: input_boolean.ha_maintenance_mode
                state: "on"
            sequence:
                - service: system_log.write
                  data:
                    level: warning
                    message: >
                      Monthly CSV append SKIPPED - ha_maintenance_mode is on. This fires only on the last day of the month; it will not retry. Re-run shell_command.appendmonthlycsv by hand once maintenance is over.
          - conditions:
              - condition: template
                value_template: >
                  {{ captured_today and
                     days_count >= 20 and
                     total_hdd >= 0 and total_hdd <= 2500 and
                     runtime_hours >= 0 and runtime_hours <= 2000 and
                     runtime_per_hdd >= 0 and runtime_per_hdd <= 120 }}
            sequence:
              - service: shell_command.appendmonthlycsv
              - service: system_log.write
                data:
                  message: "Monthly CSV report appended"
                  level: info
        default:
          - service: system_log.write
            data:
              level: warning
              message: >
                Monthly CSV append skipped due to invalid/incomplete data:
                captured_today={{ captured_today }}, days={{ days_count }},
                hdd={{ total_hdd }}, runtime_hours={{ runtime_hours }},
                runtime_per_hdd={{ runtime_per_hdd }}
  - id: csv_yearly_rotation
    alias: "CSV Yearly Rotation"
    description: "Create new daily CSV file on Jan 1st"
    trigger:
      - platform: time
        at: "00:03:00"
    condition:
      - condition: template
        value_template: "{{ now().month == 1 and now().day == 1 }}"
    action:
      # Guarded 2026-08-22. This is a ROTATION, not an append, and it gets exactly
      # one chance a year (Jan 1, 00:03). A bare condition: on the automation
      # would skip it silently and the daily CSV would never roll over, so the
      # guard lives in a choose: whose default: does the real work.
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.ha_maintenance_mode
                state: "on"
            sequence:
              - service: system_log.write
                data:
                  level: warning
                  message: >
                    Daily CSV yearly rotation SKIPPED - ha_maintenance_mode is on
                    at 00:03 on Jan 1. It will NOT retry until next year. Run
                    shell_command.rotatedailycsv by hand once maintenance is over.
        default:
          - service: shell_command.rotatedailycsv
          - service: system_log.write
            data:
              message: "Daily CSV rotated for new year"
              level: info

  # ===============================================================
  # WATCHDOG & ROBUSTNESS AUTOMATIONS
  # ===============================================================
  # WATCHDOG: HDD Capture Health Monitor
  # Alerts if daily capture hasn't succeeded in 26+ hours
  - id: notify_hdd_capture_stale
    alias: "Notify HDD Capture Stale"
    description: "Alert if HDD capture hasn't succeeded recently"
    trigger:
      - platform: state
        entity_id: binary_sensor.hdd_capture_stale
        to: "on"
        for:
          hours: 2
    action:
      - service: persistent_notification.create
        data:
          title: "⚠️ HDD Capture Health Alert"
          message: >
            HDD capture has not succeeded in over 26 hours.
            Last successful: {{ states('input_datetime.hdd_capture_last_ok') }}

            Check:
            - sensor.hvac_hdd65_today state: {{ states('sensor.hvac_hdd65_today') }}
            - sensor.hvac_cdd65_today state: {{ states('sensor.hvac_cdd65_today') }}
            - sensor.hvac_outdoor_temp_hartford_proxy state: {{ states('sensor.hvac_outdoor_temp_hartford_proxy') }}
  # WATCHDOG: Runtime per HDD Capture Health Monitor
  - id: notify_runtime_per_hdd_capture_stale
    alias: "Notify Runtime/HDD Capture Stale"
    description: "Alert if runtime/HDD capture hasn't succeeded recently"
    trigger:
      - platform: state
        entity_id: binary_sensor.runtime_per_hdd_capture_stale
        to: "on"
        for:
          hours: 2
    action:
      - service: persistent_notification.create
        data:
          title: "⚠️ Runtime/HDD Capture Alert"
          message: >
            Runtime per HDD capture has not succeeded in over 26 hours.
            Last successful: {{ states('input_datetime.runtime_per_hdd_capture_last_ok') }}

            Check:
            - sensor.hvac_total_runtime_per_hdd_today: {{ states('sensor.hvac_total_runtime_per_hdd_today') }}
  # WATCHDOG: Furnace Cycle Capture Health Monitor
  - id: notify_furnace_cycle_capture_stale
    alias: "Notify Furnace Cycle Capture Stale"
    description: "Alert if furnace cycle capture hasn't succeeded recently"
    trigger:
      - platform: state
        entity_id: binary_sensor.furnace_cycle_capture_stale
        to: "on"
        for:
          hours: 2
      # 2026-10-10: the capture automation itself has not run in 25 h (90000 s,
      # the stale sensor's own age limit). Catches a disabled or dead capture
      # even when its last run was a skip and the stamp already reads 1970 -
      # the case the condition below would otherwise silence all summer.
      # Unknown or unparseable run stamp counts as not run: fail loud.
      - platform: template
        value_template: >
          {% set r = states('input_datetime.furnace_cycle_capture_last_run') | as_datetime %}
          {{ r is none or (now() - (r | as_local)).total_seconds() > 90000 }}
    # 2026-10-10 (Bill: bell only when it ran). The stale sensor reads on after
    # EVERY skip (1970 sentinel) - every no-heat day and all summer - and the
    # 09-14 review kept that display as honest. The bell is narrower: a real
    # stamp gone old (the capture stopped succeeding without skipping), or the
    # capture automation not running. A skip on a day the furnace ran belled
    # from the capture's own skip branch already.
    condition:
      - condition: template
        value_template: >
          {% set s = states('input_datetime.furnace_cycle_capture_last_ok') %}
          {% set r = states('input_datetime.furnace_cycle_capture_last_run') | as_datetime %}
          {{ s[:4] != '1970' or r is none or (now() - (r | as_local)).total_seconds() > 90000 }}
    action:
      - service: persistent_notification.create
        data:
          title: "⚠️ Furnace Cycle Capture Alert"
          message: >
            Furnace min/cycle capture has not succeeded in over 26 hours.
            Last successful: {{ states('input_datetime.furnace_cycle_capture_last_ok') }}

            Check:
            - sensor.hvac_furnace_min_per_cycle: {{ states('sensor.hvac_furnace_min_per_cycle') }}
            - sensor.hvac_furnace_cycles_today: {{ states('sensor.hvac_furnace_cycles_today') }}
            - capture automation last ran: {{ states('input_datetime.furnace_cycle_capture_last_run') }}
  # WATCHDOG: Monthly Report Capture Health Monitor
  - id: notify_monthly_report_stale
    alias: "Notify Monthly Report Stale"
    description: "Alert on day 2+ if monthly report wasn't captured for previous month"
    trigger:
      - platform: state
        entity_id: binary_sensor.monthly_report_stale
        to: "on"
        for:
          hours: 6
    action:
      - service: persistent_notification.create
        data:
          title: "⚠️ Monthly Report Missing"
          message: >
            Monthly HVAC report may not have been captured for the previous month.
            Last monthly capture: {{ states('input_datetime.monthly_tracking_capture_last_ok') }}

            Check reports/hvac_monthly.csv for the expected row.
            If missing, data must be manually reconstructed from daily CSV.
  # WEATHER SOURCE FAILOVER MONITOR
  # Alert if outdoor temp proxy becomes unavailable (all sources failed)
  - id: notify_weather_sources_down
    alias: "Notify All Weather Sources Down"
    description: "Alert if outdoor temp proxy is unavailable (all weather sources failed)"
    trigger:
      - platform: state
        entity_id: sensor.hvac_outdoor_temp_hartford_proxy
        to: "unavailable"
        for:
          minutes: 30
    action:
      - service: persistent_notification.create
        data:
          title: "⚠️ Weather Data Unavailable"
          message: >
            All weather sources have failed - outdoor temp proxy is unavailable.
            HDD/CDD calculations will be skipped until data returns.

            Source status:
            - Live API: {{ states('sensor.outdoor_temp_live') }}
            - Pirate Weather: {{ state_attr('weather.pirateweather', 'temperature') }}
            - NWS: {{ state_attr('weather.local_weather_2', 'temperature') }}
            - Open-Meteo: {{ state_attr('weather.home', 'temperature') }}

            Check integrations:
            - weather.pirateweather
            - weather.local_weather_2
            - sensor.outdoor_temp_live (Open-Meteo REST)
  # DATABASE SIZE MONITOR
  # Warn if database grows too large (indicates recording issue)
  # THERMOSTAT OFFLINE DETECTION
  - id: notify_thermostat_offline
    alias: "Notify Thermostat Offline"
    description: "Alert if either thermostat goes unavailable"
    trigger:
      - platform: state
        entity_id: climate.main_floor
        to: "unavailable"
        for:
          minutes: 15
        id: "1f"
      - platform: state
        entity_id: climate.upstairs
        to: "unavailable"
        for:
          minutes: 15
        id: "2f"
    action:
      - service: persistent_notification.create
        data:
          title: "⚠️ Thermostat Offline"
          message: >
            {{ trigger.id | upper }} thermostat has been unavailable for 15+ minutes.

            Entity: {{ trigger.entity_id }}
            Check WiFi connectivity and thermostat power.
  # backup_input_numbers_weekly REMOVED 2026-08-23. It backed up 54 of the 128
  # buffer entities every Sunday; automation.nightly_rolling_buffer_backup does all
  # 128 every night at 00:20 via scripts/spc_buffer_export.py, so this was a strict
  # subset running less often. CLAUDE.md's retirement criterion - "once the
  # manifest-driven backup has a few nights of history" - was met with three nights
  # (08-21..08-23, 570 rows in www/spc/buffer_backup_master.csv).
  # reports/input_number_backup.csv is kept as history and is NOT deleted.

  - id: rotate_setback_log_yearly
    alias: "Rotate Setback Log Yearly"
    description: "Archives previous year setback data and starts fresh log"
    trigger:
      - platform: time
        at: "00:05:00"
    condition:
      - condition: template
        value_template: "{{ now().month == 1 and now().day == 1 }}"
    action:
      # Guarded 2026-08-22 — same reasoning as csv_yearly_rotation, and this one
      # is the sharpest of the set: one shot a year at 00:05 on Jan 1.
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.ha_maintenance_mode
                state: "on"
            sequence:
              - service: system_log.write
                data:
                  level: warning
                  message: >
                    Setback log yearly rotation SKIPPED - ha_maintenance_mode is
                    on at 00:05 on Jan 1. It will NOT retry until next year. Run
                    shell_command.rotate_setback_log by hand once maintenance is
                    over, before the new year's rows accumulate.
        default:
          - service: shell_command.rotate_setback_log
          - service: system_log.write
            data:
              message: "Setback log rotated for new year"
              level: info
  # ===============================================================
  # AC MIN/CYCLE TRACKING - Daily capture at 11:55:30 PM
  # Mirrors capture_daily_furnace_min_per_cycle exactly.
  #   NO LONGER EXACTLY, 2026-10-10: the furnace gate is now >= 1 cycle and its
  #   skip branch bells when the furnace ran. This AC copy was left at >= 2 and
  #   silent on purpose - Bill's decision covered the furnace only.
  # Gate: requires >= 2 AC cycles (same as furnace gate) and
  #       value in valid range 0 < val <= 120 min/cycle.
  # Fires at 23:55:30 — after CDD capture (23:55:15),
  #   before runtime/HDD capture (23:56:00). No conflicts.
  # ===============================================================
  - id: capture_daily_ac_min_per_cycle
    alias: "Capture Daily AC Min/Cycle"
    description: "Records daily AC min/cycle for 7-day std dev calculation"
    mode: single
    trigger:
      - platform: time
        at: "23:55:30"
    action:
      - variables:
          capture_stamp: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {% set min_per_cycle = states('sensor.hvac_ac_min_per_cycle') %}
                  {% set ac_cycles = states('sensor.hvac_ac_cycles_today') %}
                  {% set val = min_per_cycle | float(-1) %}
                  {# Upstream validation: need at least 2 cycles for meaningful average #}
                  {% set cycles_ok = ac_cycles | int(0) >= 2 %}
                  {# Value validation: min/cycle must be in valid range #}
                  {% set values_ok = is_number(min_per_cycle) and 0 < val <= 120 %}
                  {{ cycles_ok and values_ok }}
            sequence:
              - variables:
                  todays_min_per_cycle: "{{ states('sensor.hvac_ac_min_per_cycle') | float(0) }}"
                  d1: "{{ states('input_number.ac_min_per_cycle_day_1') | float(0) }}"
                  d2: "{{ states('input_number.ac_min_per_cycle_day_2') | float(0) }}"
                  d3: "{{ states('input_number.ac_min_per_cycle_day_3') | float(0) }}"
                  d4: "{{ states('input_number.ac_min_per_cycle_day_4') | float(0) }}"
                  d5: "{{ states('input_number.ac_min_per_cycle_day_5') | float(0) }}"
                  d6: "{{ states('input_number.ac_min_per_cycle_day_6') | float(0) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.ac_min_per_cycle_day_7
                data:
                  value: "{{ d6 }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.ac_min_per_cycle_day_6
                data:
                  value: "{{ d5 }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.ac_min_per_cycle_day_5
                data:
                  value: "{{ d4 }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.ac_min_per_cycle_day_4
                data:
                  value: "{{ d3 }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.ac_min_per_cycle_day_3
                data:
                  value: "{{ d2 }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.ac_min_per_cycle_day_2
                data:
                  value: "{{ d1 }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.ac_min_per_cycle_day_1
                data:
                  value: "{{ todays_min_per_cycle }}"
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.ac_min_per_cycle_capture_last_ok
                data:
                  datetime: "{{ capture_stamp }}"
              - service: system_log.write
                data:
                  level: info
                  message: >
                    AC min/cycle captured: {{ todays_min_per_cycle }} min/cycle
                    ({{ states('sensor.hvac_ac_cycles_today') }} cycles today)
        default:
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.ac_min_per_cycle_capture_last_ok
            data:
              datetime: "1970-01-01 00:00:00"
          - service: system_log.write
            data:
              level: info
              message: >
                AC min/cycle capture skipped — Cycles={{ states('sensor.hvac_ac_cycles_today') }},
                Min_per_cycle={{ states('sensor.hvac_ac_min_per_cycle') }}
                (requires >= 2 cycles and 0 < val <= 120)

  # ===============================================================
  # DIY LiFePO4 UPS — BATTERY MONITORING & SHUTDOWN (v3 ESP32/INA260)
  # ===============================================================
  # Layered event-driven controller using ESPHome binary sensors.
  # Source device: ups-monitor (XIAO ESP32-C3 + INA260 + DS18B20)
  #
  # Hardware context:
  #   XIAO ESP32-C3 + INA260   — voltage/current/power/Ah telemetry (I2C)
  #   DS18B20                  — battery temperature (1-Wire)
  #   Victron BP-65            — hardware LVD at 11.80V (always active)
  #   ASRock N100DC-ITX        — executes software shutdown (was the HA Green;
  #                              migrated 2026-08, and fed from the 12 V bus via
  #                              the 18 V U3V70A boost since 2026-08-29)
  #
  # Binary sensor → automation map:
  #   ups_monitor_on_battery        ON  → Auto 1: outage start notify
  #   ups_monitor_voltage_warning   ON  → Auto 2: warning + runtime notify
  #                                            → Auto 3: graceful shutdown (secondary)
  #   ups_monitor_cliff_imminent          ON  → Auto 3: graceful shutdown (PRIMARY)
  #   ups_monitor_runtime_remaining_minutes < 8 → Auto 3: graceful shutdown (structural backup)
  #   ups_monitor_voltage_critical  ON  → Auto 4: hard fallback shutdown
  #   ups_monitor_on_battery        OFF → Auto 5: AC restored notify
  #
  # Protection layers:
  #   Layer A — ESPHome binary sensor: debounced in firmware, no raw ADC noise
  #   Layer B — mode: single prevents re-entry on threshold bounce
  #   Layer C — on_battery condition guards against false triggers at boot
  #   Layer D — 30s delay + revalidation before graceful shutdown command
  #   Hardware backstop: BP-65 cuts at 11.80V regardless of software state
  #
  # Validated phase durations — INA260 coulomb-counted, May 2026 outage test:
  #   Settling : ~5 min   (OCV relaxation, >13.00V)
  #   Plateau  : ~142 min (12.65–13.00V, bulk LFP discharge — flat curve)
  #   Knee     : ~49 min  (12.40–12.65V, accelerating decline)
  #   Cliff    : ~17 min  (< 12.40V, −30 to −58 mV/min)
  #   Total to LVD: ~213 min at 1.18A / 15.0W average (INA260 coulomb-counted, May 2026)
  #
  # SUPERSEDED 2026-08-29 — the 18 V boost put the N100DC host on the 12 V bus.
  # Measured load is now 2.089 A / 26.80 W steady, 2.533 A / 32.48 W peak
  # [M, n=156 5 s samples, 2026-08-29 23:46:30–23:59:30Z]. The durations above
  # scale by 0.60 [D: 53.3 Wh / 25.01 W outage mean]:
  #   Settling ~3 min · Plateau ~85 min · Knee ~29 min · Cliff ~10 min
  #   Total to LVD: ~128 min  (was ~213)
  # [D], NOT re-measured: the scaling does not model the extra IR sag at 2.09 A,
  # which crosses each threshold at a higher SoC. Only a deep discharge at the
  # new load closes it. sensor.ups_monitor_runtime_remaining_minutes divides by
  # LIVE current and needs no correction — these comments did.
  #
  # Shutdown timing — May 6 2026 outage validation (Rev 2):
  #   v3 graceful shutdown VALIDATED via cliff_imminent (slope-based) path, NOT voltage_critical.
  #   cliff_imminent fired at V=12.431V / 13:39:41 UTC; hassio.host_shutdown called at 13:40:11;
  #   last HA sample 13:40:17. voltage_critical (12.20V) not crossed until 13:48:07 — 8 min
  #   after HA was already down. Auto 4 was not exercised and remains as structural backstop.
  #   cliff_imminent at ~12.43V provided ~17 min to BP-65 LVD at the 1.18 A load —
  #   ~10 min [D] at the 2.089 A load since 2026-08-29. Still sufficient: the May
  #   test had the host down 6 s after the service call (13:40:11 → 13:40:17); the
  #   '~15 min HA shutdown' figure this line used to cite was a budget, not a
  #   measurement, and it never applied to the observed sequence.
  # ===============================================================
  # ===============================================================
  # AC OPERATING COST — daily EOD accumulation
  # Fires 23:59:45 (after dehumidifier cost 23:59:30, before 00:00 resets).
  # Locks today's AC cost at today's rate into the YTD accumulator.
  # ===============================================================
  - id: capture_daily_ac_cost
    alias: "Capture Daily AC Cost"
    mode: single
    trigger:
      - platform: time
        at: "23:59:45"
    action:
      - variables:
          capture_stamp: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          today_cost: "{{ states('sensor.hvac_ac_daily_cost') | float(0) }}"
          acc: "{{ states('input_number.ac_cost_year_acc') | float(0) }}"
      - service: input_number.set_value
        target: {entity_id: input_number.ac_cost_year_acc}
        data: {value: "{{ (acc + today_cost) | round(2) }}"}
      - service: input_datetime.set_datetime
        target: {entity_id: input_datetime.ac_cost_capture_last_ok}
        data: {datetime: "{{ capture_stamp }}"}
      - service: system_log.write
        data:
          level: info
          message: "AC cost captured: +${{ today_cost }} -> YTD ${{ (acc + today_cost) | round(2) }}"
  # ===============================================================
  # AC OPERATING COST — yearly reset (mirrors reset_yearly_dehumidifier_cost)
  # On Jan 1: snapshot season total to prev-year, then zero YTD. Scheduled +
  # startup catch-up so a reboot across midnight Jan 1 still resets exactly once.
  # ===============================================================
  - id: reset_yearly_ac_cost
    alias: "Reset Yearly AC Cost"
    description: "Snapshot prior-year AC cost then zero YTD on Jan 1, with startup catch-up"
    mode: single
    trigger:
      - platform: time
        at: "00:06:00"
        id: scheduled
      - platform: homeassistant
        event: start
        id: startup
    condition:
      - condition: template
        value_template: >
          {% set last_ok = states('input_datetime.ac_cost_capture_last_ok') %}
          {% set year_val = states('input_number.ac_cost_year_acc') | float(0) %}
          {% if not (now().month == 1 and now().day == 1) %}
            false
          {% elif year_val == 0 %}
            false
          {% elif now().hour < 3 %}
            true
          {% elif last_ok not in ['unknown', 'unavailable', '1970-01-01 00:00:00'] %}
            {% set last_capture = last_ok | as_datetime | as_local %}
            {{ last_capture.year != now().year }}
          {% else %}
            false
          {% endif %}
    action:
      - service: input_number.set_value
        target: {entity_id: input_number.ac_cost_prev_year}
        data: {value: "{{ states('input_number.ac_cost_year_acc') | float(0) | round(2) }}"}
      - service: input_number.set_value
        target: {entity_id: input_number.ac_cost_year_acc}
        data: {value: 0}
      - service: system_log.write
        data:
          level: info
          message: "AC cost yearly reset: prev-year snapshot taken, YTD zeroed (trigger: {{ trigger.id }})"
