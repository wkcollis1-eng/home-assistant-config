input_number:
  # === SYSTEM CONSTANTS ===
  furnace_heating_rate_btu_hr:
    name: Furnace Heating Rate (BTU/hr)
    min: 50000
    max: 100000
    step: 1
    unit_of_measurement: "BTU/hr"
    mode: box
    icon: mdi:fire

  building_ua_baseline:
    name: Building UA Baseline
    min: 300
    max: 600
    step: 1
    unit_of_measurement: "BTU/hr-°F"
    mode: box
    icon: mdi:home-thermometer
    # 2026-10-10 rebased to ACIS BDL 2025 (Bill). Was 493 = 599 CCF over NOAA
    # HDD59 5,294 (METHODOLOGY.md Feb 2026). Now the ua_12m formula on
    # 566.2 CCF (787 - Navien DHW 220.8), 3.6 MMBTU fireplace, BDL HDD59 4,230 [M].
    # 2026-10-15 (Bill: "4. yes rebase"): 585 -> 593. The 220.8 above is Navien
    # THERMS = 212.9 CCF [D: x 0.9643], so space heat is 574.1 CCF [D: 787 - 212.9].
    initial: 593

  balance_point_baseline:
    name: Balance Point Baseline
    min: 50
    max: 70
    step: 0.5
    unit_of_measurement: "°F"
    mode: box
    icon: mdi:thermometer-lines
    initial: 59

  hdd_balance_point_ratio:
    name: HDD Balance Point Ratio (HDD59/HDD65)
    min: 0.5
    max: 1.0
    step: 0.001
    mode: box
    icon: mdi:math-compass
    # 2026-10-10 rebased (Bill): ACIS BDL 2025 HDD59 4,230 / HDD65 5,629 [M,
    # 365 days]. Was 0.844 = NOAA HDD59 5,294 / 6,270, two different sources.
    initial: 0.751

  fireplace_annual_heat_mmbtu:
    name: Fireplace Annual Heat Contribution (MMBTU)
    min: 0
    max: 10
    step: 0.1
    unit_of_measurement: "MMBTU"
    mode: box
    icon: mdi:fireplace
    initial: 3.6

  heating_efficiency_baseline:
    name: Heating Efficiency Baseline (CCF/1k HDD)
    min: 50
    max: 150
    step: 0.1
    unit_of_measurement: "CCF/1k HDD"
    mode: box
    icon: mdi:chart-bell-curve
    # 2026-10-10 rebased (Bill): 566.2 CCF / ACIS BDL 2025 5,629 HDD65 [D].
    # Was 90.3 on 6,270 HDD, 641 above the BDL figure for the same year.
    # 2026-10-15 (Bill: "4. yes rebase"): 100.6 -> 102.0 [D: 574.1 CCF / 5.629];
    # 566.2 read the Navien 220.8 THERMS as CCF (212.9 CCF [D: x 0.9643]).
    initial: 102.0

  annual_hdd_baseline:
    name: Annual HDD Baseline
    min: 4000
    max: 8000
    step: 1
    unit_of_measurement: "HDD"
    mode: box
    icon: mdi:snowflake
    # 2026-10-10: ACIS BDL 2025 [M, 365 days, 0 missing] (Bill). Was 6,270.
    initial: 5629

