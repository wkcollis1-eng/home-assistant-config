template:
  - sensor:
      - name: "Projected Annual Electricity kWh"
        unique_id: projected_annual_electricity_kwh
        unit_of_measurement: "kWh"
        state: >
          {% set months = ['jan','feb','mar','apr','may','jun',
                           'jul','aug','sep','oct','nov','dec'] %}
          {% set baseline = states('input_number.annual_electricity_baseline') | float(6730) %}
          {% set ns = namespace(total=0, billed=0) %}
          {% for m in months %}
            {% set kwh = states('input_number.electric_archive_' ~ m ~ '_kwh') | float(0) %}
            {% if kwh > 0 %}
              {% set ns.total = ns.total + kwh %}
              {% set ns.billed = ns.billed + 1 %}
            {% endif %}
          {% endfor %}
          {% if ns.billed == 0 %}
            {# No archive data at all — return baseline #}
            {{ baseline | round(0) }}
          {% elif ns.billed == 12 %}
            {# All 12 months billed — straight sum of actuals #}
            {{ ns.total | round(0) }}
          {% else %}
            {# Mix of actual + prior-year proxy: all 12 archive slots sum naturally.
               Billed months hold this year's actuals. Unbilled months hold last year's
               same-month values. Sum of all 12 is the best available full-year estimate. #}
            {% set ns2 = namespace(full=0) %}
            {% for m in months %}
              {% set ns2.full = ns2.full + states('input_number.electric_archive_' ~ m ~ '_kwh') | float(baseline / 12) %}
            {% endfor %}
            {{ ns2.full | round(0) }}
          {% endif %}
      - name: "Electricity Effective Rate"
        unique_id: electricity_effective_rate
        unit_of_measurement: "$/kWh"
        state: >
          {% set amt = states('input_number.electricity_bill_amount') | float(0) %}
          {% set kwh = states('input_number.electricity_bill_kwh') | float(1) %}
          {{ (amt / kwh) | round(4) if amt > 0 and kwh > 0 else 0.2733 }}
      - name: "Electricity Effective Rate Previous"
        unique_id: electricity_effective_rate_previous
        unit_of_measurement: "$/kWh"
        state: >
          {% set amt = states('input_number.electricity_bill_amount_previous') | float(0) %}
          {% set kwh = states('input_number.electricity_bill_kwh_previous') | float(1) %}
          {{ (amt / kwh) | round(4) if amt > 0 and kwh > 0 else 0.2722 }}
      - name: "Electricity Effective Rate Last Year"
        unique_id: electricity_effective_rate_last_year
        unit_of_measurement: "$/kWh"
        state: >
          {% set amt = states('input_number.electricity_bill_amount_last_year') | float(0) %}
          {% set kwh = states('input_number.electricity_bill_kwh_last_year') | float(1) %}
          {{ (amt / kwh) | round(4) if amt > 0 and kwh > 0 else 0.3152 }}
      - name: "Electricity Rate Change MoM"
        unique_id: electricity_rate_change_mom
        unit_of_measurement: "%"
        state: >
          {% set cur = states('sensor.electricity_effective_rate') | float(0) %}
          {% set prev = states('sensor.electricity_effective_rate_previous') | float(0) %}
          {{ ((cur / prev - 1) * 100) | round(1) if prev > 0 and cur > 0 else 0 }}
      - name: "Electricity Usage Change MoM"
        unique_id: electricity_usage_change_mom
        unit_of_measurement: "%"
        state: >
          {% set cur = states('input_number.electricity_bill_kwh') | float(0) %}
          {% set prev = states('input_number.electricity_bill_kwh_previous') | float(0) %}
          {{ ((cur / prev - 1) * 100) | round(1) if prev > 0 and cur > 0 else 0 }}
      - name: "Electricity Bill Change MoM"
        unique_id: electricity_bill_change_mom
        unit_of_measurement: "%"
        state: >
          {% set cur = states('input_number.electricity_bill_amount') | float(0) %}
          {% set prev = states('input_number.electricity_bill_amount_previous') | float(0) %}
          {{ ((cur / prev - 1) * 100) | round(1) if prev > 0 and cur > 0 else 0 }}
      - name: "Electricity Rate Change YoY"
        unique_id: electricity_rate_change_yoy
        unit_of_measurement: "%"
        state: >
          {% set cur = states('sensor.electricity_effective_rate') | float(0) %}
          {% set ly = states('sensor.electricity_effective_rate_last_year') | float(0) %}
          {{ ((cur / ly - 1) * 100) | round(1) if ly > 0 and cur > 0 else 0 }}
      - name: "Electricity Usage Change YoY"
        unique_id: electricity_usage_change_yoy
        unit_of_measurement: "%"
        state: >
          {% set cur = states('input_number.electricity_bill_kwh') | float(0) %}
          {% set ly = states('input_number.electricity_bill_kwh_last_year') | float(0) %}
          {{ ((cur / ly - 1) * 100) | round(1) if ly > 0 and cur > 0 else 0 }}
      - name: "Electricity Bill Change YoY"
        unique_id: electricity_bill_change_yoy
        unit_of_measurement: "%"
        state: >
          {% set cur = states('input_number.electricity_bill_amount') | float(0) %}
          {% set ly = states('input_number.electricity_bill_amount_last_year') | float(0) %}
          {{ ((cur / ly - 1) * 100) | round(1) if ly > 0 and cur > 0 else 0 }}
      - name: "Total Cost Month"
        unique_id: total_cost_month
        unit_of_measurement: "$"
        state: >
          {% set amt = states('input_number.electricity_bill_amount') | float(124) %}
          {% set days = states('input_number.electricity_bill_days') | float(30) %}
          {{ ((amt / days) * now().day) | round(2) if days > 0 else 0 }}
      - name: "Total Utility Cost Month"
        unique_id: total_utility_cost_month
        unit_of_measurement: "$"
        state: >
          {% set electric = states('input_number.electricity_bill_amount') | float(0) %}
          {% set gas = states('input_number.gas_bill_amount') | float(0) %}
          {{ (electric + gas) | round(2) }}

automation:
  # ===============================================================
  # BILL SAVE AUTOMATIONS
  # ===============================================================
  - id: save_electric_bill_button
    alias: "Save Electric Bill - Button Press"
    trigger:
      - platform: state
        entity_id: input_button.save_electric_bill
    action:
      - variables:
          bill_month: >
            {% set dt = states('input_datetime.electricity_bill_date') %}
            {{ (dt | as_datetime).month if dt not in ['unknown', 'unavailable', 'none'] else now().month }}
          current_amount: "{{ states('input_number.electricity_bill_amount') | float(0) }}"
          current_kwh: "{{ states('input_number.electricity_bill_kwh') | float(0) }}"
          current_days: "{{ states('input_number.electricity_bill_days') | float(0) }}"
          month_name: >
            {% set months = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'] %}
            {{ months[(bill_month | int(0)) - 1] }}
          prev_month_name: >
            {% set prev_map = {1: 'dec', 2: 'jan', 3: 'feb', 4: 'mar', 5: 'apr', 6: 'may', 7: 'jun', 8: 'jul', 9: 'aug', 10: 'sep', 11: 'oct', 12: 'nov'} %}
            {{ prev_map[bill_month] }}
      - service: input_number.set_value
        target:
          entity_id: input_number.electricity_bill_amount_previous
        data:
          value: "{{ states('input_number.electric_archive_' ~ (prev_month_name | trim) ~ '_amount') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.electricity_bill_kwh_previous
        data:
          value: "{{ states('input_number.electric_archive_' ~ (prev_month_name | trim) ~ '_kwh') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.electricity_bill_days_previous
        data:
          value: 30
      - service: input_number.set_value
        target:
          entity_id: input_number.electricity_bill_amount_last_year
        data:
          value: >
            {% set archive_val = states('input_number.electric_archive_' ~ (month_name | trim) ~ '_amount') | float(0) %}
            {{ archive_val if archive_val != current_amount else states('input_number.electricity_bill_amount_last_year') | float(0) }}
      - service: input_number.set_value
        target:
          entity_id: input_number.electricity_bill_kwh_last_year
        data:
          value: >
            {% set archive_val = states('input_number.electric_archive_' ~ (month_name | trim) ~ '_kwh') | float(0) %}
            {{ archive_val if archive_val != current_kwh else states('input_number.electricity_bill_kwh_last_year') | float(0) }}
      # Prior-year roll (2026-09-22; see packages/billing_overview.yaml). The
      # slot overwritten below may hold this statement month from an EARLIER
      # year: move that value to _ly_ first and stamp the slot with this bill's
      # year. A repeat press or a corrected re-save finds the stamp already equal
      # to this year and does not roll, so this year never lands in _ly_. A slot
      # more than one year old rolls in as 0 (YTD reports it missing). An
      # unreadable stamp list skips the roll and says so.
      - variables:
          roll_year: >
            {% set dt = states('input_datetime.electricity_bill_date') %}
            {{ (dt | as_datetime).year if dt not in ['unknown', 'unavailable', 'none'] else now().year }}
          roll_years: "{{ states('input_text.electric_archive_years').split(',') }}"
          roll_i: "{{ (bill_month | int(0)) - 1 }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ roll_years | count == 12 and roll_years[roll_i] != (roll_year | string) }}"
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: "input_number.electric_archive_ly_{{ month_name | trim }}_amount"
                data:
                  value: >
                    {{ states('input_number.electric_archive_' ~ (month_name | trim) ~ '_amount') | float(0)
                       if roll_years[roll_i] == ((roll_year | int(0)) - 1) | string else 0 }}
              - service: input_number.set_value
                target:
                  entity_id: "input_number.electric_archive_ly_{{ month_name | trim }}_kwh"
                data:
                  value: >
                    {{ states('input_number.electric_archive_' ~ (month_name | trim) ~ '_kwh') | float(0)
                       if roll_years[roll_i] == ((roll_year | int(0)) - 1) | string else 0 }}
              - service: input_text.set_value
                target:
                  entity_id: input_text.electric_archive_years
                data:
                  value: "{{ (roll_years[:roll_i] + [roll_year | string] + roll_years[roll_i + 1:]) | join(',') }}"
          - conditions:
              - condition: template
                value_template: "{{ roll_years | count != 12 }}"
            sequence:
              - service: persistent_notification.create
                data:
                  title: "Electric prior-year roll skipped"
                  message: >
                    input_text.electric_archive_years is not a 12-entry year list
                    ({{ states('input_text.electric_archive_years') }}), so the
                    {{ (month_name | trim) | upper }} slot was overwritten
                    without moving last year's value to _ly_. Last-year-to-date
                    on Cost Overview is wrong for that month until it is fixed.
        default: []
      - service: input_number.set_value
        target:
          entity_id: "input_number.electric_archive_{{ month_name | trim }}_amount"
        data:
          value: "{{ current_amount }}"
      - service: input_number.set_value
        target:
          entity_id: "input_number.electric_archive_{{ month_name | trim }}_kwh"
        data:
          value: "{{ current_kwh }}"
      - service: persistent_notification.create
        data:
          title: "✅ Electric Bill Saved"
          message: "{{ (month_name | trim) | upper }}: ${{ current_amount }}, {{ current_kwh }} kWh archived"
