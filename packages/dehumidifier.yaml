# pkg_move: packages/dehumidifier.yaml, created 2026-10-19 by pkg_move.py from manifest dehumidifier.txt.
# pkg_move: every item below was moved verbatim, comments included, from
# pkg_move: configuration.yaml / automations.yaml; config_equiv.py proved the loaded config unchanged.

counter:
  dehumidifier_cycles_today:
    name: "Dehumidifier Cycles Today"
    initial: 0
    step: 1
    icon: mdi:counter

input_boolean:
  # === LOCAL (UNIT) CONTROL - COMMISSIONING MODE (2026-08-03) ===
  # ON  = the E080 runs on its OWN onboard humidistat. HA, the ESP32-C3
  #       node and the SHT45 are MONITORING ONLY. HA will hold the plug
  #       powered and will not switch it off for any reason.
  # OFF = normal HA control (RH band + envelope guards).
  #
  # This exists because the commissioning question - "what does this
  # machine do on its own?" - cannot be answered while a controller is
  # sitting on top of it. It is also the only clean way to capture the
  # native power trace needed to retune dehumidifier_power_threshold,
  # which is currently 250 W and tuned to a machine that no longer
  # exists.
  #
  # WHAT THIS TURNS OFF, explicitly, so it is never a surprise:
  #   dehumidifier_auto_on              - RH band start
  #   dehumidifier_auto_off             - RH band stop + condensation veto
  #   dehumidifier_force_on_backstop    - mold ceiling + condensation limb
  #   dehumidifier_max_runtime_backstop - runtime cap
  #   dehumidifier_rh_stall_shutdown    - DP stall cut-out
  #   dehumidifier_sensor_loss_shutdown - dead-sensor cut-out
  #
  # That is EVERY HA-side stop. Accepted for a supervised commissioning
  # window and not beyond it, which is why there is a nagging reminder.
  # The residual protection is real but is all inside the E080: its own
  # humidistat (~50 % RH, below the 60 % mold ceiling), its suction-line
  # frost sensor, and its E4 insufficient-capacity diagnostic. Note that
  # a latched E4 clears only on a power cycle and is invisible to HA.
  dehumidifier_local_control:
    name: "Dehumidifier Local (Unit) Control"
    icon: mdi:tune-vertical

input_number:
  # ===============================================================
  # DEHUMIDIFIER CONTROL (Aprilaire E080 since 2026-08-05; was Santa Fe Classic)
  # ===============================================================
  dehumidifier_dewpoint_threshold:
    name: "Dehumidifier Dew Point Threshold"
    min: 40
    max: 70
    step: 1
    unit_of_measurement: "°F"
    mode: box
    icon: mdi:water-thermometer
  # --- RH-band control (dehumidifier redesign) — field-tunable, no YAML edits ---
  dehumidifier_rh_on_threshold:
    name: "Dehumidifier RH On Threshold"
    min: 40
    max: 65
    step: 0.5
    unit_of_measurement: "%"
    mode: box
    icon: mdi:water-percent
  # max raised 55 -> 65 (2026-07-29). The SHT45 reads ~9 points higher than
  # the Shelly it replaced, so any band expressed in the old sensor's numbers
  # needs headroom above 55 to be reachable at all from the dashboard.
  dehumidifier_rh_off_threshold:
    name: "Dehumidifier RH Off Threshold"
    min: 35
    max: 65
    step: 0.5
    unit_of_measurement: "%"
    mode: box
    icon: mdi:water-percent
  # Absolute cap on the recommended DP target, independent of temperature.
  # The mold limit alone would allow DP to drift up in a warm basement; this
  # is the ceiling beyond which the target should not go regardless.
  # min lowered to 45 with the same widening pass, so the cap can also be used
  # as a manual override to force a lower target than temperature alone implies.
  basement_dp_target_cap:
    name: "Basement DP Target Cap"
    min: 45
    max: 62
    step: 0.5
    unit_of_measurement: "°F"
    mode: box
    icon: mdi:arrow-collapse-down
  # === DEW-POINT BAND — PRIMARY CONTROL 2026-07-30 to 2026-08-03; DORMANT since ===
  # DORMANT (verified 2026-09-23). The controlled variable went back to RH on
  # 2026-08-03 - see the note on dehumidifier_should_run, which also explains
  # why the rationale below was a Santa Fe artefact (a frosted coil that
  # heated the room). Nothing in YAML reads dp_on / dp_off any more: their
  # only reference is a row on the dehumidifier dashboard. Both hold 54.0
  # live [M, /api/states 2026-09-23] - a zero-width band, harmless only while
  # dormant. Set a real band (dp_off < dp_on) BEFORE any return to dew-point
  # control. dp_stall_threshold below is NOT dormant:
  # dehumidifier_rh_stall_shutdown reads it.
  #
  # Replaces the RH band as the controlled variable. Rationale from 12 h of
  # logged data: over that window indoor absolute humidity moved 0.17 g/m3
  # and dew point 0.55 degF, while RH swung 2.66 points. r(RH, temperature)
  # = -0.943; r(RH, absolute humidity) = +0.008. RH in this basement is a
  # thermometer. Worse, the compressor's own condenser heat raises the
  # temperature, which lowers RH, which is what an RH controller sees as
  # success - a closed loop that rewards the unit for heating the room.
  # Measured cost of that loop: 4.18 kWh to move 31 g of water.
  #
  # RANGE WIDENED 2026-07-30 (second pass). These first shipped with min set
  # equal to the intended value, so that a freshly created input_number - which
  # HA instantiates at its `min` - would come up already correct. That was the
  # right guard for a brand-new entity but the wrong permanent range: it made
  # the setpoint untunable downward, and 55 cannot express winter at all. The
  # mold-limited DP tracks air temperature at about T - 14.2 degF, so a 60 degF
  # basement needs a target near 44.6.
  #
  # Widening is safe NOW because the values already exist in .storage; lowering
  # a min never disturbs a stored value that is above it. The uninitialised-
  # at-min hazard only returns if these entities are ever deleted and recreated
  # - if that happens, set them BEFORE restarting.
  #
  # And the runaway that min was guarding against is bounded elsewhere anyway:
  # an implausibly low dp_on cannot run the compressor forever because
  # dehumidifier_max_runtime and the DP stall detector both stop the cycle.
  # That is the real protection; min was never load-bearing for it.
  dehumidifier_dp_on_threshold:
    name: "Dehumidifier DP On Threshold"
    min: 40
    max: 65
    step: 0.5
    unit_of_measurement: "°F"
    mode: box
    icon: mdi:water-thermometer
  # Same widening. min 39 keeps dp_off strictly below dp_on's new floor of 40,
  # so the band stays orderable across the whole range.
  dehumidifier_dp_off_threshold:
    name: "Dehumidifier DP Off Threshold"
    min: 39
    max: 64
    step: 0.5
    unit_of_measurement: "°F"
    mode: box
    icon: mdi:water-thermometer
  # Stall threshold in degF/hr of dew-point improvement. 0.15 is the DP
  # equivalent of the old 0.30 %/hr RH threshold: near 70 degF the local
  # slope is about 0.47 degF of dew point per point of RH, so
  # 0.30 x 0.47 = 0.14. min is 0.05 so an uninitialised value fires the
  # stall LESS often, never more - a wasted cycle beats a killed one.
  dehumidifier_dp_stall_threshold:
    name: "Dehumidifier DP Stall Threshold"
    min: 0.05
    max: 1.0
    step: 0.05
    unit_of_measurement: "°F/h"
    mode: box
    icon: mdi:fan-alert
  # RH ceiling retargeted 2026-07-30 (band moved 49/46 -> 55/52), then
  # PROMOTED TO BACKSTOP when control moved to dew point.
  #
  # This is not vestigial and must not be removed. A fixed dew-point
  # setpoint does NOT hold a fixed RH across temperature: DP 55 degF is
  # 59 % RH at 70 degF but 78 % RH at 62 degF. On a cooling basement,
  # dew-point control alone would walk straight through the mold limit
  # without the controlled variable moving at all. This ceiling is the
  # only thing watching that.
  # The old ~50 % value was set on the assumption that bare copper was the
  # binding constraint. It is not. Clean copper's critical RH is ~70-80 %,
  # and the mold limit on basement organics binds first at ~60 % air RH
  # (80 % surface RH over a 5 degF-colder surface). So this is a MOLD
  # ceiling, not a corrosion ceiling, and 60 is the value to set.
  #
  # min deliberately left at 45 rather than raised to 55: the stored value
  # lives in .storage, and raising min above the current stored value on a
  # restart risks HA clamping or erroring on load. Set the value from the
  # dashboard FIRST, then tighten min in a later pass if desired.
  # Constraint to respect when setting it: force_on >= rh_on, or the
  # override fires continuously and defeats the band.
  #
  # WHAT 60 ACTUALLY IS (clarified 2026-08-07). It is NOT a mold threshold.
  # ASHRAE 160 sec 6.1 states the criterion as a 30-DAY RUNNING AVERAGE
  # SURFACE RH below 80 % (Addendum e replaces that with the VTT mold index,
  # limit M < 3). Three differences from this entity: surface not air, 80 not
  # 60, and a 30-day mean not an instantaneous reading. Below the critical RH
  # the accumulated dose is ZERO, not small, so brief excursions add nothing.
  # Measured margin here: bus-bar surface RH is 55.8 % at the 55/51 band and
  # 56.8 % at 55.5/52 (bar runs 0.95 degF below air, so it sits in the ALCOVE
  # air, i.e. the node reading - not the machine-end air). Any surface would
  # have to sit 9+ degF below air to reach 80 %. That is ~23 points of margin.
  # Corrosion points the same way: the literature puts continuous adsorbed
  # electrolyte films at roughly 65-100 % RH with 80 % as the wetting
  # threshold on CLEAN metal. The real bus-bar risk is hygroscopic
  # contamination (dust, salts, sulfur), which deliquesces far below 80 % -
  # a housekeeping and enclosure issue, not a setpoint.
  #
  # SO WHY LEAVE IT AT 60? Because with rh_on at 55.5 the band already engages
  # at 55.5, and the node can only REACH 60 if control has failed - plug
  # fault, local-control mode, sensor loss, or the unit unable to keep up.
  # 60 is therefore already the "something broke" level, and forcing on there
  # (bypassing min_off) is the correct response. Do not raise it to 65 for
  # consistency with the mold argument; it is not doing mold duty.
  dehumidifier_rh_force_on:
    name: "Dehumidifier RH Force-On (mold ceiling)"
    min: 45
    max: 65
    step: 0.5
    unit_of_measurement: "%"
    mode: box
    icon: mdi:shield-alert
  # --- Condensation guard (added 2026-07-30) ---
  # Neither the RH band nor the mold ceiling is the bus bars' real failure
  # mode. Steady-state RH at these levels produces self-limiting Cu2O and
  # nothing else. The ONE mechanism that can actually wet bare copper is a
  # dew event, which is a step change, not a rate: it deposits liquid water
  # AND dissolves whatever is on the surface into a working electrolyte.
  # So condensation gets an explicit guard that outranks the RH band.
  #
  # MANUAL OVERRIDE ONLY as of 2026-07-30. The guard's normal reference is
  # the live sensor.battery_bank_monitor_battery_pack_temperature. Use this
  # only if IR measurement finds something COLDER than the pack - the slab
  # under the rack, the nearest below-grade wall, or a cold-water line
  # overhead. The guard then uses the lower of the two.
  #
  # Leave at 35 (the minimum) to disable the override: 35 fails the
  # plausibility gate in sensor.basement_condensation_margin and drops out.
  basement_coldest_surface_temp:
    name: "Colder Surface Override (35 = off)"
    min: 35
    max: 75
    step: 0.5
    unit_of_measurement: "°F"
    mode: box
    icon: mdi:snowflake-thermometer
  # Required dew-point depression below that coldest surface. 8 degF is the
  # working default: enough to absorb sensor error, stratification between
  # the node and the rack, and the lag between 10 s samples and a real
  # surface temperature swing. 5 is an absolute floor, not a target.
  basement_dp_margin_min:
    name: "Basement Min Dew Point Margin"
    min: 3
    max: 20
    step: 0.5
    unit_of_measurement: "°F"
    mode: box
    icon: mdi:arrow-expand-vertical
  dehumidifier_min_off_minutes:
    name: "Dehumidifier Minimum Off Minutes"
    min: 0
    max: 120
    step: 5
    unit_of_measurement: "min"
    mode: box
    icon: mdi:timer-off
  # How long local control may stay on before HA starts nagging. The
  # commissioning plan is 24 h on the internal humidistat, so 36 gives a
  # margin without letting it be forgotten for a season.
  #
  # min IS 1, and that is the safe uninitialised value: a fresh entity
  # comes up at its min, so an unset limit makes the reminder fire EARLY,
  # never late. A reminder that fails towards nagging is the correct
  # failure direction for a mode that disables every safety stop.
  dehumidifier_local_control_max_hours:
    name: "Dehumidifier Local Control Max Hours"
    min: 1
    max: 168
    step: 1
    unit_of_measurement: "h"
    mode: box
    icon: mdi:clock-alert
  # --- MIN RUN TIME (new 2026-08-03) ---
  # Companion to dehumidifier_min_off_minutes. min_off protects the
  # compressor from restarting against unequalised head pressure;
  # min_run protects against the opposite failure - a cycle so short
  # that the coil never reaches condensing temperature, so the unit
  # draws full power and removes no water. On the Santa Fe that failure
  # mode was invisible because it never removed water anyway.
  #
  # SCOPE - deliberately narrow. min_run gates ONLY the
  # `conditions_cleared` stop in dehumidifier_auto_off. It does NOT gate
  # dehumidifier_max_runtime_backstop, dehumidifier_rh_stall_shutdown,
  # or dehumidifier_sensor_loss_shutdown. Those three must always be
  # able to stop the unit; an efficiency guard that can override a
  # safety stop is a defect, not a feature.
  #
  # min IS 0, NOT 30. A freshly created input_number instantiates at its
  # `min`, and this config's own 2026-07-30 lesson is that min = intended
  # is right only for a brand-new entity and wrong as a permanent range.
  # Here the safe direction is unambiguous: at 0 the guard is inert and
  # behaviour is identical to before, with min_off still doing the
  # anti-short-cycle work. So 0 is both the safe uninitialised value AND
  # a usable permanent floor. SET TO 30 FROM THE DASHBOARD AFTER RESTART.
  #
  # UPPER BOUND SANITY: min_run must stay well below
  # max_runtime_hours * 60. At min_run >= max_runtime the two guards
  # fight and every cycle ends on the backstop. 120 leaves headroom but
  # does not enforce it - nothing in HA can, so check it by hand if you
  # raise either one.
  dehumidifier_min_run_minutes:
    name: "Dehumidifier Minimum Run Minutes"
    min: 0
    max: 120
    step: 5
    unit_of_measurement: "min"
    mode: box
    icon: mdi:timer-play
  dehumidifier_max_runtime_hours:
    name: "Dehumidifier Max Runtime"
    min: 1
    max: 24
    step: 0.5
    unit_of_measurement: "h"
    mode: box
    icon: mdi:timer-alert
  dehumidifier_min_temp:
    name: "Dehumidifier Minimum Run Temp"
    min: 56
    max: 70
    step: 1
    unit_of_measurement: "°F"
    mode: box
    icon: mdi:thermometer-low
  # Compressor gate threshold — Santa Fe Classic: fan ~50-120W, compressor ~500-600W
  # Initial value 250W sits cleanly between bands; tune after observing real power curves
  # The two lines above describe the retired Santa Fe. Aprilaire E080
  # (2026-09-23): compressor 465.8 +/- 6.5 W steady [M, n=340 runs,
  # 2026-08-07..09-22, minutes 10-14], fan-only ~57.8 W [M, CHANGELOG
  # 2026-08-24 entry]. The live gate is 150 W [M, /api/states 2026-09-23],
  # between the two.
  dehumidifier_power_threshold:
    name: "Dehumidifier Power Threshold"
    min: 50
    max: 600
    step: 10
    unit_of_measurement: "W"
    mode: box
    icon: mdi:power-plug
  # --- Dehumidifier Performance Tracking ---
  dehumidifier_cycle_start_dp:
    name: "Dehumidifier Cycle Start Dew Point"
    min: 20
    max: 90
    step: 0.1
    unit_of_measurement: "°F"
    mode: box
    icon: mdi:water-thermometer
  dehumidifier_last_pull_down_rate:
    name: "Dehumidifier Last Pull-Down Rate"
    min: -10
    max: 20
    step: 0.1
    unit_of_measurement: "°F/h"
    mode: box
    icon: mdi:arrow-down-bold
  dehumidifier_last_cycle_minutes:
    name: "Dehumidifier Last Cycle Minutes"
    min: 0
    max: 300
    step: 1
    unit_of_measurement: "min"
    mode: box
    icon: mdi:timer
  dehumidifier_last_hold_hours:
    name: "Dehumidifier Last Hold Hours"
    min: 0
    max: 72
    step: 0.1
    unit_of_measurement: "h"
    mode: box
    icon: mdi:timer-sand
  # --- daily duty% / kWh rolling buffers (test/optimization tracking) ---
  dehumidifier_duty_day_1:
    name: "Dehum Duty Day 1 (Yesterday)"
    min: 0
    max: 100
    step: 0.1
    mode: box
    unit_of_measurement: "%"
  dehumidifier_duty_day_2:
    name: "Dehum Duty Day 2"
    min: 0
    max: 100
    step: 0.1
    mode: box
    unit_of_measurement: "%"
  dehumidifier_duty_day_3:
    name: "Dehum Duty Day 3"
    min: 0
    max: 100
    step: 0.1
    mode: box
    unit_of_measurement: "%"
  dehumidifier_duty_day_4:
    name: "Dehum Duty Day 4"
    min: 0
    max: 100
    step: 0.1
    mode: box
    unit_of_measurement: "%"
  dehumidifier_duty_day_5:
    name: "Dehum Duty Day 5"
    min: 0
    max: 100
    step: 0.1
    mode: box
    unit_of_measurement: "%"
  dehumidifier_duty_day_6:
    name: "Dehum Duty Day 6"
    min: 0
    max: 100
    step: 0.1
    mode: box
    unit_of_measurement: "%"
  dehumidifier_duty_day_7:
    name: "Dehum Duty Day 7 (Oldest)"
    min: 0
    max: 100
    step: 0.1
    mode: box
    unit_of_measurement: "%"
  dehumidifier_kwh_day_1:
    name: "Dehum kWh Day 1 (Yesterday)"
    min: 0
    max: 20
    step: 0.001
    mode: box
    unit_of_measurement: "kWh"
  dehumidifier_kwh_day_2:
    name: "Dehum kWh Day 2"
    min: 0
    max: 20
    step: 0.001
    mode: box
    unit_of_measurement: "kWh"
  dehumidifier_kwh_day_3:
    name: "Dehum kWh Day 3"
    min: 0
    max: 20
    step: 0.001
    mode: box
    unit_of_measurement: "kWh"
  dehumidifier_kwh_day_4:
    name: "Dehum kWh Day 4"
    min: 0
    max: 20
    step: 0.001
    mode: box
    unit_of_measurement: "kWh"
  dehumidifier_kwh_day_5:
    name: "Dehum kWh Day 5"
    min: 0
    max: 20
    step: 0.001
    mode: box
    unit_of_measurement: "kWh"
  dehumidifier_kwh_day_6:
    name: "Dehum kWh Day 6"
    min: 0
    max: 20
    step: 0.001
    mode: box
    unit_of_measurement: "kWh"
  dehumidifier_kwh_day_7:
    name: "Dehum kWh Day 7 (Oldest)"
    min: 0
    max: 20
    step: 0.001
    mode: box
    unit_of_measurement: "kWh"
  # --- Dehumidifier Operating Cost: yearly accumulator + prior-year snapshot ---
  dehumidifier_cost_year_acc:
    name: "Dehumidifier Cost Year Accumulated"
    min: 0
    max: 2000
    step: 0.01
    mode: box
    unit_of_measurement: "$"
    icon: mdi:cash
  dehumidifier_cost_prev_year:
    name: "Dehumidifier Cost Previous Year"
    min: 0
    max: 2000
    step: 0.01
    mode: box
    unit_of_measurement: "$"
    icon: mdi:cash-clock
  # ===============================================================
  # BASEMENT TH NODE - display tuning (HA is the source of truth)
  # ===============================================================
  # basement-th-node.yaml imports these three via `platform: homeassistant`
  # and mirrors each into a restore_value global so the node keeps the last
  # known value through a WiFi/HA outage. They did NOT previously exist in
  # HA, so every import silently no-op'd and the node has been running on
  # its firmware NVS defaults (12 lx / 3 min / 30 %).
  #
  # No `initial:` on purpose - `initial` re-forces the value on every HA
  # restart and would defeat field tuning. Without it, a never-before-set
  # input_number lands on `min`, so each `min` below is chosen to be a SAFE
  # first-load value rather than the widest legal one:
  #   lux_wake  min 2   - firmware accept guard is x > 0; 2 lx wakes readily
  #                       and the self-glow latch breaker covers the rest
  #   blank_min min 2   - firmware accept guard is x >= 1
  #   contrast  min 20  - firmware accept guard is 5..100, but its own note
  #                       says <= 15 % may clamp dark on some SSD1306 stacks
  basement_display_lux_wake:
    name: "Basement Display Lux Wake"
    min: 2
    max: 200
    step: 0.5
    unit_of_measurement: "lx"
    mode: box
    icon: mdi:brightness-6
  basement_display_blank_min:
    name: "Basement Display Blank Delay"
    min: 2
    max: 30
    step: 1
    unit_of_measurement: "min"
    mode: box
    icon: mdi:timer-sand
  basement_display_contrast_pct:
    name: "Basement Display Contrast"
    min: 20
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: box
    icon: mdi:contrast-circle
  # Tolerance for the SHT45-vs-Shelly cross-check flag. Deliberately set
  # wide enough that it is a DRIFT detector, not a restatement of the
  # currently-open ~9 %RH disagreement. Tighten it after that is resolved.
  basement_rh_delta_tolerance:
    name: "Basement RH Cross-Check Tolerance"
    min: 0.5
    max: 15
    step: 0.5
    unit_of_measurement: "%"
    mode: box
    icon: mdi:approximate-equal

# ===============================================================
# INPUT SELECT
# ===============================================================
input_select:
  dehumidifier_last_stop_reason:
    name: "Dehumidifier Last Stop Reason"
    options:
      - conditions_cleared
      - max_runtime
      - rh_stall
      # dp_stall added 2026-07-30 with the DP-control conversion. rh_stall
      # is retained rather than renamed so historical states stay readable.
      - dp_stall
      - sensor_loss
      # Not a stop reason in the usual sense - it marks that HA has
      # handed the unit to its own humidistat, so the badge stops
      # reporting a stale HA stop that no longer describes anything.
      - local_control
      - unknown
    # NO `initial:`. 2026-08-24: this carried `initial: unknown`, and an
    # input_select with `initial:` does not restore - HA forces that value at
    # every start. The last stop reason was therefore erased by every restart,
    # which is the one moment you most want to know why the unit stopped.
    # `unknown` stays in options as the restore target for a fresh deploy.
    icon: mdi:information-outline

input_datetime:
  # Companion to dehumidifier_last_off_time: stamped on every switch ON.
  # Basis for the dip-proof, restart-proof max-runtime backstop (the 240-min
  # 'for:' trigger resets on any >10 s compressor-power dip, e.g. defrost).
  dehumidifier_last_on_time:
    name: "Dehumidifier Last On Time"
    has_date: true
    has_time: true
    icon: mdi:clock-start
  # --- Dehumidifier Performance Tracking ---
  dehumidifier_cycle_start_time:
    name: "Dehumidifier Cycle Start Time"
    has_date: true
    has_time: true
    icon: mdi:clock-start
  dehumidifier_last_cycle_end_time:
    name: "Dehumidifier Last Cycle End Time"
    has_date: true
    has_time: true
    icon: mdi:clock-end
  dehumidifier_last_off_time:
    name: "Dehumidifier Last Off Time"
    has_date: true
    has_time: true
    icon: mdi:timer-off-outline
  # Entry stamp for local-control mode. An input_datetime rather than the
  # boolean's last_changed, which resets to unknown on every HA restart -
  # that would make the "you left it on" reminder fail silently at exactly
  # the moment it matters (an unattended box that rebooted overnight).
  dehumidifier_local_control_since:
    name: "Dehumidifier Local Control Since"
    has_date: true
    has_time: true
    icon: mdi:clock-start
  dehumidifier_cost_capture_last_ok:
    name: "Dehumidifier Cost Capture Last OK"
    has_date: true
    has_time: true
    icon: mdi:check-circle
  # ===============================================================
  # CAPTURE HEALTH TRACKING
  # ===============================================================
  # --- Added 2026-08-21 -------------------------------------------------
  # These four pipelines wrote buffer slots but stamped nothing, so their
  # liveness could not be monitored even in principle - the same blind spot
  # that let the dehumidifier SPC capture die for 14 days unnoticed. A stamp
  # is the prerequisite for a stale detector; the detectors are further down.
  dehumidifier_duty_kwh_capture_last_ok:
    name: "Dehumidifier Duty/kWh Capture Last OK"
    has_date: true
    has_time: true
    icon: mdi:check-circle

template:
  - binary_sensor:
      # CONTROL SENSOR: basement TH node (SHT45), cut over 2026-07-29 after the
      # Shelly disagreement was resolved. The Shelly keeps running as an
      # independent validation channel but no longer touches this loop.
      # Availability is the gate that keeps auto-on from firing on a dead node:
      # this entity goes `unavailable`, and the auto_on trigger (to: "on")
      # cannot fire from unavailable. Do not weaken it to a float() default.
      - name: "Dehumidifier Should Run"
        unique_id: dehumidifier_should_run
        # CONTROLLED VARIABLE: RELATIVE HUMIDITY, as of 2026-08-03.
        # Reverts the 2026-07-30 dew-point conversion.
        #
        # Why this is not a flip-flop: the DP conversion was reasoned from
        # r(RH,T) = -0.943 and r(RH,AH) = +0.008 over a 12 h window. Those
        # numbers were correctly measured and incorrectly attributed. The
        # Santa Fe had a frosted evaporator and produced no condensate; it
        # lowered RH by adding sensible heat at 148 kWh/litre. RH tracked
        # temperature because the machine was a heater. Absolute humidity
        # did not move because no water was being removed. Neither
        # correlation says anything about how RH behaves under a
        # dehumidifier that actually dehumidifies.
        #
        # The objective is a MOLD limit. Mold responds to RH. Matching the
        # controlled variable to the objective removes the entire reason
        # the dynamic DP envelope had to exist: a 60 % ceiling is 60 % at
        # every temperature, whereas DP 55 degF is 59 % RH at 70 degF and
        # 78 % at 62 degF.
        #
        # The mold-ceiling limb that used to live here is GONE, and its
        # absence is deliberate rather than an oversight: under RH control,
        # rh > ceiling implies rh > rh_on for any ordered band, so the limb
        # is vacuous. The ceiling is still enforced - by
        # dehumidifier_force_on_backstop, which additionally bypasses
        # min_off, which is the part that actually matters.
        availability: >
          {% set temp = states('sensor.basement_th_node_basement_temperature') %}
          {% set rh = states('sensor.basement_th_node_basement_humidity') %}
          {% set rh_on = states('input_number.dehumidifier_rh_on_threshold') %}
          {{ is_number(temp) and is_number(rh) and is_number(rh_on) }}
        state: >
          {% set temp = states('sensor.basement_th_node_basement_temperature') | float(0) %}
          {% set rh = states('sensor.basement_th_node_basement_humidity') | float(0) %}
          {% set rh_on = states('input_number.dehumidifier_rh_on_threshold') | float(57) %}
          {% set min_temp = states('input_number.dehumidifier_min_temp') | float(60) %}
          {{ temp >= min_temp and rh > rh_on }}
      # ===============================================================
      # DEHUMIDIFIER COMPRESSOR ACTIVE (Aprilaire E080, 465.8 W steady
      # [M, n=340 runs]; this header said "Santa Fe Classic ~540W tuned"
      # until 2026-09-23)
      # Switch guard prevents false triggers from Kasa sensor glitches.
      # Threshold referenced from input_number for field tuning without
      # YAML edits. Validate 250W starting point against real power curves.
      # (250 W was the Santa Fe starting point; the E080 gate is 150 W -
      # see dehumidifier_power_threshold.)
      # ===============================================================
      - name: "Dehumidifier Compressor Active"
        unique_id: dehumidifier_compressor_active
        device_class: running
        # 2026-08-24: the threshold helper is now part of the AVAILABILITY gate,
        # not something a fallback substitutes for. It read `| float(250)` while
        # the helper holds 150, so an unreadable helper silently moved the
        # compressor gate 67 % - and at 150-250 W a running compressor would
        # have read OFF, under-counting runtime, skipping the SPC capture and
        # disabling the stall detector's precondition, all without a symptom.
        # A guard whose threshold is unknown must not act: this goes unavailable
        # instead, which reads as "not running" to every consumer.
        #
        # SAFE TO DO because the runaway protection does not depend on this
        # sensor - dehumidifier_max_runtime_backstop keys on switch.dehumidifier
        # and input_datetime.dehumidifier_last_on_time. Verified 2026-08-24.
        #
        # The float() below is unreachable behind is_number() and is chosen to
        # read OFF if it ever were reached, matching the fail-safe direction.
        availability: >
          {{ is_number(states('sensor.dehumidifier_current_consumption'))
             and is_number(states('input_number.dehumidifier_power_threshold')) }}
        state: >
          {{ is_state('switch.dehumidifier', 'on') and
             states('sensor.dehumidifier_current_consumption') | float(0) >
             states('input_number.dehumidifier_power_threshold') | float(99999) }}
        delay_on:
          seconds: 3
        delay_off:
          seconds: 10
        icon: mdi:compressor
      # === Added 2026-08-21: the six pipelines the audit found unmonitored ===
      #
      # Same opportunity-gate design as the SPC capture watchdog in
      # packages/spc.yaml: a bare "last run is old" test would cry all
      # off-season for the heating and cooling pipelines, and an alarm that
      # cries for six months is one you switch off. Each daily detector asks
      # whether the pipeline had the CHANCE to run and did not take it.
      #
      # No availability: block on any of these, deliberately - a watchdog that
      # can go unavailable fails in the direction that hides the fault.
      # An unparseable stamp reports stale, never quiet.
      - name: "Dehumidifier Duty/kWh Capture Stale"
        unique_id: dehumidifier_duty_kwh_capture_stale
        device_class: problem
        state: >
          {% set last = states('input_datetime.dehumidifier_duty_kwh_capture_last_ok') %}
          {% set act = states('counter.dehumidifier_cycles_today') | int(0) %}
          {% if act <= 0 %}
            false
          {% elif last in ['unknown', 'unavailable', 'none', ''] or last[:4] == '1970' %}
            true
          {% else %}
            {% set d = last | as_datetime %}
            {% if d is none %}
              true
            {% else %}
              {{ (now().date() - d.date()).days > 2 }}
            {% endif %}
          {% endif %}
      - name: "Dehumidifier Cost Capture Stale"
        unique_id: dehumidifier_cost_capture_stale
        device_class: problem
        state: >
          {% set last = states('input_datetime.dehumidifier_cost_capture_last_ok') %}
          {% set act = states('counter.dehumidifier_cycles_today') | int(0) %}
          {% if act <= 0 %}
            false
          {% elif last in ['unknown', 'unavailable', 'none', ''] or last[:4] == '1970' %}
            true
          {% else %}
            {% set d = last | as_datetime %}
            {% if d is none %}
              true
            {% else %}
              {{ (now().date() - d.date()).days > 2 }}
            {% endif %}
          {% endif %}
  - sensor:
      # Basement dew point - SOURCE CHANGED to the SHT45 node 2026-07-29.
      # The entity_id is deliberately unchanged: sensor.basement_dp_rate
      # (derivative), dehumidifier_dew_point_margin, the cycle-start/end
      # capture automations and the daily CSV export all read this id, and
      # keeping it preserves their history as one continuous series.
      # Still computed here with Magnus rather than read from the node's
      # native dew_point platform, so the pre- and post-cutover halves of
      # that series use identical math. Cross-checked 2026-07-29: node
      # native 54.876 degF vs this formula 54.853 degF on the same T/RH -
      # 0.02 degF apart, i.e. Magnus-coefficient choice, not a real gap.
      - name: "Basement Dew Point"
        unique_id: basement_dew_point
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        availability: >
          {% set t = states('sensor.basement_th_node_basement_temperature') %}
          {% set rh = states('sensor.basement_th_node_basement_humidity') %}
          {{ is_number(t) and is_number(rh) and (t | float(0)) > 0 and (rh | float(0)) > 0 and (rh | float(0)) <= 100 }}
        state: >
          {% set t = states('sensor.basement_th_node_basement_temperature') | float(0) %}
          {% set rh = states('sensor.basement_th_node_basement_humidity') | float(0) %}
          {% set t_c = (t - 32) * 5 / 9 %}
          {% set a = 17.27 %}
          {% set b = 237.7 %}
          {% set gamma = log(rh / 100) + (a * t_c) / (b + t_c) %}
          {% set dp_c = (b * gamma) / (a - gamma) %}
          {# PRECISION RAISED 1 -> 2 dp, 2026-07-31. round(1) quantised this
             entity to 0.1 degF - a 12 h export held just SEVEN distinct values.
             Harmless for the 1 degF control band, but it broke every rate
             sensor derived from it. dehumidifier_dp_drop_rate_60min is
             (mean - current) * 2, so a 0.1 degF quantised `current` made the
             stall metric move in 0.2 degF/hr STEPS against a 0.15 threshold:
             'below 0.15' collapsed to 'at or below 0.00', so the stall could
             only fire when dew point was FLAT OR RISING, never merely slow.
             sensor.basement_dp_rate inherits the same source and was equally
             coarse. The SHT45 inputs carry ~0.002 %RH and ~0.005 degF of
             resolution, so the second decimal resolves real signal, not noise.
             Cost is a higher recorder write rate, comparable to the RH sensor
             which already logs ~343 samples/hr. #}
          {{ (dp_c * 9 / 5 + 32) | round(2) }}
      # === DYNAMIC DP ENVELOPE (2026-07-30) ===
      # The mold limit is an RH limit, so the dew point that satisfies it
      # moves with air temperature - roughly 1:1 (about T - 14.2 degF at a
      # 60 % ceiling). A fixed DP setpoint is therefore correct at exactly
      # one temperature. DP 55 is 59 % RH at 70 degF but 63 % at 68 degF,
      # so two degrees of seasonal cooling puts a summer setpoint through
      # the ceiling with the controlled variable never moving.
      #
      # Same Magnus form as sensor.basement_dew_point above, with the
      # ceiling substituted for measured RH. Identical algorithm on
      # purpose: these two can then only disagree by input, never by math.
      - name: "Basement Mold Limited DP"
        unique_id: basement_mold_limited_dp
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        icon: mdi:blur
        availability: >
          {% set t = states('sensor.basement_th_node_basement_temperature') %}
          {% set c = states('input_number.dehumidifier_rh_force_on') %}
          {{ is_number(t) and is_number(c) and (t | float(0)) > 0
             and (c | float(0)) > 0 and (c | float(0)) <= 100 }}
        state: >
          {% set t = states('sensor.basement_th_node_basement_temperature') | float(0) %}
          {% set c = states('input_number.dehumidifier_rh_force_on') | float(60) %}
          {% set t_c = (t - 32) * 5 / 9 %}
          {% set a = 17.27 %}
          {% set b = 237.7 %}
          {% set gamma = log(c / 100) + (a * t_c) / (b + t_c) %}
          {{ ((b * gamma) / (a - gamma) * 9 / 5 + 32) | round(1) }}
      # Headroom: how far the current dew point sits below the mold limit.
      # This is the number to chart and to alarm on - it collapses toward
      # zero either when moisture rises OR when the basement cools, and the
      # second cause is invisible on a dew-point trace alone.
      - name: "Basement DP Headroom"
        unique_id: basement_dp_headroom
        unit_of_measurement: "°F"
        state_class: measurement
        icon: mdi:arrow-expand-vertical
        availability: >
          {{ is_number(states('sensor.basement_mold_limited_dp'))
             and is_number(states('sensor.basement_dew_point')) }}
        state: >
          {% set lim = states('sensor.basement_mold_limited_dp') | float(0) %}
          {% set dp = states('sensor.basement_dew_point') | float(0) %}
          {{ (lim - dp) | round(1) }}
      # What dehumidifier_dp_on_threshold SHOULD be right now: the lowest of
      # the three ceilings. 1.5 degF is held back from the mold limit to
      # cover band width (dp_on - dp_off) plus overshoot between /15 checks,
      # so the whole band stays under the limit rather than straddling it.
      #
      # float(999) on a missing input makes that limb non-binding rather
      # than zero - a dead sensor must not drive the recommendation to an
      # absurdly low target that would run the compressor forever. The cap
      # always remains, so this degrades to the fixed cap, never to nothing.
      - name: "Basement Recommended DP On"
        unique_id: basement_recommended_dp_on
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        icon: mdi:target
        availability: >
          {{ is_number(states('input_number.basement_dp_target_cap')) }}
        # SMOOTHED SOURCE + WIDER HOLDBACK (2026-07-30, after observing that
        # basement temperature dips when the house AC runs).
        #
        # The mold limit moves 0.94 degF per degF of air temperature, so an AC
        # cycle swings it about 1.6 degF - three times further than the dew
        # point itself moved across the whole 12 h export. Feeding the raw
        # limit into a setpoint recommendation would make the recommendation
        # chatter on the AC's duty cycle rather than on moisture, which is the
        # same class of mistake as controlling on RH: reacting to a temperature
        # artifact. The 60-min mean separates the AC cycle (~15-30 min) from
        # the seasonal drift (weeks) this recommendation actually exists for.
        #
        # HOLDBACK CORRECTED BACK TO 1.5 degF (2026-07-31), on measurement.
        # I briefly raised it to 2.5 on an estimate of a 1.63 degF AC-driven
        # limit swing. That estimate was wrong: it came from the full 12 h
        # temperature RANGE (69.90-71.64 F), which contained the dehumidifier's
        # own condenser heating as well as the AC. A 60-min export of an actual
        # AC cycle shows a 0.72 degF swing (plateau 69.85 -> trough 69.27),
        # i.e. 0.55 degF of mold-limit movement - overstated 2.9x.
        #
        # Rebuilt budget: AC swing 0.55 (and the 60-min mean below removes most
        # of that anyway); DP overshoot between /15 checks at the observed
        # ingress ~0.01; band width is NOT a term, because the band extends
        # DOWNWARD from dp_on, away from the limit. What remains is sensor
        # uncertainty, which is the dominant term and is NOT verified here.
        # 1.5 degF covers it; 2.5 was buying about 1 degF of pointless runtime.
        #
        # Falls back to the instantaneous limit if the statistics sensor has
        # not populated yet (first hour after a restart), so the recommendation
        # is never blank - only briefly noisier.
        state: >
          {% set cap = states('input_number.basement_dp_target_cap') | float(55) %}
          {% set smooth = states('sensor.basement_mold_limited_dp_mean_60min') %}
          {% set raw = states('sensor.basement_mold_limited_dp') %}
          {% set mold = (smooth if is_number(smooth) else raw) | float(999) %}
          {% set surf = states('sensor.battery_bank_monitor_battery_pack_temperature') | float(999) %}
          {% set marg = states('input_number.basement_dp_margin_min') | float(8) %}
          {{ [cap, mold - 1.5, surf - marg] | min | round(1) }}
      # Shelly dew point - VALIDATION ONLY, no control path reads this.
      # Same Magnus coefficients as above so the DP delta is a sensor
      # comparison and not an algorithm comparison. Exists so the Shelly
      # can keep running independently for the post-cutover watch period.
      - name: "Shelly Dew Point"
        unique_id: shelly_dew_point
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        icon: mdi:water-thermometer-outline
        availability: >
          {% set t = states('sensor.shelly_temperature_humidity_temperature') %}
          {% set rh = states('sensor.shelly_temperature_humidity_humidity') %}
          {{ is_number(t) and is_number(rh) and (t | float(0)) > 0 and (rh | float(0)) > 0 and (rh | float(0)) <= 100 }}
        state: >
          {% set t = states('sensor.shelly_temperature_humidity_temperature') | float(0) %}
          {% set rh = states('sensor.shelly_temperature_humidity_humidity') | float(0) %}
          {% set t_c = (t - 32) * 5 / 9 %}
          {% set a = 17.27 %}
          {% set b = 237.7 %}
          {% set gamma = log(rh / 100) + (a * t_c) / (b + t_c) %}
          {% set dp_c = (b * gamma) / (a - gamma) %}
          {{ (dp_c * 9 / 5 + 32) | round(1) }}

      # Absolute humidity is NOT redefined here. The SHT45 node already
      # publishes sensor.basement_th_node_basement_absolute_humidity (and a
      # 30 min moisture-removal rate in g/m3/hr derived from it), both of
      # which already have history and are already on the dashboard. A
      # second HA-side AH template would create two numbers that can
      # disagree, which is strictly worse than one. Use the node's.
      #
      # This differs from sensor.basement_dew_point above, which IS
      # duplicated in HA on purpose: that one exists to keep the pre- and
      # post-cutover halves of a single long series on identical math.
      # AH has no pre-cutover series to preserve, so that argument does not
      # apply and the node value stands alone.
      # Basement Condensation Margin - added 2026-07-30.
      # degF between the coldest MEASURED surface at the rack and the current
      # basement dew point. This is the number that actually protects the
      # bare copper bus bars; the RH band does not.
      #
      # Distinct from sensor.dehumidifier_dew_point_margin, which is left
      # untouched: that one is vestigial from the pre-RH-band dew-point
      # control era and measures DP against a fixed setpoint, not against a
      # surface. Its entity_id and history are preserved deliberately.
      #
      # float(60) is a deliberately conservative placeholder for a typical
      # 2021 Zone 5A insulated-foundation slab in summer. It is an ESTIMATE
      # and should be replaced by the IR reading; the fallback only applies
      # if the input_number is missing entirely.
      - name: "Basement Condensation Margin"
        unique_id: basement_condensation_margin
        unit_of_measurement: "°F"
        state_class: measurement
        icon: mdi:water-alert-outline
        # SURFACE REFERENCE (2026-07-30, revised). Reads the bank monitor's
        # LIVE temperature rather than a typed-in number. A static snapshot
        # cannot track, and it cannot see the case this guard exists for:
        # copper has real thermal mass, so in a fast dew-point excursion the
        # bar lags the air and briefly BECOMES the cold surface. Only a live
        # reading catches that.
        #
        # ON THE SOURCE: despite the entity name, this is a DS18B20 mounted
        # immediately adjacent to the bus bar - confirmed 2026-07-30. It is a
        # good steady-state proxy for bar temperature. The entity id says
        # `battery_pack_temperature`, which is misleading about what is
        # physically measured; do not later 'correct' this reference to some
        # other pack sensor on the strength of the name.
        #
        # Known limit: the DS18B20 equilibrates faster than ~440 g of copper
        # (sensor time constant is minutes, the bar's is tens of minutes), so
        # during a fast dew-point excursion it reads slightly WARM relative to
        # the bar and the margin is briefly optimistic. That lag is the reason
        # the 8 degF required margin exists rather than 5 - it is absorbed by
        # design, not ignored.
        #
        # input_number.basement_coldest_surface_temp is demoted to a manual
        # COLDER-surface override: if IR measurement finds something colder
        # than the pack (slab, below-grade wall, cold-water line), enter it
        # and the guard uses the lower of the two - a condensation guard
        # should always reference the coldest known surface. Leaving it at
        # its minimum (35) fails the plausibility gate and disables the
        # override, so 35 now correctly means OFF.
        #
        # PLAUSIBILITY GATE, retained. HA creates a new input_number with no
        # `initial:` at its `min`, so on first deploy this read 35 degF - the
        # bound, not a measurement - and the margin came out -19.1 degF. That
        # pinned the force-on backstop ON every /15 and left the auto_off
        # veto permanently engaged. AN UNCONFIGURED GUARD MUST NOT ACT: with
        # no plausible source this sensor goes unavailable, is_number() fails
        # on both the force-on limb and the veto, and control degrades to the
        # plain RH band that ran before the guard existed. Failing back to
        # known-good beats failing to a compressor that cannot be shut off.
        availability: >
          {% set pack = states('sensor.battery_bank_monitor_battery_pack_temperature') %}
          {% set manual = states('input_number.basement_coldest_surface_temp') %}
          {% set pack_ok = is_number(pack) and (pack | float(0)) > 40 %}
          {% set manual_ok = is_number(manual) and (manual | float(0)) > 40 %}
          {{ is_number(states('sensor.basement_dew_point')) and (pack_ok or manual_ok) }}
        state: >
          {% set pack = states('sensor.battery_bank_monitor_battery_pack_temperature') %}
          {% set manual = states('input_number.basement_coldest_surface_temp') %}
          {% set pack_ok = is_number(pack) and (pack | float(0)) > 40 %}
          {% set manual_ok = is_number(manual) and (manual | float(0)) > 40 %}
          {% set candidates = ([pack | float(999)] if pack_ok else [])
                            + ([manual | float(999)] if manual_ok else []) %}
          {% set surface = candidates | min %}
          {% set dp = states('sensor.basement_dew_point') | float(0) %}
          {{ (surface - dp) | round(1) }}
      # ===============================================================
      # DEHUMIDIFIER PERFORMANCE TRACKING
      # ===============================================================
      - name: "Dehumidifier Dew Point Margin"
        unique_id: dehumidifier_dew_point_margin
        unit_of_measurement: "°F"
        state_class: measurement
        icon: mdi:water-minus
        availability: >
          {{ states('sensor.basement_dew_point') not in ['unknown', 'unavailable'] and
             states('input_number.dehumidifier_dewpoint_threshold') not in ['unknown', 'unavailable'] }}
        state: >
          {% set dp = states('sensor.basement_dew_point') | float(0) %}
          {% set threshold = states('input_number.dehumidifier_dewpoint_threshold') | float(52) %}
          {{ (threshold - dp) | round(1) }}
      - name: "Dehumidifier Duty Cycle 24h"
        unique_id: dehumidifier_duty_cycle_24h
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:percent
        availability: >
          {{ states('sensor.dehumidifier_runtime_today') not in ['unknown', 'unavailable'] }}
        state: >
          {% set runtime_h = states('sensor.dehumidifier_runtime_today') | float(0) %}
          {{ ((runtime_h / 24) * 100) | round(1) }}
      - name: "Dehumidifier Avg Cycle Minutes"
        unique_id: dehumidifier_avg_cycle_minutes
        unit_of_measurement: "min"
        state_class: measurement
        icon: mdi:timer-outline
        availability: >
          {% set runtime = states('sensor.dehumidifier_runtime_today') %}
          {% set cycles = states('counter.dehumidifier_cycles_today') %}
          {{ runtime not in ['unknown', 'unavailable'] and
             cycles not in ['unknown', 'unavailable'] and
             cycles | int(0) > 0 }}
        state: >
          {% set runtime_h = states('sensor.dehumidifier_runtime_today') | float(0) %}
          {% set cycles = states('counter.dehumidifier_cycles_today') | int(1) %}
          {{ ((runtime_h * 60) / cycles) | round(1) }}
      - name: "Dehumidifier Pull-Down Rate"
        unique_id: dehumidifier_pull_down_rate
        unit_of_measurement: "°F/h"
        state_class: measurement
        icon: mdi:arrow-down-bold
        availability: >
          {% set rate = states('input_number.dehumidifier_last_pull_down_rate') %}
          {% set end_time = states('input_datetime.dehumidifier_last_cycle_end_time') %}
          {{ rate not in ['unknown', 'unavailable'] and
             end_time not in ['unknown', 'unavailable'] and
             end_time[:4] != '1970' }}
        state: >
          {{ states('input_number.dehumidifier_last_pull_down_rate') | float(0) | round(1) }}
      - name: "Dehumidifier Hold Time"
        unique_id: dehumidifier_hold_time
        unit_of_measurement: "h"
        state_class: measurement
        icon: mdi:timer-sand
        # Availability: show whenever the hold value has been written (not uninitialized 0 from 1970)
        availability: >
          {% set hold = states('input_number.dehumidifier_last_hold_hours') %}
          {% set end_time = states('input_datetime.dehumidifier_last_cycle_end_time') %}
          {{ hold not in ['unknown', 'unavailable'] and
             end_time not in ['unknown', 'unavailable'] and
             end_time[:4] != '1970' }}
        state: >
          {{ states('input_number.dehumidifier_last_hold_hours') | float(0) | round(1) }}
      - name: "Dehumidifier Daily Cost"
        unique_id: dehumidifier_daily_cost
        unit_of_measurement: "$"
        state_class: total_increasing
        icon: mdi:currency-usd
        # Cost today = MEASURED daily kWh * effective $/kWh.
        #
        # 2026-08-24: was `runtime_h * 0.568 kW * rate`. The 0.568 was a second
        # copy of the machine's power draw and it had drifted off the machine.
        # The E080 measures 468.7 W (0.523 kWh over 1.1158 h on 2026-08-24) and
        # sensor.dehumidifier_running_watts_mean_7d independently reads 467.3 W,
        # so 0.568 kW made every reported cost 21 % high. It was also the wrong
        # SHAPE: runtime is switch-on time, which includes ~57.8 W fan-only
        # sampling, and the constant priced those minutes at compressor watts.
        #
        # sensor.dehumidifier_energy_daily is the daily utility_meter over the
        # integration of the plug's own power reading, so this multiplies a
        # measurement by a rate instead of an assumption by a rate. Still
        # total_increasing: the utility meter is monotonic within a day and
        # resets at midnight.
        #
        # No | float() fallback on the rate. A fabricated rate is exactly the
        # defect being removed here, so an unreadable rate makes this
        # unavailable and the chart draws no bar - see R7/R8 in CLAUDE.md.
        availability: >
          {{ is_number(states('sensor.dehumidifier_energy_daily'))
             and is_number(states('sensor.electricity_effective_rate')) }}
        state: >
          {% set kwh  = states('sensor.dehumidifier_energy_daily') | float(0) %}
          {% set rate = states('sensor.electricity_effective_rate') | float(0) %}
          {{ (kwh * rate) | round(2) }}
      - name: "Dehumidifier Projected Seasonal Cost"
        unique_id: dehumidifier_projected_seasonal_cost
        unit_of_measurement: "$"
        state_class: measurement
        icon: mdi:calendar-clock
        # Projected 180-day season cost based on 7-day runtime average
        # formula: (runtime_week_h / 7) * 0.568 kW * effective $/kWh * 180 days
        availability: >
          {{ states('sensor.dehumidifier_runtime_week') not in ['unknown', 'unavailable'] }}
        state: >
          {% set weekly_h = states('sensor.dehumidifier_runtime_week') | float(0) %}
          {% set daily_avg_h = weekly_h / 7 %}
          {% set rate = states('sensor.electricity_effective_rate') | float(0.2733) %}
          {{ (daily_avg_h * 0.568 * rate * 180) | round(0) | int(0) }}
      # Live year-to-date operating cost: accumulator (completed days) plus
      # today's running cost until the 23:59:30 capture folds it in.
      # Resets each Jan 1 via reset_yearly_dehumidifier_cost; prior-year total
      # is snapshot to input_number.dehumidifier_cost_prev_year for comparison.
      - name: "Dehumidifier Cost Year To Date"
        unique_id: dehumidifier_cost_year_to_date
        unit_of_measurement: "$"
        state_class: total
        icon: mdi:cash-multiple
        state: >
          {% set acc = states('input_number.dehumidifier_cost_year_acc') | float(0) %}
          {% set today = states('sensor.dehumidifier_daily_cost') | float(0) %}
          {% set last = states('input_datetime.dehumidifier_cost_capture_last_ok') %}
          {% set captured_today = last[:10] == now().strftime('%Y-%m-%d')
             if last not in ['unknown', 'unavailable', '1970-01-01 00:00:00'] else false %}
          {{ (acc if captured_today else acc + today) | round(2) }}

      # === RETIRED 2026-08-07 — rate sensors unified ==================
      # sensor.dehumidifier_rh_drop_rate_60min and
      # sensor.dehumidifier_dp_drop_rate_60min are GONE. Both used the
      # estimator 2 x (60-min mean - current), which is a mean-lag proxy
      # for a slope and read POSITIVE when the quantity was falling — the
      # opposite of sensor.basement_dp_rate sitting a few hundred lines
      # below, and a different formula from it as well.
      #
      # Replaced by the canonical derivative set in
      # packages/dehumidifier_spc.yaml:
      #     sensor.basement_dp_rate     (already here, unchanged)
      #     sensor.basement_rh_rate     (new)
      #     sensor.basement_ah_rate     (new)
      #     sensor.basement_temp_rate   (new, degF/h)
      # All four: platform derivative, 30-min time_window, unit_time h,
      # NATURAL SIGN — negative means the quantity is falling.
      #
      # Three further reasons the old pair had to go, beyond consistency:
      #   1. noise dominated by the single `current` sample — the old
      #      comment here put sigma(rate) at ~0.16 %/hr against a
      #      0.30 %/hr threshold, over half the threshold;
      #   2. a 60-min window no longer fits inside a run. Measured E080
      #      runs are 15.6 to 30.3 min, so the window straddles the
      #      preceding off period and nets falling against rising;
      #   3. RH falls whenever the compressor merely heats the room, so
      #      an RH-based rate flatters a broken machine. That is how the
      #      Santa Fe hid a frosted coil for months. basement_ah_rate is
      #      the honest metric and is now available.
      #
      # The stall detector in automations.yaml now reads
      # sensor.basement_dp_rate and tests rate > -threshold.
      # ================================================================
      # === dp removal / ingress — SAME rate, split by machine state ===
      # 2026-08-07 SIGN FIX. Both are now plain pass-throughs of
      # sensor.basement_dp_rate with no arithmetic at all, gated on
      # compressor state. Previously "removal" negated the source and
      # "ingress" did not, so BOTH read positive and the chart showed two
      # curves above zero meaning physically opposite things.
      #
      # Now, on the canonical convention:
      #     removal  (running) is NEGATIVE — dew point falling
      #     ingress  (off)     is POSITIVE — dew point rising
      # They can never overlap, so the pair reads as one continuous
      # signed curve crossing zero at each state change.
      #
      # SETTLE + WINDOW FIXED TOGETHER 2026-08-07. Both were sized for
      # the Santa Fe era of 4-hour runs and neither works at 15.6-30.3
      # min: a 1800 s settle simply never elapsed inside a run, so the
      # RUNNING side almost never became available.
      #
      # Cutting the settle ALONE would have been worse than the gap.
      # The source was a 30-min derivative window, so 10 min into a run
      # that window still holds 20 min of OFF-period data where dew
      # point is rising — the reported "removal rate" would read near
      # zero or positive. Wrong is worse than missing.
      #
      # So both moved: source is now sensor.basement_dp_rate_10m and
      # the settle is 600 s, matching it exactly. Availability then
      # begins the moment the window is clean of pre-transition data.
      # Coverage at measured run lengths: 5.6 min of a 15.6-min run
      # through 20.3 min of a 30.3-min run. Off periods are 63 min or
      # longer, so the ingress side is unaffected.
      #
      # The SHT45 is not the limit here — tau63 is seconds for both RH
      # and temperature. The limits are the smoothing window and the
      # ~1-2 min transport lag from the machine end to the node alcove,
      # which the 600 s settle also covers.
      #
      # If the band is ever narrowed back toward 3 points (~14 min
      # runs), drop BOTH to 5 min / 300 s together — never one alone.
      - name: "Dehumidifier DP Removal Rate"
        unique_id: dehumidifier_dp_removal_rate
        unit_of_measurement: "°F/h"
        state_class: measurement
        icon: mdi:water-minus
        availability: >
          {{ is_state('binary_sensor.dehumidifier_compressor_active', 'on')
             and is_number(states('sensor.basement_dp_rate_10m'))
             and (now() - states.binary_sensor.dehumidifier_compressor_active.last_changed).total_seconds() > 600 }}
        state: "{{ states('sensor.basement_dp_rate_10m') | float(0) | round(2) }}"
      - name: "Dehumidifier DP Ingress Rate"
        unique_id: dehumidifier_dp_ingress_rate
        unit_of_measurement: "°F/h"
        state_class: measurement
        icon: mdi:water-plus
        availability: >
          {{ is_state('binary_sensor.dehumidifier_compressor_active', 'off')
             and is_number(states('sensor.basement_dp_rate_10m'))
             and (now() - states.binary_sensor.dehumidifier_compressor_active.last_changed).total_seconds() > 600 }}
        state: "{{ states('sensor.basement_dp_rate_10m') | float(0) | round(2) }}"
      # === daily duty% / kWh (mirror newest buffer slot for charting) ===
      - name: "Dehumidifier Duty Daily"
        unique_id: dehumidifier_duty_daily
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:percent
        state: "{{ states('input_number.dehumidifier_duty_day_1') | float(0) | round(1) }}"
      - name: "Dehumidifier kWh Daily"
        unique_id: dehumidifier_kwh_daily
        unit_of_measurement: "kWh"
        state_class: measurement
        icon: mdi:lightning-bolt
        state: "{{ states('input_number.dehumidifier_kwh_day_1') | float(0) | round(3) }}"
      - name: "Dehumidifier Duty Mean 7d"
        unique_id: dehumidifier_duty_mean_7d
        unit_of_measurement: "%"
        icon: mdi:chart-line
        state: >
          {% set days = [
            states('input_number.dehumidifier_duty_day_1') | float(-1),
            states('input_number.dehumidifier_duty_day_2') | float(-1),
            states('input_number.dehumidifier_duty_day_3') | float(-1),
            states('input_number.dehumidifier_duty_day_4') | float(-1),
            states('input_number.dehumidifier_duty_day_5') | float(-1),
            states('input_number.dehumidifier_duty_day_6') | float(-1),
            states('input_number.dehumidifier_duty_day_7') | float(-1)
          ] %}
          {% set valid = days | select('>=', 0) | select('<=', 100) | list %}
          {% if valid | length > 0 %}
            {{ (valid | sum / valid | length) | round(1) }}
          {% else %}
            0
          {% endif %}
      - name: "Dehumidifier KWH Mean 7d"
        unique_id: dehumidifier_kwh_mean_7d
        unit_of_measurement: "kWh"
        icon: mdi:chart-line
        state: >
          {% set days = [
            states('input_number.dehumidifier_kwh_day_1') | float(-1),
            states('input_number.dehumidifier_kwh_day_2') | float(-1),
            states('input_number.dehumidifier_kwh_day_3') | float(-1),
            states('input_number.dehumidifier_kwh_day_4') | float(-1),
            states('input_number.dehumidifier_kwh_day_5') | float(-1),
            states('input_number.dehumidifier_kwh_day_6') | float(-1),
            states('input_number.dehumidifier_kwh_day_7') | float(-1)
          ] %}
          {% set valid = days | select('>=', 0) | select('<=', 20) | list %}
          {% if valid | length > 0 %}
            {{ (valid | sum / valid | length) | round(3) }}
          {% else %}
            0
          {% endif %}
  - binary_sensor:
      # --- Basement sensor cross-check -----------------------------
      # Fires on the 24 h MEAN, not the instantaneous delta: the two
      # sensors are never sampled simultaneously, so single readings are
      # noise-dominated. Availability-gated so a dead node reads unavailable
      # rather than silently 'off' (a fail-open problem flag is worse than
      # no flag).
      - name: "Basement RH Sensors Disagree"
        unique_id: basement_rh_sensors_disagree
        device_class: problem
        icon: mdi:not-equal-variant
        availability: >
          {{ is_number(states('sensor.basement_rh_delta_mean_24h')) and
             is_number(states('input_number.basement_rh_delta_tolerance')) }}
        state: >
          {% set d = states('sensor.basement_rh_delta_mean_24h') | float(0) %}
          {% set tol = states('input_number.basement_rh_delta_tolerance') | float(12) %}
          {{ (d | abs) > tol }}
  # ===============================================================
  # BASEMENT SENSOR CROSS-CHECK (SHT45 node vs Shelly H&T Gen3)
  # ===============================================================
  # RESOLVED 2026-07-29 and the control loop is now on the SHT45. The Shelly
  # stays powered as an INDEPENDENT validation channel for a few days; these
  # deltas are how that validation is read. They are still diagnostics and
  # still must never feed control - the point of an independent channel is
  # that it cannot influence the thing it is checking.
  #
  # Post-cutover the interesting question changes from "which one is right"
  # to "does the delta stay put". A stable offset is a known, characterised
  # calibration difference. A MOVING offset means one of the two is drifting,
  # and the control sensor is the one that matters.
  #
  # Sign convention: SHT45 minus Shelly. Positive = node reads wetter/warmer.
  #
  # Trigger-based on a /5 min time_pattern rather than state-based: the
  # SHT45 publishes every 10 s and the Shelly every ~5 min on USB, so a
  # state-based delta would recompute ~8,640x/day while carrying only ~288
  # independent Shelly readings - autocorrelated churn that also blows out
  # the statistics sampling_size needed to cover 24 h. Worst-case pairing
  # staleness is 5 min; at a fast 3 %/hr pulldown that is 0.25 %RH, which
  # is negligible against the ~9 %RH being measured.
  - trigger:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
    # No block-level condition, deliberately. It used to require all six
    # entities to be numeric at once, which meant one missing entity blanked
    # all three deltas, starved all three statistics sensors, and took the
    # whole cross-check panel down. A panel whose job is detecting sensor
    # faults must not be disabled by a sensor fault. Each sensor now carries
    # its own availability covering only the two entities it reads, so an RH
    # delta survives a dead dew-point sensor and vice versa.
    sensor:
      - name: "Basement RH Delta SHT45 vs Shelly"
        unique_id: basement_rh_delta_sht45_shelly
        availability: >
          {{ is_number(states('sensor.basement_th_node_basement_humidity')) and
             is_number(states('sensor.shelly_temperature_humidity_humidity')) }}
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:delta
        state: >
          {% set a = states('sensor.basement_th_node_basement_humidity') | float(0) %}
          {% set b = states('sensor.shelly_temperature_humidity_humidity') | float(0) %}
          {{ (a - b) | round(2) }}

      - name: "Basement Temp Delta SHT45 vs Shelly"
        unique_id: basement_temp_delta_sht45_shelly
        availability: >
          {{ is_number(states('sensor.basement_th_node_basement_temperature')) and
             is_number(states('sensor.shelly_temperature_humidity_temperature')) }}
        unit_of_measurement: "\u00b0F"
        state_class: measurement
        icon: mdi:delta
        state: >
          {% set a = states('sensor.basement_th_node_basement_temperature') | float(0) %}
          {% set b = states('sensor.shelly_temperature_humidity_temperature') | float(0) %}
          {{ (a - b) | round(2) }}

      # Repointed 2026-07-29: sensor.basement_dew_point is now SHT45-derived,
      # so comparing against it would be SHT45-vs-SHT45. The Shelly side is
      # now sensor.shelly_dew_point, which uses the same Magnus coefficients -
      # this delta measures the SENSORS, not two dew-point algorithms.
      - name: "Basement DP Delta SHT45 vs Shelly"
        unique_id: basement_dp_delta_sht45_shelly
        availability: >
          {{ is_number(states('sensor.basement_dew_point')) and
             is_number(states('sensor.shelly_dew_point')) }}
        unit_of_measurement: "\u00b0F"
        state_class: measurement
        icon: mdi:delta
        state: >
          {% set a = states('sensor.basement_dew_point') | float(0) %}
          {% set b = states('sensor.shelly_dew_point') | float(0) %}
          {{ (a - b) | round(2) }}

# ===============================================================
# ===============================================================
# UTILITY METERS (added 2026-06) - dehumidifier energy daily/monthly
# ===============================================================
utility_meter:
  dehumidifier_energy_daily:
    source: sensor.dehumidifier_energy
    name: "Dehumidifier Energy Daily"
    unique_id: dehumidifier_energy_daily
    cycle: daily
  dehumidifier_energy_monthly:
    source: sensor.dehumidifier_energy
    name: "Dehumidifier Energy Monthly"
    unique_id: dehumidifier_energy_monthly
    cycle: monthly

sensor:
  - platform: integration
    source: sensor.dehumidifier_current_consumption
    name: "Dehumidifier Energy"
    unique_id: dehumidifier_energy_kwh
    unit_prefix: k
    unit_time: h
    method: trapezoidal
    round: 3
    max_sub_interval:
      minutes: 5
  # dp slope (deg F/hr) over 30-min window -> drives removal/ingress rate sensors
  - platform: derivative
    source: sensor.basement_dew_point
    name: "Basement DP Rate"
    unique_id: basement_dp_rate
    unit_time: h
    time_window: "00:30:00"
    round: 2

  # =================================================================
  # CANONICAL RATE-OF-CHANGE SET (added 2026-08-07)
  # =================================================================
  # ONE estimator form for every rate in the dehumidifier stack:
  # platform: derivative, unit_time h, NATURAL SIGN.
  #
  # UNITS: derived automatically. unit_time: h makes the unit
  # <source unit>/h, which is already what each of these wants:
  #   basement_dew_point            degF     -> degF/h
  #   ..._basement_humidity         %        -> %/h
  #   ..._basement_temperature      degF     -> degF/h   <- the fix
  #   ..._basement_absolute_humidity g/m3    -> g/m3/h
  #
  # DO NOT add unit_of_measurement: here. It is a config-flow (UI
  # helper) field only and is NOT in the derivative YAML
  # PLATFORM_SCHEMA — HA rejects the whole platform entry with
  # "'unit_of_measurement' is an invalid option for 'sensor.derivative'",
  # which silently takes out every derivative sensor in the block,
  # including basement_dp_rate and therefore the removal/ingress
  # sensors and the stall detector that read it. The legacy YAML key
  # was `unit:` (deprecated, and reported not to behave); leaving the
  # unit derived is both correct and simpler.
  #
  #     NEGATIVE = the quantity is FALLING
  #     POSITIVE = the quantity is RISING
  #
  # For moisture that reads directly: negative = drying.
  #
  # TWO WINDOWS, one formula. The window is a parameter chosen per
  # job, and the choice is forced by arithmetic, not taste:
  #
  #   30 min — TREND / diagnostic, and the stall detector.
  #            Slope noise goes roughly as sigma*sqrt(2)/T. At the
  #            SHT45 dew-point scatter of ~0.05 degF documented on
  #            sensor.basement_dew_point, a 30-min window gives about
  #            0.14 degF/h — just under the 0.15 degF/h stall
  #            threshold. A 10-min window would give ~0.42 degF/h,
  #            nearly 3x the threshold, so the stall detector MUST
  #            stay on the 30-min series.
  #
  #   10 min — WITHIN-CYCLE. Measured E080 runs are 15.6 to 30.3 min,
  #            so a 30-min window can never fill inside a run: it
  #            always contains off-period data where dew point is
  #            RISING, which nets against the falling run data. The
  #            10-min pair below is what the removal/ingress sensors
  #            read. Against a productive signal of -3.9 to -5.4
  #            degF/h, ~0.42 degF/h of noise is 8-11 % — fine.
  #
  # NB the SHT45 itself is not the constraint (tau63 is seconds for
  # both RH and T). The constraints are the smoothing window and the
  # ~1-2 min transport lag from the machine end to the node alcove.
  # =================================================================
  # --- 30-min trend set -------------------------------------------
  - platform: derivative
    source: sensor.basement_th_node_basement_humidity
    name: "Basement RH Rate"
    unique_id: basement_rh_rate
    unit_time: h
    time_window: "00:30:00"
    round: 2
  # THE degC/h -> degF/h FIX, done at the root rather than by scaling.
  # sensor.basement_th_node_basement_temp_rate_30m is published by the
  # ESPHome node in degC/h, because the node derives its slope from the
  # SHT45 native Celsius reading while publishing temperature in degF.
  # Taking the derivative here off the node degF temperature gives
  # degF/h directly AND uses the same estimator as every other rate.
  # Scaling the node sensor by 9/5 would have left a fifth formula.
  # For the record: a rate is a difference per unit time, so only the
  # 9/5 scale applies and the +32 offset does NOT.
  # 1 degC/h = 1.8 degF/h, and 0 degC/h = 0 degF/h, not 32.
  - platform: derivative
    source: sensor.basement_th_node_basement_temperature
    name: "Basement Temp Rate"
    unique_id: basement_temp_rate
    unit_time: h
    time_window: "00:30:00"
    round: 2
  # Absolute humidity — the honest dehumidification metric. RH and dew
  # point both fall when the compressor merely heats the room; AH does
  # not. This is the series that would have caught the Santa Fe frosted
  # coil immediately (148 kWh/litre, AH never moved).
  - platform: derivative
    source: sensor.basement_th_node_basement_absolute_humidity
    name: "Basement AH Rate"
    unique_id: basement_ah_rate
    unit_time: h
    time_window: "00:30:00"
    round: 3
  # --- 10-min within-cycle pair -----------------------------------
  - platform: derivative
    source: sensor.basement_dew_point
    name: "Basement DP Rate 10m"
    unique_id: basement_dp_rate_10m
    unit_time: h
    time_window: "00:10:00"
    round: 2
  # CAVEAT worth keeping in view: the basement is ~60 % moisture-
  # buffered and dAH/dT = +0.204 g/m3/degF, so a 0.5 degF AC-driven
  # temperature swing injects real apparent AH rate. That artefact is
  # larger on shorter windows. Read this series against the compressor
  # trace, not on its own.
  - platform: derivative
    source: sensor.basement_th_node_basement_absolute_humidity
    name: "Basement AH Rate 10m"
    unique_id: basement_ah_rate_10m
    unit_time: h
    time_window: "00:10:00"
    round: 3
  # === DEHUMIDIFIER RUNTIME (power-gated: tracks compressor-only time) ===
  - platform: history_stats
    name: "Dehumidifier Runtime Today"
    unique_id: dehumidifier_runtime_today
    entity_id: binary_sensor.dehumidifier_compressor_active
    state: "on"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Dehumidifier Runtime Week"
    unique_id: dehumidifier_runtime_week
    entity_id: binary_sensor.dehumidifier_compressor_active
    state: "on"
    type: time
    start: "{{ now() - timedelta(days=7) }}"
    end: "{{ now() }}"


  # ===============================================================
  # DEHUMIDIFIER RH STATISTICS — SENSOR RETIRED 2026-08-07
  # (notes below kept: the sampling_size lesson is general)
  # ===============================================================
  # Provides 60-min mean of the CONTROL RH sensor for stall detection.
  # Used by dehumidifier_rh_stall_shutdown to detect when the unit has made
  # < 0.3 %/hr RH improvement (stall condition).
  #
  # 2026-07-29 SOURCE + SIZING CHANGE. Old: the Shelly at a ~6-min cadence,
  # which put 8-12 readings in a 60-min window, so sampling_size 20 was
  # ample. New: the SHT45 node publishes every 10 s = 360 readings per hour.
  # sampling_size is a HARD CAP on the buffer, so leaving it at 20 would have
  # silently reduced max_age to decoration: the '60-min mean' would really be
  # a 200-second mean.
  #
  # That is not a cosmetic error. dehumidifier_rh_drop_rate_60min computes
  # 2 x (mean - current), which assumes a 1-hour window. Over a 200 s window
  # the mean lags current by only 100 s, so the estimator reads
  # 2 x r x (100/3600) = 0.056 x r. Real pulldown of 0.3-1.0 %/hr would have
  # reported 0.017-0.056 %/hr - permanently under the 0.30 %/hr stall
  # threshold - and every cycle past the 90-min gate would have been killed
  # as a false stall.
  #
  # 360 samples/hr needs >= 360; 400 gives margin. If the node's
  # update_interval is ever changed, recompute this: 3600 / interval_s.
  # ===============================================================

  # SENSOR RETIRED 2026-08-07 with dehumidifier_rh_drop_rate_60min, its
  # only consumer. The sizing lesson above is KEPT deliberately: it
  # applies to every statistics sensor in this file, and the cross-check
  # 24 h means below refer back to it by name.
  # ===============================================================
  # MOLD-LIMIT 60-MIN MEAN (AC-cycle smoothing)
  # ===============================================================
  # sensor.basement_mold_limited_dp is a pure function of air temperature, and
  # basement temperature dips when the house AC runs. Measured 2026-07-31: a
  # 26-min plateau at 69.85 F followed by a 31-min decline to 69.27 F, i.e. a
  # 0.72 degF excursion at about 1.14 degF/hr, still recovering at the end of
  # the export - so the full period is >= 60 min and is NOT bounded by that
  # sample. A 60-min window therefore averages roughly one period, which is
  # the best case; if the AC period lengthens in cooler weather the window
  # will straddle partial cycles and the mean will wobble. If the recommended
  # setpoint visibly hunts, lengthen max_age to 180 min (and sampling_size to
  # ~1200) rather than widening the holdback - the holdback costs runtime,
  # the window does not. This mean is what the
  # setpoint RECOMMENDATION reads, so retuning tracks the season rather than
  # the AC's duty cycle. sensor.basement_dp_headroom deliberately keeps using
  # the INSTANTANEOUS limit: a real-time excursion is a safety fact and must
  # not be averaged away.
  #
  # Cadence: the source follows the node temperature, ~328 samples/hr in the
  # 12 h export. 400 covers it with margin, same sizing as the RH/DP means.
  - platform: statistics
    name: "Basement Mold Limited DP Mean 60min"
    unique_id: basement_mold_limited_dp_mean_60min
    entity_id: sensor.basement_mold_limited_dp
    state_characteristic: mean
    max_age:
      minutes: 60
    sampling_size: 400
    precision: 2

  # ===============================================================
  # DEHUMIDIFIER DP STATISTICS — SENSOR RETIRED 2026-08-07
  # (notes below kept: the cadence measurement is still useful)
  # ===============================================================
  # Feeds dehumidifier_dp_drop_rate_60min. sampling_size is a HARD CAP on
  # the buffer, so it must exceed the samples arriving in the max_age
  # window or the '60-min mean' silently becomes a mean of the last N -
  # the exact trap documented on the RH statistics sensor above.
  #
  # Measured cadence: a 12 h export of sensor.basement_dew_point held 1492
  # points = ~122/hr (the template only writes on a changed value, so this
  # is slower than the node's 10 s publish rate). 400 gives >3x margin and
  # matches the RH sensor's sizing. Re-measure if the template's rounding
  # or the node's interval changes.
  # SENSOR RETIRED 2026-08-07 with dehumidifier_dp_drop_rate_60min, its
  # only consumer. The stall detector now reads sensor.basement_dp_rate.
  # ===============================================================
  # BASEMENT SENSOR CROSS-CHECK — 24 h MEANS
  # ===============================================================
  # The source deltas update once per 5 min (288/day), so sampling_size 320
  # covers the full 24 h window with margin. If the delta cadence is ever
  # raised, raise this too or max_age silently becomes decorative and the
  # 'mean' is really a mean of the last sampling_size samples.
  - platform: statistics
    name: "Basement RH Delta Mean 24h"
    unique_id: basement_rh_delta_mean_24h
    entity_id: sensor.basement_rh_delta_sht45_vs_shelly
    state_characteristic: mean
    max_age:
      hours: 24
    sampling_size: 1000
    precision: 2
  - platform: statistics
    name: "Basement DP Delta Mean 24h"
    unique_id: basement_dp_delta_mean_24h
    entity_id: sensor.basement_dp_delta_sht45_vs_shelly
    state_characteristic: mean
    max_age:
      hours: 24
    sampling_size: 1000
    precision: 2
  - platform: statistics
    name: "Basement Temp Delta Mean 24h"
    unique_id: basement_temp_delta_mean_24h
    entity_id: sensor.basement_temp_delta_sht45_vs_shelly
    state_characteristic: mean
    max_age:
      hours: 24
    sampling_size: 1000
    precision: 2
  # Rolling 2-min MAX of raw power → captures the startup inrush spike.
  # Charted as daily-max (chart 5). Kasa-sampling-limited: trend, not absolute.
  - platform: statistics
    name: "Dehumidifier Power Max 2min"
    unique_id: dehumidifier_power_max_2min
    entity_id: sensor.dehumidifier_current_consumption
    state_characteristic: value_max
    max_age:
      minutes: 2
    sampling_size: 60
    precision: 0

automation:
  # ===============================================================
  # DEHUMIDIFIER AUTOMATIONS
  # ===============================================================
  - id: dehumidifier_auto_on
    alias: "Dehumidifier Auto On"
    description: >-
      Start the unit when binary_sensor.dehumidifier_should_run goes true (RH
      above the ON threshold AND basement at or above min temp), subject to the
      min-off lockout. Controlled variable returned to RH on 2026-08-03; the
      dew-point era ran 2026-07-30 to 2026-08-03.
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.dehumidifier_should_run
        to: "on"
      # Periodic re-check (2026-07-30) — THE SETPOINT BUG.
      #
      # This is the identical defect class already found and fixed in
      # dehumidifier_force_on_backstop on 2026-07-03, but never applied here,
      # to the PRIMARY control path. A state trigger fires only on the
      # TRANSITION to "on". If that transition lands inside the min-off
      # lockout the condition fails, the trigger is consumed, and because
      # should_run STAYS "on" (RH is still above rh_on) it never re-fires.
      #
      # Consequence: after almost every cycle, auto_on was dead. The only
      # thing that actually restarted the unit was the force-on backstop's own
      # /15 re-check at the CEILING — which is why min-off appeared to
      # quantise to 10-25 min (avg ~17.5) and why the band never behaved like
      # a band. The ceiling had quietly become the real ON setpoint.
      #
      # This mattered less when the ceiling sat ~1 point above rh_on (50 vs
      # 49). At the 2026-07-30 band (55/52, ceiling 60) the gap is 5 points,
      # so leaving this unfixed would have parked the true ON setpoint at 60.
      - platform: time_pattern
        minutes: "/15"
    condition:
      # LOCAL-CONTROL GATE (commissioning mode, 2026-08-03). While
      # input_boolean.dehumidifier_local_control is ON, HA does not stop or
      # start the unit - the E080's onboard humidistat does. Placed FIRST so
      # it short-circuits before any sensor is read.
      #
      # Written as a template rather than `condition: state ... state: "off"`
      # so the failure direction is CHOSEN rather than inherited. A state
      # condition testing for "off" is also false when the entity is missing
      # or unknown, which would silently and permanently disable HA control
      # if the helper were ever deleted or failed to load. This form is false
      # ONLY when the boolean is explicitly "on", so anything unreadable
      # degrades back to normal HA control - the designed behaviour, and the
      # one you would notice.
      - condition: template
        value_template: "{{ not is_state('input_boolean.dehumidifier_local_control', 'on') }}"
      - condition: state
        entity_id: switch.dehumidifier
        state: "off"
      # Explicit should_run condition: required now that the periodic trigger
      # exists — the state trigger implied it, time_pattern does not.
      # Node-loss-safe: an unavailable binary_sensor is not "on", so this
      # gates false and stays false.
      - condition: state
        entity_id: binary_sensor.dehumidifier_should_run
        state: "on"
      - condition: template
        value_template: >
          {% set lo = states('input_datetime.dehumidifier_last_off_time') %}
          {% set min_off = states('input_number.dehumidifier_min_off_minutes') | float(30) * 60 %}
          {{ lo in ['unknown', 'unavailable'] or lo[:4] == '1970'
             or (as_timestamp(now()) - as_timestamp(lo, 0)) > min_off }}
    action:
      - service: switch.turn_on
        target:
          entity_id: switch.dehumidifier
  - id: dehumidifier_auto_off
    alias: "Dehumidifier Auto Off"
    description: >-
      Stop the unit when RH clears the OFF threshold, subject to the min-run
      guard and the condensation veto. Max runtime is handled by
      dehumidifier_max_runtime_backstop; stall by dehumidifier_rh_stall_shutdown;
      sensor loss by dehumidifier_sensor_loss_shutdown. None of those three is
      gated by min-run. Controlled variable returned to RH 2026-08-03.
    mode: single
    trigger:
      # Periodic re-check: a template trigger fires only on the false->true
      # edge. If RH is already below rh_off when the unit starts - which the
      # condensation limb of the force-on backstop can cause (dry air, cold
      # surface) - the edge has already passed and auto_off would never fire,
      # running the cycle all the way to the max-runtime backstop.
      #
      # This /15 cadence is ALSO the min-run release mechanism: when min-run
      # blocks a stop the trigger is consumed, and only this periodic
      # re-check brings it back. Consequence to accept: the actual minimum
      # run is min_run rounded UP to the next /15 boundary, so a 30-min
      # setting yields 30-45 min in practice. This is the same quantisation
      # that made min_off behave as 10-25 min in the 2026-07-30
      # investigation. Documented rather than fixed: a finer cadence costs
      # more re-evaluations than the precision is worth here.
      - platform: time_pattern
        minutes: "/15"
      - platform: template
        id: conditions_cleared
        # CONTROL VARIABLE RH as of 2026-08-03. is_number() gates first, so
        # sensor loss makes this false and KEEPS it false (no spurious
        # off-pulse on recovery either); dehumidifier_sensor_loss_shutdown
        # handles the real shutdown with a named stop reason.
        value_template: >
          {% set rh = states('sensor.basement_th_node_basement_humidity') %}
          {% set rh_off = states('input_number.dehumidifier_rh_off_threshold') | float(53) %}
          {{ is_number(rh) and (rh | float(999)) < rh_off }}
    condition:
      # LOCAL-CONTROL GATE - see dehumidifier_auto_on for the rationale.
      # False only when the boolean is explicitly "on"; anything unreadable
      # degrades back to normal HA control.
      - condition: template
        value_template: "{{ not is_state('input_boolean.dehumidifier_local_control', 'on') }}"
      - condition: state
        entity_id: switch.dehumidifier
        state: "on"
      # Explicit RH condition: the template trigger implied it, the periodic
      # trigger does not. float(999) on failure means an unreadable RH is
      # never 'below the off threshold', so sensor loss cannot masquerade as
      # a satisfied cycle.
      - condition: template
        value_template: >
          {% set rh = states('sensor.basement_th_node_basement_humidity') %}
          {% set rh_off = states('input_number.dehumidifier_rh_off_threshold') | float(53) %}
          {{ is_number(rh) and (rh | float(999)) < rh_off }}
      # MIN-RUN GUARD (added 2026-08-03, REBASED 2026-08-05).
      #
      # Basis is dehumidifier_cycle_start_time - the COMPRESSOR-start stamp
      # written by dehumidifier_cycle_start_capture on every
      # binary_sensor.dehumidifier_compressor_active off->on transition.
      #
      # WAS dehumidifier_last_on_time (the switch-ON stamp). That shared one
      # clock with two other guards, and dehumidifier_local_control_exit
      # deliberately re-stamps it to now() so the max-runtime backstop does
      # not fire on handback. Consequence: exiting local control armed a
      # fresh min-run clock and auto_off could not fire for min_run minutes -
      # 30-45 min in practice with the /15 release cadence - so the plug
      # stayed on after handing control back to HA. Observed 2026-08-05.
      # last_on_time now serves only the max-runtime backstop and the stall
      # gate, both of which genuinely DO want a fresh clock on handback.
      #
      # This is also the semantically correct basis: min-run exists to stop
      # unproductively short COMPRESSOR runs, and every HA 'on' carries an
      # 80 s to 3 min E080 blower lead-in before the compressor engages
      # (measured from the plug power trace 2026-08-04). Counting from
      # switch-on charged that dead time against min-run.
      #
      # Single-writer rule still satisfied: cycle_start_capture is the only
      # writer of this stamp and it fires on EVERY compressor start -
      # HA-commanded, manual, force-on, or the unit's own humidistat during
      # local control (that automation is not local-control gated, which is
      # exactly why the stamp stays current through a commissioning window).
      #
      # FAILS OPEN by design, three ways: an unset/1970 stamp passes, a
      # missing input_number defaults to 0, and a stale stamp from a previous
      # cycle also passes. A missing timer must never be able to strand the
      # compressor on. Cost of failing open is one short cycle; cost of
      # failing closed is an unattended runaway. The stale-stamp window - the
      # blower lead-in, before compressor_active goes on - is harmless: the
      # RH condition above still has to hold, and HA only just started the
      # unit because RH was above rh_on.
      - condition: template
        value_template: >
          {% set cs = states('input_datetime.dehumidifier_cycle_start_time') %}
          {% set min_run = states('input_number.dehumidifier_min_run_minutes') | float(0) * 60 %}
          {{ cs in ['unknown', 'unavailable'] or cs[:4] == '1970'
             or (as_timestamp(now()) - as_timestamp(cs, 0)) >= min_run }}
      # MOLD VETO. Under RH control this is no longer a control-conflict
      # guard (rh < rh_off and rh > ceiling cannot both hold when the band
      # is ordered below the ceiling). Retained as a CONFIGURATION-ERROR
      # catch: if rh_off is ever set above the ceiling, this stops the unit
      # from switching off while the mold limit is breached.
      # Fails OPEN: unreadable RH or ceiling lifts the veto.
      - condition: template
        value_template: >
          {% set rh = states('sensor.basement_th_node_basement_humidity') %}
          {% set ceiling = states('input_number.dehumidifier_rh_force_on') %}
          {{ not (is_number(rh) and is_number(ceiling)
                  and (rh | float(0)) > (ceiling | float(60))) }}
      # CONDENSATION VETO - unchanged, and deliberately still in dew-point
      # units. Condensation is a dew-point-versus-surface phenomenon; RH
      # cannot express it without knowing the surface temperature. This is
      # the one place where the DP machinery is not merely diagnostic.
      #
      # For scale: with the bank surface at air temperature and an 8 degF
      # margin, the condensation limit corresponds to roughly 75-76 % RH
      # across 62-72 degF - far above the 60 % mold ceiling, so mold binds
      # first. The surface has to run about 6.5 degF colder than the air
      # before this veto becomes the binding constraint. That is what it is
      # watching for.
      #
      # Fails OPEN: if the margin sensor or its setpoint is unreadable the
      # inner test is false, the veto does not apply, and normal RH control
      # continues. A missing guard must not strand the compressor on.
      - condition: template
        value_template: >
          {% set margin = states('sensor.basement_condensation_margin') %}
          {% set margin_min = states('input_number.basement_dp_margin_min') %}
          {{ not (is_number(margin) and is_number(margin_min)
                  and (margin | float(99)) < (margin_min | float(8))) }}
    action:
      - service: input_select.select_option
        target:
          entity_id: input_select.dehumidifier_last_stop_reason
        data:
          option: "{{ trigger.id | default('conditions_cleared', true) }}"
      - service: switch.turn_off
        target:
          entity_id: switch.dehumidifier
  - id: dehumidifier_stamp_last_off
    alias: "Dehumidifier Stamp Last Off Time"
    description: "Record every dehumidifier OFF for the reboot-proof anti-short-cycle lockout (covers conditions_cleared, max_runtime, rh_stall, and manual offs)"
    mode: single
    trigger:
      - platform: state
        entity_id: switch.dehumidifier
        to: "off"
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.dehumidifier_last_off_time
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
  - id: dehumidifier_stamp_last_on
    alias: "Dehumidifier Stamp Last On Time"
    description: "Companion to the OFF stamp: records every switch ON as the dip-proof, restart-proof basis for the max-runtime backstop (added 2026-07-03)"
    mode: single
    trigger:
      - platform: state
        entity_id: switch.dehumidifier
        to: "on"
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.dehumidifier_last_on_time
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
  - id: dehumidifier_max_runtime_backstop
    alias: "Dehumidifier Max Runtime Backstop"
    description: >-
      Dip-proof max runtime cap (configurable via input_number.dehumidifier_max_runtime_hours).
      The existing max_runtime trigger in Dehumidifier Auto Off requires compressor_active
      to stay 'on' UNINTERRUPTED; any power dip > the 10 s delay_off (defrost, thermal
      protection) resets that clock. This backstop keys on the switch-ON wall clock
      instead, which nothing resets.
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/15"
    condition:
      # LOCAL-CONTROL GATE - see dehumidifier_auto_on for the rationale.
      # False only when the boolean is explicitly "on"; anything unreadable
      # degrades back to normal HA control.
      - condition: template
        value_template: "{{ not is_state('input_boolean.dehumidifier_local_control', 'on') }}"
      - condition: state
        entity_id: switch.dehumidifier
        state: "on"
      # 2026-08-24: fallback was `| float(4)` against a helper holding 2.0, so an
      # unreadable helper DOUBLED the runaway cap - on the one automation whose
      # entire job is to stop a compressor nobody is watching. Unlike the stall
      # detector this must never be gated off by is_number(): a guard that
      # disables itself when an input is missing is not a backstop. So it keeps a
      # literal fallback, deliberately set to the CONSERVATIVE end. This is not a
      # copy of the helper and must not be kept in step with it - if the helper
      # rises above 2 h, this stays at 2 h on purpose, because the only job of
      # the fallback is to bound a run when the configured bound is unreadable.
      - condition: template
        value_template: >
          {% set lo = states('input_datetime.dehumidifier_last_on_time') %}
          {% set max_hrs = states('input_number.dehumidifier_max_runtime_hours') | float(2) %}
          {{ lo not in ['unknown', 'unavailable'] and lo[:4] != '1970'
             and (as_timestamp(now()) - as_timestamp(lo, 0)) > (max_hrs * 3600) }}
    action:
      - service: input_select.select_option
        target:
          entity_id: input_select.dehumidifier_last_stop_reason
        data:
          option: max_runtime
      - service: switch.turn_off
        target:
          entity_id: switch.dehumidifier
      - service: system_log.write
        data:
          level: warning
          message: >-
            Dehumidifier max-runtime BACKSTOP fired: switch has been on
            {{ ((as_timestamp(now()) - as_timestamp(states('input_datetime.dehumidifier_last_on_time'), 0)) / 60) | round(0) }}
            min (wall clock since last ON, limit {{ states('input_number.dehumidifier_max_runtime_hours') | float(4) }} hrs).
            The compressor-active trigger did not fire — likely reset by a power dip (defrost/thermal cycle).
            RH {{ states('sensor.basement_th_node_basement_humidity') }}%.
  - id: dehumidifier_force_on_backstop
    alias: "Dehumidifier Force On Backstop"
    description: "Envelope override (retargeted 2026-07-30): runs the unit when EITHER air RH exceeds the mold ceiling OR basement dew point closes on the coldest measured surface. Kept as one automation, not two, so there is a single writer and a single /15 re-check - a second periodic force-on would compound the min-off quantisation already observed. Envelope protection outranks short-cycle protection only when genuinely at a limit."
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.basement_th_node_basement_humidity
        above: input_number.dehumidifier_rh_force_on
      # Condensation limb (2026-07-30). Dew point closing on the coldest
      # measured surface is the only mechanism that can wet the bare copper
      # bus bars, so it belongs in this guard rather than in the RH band.
      - platform: numeric_state
        entity_id: sensor.basement_condensation_margin
        below: input_number.basement_dp_margin_min
      # Periodic re-check (2026-07-03): numeric_state fires only on the CROSSING.
      # If the crossing lands inside the 10-min lockout the trigger is consumed
      # and, with RH parked above the ceiling, never re-fires. This makes the
      # corrosion ceiling a guarantee: conditions below gate everything, so when
      # RH is below the ceiling it is a no-op.
      - platform: time_pattern
        minutes: "/15"
    condition:
      # LOCAL-CONTROL GATE - see dehumidifier_auto_on for the rationale.
      # False only when the boolean is explicitly "on"; anything unreadable
      # degrades back to normal HA control.
      - condition: template
        value_template: "{{ not is_state('input_boolean.dehumidifier_local_control', 'on') }}"
      - condition: state
        entity_id: switch.dehumidifier
        state: "off"
      # Explicit envelope condition (2026-07-03, widened 2026-07-30): required
      # because the periodic trigger implies nothing. Either limb qualifies.
      #
      # Written as an OR template rather than two numeric_state conditions
      # because condition lists are ANDed - two numeric_state entries would
      # require BOTH limits to be violated at once, which is exactly the
      # opposite of the intent and would silently disable the guard.
      #
      # is_number() gates each limb first, so a dead node or a missing
      # input_number makes that limb false and KEEPS it false. Node-loss-safe
      # by construction: forcing a compressor on from a sensor you cannot read
      # is worse than briefly not forcing it.
      - condition: template
        value_template: >
          {% set rh = states('sensor.basement_th_node_basement_humidity') %}
          {% set ceiling = states('input_number.dehumidifier_rh_force_on') %}
          {% set margin = states('sensor.basement_condensation_margin') %}
          {% set margin_min = states('input_number.basement_dp_margin_min') %}
          {% set rh_hit = is_number(rh) and is_number(ceiling)
                          and (rh | float(0)) > (ceiling | float(60)) %}
          {% set dp_hit = is_number(margin) and is_number(margin_min)
                          and (margin | float(99)) < (margin_min | float(8)) %}
          {{ rh_hit or dp_hit }}
      - condition: template
        value_template: >
          {{ is_number(states('sensor.basement_th_node_basement_temperature')) and
             states('sensor.basement_th_node_basement_temperature') | float(0)
             >= states('input_number.dehumidifier_min_temp') | float(60) }}
      - condition: template
        value_template: >
          {% set lo = states('input_datetime.dehumidifier_last_off_time') %}
          {{ lo in ['unknown', 'unavailable'] or lo[:4] == '1970'
             or (as_timestamp(now()) - as_timestamp(lo, 0)) > 600 }}
    action:
      - service: switch.turn_on
        target:
          entity_id: switch.dehumidifier
  # ===============================================================
  # LOCAL (UNIT) CONTROL - COMMISSIONING MODE (2026-08-03)
  #
  # Three automations, one job: while the mode is on, guarantee the unit
  # has power and stay out of its way. Every other dehumidifier
  # automation is gated off by the local-control condition.
  #
  # SINGLE WRITER: dehumidifier_local_control_power_hold is the ONLY
  # automation permitted to touch switch.dehumidifier during local mode,
  # and it is on-only. Nothing in HA can switch the unit off while the
  # mode is active, including a manual toggle - the hold will simply put
  # it back within 5 minutes.
  # ===============================================================
  - id: dehumidifier_local_control_enter
    alias: "Dehumidifier Local Control - Enter"
    description: >-
      Stamp the entry time, mark the stop reason so the dashboard badge stops
      reporting a stale HA stop, and raise a standing notification. Does NOT
      write the switch - power is handled by the hold automation, so there is
      exactly one writer.
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.dehumidifier_local_control
        to: "on"
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.dehumidifier_local_control_since
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: input_select.select_option
        target:
          entity_id: input_select.dehumidifier_last_stop_reason
        data:
          option: local_control
      - service: system_log.write
        data:
          level: warning
          message: >-
            Dehumidifier LOCAL CONTROL enabled. HA will hold the plug powered and
            will not switch it off. auto_on, auto_off, force_on_backstop,
            max_runtime_backstop, rh_stall_shutdown and sensor_loss_shutdown are
            all suspended. The E080 onboard humidistat is now the only controller.
            Basement {{ states('sensor.basement_th_node_basement_temperature') }} F,
            RH {{ states('sensor.basement_th_node_basement_humidity') }} %,
            DP {{ states('sensor.basement_dew_point') }} F.
      - service: persistent_notification.create
        data:
          notification_id: dehumidifier_local_control
          title: "🔧 Dehumidifier on LOCAL (unit) control"
          message: >
            HA is in monitoring mode. The E080 is running on its own onboard
            humidistat and HA will not switch it off - every HA-side stop is
            suspended, including the mold ceiling, the condensation guard, the
            runtime cap and the dead-sensor cut-out.


            Logging, the SHT45 node, the Shelly cross-check, compressor/power
            capture, duty, cost and the watchdog all keep running. This is the
            window in which to capture the native power trace and retune
            input_number.dehumidifier_power_threshold.


            Turn the toggle off to hand control back to HA.
  - id: dehumidifier_local_control_power_hold
    alias: "Dehumidifier Local Control - Hold Power On"
    description: >-
      Keep switch.dehumidifier energised for the whole local-control window so
      the unit's own humidistat can govern. On-only writer. Re-asserts every
      5 min, so a manual off, a power blip or an HA restart cannot silently
      leave the unit dead during a commissioning run.
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.dehumidifier_local_control
        to: "on"
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: input_boolean.dehumidifier_local_control
        state: "on"
      - condition: state
        entity_id: switch.dehumidifier
        state: "off"
      # MIN-OFF IS STILL HONOURED, and this is not negotiable. The compressor
      # is PSC - no start capacitor or relay - so it cannot start against
      # unequalised head pressure; an early restart stalls the rotor and trips
      # the overload. Entering local mode two minutes after an HA stop must not
      # slam power back on. Worst case the unit powers up min_off after the
      # last stop, which for commissioning is a rounding error.
      #
      # Fails OPEN (allows power-up) on an unset/1970 stamp: at that point
      # there is no evidence of a recent stop, and leaving the unit unpowered
      # for a whole commissioning window is the worse outcome.
      - condition: template
        value_template: >
          {% set lo = states('input_datetime.dehumidifier_last_off_time') %}
          {% set min_off = states('input_number.dehumidifier_min_off_minutes') | float(30) * 60 %}
          {{ lo in ['unknown', 'unavailable'] or lo[:4] == '1970'
             or (as_timestamp(now()) - as_timestamp(lo, 0)) > min_off }}
    action:
      - service: switch.turn_on
        target:
          entity_id: switch.dehumidifier
  - id: dehumidifier_local_control_exit
    alias: "Dehumidifier Local Control - Exit"
    description: >-
      Hand control back to HA cleanly. The important part is the re-stamp: see
      the comment on the action.
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.dehumidifier_local_control
        to: "off"
    action:
      # RE-STAMP THE ON CLOCK. During local mode the switch has been
      # continuously on - possibly for 24 h - so dehumidifier_last_on_time is
      # stale by exactly that much. Without this, dehumidifier_max_runtime_
      # backstop evaluates (now - last_on) > max_runtime on its very next /15
      # tick and cuts the unit off within 15 minutes of handing back, logging
      # a max_runtime stop that never happened. That would look like a
      # mystery shutdown and would be hard to attribute.
      #
      # This clock is a control timer, not a data record: runtime, duty, kWh
      # and cost all derive from compressor_active and are untouched.
      - choose:
          - conditions:
              - condition: state
                entity_id: switch.dehumidifier
                state: "on"
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.dehumidifier_last_on_time
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        default: []
      - service: persistent_notification.dismiss
        data:
          notification_id: dehumidifier_local_control
      - service: persistent_notification.dismiss
        data:
          notification_id: dehumidifier_local_control_overdue
      - service: system_log.write
        data:
          level: warning
          message: >-
            Dehumidifier LOCAL CONTROL disabled; HA control resumed. On-clock
            re-stamped to now so the max-runtime backstop starts a fresh cycle.
            Basement {{ states('sensor.basement_th_node_basement_temperature') }} F,
            RH {{ states('sensor.basement_th_node_basement_humidity') }} %,
            band {{ states('input_number.dehumidifier_rh_on_threshold') }} /
            {{ states('input_number.dehumidifier_rh_off_threshold') }} %.
  - id: dehumidifier_local_control_reminder
    alias: "Dehumidifier Local Control - Left On Reminder"
    description: >-
      Nag hourly once local control has been on longer than
      input_number.dehumidifier_local_control_max_hours. There is deliberately
      NO auto-revert: silently taking control back partway through a
      commissioning run would corrupt the very measurement the mode exists to
      make, and the residual risk is soft - the E080's own humidistat holds
      ~50 % RH, below the 60 % mold ceiling, so what is actually being lost is
      the envelope logic and the energy, not an acute limit.
    mode: single
    trigger:
      - platform: time_pattern
        hours: "/1"
        minutes: 0
    condition:
      - condition: state
        entity_id: input_boolean.dehumidifier_local_control
        state: "on"
      - condition: template
        value_template: >
          {% set s = states('input_datetime.dehumidifier_local_control_since') %}
          {% set lim = states('input_number.dehumidifier_local_control_max_hours') | float(36) * 3600 %}
          {{ s not in ['unknown', 'unavailable'] and s[:4] != '1970'
             and (as_timestamp(now()) - as_timestamp(s, 0)) > lim }}
    action:
      - service: persistent_notification.create
        data:
          notification_id: dehumidifier_local_control_overdue
          title: "⚠️ Dehumidifier still on LOCAL control"
          message: >
            Local (unit) control has been on for
            {{ ((as_timestamp(now()) - as_timestamp(states('input_datetime.dehumidifier_local_control_since'), 0)) / 3600) | round(1) }}
            hours, past the
            {{ states('input_number.dehumidifier_local_control_max_hours') }} h limit.


            Every HA-side stop is still suspended: mold ceiling, condensation
            guard, runtime cap, stall cut-out and dead-sensor cut-out. Basement
            is {{ states('sensor.basement_th_node_basement_humidity') }} % RH at
            {{ states('sensor.basement_th_node_basement_temperature') }} F.


            Turn the toggle off to resume HA control, or raise the limit if the
            run is meant to be this long.
      - service: system_log.write
        data:
          level: warning
          message: >-
            Dehumidifier local control has been active
            {{ ((as_timestamp(now()) - as_timestamp(states('input_datetime.dehumidifier_local_control_since'), 0)) / 3600) | round(1) }} h,
            past the {{ states('input_number.dehumidifier_local_control_max_hours') }} h limit.
            All HA-side stops remain suspended.
  # ===============================================================
  # DEHUMIDIFIER PERFORMANCE TRACKING (Aprilaire E080; was "Santa Fe Classic Tuned")
  # Triggers on compressor_active (power-gated), not switch state.
  # Control automations (auto_on / auto_off) are unchanged above.
  # ===============================================================
  - id: dehumidifier_cycle_start_capture
    alias: "Dehumidifier Cycle Start Capture"
    description: "Capture dew point and timestamp when compressor turns on"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.dehumidifier_compressor_active
        from: "off"
        to: "on"
    condition:
      - condition: template
        value_template: >
          {% set dp = states('sensor.basement_dew_point') %}
          {% set dp_val = dp | float(-999) %}
          {{ dp not in ['unknown', 'unavailable'] and dp_val >= 20 and dp_val <= 90 }}
    action:
      - service: counter.increment
        target:
          entity_id: counter.dehumidifier_cycles_today
      - service: input_number.set_value
        target:
          entity_id: input_number.dehumidifier_cycle_start_dp
        data:
          value: "{{ states('sensor.basement_dew_point') | float(0) | round(1) }}"
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.dehumidifier_cycle_start_time
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      # Calculate hold time from last cycle end (only if last stop was conditions_cleared)
      - if:
          - condition: template
            value_template: >
              {% set last_end = states('input_datetime.dehumidifier_last_cycle_end_time') %}
              {% set reason = states('input_select.dehumidifier_last_stop_reason') %}
              {{ last_end not in ['unknown', 'unavailable'] and
                 last_end[:4] != '1970' and
                 reason == 'conditions_cleared' }}
        then:
          - service: input_number.set_value
            target:
              entity_id: input_number.dehumidifier_last_hold_hours
            data:
              value: >
                {% set last_end = states('input_datetime.dehumidifier_last_cycle_end_time') %}
                {% set end_ts = as_timestamp(last_end, 0) %}
                {% set hold_h = (as_timestamp(now()) - end_ts) / 3600 %}
                {{ [[hold_h | round(1), 0] | max, 72] | min }}
  - id: dehumidifier_cycle_end_capture
    alias: "Dehumidifier Cycle End Capture"
    description: "Calculate pull-down rate and cycle duration when compressor turns off"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.dehumidifier_compressor_active
        from: "on"
        to: "off"
    condition:
      - condition: template
        value_template: >
          {% set dp = states('sensor.basement_dew_point') %}
          {% set start_time = states('input_datetime.dehumidifier_cycle_start_time') %}
          {{ dp not in ['unknown', 'unavailable'] and
             start_time not in ['unknown', 'unavailable'] and
             start_time[:4] != '1970' }}
    action:
      - variables:
          cycle_minutes: >
            {% set start_ts = as_timestamp(states('input_datetime.dehumidifier_cycle_start_time'), 0) %}
            {{ ((as_timestamp(now()) - start_ts) / 60) | round(1) }}
          start_dp: "{{ states('input_number.dehumidifier_cycle_start_dp') | float(0) }}"
          current_dp: "{{ states('sensor.basement_dew_point') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.dehumidifier_last_cycle_minutes
        data:
          value: "{{ [[cycle_minutes | float(0), 0] | max, 300] | min }}"
      # Only calculate pull-down rate for cycles >= 10 minutes (short cycle guard)
      - if:
          - condition: template
            value_template: "{{ cycle_minutes | float(0) >= 10 }}"
        then:
          - service: input_number.set_value
            target:
              entity_id: input_number.dehumidifier_last_pull_down_rate
            data:
              value: >
                {% set delta_dp = start_dp | float(0) - current_dp | float(0) %}
                {% set hours = cycle_minutes | float(0) / 60 %}
                {% set rate = delta_dp / hours if hours > 0 else 0 %}
                {{ [[rate | round(1), -10] | max, 20] | min }}
        else:
          - service: input_number.set_value
            target:
              entity_id: input_number.dehumidifier_last_pull_down_rate
            data:
              value: 0
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.dehumidifier_last_cycle_end_time
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
  - id: dehumidifier_cycle_counter_reset
    alias: "Dehumidifier Cycle Counter Reset"
    description: "Reset daily cycle counter at midnight"
    trigger:
      - platform: time
        at: "00:00:00"
    action:
      - service: counter.reset
        target:
          entity_id: counter.dehumidifier_cycles_today
  # ===============================================================
  # DEHUMIDIFIER STALL DETECTION (RH-based, tuned from 2026 data)
  # ---------------------------------------------------------------
  # Fires every 30 min while compressor is active and runtime > 90 min.
  # Stops the unit early when RH has improved < 0.3 %/hr over the
  # prior 60 min — the measured stall signature (5 of 8 cycles stall
  # at hr 3-4).  Uses RH directly (6-min median updates, 7.5× better
  # SNR than DP at 0.051°F/step).
  #
  # 2026-08-07: reads sensor.basement_dp_rate (platform: derivative,
  # 30-min time_window, unit_time h). NEGATIVE = dew point falling.
  # input_number.dehumidifier_dp_stall_threshold stays a POSITIVE
  # magnitude; the test is rate > -threshold.
  #
  # KNOWN INERT: the 5400 s (90 min) runtime gate below cannot be reached
  # — measured E080 runs are 15.6 to 30.3 min. This automation therefore
  # never fires today. Lowering the gate alone is NOT enough: a 30-min
  # rolling window is comparable to a whole run and would straddle the
  # preceding off period. The structurally correct replacement is a
  # per-cycle check at compressor-off, (AH_start - AH_end)/run_hours
  # against about -1.0 g/m3/h vs -1.74 to -2.23 measured healthy.
  #
  # SEASONAL NOTE: In July–Aug the unit pulls hard all cycle; this
  # automation will not fire (drop rate stays > 0.3%/hr). In June and
  # September it captures the stall pattern observed in the data.
  # ===============================================================
  - id: dehumidifier_rh_stall_shutdown
    alias: "Dehumidifier Stall Shutdown (dew point)"
    description: "Stop the unit early when DEW-POINT improvement has stalled. Retargeted from RH 2026-07-30: RH falls whenever the compressor heats the room, so an RH-based stall detector reported healthy progress exactly when no water was being removed. Automation id kept so history and the last_triggered guards stay continuous."
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/30"
    condition:
      # LOCAL-CONTROL GATE - see dehumidifier_auto_on for the rationale.
      # False only when the boolean is explicitly "on"; anything unreadable
      # degrades back to normal HA control.
      - condition: template
        value_template: "{{ not is_state('input_boolean.dehumidifier_local_control', 'on') }}"
      # Compressor must be actively running
      - condition: state
        entity_id: binary_sensor.dehumidifier_compressor_active
        state: "on"
      # Must have been running > 40 min (skip compressor warmup and early-cycle noise)
      #
      # Gate rebased 2026-07-03: last_changed of compressor_active resets on any
      # >10 s power dip AND on every HA restart, delaying stall detection each
      # time. The switch-ON stamp is immune to both.
      #
      # REBASED AGAIN 2026-08-24, 90 -> 40 min. The 90 min was sized for the Santa
      # Fe, which ran ~6.9 h/day. The E080 does not run that long: over 151
      # completed cycles from 2026-08-05 (first settled day after install) to
      # 2026-08-24 the distribution is p50 15.2, p95 21.1, p99 30.0, max 30.4 min.
      # A 90-min gate is therefore UNREACHABLE in this regime - the detector had
      # been structurally incapable of firing since the changeover, which is the
      # R7 failure mode: a rule that cannot fire looks exactly like a rule with
      # nothing to report.
      #
      # 40 min: 0 of 151 healthy cycles reach it, 32 % clear of the observed max
      # and 1.3x the p99, and well past the 10-14 min steady window the SPC
      # capture uses. It is a WARMUP SKIP, not the discriminator - the DP-rate
      # test below is what separates stalled from drying, and a healthy run at
      # -3.9 to -5.4 degF/h stays two orders clear of the 0.05 threshold even if
      # it did reach the gate.
      #
      # DETECTION LATENCY. The trigger is a /30 time pattern, so the first
      # eligible evaluation lands 40-70 min into a run depending on where the
      # start falls relative to :00 and :30. Against the 120 min max-runtime
      # backstop that buys 50-80 min of earlier detection, where the old gate
      # bought none. Tighten the trigger to /10 if that is not enough.
      - condition: template
        value_template: >
          {% set lo = states('input_datetime.dehumidifier_last_on_time') %}
          {{ lo not in ['unknown', 'unavailable'] and lo[:4] != '1970'
             and (as_timestamp(now()) - as_timestamp(lo, 0)) > 2400 }}
      # DP must not be falling fast enough.
      #
      # 2026-08-07 SIGN CONVENTION CHANGE. Source moved from
      # sensor.dehumidifier_dp_drop_rate_60min (RETIRED; positive meant
      # "DP falling") to sensor.basement_dp_rate, which is a signed
      # derivative where NEGATIVE means "DP falling".
      #
      # The threshold input_number is UNCHANGED and stays a positive
      # MAGNITUDE, so its 0.05-1.0 range is still valid and no value
      # needs re-entering. The comparison is what flips:
      #
      #   old:  drop_rate <  thr     e.g.  +0.03 <  +0.05  -> stalled
      #   new:  rate      > -thr     e.g.  -0.03 >  -0.05  -> stalled
      #
      # Both say the same thing: DP is improving by less than `thr` degF
      # per hour. A healthy run measures -3.9 to -5.4 degF/h, comfortably
      # below the threshold, so it does not trip.
      #
      # THE THRESHOLD IS THE HELPER'S, NOT A NUMBER WRITTEN HERE. It reads
      # 0.05 as of 2026-08-24; the examples above are illustrative and go
      # stale the moment you retune it, which is why nothing downstream
      # keys on the literal. The old comment quoted 0.15 against a helper
      # that had already moved to 0.05.
      #
      # FAIL-SAFE DIRECTION PRESERVED, BOTH INPUTS. is_number() now gates
      # the THRESHOLD as well as the rate. Until 2026-08-24 an unreadable
      # helper fell through to `| float(0.15)` and silently ran a 3x
      # threshold; now it makes the condition FALSE and no shutdown occurs.
      # Both float(-99) defaults are unreachable behind those gates: the
      # rate default reads "drying hard", and the threshold default makes
      # the test `rate > 99`, i.e. never stalled. Not stopping is the safe
      # direction here because dehumidifier_max_runtime_backstop still
      # caps the run independently.
      #
      # mode: single prevents re-entry so one stall reading won't double-fire.
      - condition: template
        value_template: >
          {% set rate = states('sensor.basement_dp_rate') %}
          {% set thr = states('input_number.dehumidifier_dp_stall_threshold') %}
          {{ is_number(rate) and is_number(thr)
             and (rate | float(-99)) > (0 - (thr | float(-99))) }}
    action:
      - service: input_select.select_option
        target:
          entity_id: input_select.dehumidifier_last_stop_reason
        data:
          option: "dp_stall"
      - service: switch.turn_off
        target:
          entity_id: switch.dehumidifier
      - service: system_log.write
        data:
          level: info
          message: >
            Dehumidifier stall shutdown: DP rate {{ states('sensor.basement_dp_rate') | float(0) | round(3) }} degF/hr
            (needed <= -{{ states('input_number.dehumidifier_dp_stall_threshold') }} degF/hr,
            runtime {{ ((now() - states.binary_sensor.dehumidifier_compressor_active.last_changed).total_seconds() / 60) | round(0) | int(0) }} min).
            DP {{ states('sensor.basement_dew_point') }}F,
            AH rate {{ states('sensor.basement_ah_rate') }} g/m3/h,
            RH {{ states('sensor.basement_th_node_basement_humidity') }}%.
  # ===============================================================
  # DEHUMIDIFIER OPERATING COST — daily EOD accumulation
  # Fires 23:59:30 (after watts capture 23:59:00, before 00:00 resets).
  # That 23:59:00 capture is capture_daily_dehumidifier_running_watts in
  # packages/dehumidifier_spc.yaml, added 2026-08-07. Until then this
  # comment referred to an automation that had never been written, which
  # is why the Running Watts SPC chart plotted four non-existent entities.
  # Adds today's cost (sensor.dehumidifier_daily_cost, already rate-aware)
  # to the year-to-date accumulator and stamps the capture time so the
  # live YTD sensor stops double-counting today.
  # ===============================================================
  - id: capture_daily_dehumidifier_duty_kwh
    alias: "Capture Daily Dehumidifier Duty & kWh"
    description: "EOD 23:59:30 shift of the 7-day duty% and kWh buffers. Captured EVERY day (incl. 0-run days) for purge-immune duty/energy tracking."
    mode: single
    trigger:
      - platform: time
        at: "23:59:30"
    action:
      - variables:
          capture_stamp: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          duty_today: >-
            {% set rt = states('sensor.dehumidifier_runtime_today') | float(0) %}
            {{ (rt / 24 * 100) | round(1) }}
          kwh_today: "{{ states('sensor.dehumidifier_energy_daily') | float(0) | round(3) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.dehumidifier_duty_day_7
        data:
          value: "{{ states('input_number.dehumidifier_duty_day_6') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.dehumidifier_duty_day_6
        data:
          value: "{{ states('input_number.dehumidifier_duty_day_5') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.dehumidifier_duty_day_5
        data:
          value: "{{ states('input_number.dehumidifier_duty_day_4') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.dehumidifier_duty_day_4
        data:
          value: "{{ states('input_number.dehumidifier_duty_day_3') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.dehumidifier_duty_day_3
        data:
          value: "{{ states('input_number.dehumidifier_duty_day_2') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.dehumidifier_duty_day_2
        data:
          value: "{{ states('input_number.dehumidifier_duty_day_1') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.dehumidifier_duty_day_1
        data:
          value: "{{ duty_today }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.dehumidifier_kwh_day_7
        data:
          value: "{{ states('input_number.dehumidifier_kwh_day_6') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.dehumidifier_kwh_day_6
        data:
          value: "{{ states('input_number.dehumidifier_kwh_day_5') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.dehumidifier_kwh_day_5
        data:
          value: "{{ states('input_number.dehumidifier_kwh_day_4') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.dehumidifier_kwh_day_4
        data:
          value: "{{ states('input_number.dehumidifier_kwh_day_3') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.dehumidifier_kwh_day_3
        data:
          value: "{{ states('input_number.dehumidifier_kwh_day_2') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.dehumidifier_kwh_day_2
        data:
          value: "{{ states('input_number.dehumidifier_kwh_day_1') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.dehumidifier_kwh_day_1
        data:
          value: "{{ kwh_today }}"
      - service: logbook.log
        data:
          name: "Dehumidifier Duty/kWh"
          message: "Captured duty {{ duty_today }}%, energy {{ kwh_today }} kWh"
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.dehumidifier_duty_kwh_capture_last_ok
        data:
          datetime: "{{ capture_stamp }}"
  - id: capture_daily_dehumidifier_cost
    alias: "Capture Daily Dehumidifier Cost"
    mode: single
    trigger:
      - platform: time
        at: "23:59:30"
    action:
      - variables:
          capture_stamp: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          today_cost: "{{ states('sensor.dehumidifier_daily_cost') | float(0) }}"
          acc: "{{ states('input_number.dehumidifier_cost_year_acc') | float(0) }}"
      - service: input_number.set_value
        target: {entity_id: input_number.dehumidifier_cost_year_acc}
        data: {value: "{{ (acc + today_cost) | round(2) }}"}
      - service: input_datetime.set_datetime
        target: {entity_id: input_datetime.dehumidifier_cost_capture_last_ok}
        data: {datetime: "{{ capture_stamp }}"}
      - service: system_log.write
        data:
          level: info
          message: "Dehumidifier cost captured: +${{ today_cost }} -> YTD ${{ (acc + today_cost) | round(2) }}"
  # ===============================================================
  # DEHUMIDIFIER OPERATING COST — yearly reset (mirrors reset_yearly_hdd)
  # On Jan 1: snapshot the season total into prev-year (for comparison),
  # then zero the YTD accumulator. Scheduled + startup catch-up so a reboot
  # across midnight Jan 1 still resets exactly once.
  # ===============================================================
  - id: reset_yearly_dehumidifier_cost
    alias: "Reset Yearly Dehumidifier Cost"
    description: "Snapshot prior-year cost then zero YTD on Jan 1, with startup catch-up"
    mode: single
    trigger:
      - platform: time
        at: "00:04:00"
        id: scheduled
      - platform: homeassistant
        event: start
        id: startup
    condition:
      - condition: template
        value_template: >
          {% set last_ok = states('input_datetime.dehumidifier_cost_capture_last_ok') %}
          {% set year_val = states('input_number.dehumidifier_cost_year_acc') | float(0) %}
          {% if not (now().month == 1 and now().day == 1) %}
            false
          {% elif year_val == 0 %}
            false
          {% elif now().hour < 3 %}
            true
          {% elif last_ok not in ['unknown', 'unavailable', '1970-01-01 00:00:00'] %}
            {% set last_capture = last_ok | as_datetime | as_local %}
            {{ last_capture.year != now().year }}
          {% else %}
            false
          {% endif %}
    action:
      - service: input_number.set_value
        target: {entity_id: input_number.dehumidifier_cost_prev_year}
        data: {value: "{{ states('input_number.dehumidifier_cost_year_acc') | float(0) | round(2) }}"}
      - service: input_number.set_value
        target: {entity_id: input_number.dehumidifier_cost_year_acc}
        data: {value: 0}
      - service: system_log.write
        data:
          level: info
          message: "Dehumidifier cost yearly reset: prev-year snapshot taken, YTD zeroed (trigger: {{ trigger.id }})"
  # ===============================================================
  # DEHUMIDIFIER CONTROL-SENSOR LOSS
  # ===============================================================
  # Closes the control half of DESIGN.md §12's open item: "the node has no
  # actuator, so a dead node means the dehumidifier control loses its input
  # entirely. What the HA automation does with `unavailable` has not been
  # checked." It is checked now, and this is the answer.
  #
  # Design question: what should happen at the unattended moment when the
  # control sensor dies mid-cycle?
  #   - keep running blind: no feedback, no stall detection, and the RH band
  #     is unenforceable. The unit runs to the backstop on every cycle and
  #     the log looks normal.
  #   - stop immediately: a 30-second WiFi blip or an OTA reboot short-cycles
  #     the compressor.
  # So: stop, but only after 10 minutes. That is long enough to ride out an
  # OTA (~30 s) and a WiFi reassociation, short enough that a genuinely dead
  # node never leaves the compressor running unsupervised for an hour.
  #
  # auto_on needs no equivalent: binary_sensor.dehumidifier_should_run has an
  # is_number availability template, so it goes `unavailable` and a
  # `to: "on"` state trigger cannot fire out of unavailable.
  #
  # The stop reason is its own input_select option (sensor_loss) rather than
  # being folded into max_runtime, so it cannot be mistaken for a capacity
  # problem in the cycle-history analysis.
  # ===============================================================
  - id: dehumidifier_sensor_loss_shutdown
    alias: "Dehumidifier Control Sensor Loss Shutdown"
    description: "Stop the dehumidifier when the SHT45 control RH has been unreadable for 10 min. Running a compressor against a sensor you cannot read is not control."
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.basement_th_node_basement_humidity
        to: "unavailable"
        for:
          minutes: 10
      - platform: state
        entity_id: sensor.basement_th_node_basement_humidity
        to: "unknown"
        for:
          minutes: 10
    condition:
      # LOCAL-CONTROL GATE - see dehumidifier_auto_on for the rationale.
      # False only when the boolean is explicitly "on"; anything unreadable
      # degrades back to normal HA control.
      - condition: template
        value_template: "{{ not is_state('input_boolean.dehumidifier_local_control', 'on') }}"
      - condition: state
        entity_id: switch.dehumidifier
        state: "on"
    action:
      - service: input_select.select_option
        target:
          entity_id: input_select.dehumidifier_last_stop_reason
        data:
          option: sensor_loss
      - service: switch.turn_off
        target:
          entity_id: switch.dehumidifier
      - service: system_log.write
        data:
          level: warning
          message: >-
            Dehumidifier stopped: control RH (sensor.basement_th_node_basement_humidity)
            unreadable for 10 min. Node status
            {{ states('binary_sensor.basement_th_node_node_status') }}.
            Shelly validation channel reads
            {{ states('sensor.shelly_temperature_humidity_humidity') }} %RH.
      - service: persistent_notification.create
        data:
          notification_id: dehumidifier_sensor_loss
          title: "⚠️ Dehumidifier stopped — control sensor lost"
          message: >
            The SHT45 control RH has been unreadable for 10+ min, so the
            dehumidifier was stopped rather than left running blind.
            The Shelly is still reporting
            {{ states('sensor.shelly_temperature_humidity_humidity') }} %RH — it is a
            validation channel only and will NOT take over control on its own.
            Control resumes automatically when the node returns.
