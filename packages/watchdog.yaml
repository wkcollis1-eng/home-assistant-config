# =============================================================================
# Watchdog Package - Monitor and Auto-Recover Stale Sensors
# =============================================================================
#
# Purpose: Detect sensors that stop updating and auto-reload their integrations
#          with backoff protection to prevent reload spam.
#
# Monitored Systems:
#   - Battery Bank Monitor (ESPHome/Custom)
#   - Ecobee Thermostats
#   - UPS Monitor
#   - SEM Meter (energy monitoring)
#   - Basement TH Node (SHT45) - DEHUMIDIFIER CONTROL SENSOR since 2026-07-29
#
# Features:
#   - Configurable stale thresholds per sensor type
#     (except Ecobee since 2026-10-04: unavailable/unknown only, no age test)
#   - Ecobee frozen-value test since 2026-10-23: each HomeKit temperature
#     sensor against its climate entity, reloading only that thermostat
#   - Auto-reload with 15-minute backoff
#   - Persistent notifications on stale/recovery  [RETIRED 2026-09-10]
#   - Notification ONLY when a reset fails (watchdog_reset_failed), 2026-09-10
#   - Dashboard-friendly status sensors
#
# =============================================================================

# -----------------------------------------------------------------------------
# Input Numbers: Configurable Stale Thresholds (minutes)
# -----------------------------------------------------------------------------
input_number:
  watchdog_threshold_battery_bank:
    name: "Watchdog: Battery Bank Stale Threshold"
    min: 5
    max: 120
    step: 5
    unit_of_measurement: "min"
    icon: mdi:battery-alert
    initial: 30

  # UNUSED since 2026-10-04: binary_sensor.watchdog_ecobee_stale no longer
  # has an age test (see its comment). Kept declared because it is in the
  # entity registry - removing only this block would leave an orphaned row
  # that needs a UI delete. Remove both together, or leave it.
  watchdog_threshold_ecobee:
    name: "Watchdog: Ecobee Stale Threshold (unused)"
    min: 5
    max: 120
    step: 5
    unit_of_measurement: "min"
    icon: mdi:thermostat
    initial: 30

  watchdog_threshold_ups:
    name: "Watchdog: UPS Stale Threshold"
    min: 5
    max: 120
    step: 5
    unit_of_measurement: "min"
    icon: mdi:battery-charging
    initial: 30

  watchdog_threshold_sem:
    name: "Watchdog: SEM Meter Stale Threshold"
    min: 1
    max: 30
    step: 1
    unit_of_measurement: "min"
    icon: mdi:flash
    initial: 5

  # 5 min, not the 30 used for the battery bank / Ecobee / UPS. This node is
  # the dehumidifier's control input and publishes every 10 s, so 5 min is
  # already 30 missed reads. It is also deliberately tighter than the 10-min
  # dehumidifier_sensor_loss_shutdown in automations.yaml, giving the
  # integration reload a full 5 minutes to recover the node before the
  # control loop gives up and stops the compressor. Ladder: 5 min try to
  # fix -> 10 min stop safely.
  watchdog_threshold_basement_th:
    name: "Watchdog: Basement TH Stale Threshold"
    min: 1
    max: 30
    step: 1
    unit_of_measurement: "min"
    icon: mdi:home-thermometer
    initial: 5

  watchdog_reload_backoff:
    name: "Watchdog: Reload Backoff Period"
    min: 5
    max: 60
    step: 5
    unit_of_measurement: "min"
    icon: mdi:timer-sand
    initial: 15

# -----------------------------------------------------------------------------
# Input Booleans: Enable/Disable Auto-Reload per Integration
# -----------------------------------------------------------------------------
input_boolean:
  watchdog_auto_reload_battery_bank:
    name: "Watchdog: Auto-Reload Battery Bank"
    icon: mdi:reload

  watchdog_auto_reload_ecobee:
    name: "Watchdog: Auto-Reload Ecobee"
    icon: mdi:reload

  watchdog_auto_reload_ups:
    name: "Watchdog: Auto-Reload UPS"
    icon: mdi:reload

  watchdog_auto_reload_sem:
    name: "Watchdog: Auto-Reload SEM"
    icon: mdi:reload

  watchdog_auto_reload_basement_th:
    name: "Watchdog: Auto-Reload Basement TH"
    icon: mdi:reload

# -----------------------------------------------------------------------------
# Input Datetime: Track Last Reload Time (for backoff)
# -----------------------------------------------------------------------------
input_datetime:
  watchdog_last_reload_battery_bank:
    name: "Watchdog: Last Reload Battery Bank"
    has_date: true
    has_time: true

  watchdog_last_reload_ecobee:
    name: "Watchdog: Last Reload Ecobee"
    has_date: true
    has_time: true

  watchdog_last_reload_ups:
    name: "Watchdog: Last Reload UPS"
    has_date: true
    has_time: true

  watchdog_last_reload_sem:
    name: "Watchdog: Last Reload SEM"
    has_date: true
    has_time: true

  watchdog_last_reload_basement_th:
    name: "Watchdog: Last Reload Basement TH"
    has_date: true
    has_time: true

# -----------------------------------------------------------------------------
# Template Sensors: Staleness Detection
# -----------------------------------------------------------------------------
template:
  - binary_sensor:
      # --- Battery Bank Monitor ---
      - name: "Watchdog: Battery Bank Stale"
        unique_id: watchdog_battery_bank_stale
        icon: "{{ 'mdi:battery-alert' if is_state('binary_sensor.watchdog_battery_bank_stale', 'on') else 'mdi:battery-check' }}"
        device_class: problem
        state: >
          {% set sensor = states.sensor.battery_bank_monitor_battery_voltage %}
          {% if sensor is none or sensor.state in ['unavailable', 'unknown'] %}
            true
          {% else %}
            {% set threshold = states('input_number.watchdog_threshold_battery_bank') | float(30) * 60 %}
            {{ (now() - sensor.last_updated).total_seconds() > threshold }}
          {% endif %}
        attributes:
          threshold_minutes: "{{ states('input_number.watchdog_threshold_battery_bank') }}"

      # --- Ecobee Thermostats (either sensor stale triggers) ---
      # UNAVAILABLE OR UNKNOWN ONLY (2026-10-04). Until this date a temperature
      # whose last_updated was older than input_number.watchdog_threshold_ecobee
      # (30 min) also counted as stale. That test cannot tell a steady house
      # from a dead thermostat: homekit_controller writes an entity's state only
      # when a polled value CHANGES [S: core 2026.9.4
      # homekit_controller/connection.py async_update -> process_new_events;
      # aiohomekit 4.0.1 model/__init__.py:399-419 and
      # characteristics/characteristic.py:169-182], so last_updated stops
      # whenever the temperature holds inside one 0.18 F (0.1 C) step [M].
      # 09-26 20:00 to 10-04 19:00 EDT [M, HA history]: 151 reloads, 146 of
      # them back with the same main-floor temperature; each reload dropped the
      # accessory's occupancy, motion and climate entities to unavailable for
      # about 80 ms (147 of 147 such blips within 3 s of a reload), and every
      # blip re-armed binary_sensor.mmw_family_dropout_candidate.
      # A thermostat that stops answering still turns this on: homekit_controller
      # polls every 1 min and marks the entities unavailable after 3 failed
      # polls [S: aiohomekit 4.0.1 controller/ip/pairing.py:140-142; core
      # 2026.9.4 homekit_controller/const.py:57]. Replayed over 09-20 08:12 to
      # 10-04 23:04 UTC [M, HA history, both temperature sensors]: on for 60 s
      # or more exactly once - the 09-21 Main Floor outage, 00:23:21-10:40:08
      # EDT, off the LAN, cleared by a reseat - and the other 236 episodes,
      # all blips from the old reloads, lasted 0.51 s or less. The 09-15 outage
      # (330 min) is older than the recorder and was not replayed.
      # NOT CAUGHT, now or before: an accessory that answers polls with a frozen
      # value. The age test could not catch that either; it could not tell
      # frozen from steady.
      # R13, 2026-10-23: wrong for the freeze that actually happened. From
      # 10-23 01:50:37 to 12:20:14 UTC (629.6 min [D]) the upstairs HomeKit
      # temperature sensor held 67.82 F while climate.upstairs, reading the
      # same accessory, kept moving 64-68 F [M, HA history]. Comparing the two
      # tells frozen from steady: see Watchdog: Upstairs / Main Floor Frozen
      # below. Still not caught: every value on an accessory freezing at once.
      - name: "Watchdog: Ecobee Stale"
        unique_id: watchdog_ecobee_stale
        icon: "{{ 'mdi:thermostat-alert' if is_state('binary_sensor.watchdog_ecobee_stale', 'on') else 'mdi:thermostat' }}"
        device_class: problem
        state: >
          {% set upstairs = states.sensor.upstairs_current_temperature %}
          {% set main = states.sensor.main_floor_current_temperature %}
          {% set upstairs_stale = upstairs is none or upstairs.state in ['unavailable', 'unknown'] %}
          {% set main_stale = main is none or main.state in ['unavailable', 'unknown'] %}
          {{ upstairs_stale or main_stale }}
        attributes:
          upstairs_stale: >
            {% set sensor = states.sensor.upstairs_current_temperature %}
            {{ sensor is none or sensor.state in ['unavailable', 'unknown'] }}
          main_floor_stale: >
            {% set sensor = states.sensor.main_floor_current_temperature %}
            {{ sensor is none or sensor.state in ['unavailable', 'unknown'] }}

      # --- Ecobee frozen value, one per thermostat (2026-10-23) ---
      # Catches what Watchdog: Ecobee Stale cannot: a HomeKit temperature
      # sensor that stays AVAILABLE and stops changing. 10-23 01:50:37 to
      # 12:20:14 UTC (629.6 min [D]) sensor.upstairs_current_temperature held
      # 67.82 F, up to 3.82 F off the room [M, HA history], while
      # climate.upstairs kept reading it; a reload of that thermostat ended it.
      # Cause [S: core 2026.10.2 homekit_controller entity.py
      # _async_config_changed, sensor.py SimpleSensor.native_value]: after the
      # accessory's config number changes, a sensor keeps reading its OLD
      # Characteristic object while the climate entity re-reads its service.
      # Fixed upstream by core PR #177696 (merged to dev 2026-10-15, not in
      # 2026.10.2). That a config change happened at 01:50 is [I]; falsifier:
      # the same freeze on a release that contains #177696.
      #
      # Test: |sensor - climate current_temperature| > 1.0 F for 15 min. The
      # attribute is the same reading rounded to whole F, so a healthy pair
      # differs by about 0.5 F at most. Replay 10-09 13:05 to 10-23 12:55 UTC
      # [M, HA history, both thermostats]: every interval over 1.0 F lies
      # inside the 10-23 freeze, none outside it on either; this test would
      # have turned on at 03:21:40 UTC, 91 min [D] after the freeze began,
      # once the room had drifted more than 1 F from 67.82.
      # Limits: n = 1 real freeze. A freeze while the room stays within about
      # 1 F of the frozen value is not seen until the room moves.
      # Unavailable, not off, while either input is - that case is Watchdog:
      # Ecobee Stale's. An unavailable spell does not restart delay_on: a
      # false availability blocks the state render, and an unchanged result
      # is not re-applied [S: core 2026.10.2 helpers/event.py
      # _refresh/_render_template_if_ready]. So a reload that does not cure
      # the freeze brings this straight back on, the backoff blocks a second
      # reload, and watchdog_reset_failed reports it 10 min later.
      - name: "Watchdog: Upstairs Frozen"
        unique_id: watchdog_upstairs_frozen
        device_class: problem
        delay_on: "00:15:00"
        availability: >
          {{ states('sensor.upstairs_current_temperature') | is_number
             and state_attr('climate.upstairs', 'current_temperature') is number }}
        state: >
          {{ (states('sensor.upstairs_current_temperature') | float(0)
              - state_attr('climate.upstairs', 'current_temperature') | float(0)) | abs > 1.0 }}
      - name: "Watchdog: Main Floor Frozen"
        unique_id: watchdog_main_floor_frozen
        device_class: problem
        delay_on: "00:15:00"
        availability: >
          {{ states('sensor.main_floor_current_temperature') | is_number
             and state_attr('climate.main_floor', 'current_temperature') is number }}
        state: >
          {{ (states('sensor.main_floor_current_temperature') | float(0)
              - state_attr('climate.main_floor', 'current_temperature') | float(0)) | abs > 1.0 }}

      # --- UPS Monitor ---
      - name: "Watchdog: UPS Stale"
        unique_id: watchdog_ups_stale
        icon: "{{ 'mdi:battery-alert-variant' if is_state('binary_sensor.watchdog_ups_stale', 'on') else 'mdi:battery-check' }}"
        device_class: problem
        state: >
          {% set sensor = states.sensor.ups_monitor_battery_voltage %}
          {% if sensor is none or sensor.state in ['unavailable', 'unknown'] %}
            true
          {% else %}
            {% set threshold = states('input_number.watchdog_threshold_ups') | float(30) * 60 %}
            {{ (now() - sensor.last_updated).total_seconds() > threshold }}
          {% endif %}
        attributes:
          threshold_minutes: "{{ states('input_number.watchdog_threshold_ups') }}"

      # --- SEM Meter ---
      - name: "Watchdog: SEM Stale"
        unique_id: watchdog_sem_stale
        icon: "{{ 'mdi:flash-alert' if is_state('binary_sensor.watchdog_sem_stale', 'on') else 'mdi:flash' }}"
        device_class: problem
        state: >
          {% set sensor = states.sensor.sem_whole_home_power %}
          {% if sensor is none or sensor.state in ['unavailable', 'unknown'] %}
            true
          {% else %}
            {% set threshold = states('input_number.watchdog_threshold_sem') | float(5) * 60 %}
            {{ (now() - sensor.last_updated).total_seconds() > threshold }}
          {% endif %}
        attributes:
          threshold_minutes: "{{ states('input_number.watchdog_threshold_sem') }}"

      # --- Basement TH Node (dehumidifier control sensor) ---
      # Keyed on the RAW humidity channel specifically: that is the entity
      # the control band, the stall detector and the 60-min statistics mean
      # all read. The node could stay on the API with that one channel dead
      # (I2C fault, stuck value), and node_status alone would not show it.
      - name: "Watchdog: Basement TH Stale"
        unique_id: watchdog_basement_th_stale
        icon: "{{ 'mdi:home-thermometer-outline' if is_state('binary_sensor.watchdog_basement_th_stale', 'on') else 'mdi:home-thermometer' }}"
        device_class: problem
        state: >
          {% set sensor = states.sensor.basement_th_node_basement_humidity %}
          {% if sensor is none or sensor.state in ['unavailable', 'unknown'] %}
            true
          {% else %}
            {% set threshold = states('input_number.watchdog_threshold_basement_th') | float(5) * 60 %}
            {{ (now() - sensor.last_updated).total_seconds() > threshold }}
          {% endif %}
        attributes:
          threshold_minutes: "{{ states('input_number.watchdog_threshold_basement_th') }}"
          node_status: "{{ states('binary_sensor.basement_th_node_node_status') }}"
          rh_stuck: "{{ states('binary_sensor.basement_th_node_basement_rh_stuck') }}"

  # --- Summary Sensor ---
  - sensor:
      - name: "Watchdog: Stale Sensor Count"
        unique_id: watchdog_stale_sensor_count
        icon: mdi:alert-circle
        state: >
          {{ [
            is_state('binary_sensor.watchdog_battery_bank_stale', 'on'),
            is_state('binary_sensor.watchdog_ecobee_stale', 'on')
              or is_state('binary_sensor.watchdog_upstairs_frozen', 'on')
              or is_state('binary_sensor.watchdog_main_floor_frozen', 'on'),
            is_state('binary_sensor.watchdog_ups_stale', 'on'),
            is_state('binary_sensor.watchdog_sem_stale', 'on'),
            is_state('binary_sensor.watchdog_basement_th_stale', 'on')
          ] | select | list | count }}
        attributes:
          stale_sensors: >
            {% set stale = [] %}
            {% if is_state('binary_sensor.watchdog_battery_bank_stale', 'on') %}
              {% set stale = stale + ['Battery Bank'] %}
            {% endif %}
            {% if is_state('binary_sensor.watchdog_ecobee_stale', 'on')
                  or is_state('binary_sensor.watchdog_upstairs_frozen', 'on')
                  or is_state('binary_sensor.watchdog_main_floor_frozen', 'on') %}
              {% set stale = stale + ['Ecobee'] %}
            {% endif %}
            {% if is_state('binary_sensor.watchdog_ups_stale', 'on') %}
              {% set stale = stale + ['UPS'] %}
            {% endif %}
            {% if is_state('binary_sensor.watchdog_sem_stale', 'on') %}
              {% set stale = stale + ['SEM Meter'] %}
            {% endif %}
            {% if is_state('binary_sensor.watchdog_basement_th_stale', 'on') %}
              {% set stale = stale + ['Basement TH (dehum control)'] %}
            {% endif %}
            {{ stale | join(', ') if stale else 'None' }}

# -----------------------------------------------------------------------------
# Automations: Auto-Reload with Backoff
# -----------------------------------------------------------------------------
automation:
  # --- Battery Bank Reload ---
  - id: watchdog_reload_battery_bank
    alias: "Watchdog: Reload Battery Bank"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.watchdog_battery_bank_stale
        to: "on"
        for:
          minutes: 1
    condition:
      - condition: state
        entity_id: input_boolean.watchdog_auto_reload_battery_bank
        state: "on"
      - condition: template
        value_template: >
          {% set last = states('input_datetime.watchdog_last_reload_battery_bank') %}
          {% set backoff = states('input_number.watchdog_reload_backoff') | float(15) * 60 %}
          {% if last in ['unknown', 'unavailable', ''] %}
            true
          {% else %}
            {{ (now() - (last | as_datetime | as_local)).total_seconds() > backoff }}
          {% endif %}
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.watchdog_last_reload_battery_bank
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: homeassistant.reload_config_entry
        target:
          entity_id: sensor.battery_bank_monitor_battery_voltage

  # --- Ecobee Reload ---
  - id: watchdog_reload_ecobee
    alias: "Watchdog: Reload Ecobee"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.watchdog_ecobee_stale
        to: "on"
        for:
          minutes: 1
        id: stale
      # Frozen (2026-10-23): the binary sensors carry a 15-min delay_on, so
      # no for: here. One backoff for both thermostats: a second one freezing
      # inside it gets watchdog_reset_failed's notice, not a reload.
      - platform: state
        entity_id: binary_sensor.watchdog_upstairs_frozen
        to: "on"
        id: upstairs_frozen
      - platform: state
        entity_id: binary_sensor.watchdog_main_floor_frozen
        to: "on"
        id: main_floor_frozen
    condition:
      - condition: state
        entity_id: input_boolean.watchdog_auto_reload_ecobee
        state: "on"
      - condition: template
        value_template: >
          {% set last = states('input_datetime.watchdog_last_reload_ecobee') %}
          {% set backoff = states('input_number.watchdog_reload_backoff') | float(15) * 60 %}
          {% if last in ['unknown', 'unavailable', ''] %}
            true
          {% else %}
            {{ (now() - (last | as_datetime | as_local)).total_seconds() > backoff }}
          {% endif %}
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.watchdog_last_reload_ecobee
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      # Frozen (2026-10-23): reload ONLY the thermostat whose sensor froze; a
      # reload drops that accessory's entities to unavailable for a moment
      # (see binary_sensor.watchdog_ecobee_stale), so the healthy one is left
      # alone.
      - choose:
          - conditions:
              - condition: trigger
                id: upstairs_frozen
            sequence:
              - service: homeassistant.reload_config_entry
                target:
                  entity_id: sensor.upstairs_current_temperature
          - conditions:
              - condition: trigger
                id: main_floor_frozen
            sequence:
              - service: homeassistant.reload_config_entry
                target:
                  entity_id: sensor.main_floor_current_temperature
        default: []
      # Everything below is the unavailable/unknown path only.
      - condition: trigger
        id: stale
      # BOTH thermostats (2026-09-10). They are separate homekit_controller
      # config entries, and this used to target upstairs alone - so every
      # main-floor stale episode reloaded the wrong thermostat and stayed
      # stale until the temperature happened to move. Since 2026-08-01
      # [M, InfluxDB]: main-floor-only episodes n=82, median 10.6 min, 43
      # lasting >= 10 min; upstairs-only n=78, longest 1.0 min.
      # R13, 2026-10-04: those episodes were runs of the age-based stale test
      # retired today (see binary_sensor.watchdog_ecobee_stale), so they
      # measured how long a temperature held steady, not outages. A reload
      # "ended" one because its ~80 ms unavailable blip wrote a fresh
      # last_updated, not because anything recovered: 146 of 151 reloads,
      # 09-26 to 10-04, came back with the same main-floor temperature
      # [M, HA history]. Since today this runs only on a real unavailable.
      # reload_config_entry reloads the entry of EVERY targeted entity
      # [S: core 2026.9.1, homeassistant/components/homeassistant/__init__.py:341-354].
      - service: homeassistant.reload_config_entry
        target:
          entity_id:
            - sensor.upstairs_current_temperature
            - sensor.main_floor_current_temperature

  # --- UPS Reload ---
  - id: watchdog_reload_ups
    alias: "Watchdog: Reload UPS"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.watchdog_ups_stale
        to: "on"
        for:
          minutes: 1
    condition:
      - condition: state
        entity_id: input_boolean.watchdog_auto_reload_ups
        state: "on"
      - condition: template
        value_template: >
          {% set last = states('input_datetime.watchdog_last_reload_ups') %}
          {% set backoff = states('input_number.watchdog_reload_backoff') | float(15) * 60 %}
          {% if last in ['unknown', 'unavailable', ''] %}
            true
          {% else %}
            {{ (now() - (last | as_datetime | as_local)).total_seconds() > backoff }}
          {% endif %}
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.watchdog_last_reload_ups
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: homeassistant.reload_config_entry
        target:
          entity_id: sensor.ups_monitor_battery_voltage

  # --- SEM Reload ---
  - id: watchdog_reload_sem
    alias: "Watchdog: Reload SEM"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.watchdog_sem_stale
        to: "on"
        for:
          minutes: 1
    condition:
      - condition: state
        entity_id: input_boolean.watchdog_auto_reload_sem
        state: "on"
      - condition: template
        value_template: >
          {% set last = states('input_datetime.watchdog_last_reload_sem') %}
          {% set backoff = states('input_number.watchdog_reload_backoff') | float(15) * 60 %}
          {% if last in ['unknown', 'unavailable', ''] %}
            true
          {% else %}
            {{ (now() - (last | as_datetime | as_local)).total_seconds() > backoff }}
          {% endif %}
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.watchdog_last_reload_sem
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: homeassistant.reload_config_entry
        target:
          entity_id: sensor.sem_whole_home_power

  # --- Recovery Notification ---
  #     (retired 2026-09-10 - replaced by watchdog_reset_failed, further down)
  # --- Basement TH Node Reload ---
  # `for: 1 minute` matches the other entries, so the effective trip is the
  # 5-min threshold plus 1 min = 6 min, still inside the 10-min control-loop
  # shutdown. Message names the control consequence explicitly - a stale
  # sensor here is not just a monitoring gap, it stops the dehumidifier.
  # 2026-09-10: that message was a SUCCESS notice and is gone. The control
  # consequence is now stated by watchdog_reset_failed, which fires only
  # when the reset did not work.
  - id: watchdog_reload_basement_th
    alias: "Watchdog: Reload Basement TH"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.watchdog_basement_th_stale
        to: "on"
        for:
          minutes: 1
    condition:
      - condition: state
        entity_id: input_boolean.watchdog_auto_reload_basement_th
        state: "on"
      - condition: template
        value_template: >
          {% set last = states('input_datetime.watchdog_last_reload_basement_th') %}
          {% set backoff = states('input_number.watchdog_reload_backoff') | float(15) * 60 %}
          {% if last in ['unknown', 'unavailable', ''] %}
            true
          {% else %}
            {{ (now() - (last | as_datetime | as_local)).total_seconds() > backoff }}
          {% endif %}
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.watchdog_last_reload_basement_th
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: homeassistant.reload_config_entry
        target:
          entity_id: sensor.basement_th_node_basement_humidity

  # ===============================================================
  # BASEMENT TH NODE — ON-BOARD FAULT SURFACING
  # ===============================================================
  # Relocated here from automations.yaml on 2026-07-29 so all stale/fault
  # handling lives in one file.
  #
  # These cover what the staleness check above CANNOT see. A stale check
  # asks "is the entity still updating". A stuck sensor keeps updating with
  # the same number forever, so last_updated stays fresh and the watchdog
  # stays green while the control loop reads a lie. The node's own
  # stuck-value detector is the only thing that catches that, which is why
  # it gets its own alert rather than being folded into the reload logic.
  # No auto-reload for these: reloading the integration does not fix an
  # SHT45 that is answering incorrectly.
  # ===============================================================
  - id: basement_th_node_offline
    alias: "Basement TH Node Offline"
    description: "Notify when the basement TH node drops off the ESPHome API for 10 min. 10 min tolerates an OTA reboot (~30 s) and a WiFi reassociation without crying wolf."
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.basement_th_node_node_status
        to: "off"
        for:
          minutes: 10
      - platform: state
        entity_id: binary_sensor.basement_th_node_node_status
        to: "unavailable"
        for:
          minutes: 10
    action:
      - service: persistent_notification.create
        data:
          notification_id: basement_th_node_offline
          title: "⚠️ Basement TH Node offline"
          message: >
            The basement TH node has been unreachable for 10+ min.
            Last WiFi signal {{ states('sensor.basement_th_node_node_wifi_signal') }} dBm,
            last reset reason "{{ states('sensor.basement_th_node_node_reset_reason') }}".
            This is now the dehumidifier's CONTROL sensor — the unit will have
            stopped with reason `sensor_loss` and will not restart until the
            node returns. The Shelly is still logging as a validation channel
            but does not take over control.

  - id: basement_th_node_sensor_fault
    alias: "Basement TH Node Sensor Fault"
    description: "Surface the node's own on-board problem flags: SHT45 read fault, and the stuck-value detector (RH frozen at one value = a sensor that is answering but lying)."
    mode: single
    trigger:
      - platform: state
        id: sensor_fault
        entity_id: binary_sensor.basement_th_node_basement_sensor_fault
        to: "on"
        for:
          minutes: 5
      - platform: state
        id: rh_stuck
        entity_id: binary_sensor.basement_th_node_basement_rh_stuck
        to: "on"
        for:
          minutes: 5
    action:
      - service: persistent_notification.create
        data:
          notification_id: "basement_th_node_fault_{{ trigger.id }}"
          title: "⚠️ Basement TH Node fault: {{ trigger.id }}"
          message: >
            {% if trigger.id == 'rh_stuck' %}
            The node's stuck-value detector has latched: RH has not moved for the
            detector's full window. The sensor is still answering, so the staleness
            watchdog will NOT catch this and the dehumidifier is still controlling
            on that value. Check it against the Shelly before trusting the band.
            {% else %}
            The node is reporting an SHT45 read fault. Dropped reads to date:
            {{ states('sensor.basement_th_node_basement_dropped_reads') }}.
            {% endif %}
            Control reads {{ states('sensor.basement_th_node_basement_humidity') }} %RH;
            Shelly validation channel reads
            {{ states('sensor.shelly_temperature_humidity_humidity') }} %RH.

  # --- Reset Failed (2026-09-10; replaces watchdog_recovery_notification) ---
  # Notify ONLY when the watchdog's fix did not work. Until this date every
  # reload posted a "Reloaded" notice and every on->off a "Recovered" one - two
  # positive results per episode - and the recovery trigger had no for:, so it
  # also fired on sub-minute blips that never reached a reload. Since
  # 2026-08-01 [M, InfluxDB]: 500 stale episodes across the five watchdogs and
  # 295 Ecobee reloads. Meanwhile a reset that FAILED said nothing at all: the
  # reload automations trigger only on the edge to "on" and the backoff blocks
  # a retry, so a sensor left stale after its reset stayed stale in silence.
  #
  # 10 min: a working reset clears well inside it. Slowest measured clear after
  # a reload is 163 s (SEM, n=4); upstairs Ecobee episodes, which the reload DID
  # target, never lasted past 1.0 min (n=78); every non-Ecobee episode since
  # 08-01 ended within 5.3 min except one 62.6-min UPS outage on 08-29 (n=176),
  # which is exactly what this should report.
  # [I] falsifier: with the Ecobee reload now hitting both thermostats, a
  # main-floor episode should clear like an upstairs one. A main-floor notice
  # from this automation means that model is wrong.
  # R13, 2026-10-04: the Ecobee episode counts above came from the retired
  # age-based stale test, so they measured steady temperatures, not outages
  # (see binary_sensor.watchdog_ecobee_stale). Since today an Ecobee notice
  # here means a thermostat unavailable for 10 min that a reload did not
  # bring back - on 09-21 that was a thermostat off the LAN, cleared only by
  # a reseat.
  #
  # One notice per system, same notification_id as the retired ones, so a
  # repeat REPLACES rather than stacks. It stays until dismissed - there is no
  # recovery notice, deliberately (Bill 2026-09-10: failures only).
  - id: watchdog_reset_failed
    alias: "Watchdog: Reset Failed"
    description: "Notify only when a watched sensor is still stale 10 min after going stale - the auto-reload did not fix it, was blocked by the backoff, or is switched off."
    mode: parallel
    trigger:
      - platform: state
        entity_id: binary_sensor.watchdog_battery_bank_stale
        to: "on"
        for:
          minutes: 10
        id: battery_bank
      - platform: state
        entity_id: binary_sensor.watchdog_ecobee_stale
        to: "on"
        for:
          minutes: 10
        id: ecobee
      # Frozen (2026-10-23): same id, so the same notice, helpers and reload
      # automation as Ecobee stale.
      - platform: state
        entity_id: binary_sensor.watchdog_upstairs_frozen
        to: "on"
        for:
          minutes: 10
        id: ecobee
      - platform: state
        entity_id: binary_sensor.watchdog_main_floor_frozen
        to: "on"
        for:
          minutes: 10
        id: ecobee
      - platform: state
        entity_id: binary_sensor.watchdog_ups_stale
        to: "on"
        for:
          minutes: 10
        id: ups
      - platform: state
        entity_id: binary_sensor.watchdog_sem_stale
        to: "on"
        for:
          minutes: 10
        id: sem
      - platform: state
        entity_id: binary_sensor.watchdog_basement_th_stale
        to: "on"
        for:
          minutes: 10
        id: basement_th
    action:
      - variables:
          name: >-
            {{ {'battery_bank': 'Battery Bank', 'ecobee': 'Ecobee', 'ups': 'UPS',
                'sem': 'SEM', 'basement_th': 'Basement TH'}[trigger.id] }}
      - service: persistent_notification.create
        data:
          notification_id: "watchdog_{{ trigger.id }}"
          title: "⚠️ Watchdog: {{ name }} reset failed"
          message: >-
            {%- set onset = as_local(trigger.to_state.last_changed) -%}
            {%- set last = states('input_datetime.watchdog_last_reload_' ~ trigger.id) -%}
            {%- set last_dt = last | as_datetime(none) -%}
            {{ name }} went stale at {{ onset.strftime('%H:%M') }} and is still
            stale 10 min later.
            {% if is_state('input_boolean.watchdog_auto_reload_' ~ trigger.id, 'off') -%}
            Auto-reload is OFF for it, so no reset was attempted.
            {#- 60 s slack (2026-10-23): a frozen sensor's reload blips it
                unavailable and back to on, so its onset is a few seconds
                AFTER the reset that failed to clear it. -#}
            {%- elif last_dt is not none and (onset - as_local(last_dt)).total_seconds() <= 60 -%}
            The reset at {{ as_local(last_dt).strftime('%H:%M:%S') }} did not clear it.
            {%- else -%}
            No reset ran during this episode - the previous one ({{ last }}) was
            inside the {{ states('input_number.watchdog_reload_backoff') | int(15) }}-min
            backoff, or automation.watchdog_reload_{{ trigger.id }} is off.
            {%- endif %}
            {% if trigger.id == 'basement_th' -%}
            This is the dehumidifier's control sensor, so the unit will have
            stopped with reason `sensor_loss`.
            {%- endif %}
            {%- if trigger.entity_id == 'binary_sensor.watchdog_upstairs_frozen' %}
            Frozen, not offline: sensor.upstairs_current_temperature reads
            {{ states('sensor.upstairs_current_temperature') }} F, climate.upstairs
            reads {{ state_attr('climate.upstairs', 'current_temperature') }} F.
            {%- elif trigger.entity_id == 'binary_sensor.watchdog_main_floor_frozen' %}
            Frozen, not offline: sensor.main_floor_current_temperature reads
            {{ states('sensor.main_floor_current_temperature') }} F, climate.main_floor
            reads {{ state_attr('climate.main_floor', 'current_temperature') }} F.
            {%- endif %}
            This notice stays until dismissed; {{ trigger.entity_id }}
            shows the current state.

# -----------------------------------------------------------------------------
# Scripts: Manual Reload
# -----------------------------------------------------------------------------
script:
  watchdog_reload_all_stale:
    alias: "Watchdog: Reload All Stale Integrations"
    icon: mdi:reload-alert
    mode: single
    sequence:
      - if:
          - condition: state
            entity_id: binary_sensor.watchdog_battery_bank_stale
            state: "on"
        then:
          - service: homeassistant.reload_config_entry
            target:
              entity_id: sensor.battery_bank_monitor_battery_voltage
      - if:
          - condition: state
            entity_id: binary_sensor.watchdog_ecobee_stale
            state: "on"
        then:
          # Both thermostats, not upstairs alone - see watchdog_reload_ecobee.
          - service: homeassistant.reload_config_entry
            target:
              entity_id:
                - sensor.upstairs_current_temperature
                - sensor.main_floor_current_temperature
      # Frozen (2026-10-23): that thermostat only - see watchdog_reload_ecobee.
      - if:
          - condition: state
            entity_id: binary_sensor.watchdog_upstairs_frozen
            state: "on"
        then:
          - service: homeassistant.reload_config_entry
            target:
              entity_id: sensor.upstairs_current_temperature
      - if:
          - condition: state
            entity_id: binary_sensor.watchdog_main_floor_frozen
            state: "on"
        then:
          - service: homeassistant.reload_config_entry
            target:
              entity_id: sensor.main_floor_current_temperature
      - if:
          - condition: state
            entity_id: binary_sensor.watchdog_ups_stale
            state: "on"
        then:
          - service: homeassistant.reload_config_entry
            target:
              entity_id: sensor.ups_monitor_battery_voltage
      - if:
          - condition: state
            entity_id: binary_sensor.watchdog_sem_stale
            state: "on"
        then:
          - service: homeassistant.reload_config_entry
            target:
              entity_id: sensor.sem_whole_home_power
      - if:
          - condition: state
            entity_id: binary_sensor.watchdog_basement_th_stale
            state: "on"
        then:
          - service: homeassistant.reload_config_entry
            target:
              entity_id: sensor.basement_th_node_basement_humidity
      - service: persistent_notification.create
        data:
          title: "Watchdog: Manual Reload Complete"
          message: "All stale integrations have been reloaded at {{ now().strftime('%H:%M:%S') }}"
