script:
  # ===============================================================
  # SPC Force Seed — uses hardcoded historical values from InfluxDB query
  # Values from spc_seed_results.json (2026-07-28)
  # Run once to align HA with Grafana, then nightly captures maintain it.
  # ===============================================================
  spc_force_seed_all:
    alias: "SPC Force Seed All Appliances"
    icon: mdi:refresh
    mode: single
    sequence:
      # --- FRIDGE (values: 114.7, 124.8, 114.9, 123.7, 114.3, 123.7, 114.8) ---
      - service: input_number.set_value
        target: {entity_id: input_number.fridge_running_watts_day_1}
        data: {value: 114.7}
      - service: input_number.set_value
        target: {entity_id: input_number.fridge_running_watts_day_2}
        data: {value: 124.8}
      - service: input_number.set_value
        target: {entity_id: input_number.fridge_running_watts_day_3}
        data: {value: 114.9}
      - service: input_number.set_value
        target: {entity_id: input_number.fridge_running_watts_day_4}
        data: {value: 123.7}
      - service: input_number.set_value
        target: {entity_id: input_number.fridge_running_watts_day_5}
        data: {value: 114.3}
      - service: input_number.set_value
        target: {entity_id: input_number.fridge_running_watts_day_6}
        data: {value: 123.7}
      - service: input_number.set_value
        target: {entity_id: input_number.fridge_running_watts_day_7}
        data: {value: 114.8}
      - service: input_datetime.set_datetime
        target: {entity_id: input_datetime.fridge_spc_last_capture}
        data: {date: "{{ now().strftime('%Y-%m-%d') }}"}

      # --- FURNACE (values: 767.4, 766.8, 770.7, 776.7, 776.1, 766.6, 762.4) ---
      - service: input_number.set_value
        target: {entity_id: input_number.furnace_running_watts_day_1}
        data: {value: 767.4}
      - service: input_number.set_value
        target: {entity_id: input_number.furnace_running_watts_day_2}
        data: {value: 766.8}
      - service: input_number.set_value
        target: {entity_id: input_number.furnace_running_watts_day_3}
        data: {value: 770.7}
      - service: input_number.set_value
        target: {entity_id: input_number.furnace_running_watts_day_4}
        data: {value: 776.7}
      - service: input_number.set_value
        target: {entity_id: input_number.furnace_running_watts_day_5}
        data: {value: 776.1}
      - service: input_number.set_value
        target: {entity_id: input_number.furnace_running_watts_day_6}
        data: {value: 766.6}
      - service: input_number.set_value
        target: {entity_id: input_number.furnace_running_watts_day_7}
        data: {value: 762.4}
      - service: input_datetime.set_datetime
        target: {entity_id: input_datetime.furnace_spc_last_capture}
        data: {date: "{{ now().strftime('%Y-%m-%d') }}"}

      # --- AC (values: 2554.0, 2364.5, 2486.1, 2485.6, 2388.2, 2524.8, 2406.2) ---
      - service: input_number.set_value
        target: {entity_id: input_number.ac_running_watts_day_1}
        data: {value: 2554.0}
      - service: input_number.set_value
        target: {entity_id: input_number.ac_running_watts_day_2}
        data: {value: 2364.5}
      - service: input_number.set_value
        target: {entity_id: input_number.ac_running_watts_day_3}
        data: {value: 2486.1}
      - service: input_number.set_value
        target: {entity_id: input_number.ac_running_watts_day_4}
        data: {value: 2485.6}
      - service: input_number.set_value
        target: {entity_id: input_number.ac_running_watts_day_5}
        data: {value: 2388.2}
      - service: input_number.set_value
        target: {entity_id: input_number.ac_running_watts_day_6}
        data: {value: 2524.8}
      - service: input_number.set_value
        target: {entity_id: input_number.ac_running_watts_day_7}
        data: {value: 2406.2}
      - service: input_datetime.set_datetime
        target: {entity_id: input_datetime.ac_spc_last_capture}
        data: {date: "{{ now().strftime('%Y-%m-%d') }}"}

      # --- HWH RECIRC (values: 105.0, 106.7, 105.8, 105.0, 105.8, 104.1, 107.3) ---
      - service: input_number.set_value
        target: {entity_id: input_number.hwh_recirc_running_watts_day_1}
        data: {value: 105.0}
      - service: input_number.set_value
        target: {entity_id: input_number.hwh_recirc_running_watts_day_2}
        data: {value: 106.7}
      - service: input_number.set_value
        target: {entity_id: input_number.hwh_recirc_running_watts_day_3}
        data: {value: 105.8}
      - service: input_number.set_value
        target: {entity_id: input_number.hwh_recirc_running_watts_day_4}
        data: {value: 105.0}
      - service: input_number.set_value
        target: {entity_id: input_number.hwh_recirc_running_watts_day_5}
        data: {value: 105.8}
      - service: input_number.set_value
        target: {entity_id: input_number.hwh_recirc_running_watts_day_6}
        data: {value: 104.1}
      - service: input_number.set_value
        target: {entity_id: input_number.hwh_recirc_running_watts_day_7}
        data: {value: 107.3}
      - service: input_datetime.set_datetime
        target: {entity_id: input_datetime.hwh_recirc_spc_last_capture}
        data: {date: "{{ now().strftime('%Y-%m-%d') }}"}

      # --- DEHUMIDIFIER: CLEAR, do not fabricate ------------------------
      # Was 585.4 / 591.5 / 590.3 / 587.2 / 591.6 / 587.7 / 592.6 — seven
      # Santa Fe Classic days. That machine was diagnosed with a
      # refrigerant leak and replaced; those values describe hardware that
      # no longer exists and, left in place, define control limits the E080
      # can never satisfy.
      #
      # They are NOT replaced with seven E080 numbers. Only two full days
      # have been measured (456.6 and 451.6 W), and writing seven synthetic
      # points would either invent variation or — if identical — give
      # sigma = 0, collapsing UCL and LCL onto the mean so that every
      # subsequent day reads out of control.
      #
      # Clearing to 0 makes the slots invalid to the >0 filter in mean_7d /
      # sigma_7d, so the fallbacks (455 W / 4.6 W, both measured) carry the
      # chart until real days accumulate. Clearing the capture stamp makes
      # the Daily sensor unavailable, which renders as an honest CHART GAP
      # rather than a phantom repeat of a stale slot.
      - service: input_number.set_value
        target: {entity_id: input_number.dehumidifier_running_watts_day_1}
        data: {value: 0}
      - service: input_number.set_value
        target: {entity_id: input_number.dehumidifier_running_watts_day_2}
        data: {value: 0}
      - service: input_number.set_value
        target: {entity_id: input_number.dehumidifier_running_watts_day_3}
        data: {value: 0}
      - service: input_number.set_value
        target: {entity_id: input_number.dehumidifier_running_watts_day_4}
        data: {value: 0}
      - service: input_number.set_value
        target: {entity_id: input_number.dehumidifier_running_watts_day_5}
        data: {value: 0}
      - service: input_number.set_value
        target: {entity_id: input_number.dehumidifier_running_watts_day_6}
        data: {value: 0}
      - service: input_number.set_value
        target: {entity_id: input_number.dehumidifier_running_watts_day_7}
        data: {value: 0}
      - service: input_datetime.set_datetime
        target: {entity_id: input_datetime.dehumidifier_spc_last_capture}
        data: {date: "1970-01-01"}

      # --- COOLING kWh/CDD (values: typical 1.14, no historical yet) ---
      - service: input_number.set_value
        target: {entity_id: input_number.cooling_kwh_cdd_day_1}
        data: {value: 1.14}
      - service: input_number.set_value
        target: {entity_id: input_number.cooling_kwh_cdd_day_2}
        data: {value: 1.14}
      - service: input_number.set_value
        target: {entity_id: input_number.cooling_kwh_cdd_day_3}
        data: {value: 1.14}
      - service: input_number.set_value
        target: {entity_id: input_number.cooling_kwh_cdd_day_4}
        data: {value: 1.14}
      - service: input_number.set_value
        target: {entity_id: input_number.cooling_kwh_cdd_day_5}
        data: {value: 1.14}
      - service: input_number.set_value
        target: {entity_id: input_number.cooling_kwh_cdd_day_6}
        data: {value: 1.14}
      - service: input_number.set_value
        target: {entity_id: input_number.cooling_kwh_cdd_day_7}
        data: {value: 1.14}
      - service: input_datetime.set_datetime
        target: {entity_id: input_datetime.cooling_kwh_cdd_spc_last_capture}
        data: {date: "{{ now().strftime('%Y-%m-%d') }}"}

  # ===============================================================
  # SPC RESET — DEHUMIDIFIER ONLY (added 2026-08-08)
  # ---------------------------------------------------------------
  # Use this, NOT spc_force_seed_all, whenever the dehumidifier's daily
  # statistic changes definition. spc_force_seed_all also overwrites the
  # fridge, furnace, AC, HWH-recirc and cooling slots with hardcoded
  # 2026-07-28 InfluxDB values - eleven days of real accumulated data on
  # five other populations, destroyed to fix one. Wrong blast radius.
  #
  # WHY IT CLEARS RATHER THAN SEEDS: the same reasoning as the dehumidifier
  # block in spc_force_seed_all. Writing seven synthetic points either
  # invents variation or, if identical, gives sigma = 0 and collapses UCL
  # and LCL onto the mean. Zeros fail the `select('>', 0)` filter in
  # mean_7d / sigma_7d, so the measured fallbacks carry the chart until
  # real days accumulate, and the 1970 capture stamp makes the Daily sensor
  # unavailable - an honest chart GAP, not a phantom repeat of a stale slot.
  #
  # THE ZEROS ARE NOT STUCK. The EOD capture rotates d6->d7 ... d1->d2 and
  # writes today into d1, so each passing day pushes one zero further down
  # and the buffer is fully real after seven captures.
  #
  # TRANSITION WARNING - READ BEFORE RUNNING. sensor.dehumidifier_running_
  # watts_steady_24h is a statistics sensor over a 24 h max_age, and on
  # restart it rebuilds that buffer from RECORDER HISTORY of
  # sensor.dehumidifier_power_when_on_steady. Those recorded states were
  # produced by the OLD availability template. The statistics platform reads
  # recorded states; it does not re-evaluate the template retroactively. So
  # the first capture after a window change averages old-rule samples with
  # new-rule ones and lands near the old 456.6 W rather than the new 458.9 W.
  # CORRECT SEQUENCE: restart -> let the first 23:59 capture happen (or not,
  # it does not matter) -> RUN THIS SCRIPT AGAIN THE NEXT MORNING to discard
  # that mixed point. The capture 24 h after restart is the first clean one.
  # ===============================================================
  spc_reset_dehumidifier:
    alias: "SPC Reset - Dehumidifier Only"
    icon: mdi:broom
    mode: single
    sequence:
      - service: input_number.set_value
        target:
          entity_id:
            - input_number.dehumidifier_running_watts_day_1
            - input_number.dehumidifier_running_watts_day_2
            - input_number.dehumidifier_running_watts_day_3
            - input_number.dehumidifier_running_watts_day_4
            - input_number.dehumidifier_running_watts_day_5
            - input_number.dehumidifier_running_watts_day_6
            - input_number.dehumidifier_running_watts_day_7
        data:
          value: 0
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.dehumidifier_spc_last_capture
        data:
          date: "1970-01-01"
      - service: system_log.write
        data:
          level: warning
          message: >-
            SPC reset: dehumidifier 7-day buffer cleared to 0 and capture stamp
            set to 1970-01-01. Updated 2026-08-21: mean_7d, sigma_7d, upper and
            lower now go UNAVAILABLE rather than falling back to 459/2.1 W, so
            no control band is drawn around a number nobody measured. The chart
            shows 7 gaps until real captures accumulate, which is correct.
            The startup seeder will no longer repaint a constant into the empty
            slots. Other SPC populations untouched.

      - service: system_log.write
        data:
          level: info
          message: "SPC force seed completed - all 6 populations seeded"

shell_command:
  # spc_seed_from_history REMOVED 2026-08-22. It had been declared and never
  # called since it was written, and ha_audit.py had been saying so. Deleting
  # rather than wiring it up, because scripts/spc_seed.py now takes its InfluxDB
  # credentials from the environment ONLY - the hardcoded user and password were
  # removed the same day, since this repo pushes to a public GitHub remote and
  # .gitignore does not cover scripts/. HA does not set INFLUXDB_USER /
  # INFLUXDB_PASS, so a shell_command wrapper could only ever fail to connect.
  # It is a CLI tool now. Run it from a shell that has the environment:
  #   INFLUXDB_URL=http://<host>:8086 INFLUXDB_USER=... INFLUXDB_PASS=...
  #     HA_CONFIG=/config python3 /config/scripts/spc_seed.py --days 7
  # It prints a reviewable plan to www/spc_seed_results.yaml and writes nothing
  # back on its own - same contract as spc_buffer_export.py --restore LATEST.

  # Nightly rolling-buffer backup (see automation.nightly_buffer_backup).
  # Append-only; the script never opens the CSV for writing or truncation.
  spc_buffer_export: "python3 /config/scripts/spc_buffer_export.py >> /config/www/spc/buffer_backup.log 2>&1"
