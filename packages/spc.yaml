               it replaced. Unavailable is the honest state; upper and
               lower follow via their is_number() guards. #}
            {{ ((variance.sum / (valid | length - 1)) ** 0.5) >= 0.05 }}
          {% else %}
            false
          {% endif %}
        state: >
          {% set days = [
            states('input_number.hwh_recirc_running_watts_day_1') | float(-1),
            states('input_number.hwh_recirc_running_watts_day_2') | float(-1),
            states('input_number.hwh_recirc_running_watts_day_3') | float(-1),
            states('input_number.hwh_recirc_running_watts_day_4') | float(-1),
            states('input_number.hwh_recirc_running_watts_day_5') | float(-1),
            states('input_number.hwh_recirc_running_watts_day_6') | float(-1),
            states('input_number.hwh_recirc_running_watts_day_7') | float(-1)
          ] %}
          {% set valid = days | select('>', 0) | select('<=', 200) | list %}
          {% if valid | length > 1 %}
            {% set mean = valid | sum / valid | length %}
            {% set variance = namespace(sum=0) %}
            {% for v in valid %}
              {% set variance.sum = variance.sum + ((v - mean) ** 2) %}
            {% endfor %}
            {% set sd = (variance.sum / (valid | length - 1)) ** 0.5 %}
            {# sd is published as measured. The degenerate case
               (identical slots -> sd = 0) is handled in availability
               above, not by substituting a number here. #}
            {{ sd | round(1) }}
          {% else %}
            7
          {% endif %}

      - name: "HWH Recirc Running Watts Upper"
        unique_id: hwh_recirc_running_watts_upper
        unit_of_measurement: "W"
        state_class: measurement
        icon: mdi:arrow-up-bold
        # 2026-08-21: follows the centre line and sigma. Without this the
        # limit still published a number built from the | float() fallbacks
        # even when neither input existed.
        availability: >
          {{ is_number(states('sensor.hwh_recirc_running_watts_mean_7d'))
             and is_number(states('sensor.hwh_recirc_running_watts_sigma_7d')) }}
        state: >
          {% set m = states('sensor.hwh_recirc_running_watts_mean_7d') | float(104) %}
          {% set s = states('sensor.hwh_recirc_running_watts_sigma_7d') | float(7) %}
          {{ (m + 2 * s) | round(1) }}

      - name: "HWH Recirc Running Watts Lower"
        unique_id: hwh_recirc_running_watts_lower
        unit_of_measurement: "W"
        state_class: measurement
        icon: mdi:arrow-down-bold
        # 2026-08-21: follows the centre line and sigma. Without this the
        # limit still published a number built from the | float() fallbacks
        # even when neither input existed.
        availability: >
          {{ is_number(states('sensor.hwh_recirc_running_watts_mean_7d'))
             and is_number(states('sensor.hwh_recirc_running_watts_sigma_7d')) }}
        state: >
          {% set m = states('sensor.hwh_recirc_running_watts_mean_7d') | float(104) %}
          {% set s = states('sensor.hwh_recirc_running_watts_sigma_7d') | float(7) %}
          {{ (m - 2 * s) | round(1) }}

      # ===============================================================
      # DEHUMIDIFIER RUNNING-WATTS SPC (compressor health)
      # Moved from configuration.yaml, unchanged logic/seeds — this is the
      # original, most-mature population (570W/12W are real validated
      # values, not placeholders like the other four). Still gates on
      # power > threshold directly (not compressor_active) to keep the
      # delay_off tail of ~0W samples out of the mean. Threshold itself
      # (input_number.dehumidifier_power_threshold) stays in
      # configuration.yaml — shared with compressor_active, not moved.
      # ===============================================================
      - name: "Dehumidifier Power When On"
        unique_id: dehumidifier_power_when_on
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {% set p = states('sensor.dehumidifier_current_consumption') %}
          {{ p not in ['unknown', 'unavailable']
             and p | float(0) > states('input_number.dehumidifier_power_threshold') | float(250) }}
        state: "{{ states('sensor.dehumidifier_current_consumption') | float(0) }}"

      # === STEADY-STATE GATE (2026-08-07) — this is what SPC now uses ====
      # WHY: the full-run mean is contaminated by the compressor start ramp,
      # and the size of that ramp is set by CONTROL SETTINGS, not by machine
      # health. Measured across 17 runs / 53.9 h against the basement
      # temperature series:
      #
      #   full-run mean vs time   -0.233 +/- 0.048 W/h,  r2 0.615  (-12.3 W)
      #   steady-state  vs time   -0.014 +/- 0.066 W/h,  r2 0.003  ( -0.8 W)
      #
      # So the alarming "-2.6 % in three days" lived entirely in the ramp.
      # The machine did not move.
      #
      # MECHANISM, measured: time for the compressor to reach 455 W after it
      # starts is 0.08-0.25 min when the preceding off period was the E080s
      # own 63-min standby with the plug LEFT POWERED, but 7.4-11.6 min after
      # a long HA plug-cut off period.
      #
      # CORRECTED 2026-08-07 (86 h, all four control regimes, node RH now
      # logged alongside power). The "deficit tracks preceding off-minutes at
      # r2 0.866" claim above was an ARTEFACT: that regression pooled both
      # control modes, and off-duration is collinear with plug-cut status.
      # WITHIN plug-cut runs only (n=7) the slope is +0.0061 W/min, r 0.344,
      # p 0.45 - no duration effect at all (9.77 W deficit after a 165-min off,
      # 4.82 W after 303 min). The mechanism is DE-ENERGISATION, not duration.
      # Practical consequence: the deficit is a flat ~7 W on the run mean
      # whatever the cycle length, so it does NOT argue for longer runs.
      #
      # AND THE RAMP IS NOT A CAPACITY LOSS - it is the most efficient part of
      # the cycle. Marginal g/kWh by 5-min slice, plug-cut: 5-10 min 4794 at
      # 454 W; 10-15 4187; 15-20 3864; 20-25 2615; 25-30 2609. The compressor
      # draws 30-40 W LESS during minutes 2-8 while removing at full rate.
      # Steady watts are also identical between control modes at matched
      # entering RH (E080 457.52 +/- 0.35 vs plug-cut 456.67 +/- 4.94 over the
      # 50-53 % overlap, t = -0.17). Excluding the warm-up is still right for
      # DRIFT DETECTION - it removes a control-mode signature from the trend -
      # but nothing here should be read as an efficiency penalty to minimise.
      #
      # Basement temperature is NOT the explanation and that was checked, not
      # assumed: T vs time is only -0.0058 degF/h, and the multiple regression
      # W ~ T + hours gives T = +0.89 +/- 3.58 W/degF. Temperature accounts
      # for -0.27 W of a -12.1 W move. NB this does NOT confirm or refute the
      # ~10.7 W/degF figure in the project notes — mean T across runs spans
      # only 0.78 degF, far too narrow a lever arm to fit a slope.
      #
      # RESIDUAL, honest: steady-state still shows non-trend structure (~10 W
      # spread, 451.96-464.06) which may be entering-air condition. Node RH IS
      # now logged with power (2026-08-07) and the cross-mode test came back
      # null - but WITHIN a run, RH and elapsed time are perfectly collinear,
      # so "drier entering air" still cannot be separated from "later in the
      # run". Not a monotonic drift (r2 on time = 0.003), so it does not
      # defeat drift detection. Still open.
      - name: "Dehumidifier Power When On Steady"
        unique_id: dehumidifier_power_when_on_steady
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:heart-pulse
        # Fails CLOSED on a bad stamp: if cycle_start_time is unset or 1970
        # the sensor goes unavailable and contributes nothing. That is the
        # right direction for a health metric — a missing sample is a chart
        # gap, a wrong sample is a false alarm.
        availability: >
          {% set p  = states('sensor.dehumidifier_current_consumption') %}
          {% set cs = states('input_datetime.dehumidifier_cycle_start_time') %}
          {% set wu = states('input_number.dehumidifier_spc_warmup_minutes') | float(10) %}
          {% set we = states('input_number.dehumidifier_spc_window_end_minutes') | float(14) %}
          {% set el = as_timestamp(now()) - as_timestamp(cs, 0) %}
          {{ p not in ['unknown', 'unavailable']
             and p | float(0) > states('input_number.dehumidifier_power_threshold') | float(250)
             and cs not in ['unknown', 'unavailable'] and cs[:4] != '1970'
             and el > (wu * 60) and el <= (we * 60) }}
        state: "{{ states('sensor.dehumidifier_current_consumption') | float(0) }}"

      # ALWAYS-AVAILABLE companion (added 2026-08-08). The gated sensor above
      # is unavailable whenever the compressor is off OR the run is outside the
      # window, which makes it useless for diagnosing WHY nothing is being
      # captured. This one never goes unavailable: it reads 0 when the
      # compressor is off and otherwise reports minutes into the current run,
      # so a dashboard row can show the window opening and closing live.
      # now() forces a re-render each minute.
      - name: "Dehumidifier Run Elapsed"
        unique_id: dehumidifier_run_elapsed
        unit_of_measurement: "min"
        state_class: measurement
        icon: mdi:timer-play-outline
        state: >
          {% set cs = states('input_datetime.dehumidifier_cycle_start_time') %}
          {% set p  = states('sensor.dehumidifier_current_consumption') | float(0) %}
          {% set th = states('input_number.dehumidifier_power_threshold') | float(250) %}
          {% if cs in ['unknown', 'unavailable'] or cs[:4] == '1970' or p <= th %}
            0
          {% else %}
            {{ ((as_timestamp(now()) - as_timestamp(cs, 0)) / 60) | round(1) }}
          {% endif %}

      # The gap between the two is a CONTROL-MODE SIGNATURE, not a penalty.
      # Read it as: ~0 W when the plug stayed powered (E080's own humidistat),
      # ~7 W whenever the plug was cut, independent of how long it was cut for.
      # It is NOT reduced-capacity compressor minutes - see the correction on
      # dehumidifier_power_when_on_steady above; those minutes are the most
      # efficient in the cycle. Useful as an alarm only if it climbs well past
      # ~10 W on plug-cut runs, which would be new information.
      - name: "Dehumidifier Startup Deficit"
        unique_id: dehumidifier_startup_deficit
