          {% set valid = days | select('>', 0) | select('<=', 10) | list %}
          {% if valid | length > 1 %}
            {% set mean = valid | sum / valid | length %}
            {% set variance = namespace(sum=0) %}
            {% for v in valid %}
              {% set variance.sum = variance.sum + ((v - mean) ** 2) %}
            {% endfor %}
            {% set sd = (variance.sum / (valid | length - 1)) ** 0.5 %}
            {# sd is published as measured. The degenerate case
               (identical slots -> sd = 0) is handled in availability
               above, not by substituting a number here. #}
            {{ sd | round(2) }}
          {% else %}
            0.2
          {% endif %}

      - name: "Cooling kWh/CDD Upper"
        unique_id: cooling_kwh_cdd_upper
        unit_of_measurement: "kWh/CDD"
        state_class: measurement
        icon: mdi:arrow-up-bold
        # 2026-08-21: follows the centre line and sigma. Without this the
        # limit still published a number built from the | float() fallbacks
        # even when neither input existed.
        availability: >
          {{ is_number(states('sensor.cooling_kwh_cdd_mean_7d'))
             and is_number(states('sensor.cooling_kwh_cdd_sigma_7d')) }}
        state: >
          {% set m = states('sensor.cooling_kwh_cdd_mean_7d') | float(1.14) %}
          {% set s = states('sensor.cooling_kwh_cdd_sigma_7d') | float(0.2) %}
          {{ (m + 2 * s) | round(2) }}

      - name: "Cooling kWh/CDD Lower"
        unique_id: cooling_kwh_cdd_lower
        unit_of_measurement: "kWh/CDD"
        state_class: measurement
        icon: mdi:arrow-down-bold
        # 2026-08-21: follows the centre line and sigma. Without this the
        # limit still published a number built from the | float() fallbacks
        # even when neither input existed.
        availability: >
          {{ is_number(states('sensor.cooling_kwh_cdd_mean_7d'))
             and is_number(states('sensor.cooling_kwh_cdd_sigma_7d')) }}
        state: >
          {% set m = states('sensor.cooling_kwh_cdd_mean_7d') | float(1.14) %}
          {% set s = states('sensor.cooling_kwh_cdd_sigma_7d') | float(0.2) %}
          {% set lower = m - 2 * s %}
          {{ [lower, 0] | max | round(2) }}


  # =====================================================================
  # 24h-MEAN LATCHES (2026-08-21) — why the nightly captures were skipping
  #
  # Every *_running_watts_24h sensor is the `statistics` platform applied to
  # a *_power_when_on sensor, and those sources are availability-gated to
  # "appliance is above threshold right now". HA 2026.8.2,
  # components/statistics/sensor.py::_add_state_to_queue:
  #
  #     self._attr_available = new_state.state != STATE_UNAVAILABLE
  #     if new_state.state == STATE_UNAVAILABLE:
  #         self._attr_extra_state_attributes[STAT_SOURCE_VALUE_VALID] = None
  #         return
  #
  # The availability assignment runs BEFORE the early return and nothing
  # overrides it, so the statistics sensor is unavailable for exactly as long
  # as its source is. The sample buffer is untouched — only the flag flips.
  #
  # The captures fire at a fixed 23:59:00, so they read that flag at a moment
  # that has nothing to do with the appliance's duty cycle:
  #     {% set w = states('sensor.<x>_running_watts_24h') | float(-1) %}
  #     {{ w > 0 and ... }}          ->  w = -1, skip.
  # Capture therefore succeeded only if the appliance happened to be running
  # at 23:59:00. Measured source-available fractions:
  #     dehumidifier steady window   4 min x ~6-10 cycles/day  ~1.7-2.9 %
  #     HWH recirc pump              ~0.75 h/day               ~3.1 %
  #     fridge / AC / furnace        compressor duty           tens of %
  # which is exactly the observed pattern: dehumidifier dead since 2026-08-07
  # (the day capture moved to the steady series), HWH dead since 2026-08-01
  # (four nights after the 2026-07-28 switch to *_running_watts_24h), and
  # fridge/AC/furnace capturing intermittently — AC and furnace captured
  # 08-19 and skipped 08-20.
  #
  # SECOND DEFECT, same cause: the nights that DID capture were not a random
  # sample. A subgroup was recorded only when the appliance was running at
  # 23:59:00, which correlates with load, so the centre lines were drawn from
  # busy nights only. The AC chart is the one most likely to be biased warm.
  #
  # The latch below holds the last NUMERIC value of each statistics mean.
  # Trigger-based template sensors write their state only when the trigger
  # fires (components/template/trigger_entity.py) and restore it across a
  # restart via async_restore_last_state(), so the value survives both the
  # source going unavailable and a reboot.
  #
  # Staleness is still handled by the capture guards, not here: they each
  # require same-day activity (cycles_today >= 2 for the dehumidifier,
  # runtime_today thresholds elsewhere), so a dead appliance still skips
  # rather than re-capturing yesterday's number into a new slot.
  # =====================================================================
  - trigger:
      - platform: state
        entity_id: sensor.fridge_running_watts_24h
    condition:
      # Only a numeric reading may overwrite the latch. Without this the
      # `unavailable` transition itself would clobber the held value, which
      # is the whole failure being fixed.
      - condition: template
        value_template: "{{ is_number(trigger.to_state.state) }}"
    sensor:
      - name: "Fridge Running Watts Latched"
        unique_id: fridge_running_watts_latched
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:content-save-outline
        # Belt-and-braces: the condition above already guarantees a number.
        # Kept because every template sensor in this file carries one.
        availability: "{{ is_number(trigger.to_state.state) }}"
        state: "{{ trigger.to_state.state | float(0) | round(1) }}"

  - trigger:
      - platform: state
        entity_id: sensor.furnace_running_watts_24h
    condition:
      # Only a numeric reading may overwrite the latch. Without this the
      # `unavailable` transition itself would clobber the held value, which
      # is the whole failure being fixed.
      - condition: template
        value_template: "{{ is_number(trigger.to_state.state) }}"
    sensor:
      - name: "Furnace Running Watts Latched"
        unique_id: furnace_running_watts_latched
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:content-save-outline
        # Belt-and-braces: the condition above already guarantees a number.
        # Kept because every template sensor in this file carries one.
        availability: "{{ is_number(trigger.to_state.state) }}"
        state: "{{ trigger.to_state.state | float(0) | round(1) }}"

  - trigger:
      - platform: state
        entity_id: sensor.ac_running_watts_24h
    condition:
      # Only a numeric reading may overwrite the latch. Without this the
      # `unavailable` transition itself would clobber the held value, which
      # is the whole failure being fixed.
      - condition: template
        value_template: "{{ is_number(trigger.to_state.state) }}"
    sensor:
      - name: "AC Running Watts Latched"
        unique_id: ac_running_watts_latched
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:content-save-outline
        # Belt-and-braces: the condition above already guarantees a number.
        # Kept because every template sensor in this file carries one.
        availability: "{{ is_number(trigger.to_state.state) }}"
        state: "{{ trigger.to_state.state | float(0) | round(1) }}"

  - trigger:
      - platform: state
        entity_id: sensor.hwh_recirc_running_watts_24h
    condition:
      # Only a numeric reading may overwrite the latch. Without this the
      # `unavailable` transition itself would clobber the held value, which
      # is the whole failure being fixed.
      - condition: template
        value_template: "{{ is_number(trigger.to_state.state) }}"
    sensor:
      - name: "HWH Recirc Running Watts Latched"
        unique_id: hwh_recirc_running_watts_latched
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:content-save-outline
        # Belt-and-braces: the condition above already guarantees a number.
        # Kept because every template sensor in this file carries one.
        availability: "{{ is_number(trigger.to_state.state) }}"
        state: "{{ trigger.to_state.state | float(0) | round(1) }}"

  - trigger:
      - platform: state
        entity_id: sensor.dehumidifier_running_watts_steady_24h
    condition:
      # Only a numeric reading may overwrite the latch. Without this the
      # `unavailable` transition itself would clobber the held value, which
      # is the whole failure being fixed.
      - condition: template
        value_template: "{{ is_number(trigger.to_state.state) }}"
    sensor:
      - name: "Dehumidifier Running Watts Latched"
        # DO NOT "fix" this unique_id to match the name. The entity_id comes
        # from name: -> sensor.dehumidifier_running_watts_latched, and that is
        # the id already in the registry against this unique_id; changing
        # unique_id orphans the registry entry, mints a fresh entity and drops
        # both the restore_state latch and the InfluxDB series. The mismatch
        # is inert. What was NOT inert: every consumer was written against
        # sensor.dehumidifier_running_watts_STEADY_latched, an entity that has
        # never existed, so the 23:59 capture guard read `unavailable` ->
        # float(-1) -> skip, every night from 2026-08-07 to 2026-08-22.
        # 15 nights, silent. Fixed 2026-08-22 by pointing the four consumers
        # at the entity that exists; ha_audit.py rule_entities_resolve was
        # synthesising sensor.<unique_id> and so could never see it.
        unique_id: dehumidifier_running_watts_steady_latched
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:content-save-outline
        # Belt-and-braces: the condition above already guarantees a number.
        # Kept because every template sensor in this file carries one.
        availability: "{{ is_number(trigger.to_state.state) }}"
        state: "{{ trigger.to_state.state | float(0) | round(1) }}"

sensor:
  # Calendar-day runtime tracker — resets naturally at midnight because the
  # window start is anchored to today_at('00:00'), not a trailing duration.
  - platform: history_stats
    name: "Fridge Runtime Today"
    unique_id: fridge_runtime_today
    entity_id: binary_sensor.fridge_compressor_running
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  # Trailing-24h mean of compressor-on watts — feeds ONLY the live
  # out-of-control check above, never the nightly calendar-day capture.
  - platform: statistics
    name: "Fridge Running Watts 24h"
    unique_id: fridge_running_watts_24h
    entity_id: sensor.fridge_power_when_on
    state_characteristic: mean
    max_age:
      hours: 24
    sampling_size: 33000
    precision: 1

  - platform: history_stats
    name: "Furnace Runtime Today"
    unique_id: furnace_runtime_today
    entity_id: binary_sensor.furnace_blower_running
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: statistics
    name: "Furnace Running Watts 24h"
    unique_id: furnace_running_watts_24h
    entity_id: sensor.furnace_power_when_on
    state_characteristic: mean
    max_age:
      hours: 24
    sampling_size: 14000
    precision: 1

  - platform: history_stats
    name: "AC Runtime Today"
    unique_id: ac_runtime_today
    entity_id: binary_sensor.ac_compressor_running
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: statistics
    name: "AC Running Watts 24h"
    unique_id: ac_running_watts_24h
    entity_id: sensor.ac_power_when_on
    state_characteristic: mean
    max_age:
      hours: 24
    sampling_size: 14000
    precision: 1

  # 130s median cycle length comfortably exceeds Kasa's ~5-12s polling gaps,
  # so this should reasonably reflect true on/off timing (unlike the
  # condensate pump's 15s cycles, which is why that one isn't built here).
  - platform: history_stats
    name: "HWH Recirc Runtime Today"
    unique_id: hwh_recirc_runtime_today
    entity_id: binary_sensor.hwh_recirc_pump_running
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: statistics
    name: "HWH Recirc Running Watts 24h"
    unique_id: hwh_recirc_running_watts_24h
    entity_id: sensor.hwh_recirc_power_when_on
    state_characteristic: mean
    max_age:
      hours: 24
    sampling_size: 2000
    precision: 1

  # Left-Riemann integral of the gated (above-threshold-only) plug power.
  # method: left is required for step signals — the trapezoidal default
  # averages across on/off edges and miscounts (documented HA behavior).
  # max_sub_interval deliberately OMITTED: the gated signal sits at exactly
  # 0 between cycles (integral of 0 needs no periodic updates) and
  # max_sub_interval has an open core issue (#133292) double-counting when
  # combined with value-triggered updates.
  - platform: integration
    name: "HWH Recirc Energy Total"
    unique_id: hwh_recirc_energy_total
    source: sensor.hwh_recirc_gated_power
    unit_prefix: k
    round: 3
    method: left

  # Trailing-24h mean of compressor-on watts. NOTE this is not merely a
  # live readout — capture_daily_dehumidifier_watts reads THIS sensor at
  # 23:59, so it IS the daily SPC value. Sampled once a day at 23:59 a
  # trailing 24 h window is calendar-aligned to within a minute, so the
  # non-overlapping-subgroup rule in the header is satisfied.
  #
  # SIZING RETUNED 2026-08-07. sampling_size is a HARD CAP on the buffer:
  # whichever of max_age and sampling_size binds first wins. The Kasa
  # publishes ~5 s during a run = ~720 samples per RUNNING hour, so 2000
  # samples is only 2.78 h of run time. Measured effect on 2026-08-05
  # (3.80 h of running, 2387 samples): the buffer truncated to the last
  # 2000 and the mean read 455.85 W instead of the true full-day 456.41 W,
  # a -0.56 W bias. Small, but it appears ONLY on high-duty days — a
  # duty-dependent artefact on a chart whose whole job is to separate a
  # real drift from an artefact.
  # 4000 covers 5.5 h/day of running, so max_age governs in all normal
  # operation. The old comment "~1.5 cycles of on-time" was Santa Fe-era;
  # E080 cycles are ~20 min, so 4000 samples is roughly 16 of them.
  - platform: statistics
    name: "Dehumidifier Running Watts 24h"
    unique_id: dehumidifier_running_watts_24h
    entity_id: sensor.dehumidifier_power_when_on
    state_characteristic: mean
    max_age:
      hours: 24
    sampling_size: 17000
    precision: 1

  # SPC SERIES (2026-08-07). Same construction, but sourced from the
  # warm-up-excluded sensor. Steady samples are roughly 40-60 % of run time
  # at current run lengths, so ~1,400 samples on a 3.8 h day at the ~5 s Kasa
  # cadence; 3000 keeps max_age governing.
  - platform: statistics
    name: "Dehumidifier Running Watts Steady 24h"
    unique_id: dehumidifier_running_watts_steady_24h
    entity_id: sensor.dehumidifier_power_when_on_steady
    state_characteristic: mean
    max_age:
      hours: 24
    sampling_size: 3000
    precision: 1

  # DIAGNOSTIC (2026-08-07 second pass). How many steady samples the daily
  # mean above was actually built from. Not a gate - the gate is cycle count,
  # which is what governs the standard error - but this is what tells you WHY
  # a day was thin, and it is the number to watch if run lengths ever fall
  # toward the warm-up exclusion. Rule of thumb at the ~5 s Kasa cadence:
  # SE_within ~= 12.85 / sqrt(n) W, so n=60 -> 1.7 W, n=360 -> 0.7 W.
  - platform: statistics
    name: "Dehumidifier Steady Sample Count 24h"
    unique_id: dehumidifier_steady_sample_count_24h
    entity_id: sensor.dehumidifier_power_when_on_steady
    state_characteristic: count
    max_age:
      hours: 24
    sampling_size: 3000

utility_meter:
  # Calendar-day recirc-only energy (resets at midnight). Source is the
  # gated integral above, so this is the numerator of the EOD capture —
  # recirc kWh with standby/condensate already excluded. Current value
  # survives restarts via restore_state (recorder history not required),
  # same property relied on for the excluded sem_*_daily meters.
  hwh_recirc_energy_daily:
    unique_id: hwh_recirc_energy_daily
    name: "HWH Recirc Energy Daily"
    source: sensor.hwh_recirc_energy_total
    cycle: daily

automation:
  # ===============================================================
  # FRIDGE RUNNING-WATTS SPC — EOD capture
  # Fires 23:59:00. Shifts the 7-day window and writes today's
  # mean running watts from sensor.fridge_running_watts_24h, which
  # uses statistics platform on fridge_power_when_on (samples > 50W).
  # Matches Grafana CQ: MEAN(power) WHERE power > threshold.
  # Guarded so no-run / barely-run days never poison a slot.
  # ===============================================================
  - id: capture_daily_fridge_watts
    alias: "Capture Daily Fridge Running Watts"
    mode: single
    trigger:
      - platform: time
        at: "23:59:00"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {% set w = states('sensor.fridge_running_watts_latched') | float(-1) %}
                  {% set rt = states('sensor.fridge_runtime_today') | float(0) %}
                  {{ w > 0 and rt >= 1.0 and 50 < w <= 400 }}
            sequence:
              - variables:
                  # Snapshot the calendar date alongside the values.
                  # CLAUDE.md requires EOD captures to snapshot at trigger time to
                  # avoid midnight-boundary re-evaluation; the VALUES obeyed that but
                  # the stamp did not - it was written as {{ now().date() }} at
                  # execution time. Six captures fire together at 23:59:00, so if one
                  # ever slipped past midnight it would stamp TOMORROW against data
                  # from today, and the staleness detectors read that stamp.
                  capture_date: "{{ now().date() }}"
                  today_w: "{{ states('sensor.fridge_running_watts_latched') | float(0) | round(1) }}"
                  d1: "{{ states('input_number.fridge_running_watts_day_1') | float(0) }}"
                  d2: "{{ states('input_number.fridge_running_watts_day_2') | float(0) }}"
                  d3: "{{ states('input_number.fridge_running_watts_day_3') | float(0) }}"
                  d4: "{{ states('input_number.fridge_running_watts_day_4') | float(0) }}"
                  d5: "{{ states('input_number.fridge_running_watts_day_5') | float(0) }}"
                  d6: "{{ states('input_number.fridge_running_watts_day_6') | float(0) }}"
              - service: input_number.set_value
                target: {entity_id: input_number.fridge_running_watts_day_7}
                data: {value: "{{ d6 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.fridge_running_watts_day_6}
                data: {value: "{{ d5 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.fridge_running_watts_day_5}
                data: {value: "{{ d4 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.fridge_running_watts_day_4}
                data: {value: "{{ d3 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.fridge_running_watts_day_3}
                data: {value: "{{ d2 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.fridge_running_watts_day_2}
                data: {value: "{{ d1 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.fridge_running_watts_day_1}
                data: {value: "{{ today_w }}"}
              - service: input_datetime.set_datetime
                target: {entity_id: input_datetime.fridge_spc_last_capture}
                data: {date: "{{ capture_date }}"}
              - service: system_log.write
                data:
                  level: info
                  message: "Fridge SPC: captured day_1 = {{ today_w }} W"
        default:
          - service: system_log.write
            data:
              level: info
              message: >
                {% set w = states('sensor.fridge_running_watts_24h') %}
                {% set lw = states('sensor.fridge_running_watts_latched') %}
                {% set rt = states('sensor.fridge_runtime_today') | float(0) %}
                Fridge SPC skipped — runtime={{ rt }} h,
                running_watts_latched={{ lw }} (what the guard reads),
                live 24h statistic={{ w }} (`unavailable` here is NORMAL —
                the statistics sensor mirrors its source's availability;
                that is why the latch exists),
                threshold={{ states('input_number.fridge_power_threshold') }} W
                (needs runtime >= 1.0 h and 50 < running_watts_24h <= 400).

  # ===============================================================
  # FURNACE RUNNING-WATTS SPC — EOD capture
  # Uses sensor.furnace_running_watts_24h — statistics on power > 300W.
  # Matches Grafana CQ; recirc (~120W) excluded by threshold gate.
  # ===============================================================
  - id: capture_daily_furnace_watts
    alias: "Capture Daily Furnace Running Watts"
    mode: single
    trigger:
      - platform: time
        at: "23:59:00"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {% set w = states('sensor.furnace_running_watts_latched') | float(-1) %}
                  {% set rt = states('sensor.furnace_runtime_today') | float(0) %}
                  {{ w > 0 and rt >= 1.0 and 300 < w <= 1000 }}
            sequence:
              - variables:
                  # Snapshot the calendar date alongside the values.
                  # CLAUDE.md requires EOD captures to snapshot at trigger time to
                  # avoid midnight-boundary re-evaluation; the VALUES obeyed that but
                  # the stamp did not - it was written as {{ now().date() }} at
                  # execution time. Six captures fire together at 23:59:00, so if one
                  # ever slipped past midnight it would stamp TOMORROW against data
                  # from today, and the staleness detectors read that stamp.
                  capture_date: "{{ now().date() }}"
                  today_w: "{{ states('sensor.furnace_running_watts_latched') | float(0) | round(1) }}"
                  d1: "{{ states('input_number.furnace_running_watts_day_1') | float(0) }}"
                  d2: "{{ states('input_number.furnace_running_watts_day_2') | float(0) }}"
                  d3: "{{ states('input_number.furnace_running_watts_day_3') | float(0) }}"
                  d4: "{{ states('input_number.furnace_running_watts_day_4') | float(0) }}"
                  d5: "{{ states('input_number.furnace_running_watts_day_5') | float(0) }}"
                  d6: "{{ states('input_number.furnace_running_watts_day_6') | float(0) }}"
              - service: input_number.set_value
                target: {entity_id: input_number.furnace_running_watts_day_7}
                data: {value: "{{ d6 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.furnace_running_watts_day_6}
                data: {value: "{{ d5 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.furnace_running_watts_day_5}
                data: {value: "{{ d4 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.furnace_running_watts_day_4}
                data: {value: "{{ d3 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.furnace_running_watts_day_3}
                data: {value: "{{ d2 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.furnace_running_watts_day_2}
                data: {value: "{{ d1 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.furnace_running_watts_day_1}
                data: {value: "{{ today_w }}"}
              - service: input_datetime.set_datetime
                target: {entity_id: input_datetime.furnace_spc_last_capture}
                data: {date: "{{ capture_date }}"}
              - service: system_log.write
                data:
                  level: info
                  message: "Furnace SPC: captured day_1 = {{ today_w }} W"
        default:
          - service: system_log.write
            data:
              level: info
              message: >
                {% set w = states('sensor.furnace_running_watts_24h') %}
                {% set lw = states('sensor.furnace_running_watts_latched') %}
                {% set rt = states('sensor.furnace_runtime_today') | float(0) %}
                Furnace SPC skipped — runtime={{ rt }} h,
                running_watts_latched={{ lw }} (what the guard reads),
                live 24h statistic={{ w }},
                threshold={{ states('input_number.furnace_power_threshold') }} W
                (needs runtime >= 1.0 h and 300 < running_watts_24h <= 1000).

  # ===============================================================
  # AC RUNNING-WATTS SPC — EOD capture
  # Uses sensor.ac_running_watts_24h — statistics on power > 300W.
  # Matches Grafana CQ. NOT temperature-normalized.
  # ===============================================================
  - id: capture_daily_ac_watts
    alias: "Capture Daily AC Running Watts"
    mode: single
    trigger:
      - platform: time
        at: "23:59:00"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {% set w = states('sensor.ac_running_watts_latched') | float(-1) %}
                  {% set rt = states('sensor.ac_runtime_today') | float(0) %}
                  {{ w > 0 and rt >= 0.5 and 500 < w <= 5000 }}
            sequence:
              - variables:
                  # Snapshot the calendar date alongside the values.
                  # CLAUDE.md requires EOD captures to snapshot at trigger time to
                  # avoid midnight-boundary re-evaluation; the VALUES obeyed that but
                  # the stamp did not - it was written as {{ now().date() }} at
                  # execution time. Six captures fire together at 23:59:00, so if one
                  # ever slipped past midnight it would stamp TOMORROW against data
                  # from today, and the staleness detectors read that stamp.
                  capture_date: "{{ now().date() }}"
                  today_w: "{{ states('sensor.ac_running_watts_latched') | float(0) | round(1) }}"
                  d1: "{{ states('input_number.ac_running_watts_day_1') | float(0) }}"
                  d2: "{{ states('input_number.ac_running_watts_day_2') | float(0) }}"
                  d3: "{{ states('input_number.ac_running_watts_day_3') | float(0) }}"
                  d4: "{{ states('input_number.ac_running_watts_day_4') | float(0) }}"
                  d5: "{{ states('input_number.ac_running_watts_day_5') | float(0) }}"
                  d6: "{{ states('input_number.ac_running_watts_day_6') | float(0) }}"
              - service: input_number.set_value
                target: {entity_id: input_number.ac_running_watts_day_7}
                data: {value: "{{ d6 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.ac_running_watts_day_6}
                data: {value: "{{ d5 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.ac_running_watts_day_5}
                data: {value: "{{ d4 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.ac_running_watts_day_4}
                data: {value: "{{ d3 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.ac_running_watts_day_3}
                data: {value: "{{ d2 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.ac_running_watts_day_2}
                data: {value: "{{ d1 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.ac_running_watts_day_1}
                data: {value: "{{ today_w }}"}
              - service: input_datetime.set_datetime
                target: {entity_id: input_datetime.ac_spc_last_capture}
                data: {date: "{{ capture_date }}"}
              - service: system_log.write
                data:
                  level: info
                  message: "AC SPC: captured day_1 = {{ today_w }} W"
        default:
          - service: system_log.write
            data:
              level: info
              message: >
                {% set w = states('sensor.ac_running_watts_24h') %}
                {% set lw = states('sensor.ac_running_watts_latched') %}
                {% set rt = states('sensor.ac_runtime_today') | float(0) %}
                AC SPC skipped — runtime={{ rt }} h,
                running_watts_latched={{ lw }} (what the guard reads),
                live 24h statistic={{ w }},
                threshold={{ states('input_number.ac_power_threshold') }} W
                (needs runtime >= 0.5 h and 500 < running_watts_24h <= 5000).

