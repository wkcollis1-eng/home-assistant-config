               here, which drew a plausible-looking control band around
               a centre line nobody measured — worse than the collapse
               it replaced. Unavailable is the honest state; upper and
               lower follow via their is_number() guards. #}
            {{ ((variance.sum / (valid | length - 1)) ** 0.5) >= 0.05 }}
          {% else %}
            false
          {% endif %}
        state: >
          {% set days = [
            states('input_number.dehumidifier_running_watts_day_1') | float(-1),
            states('input_number.dehumidifier_running_watts_day_2') | float(-1),
