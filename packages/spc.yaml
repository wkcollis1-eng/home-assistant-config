  # ===============================================================
  # DEHUMIDIFIER RUNNING-WATTS SPC — EOD capture
  # Uses sensor.dehumidifier_running_watts_24h — statistics on power > 250W.
  # Matches Grafana CQ.
  # ===============================================================
  - id: capture_daily_dehumidifier_watts
    alias: "Capture Daily Dehumidifier Running Watts"
    mode: single
    trigger:
      - platform: time
        at: "23:59:00"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {# E080 RETUNE 2026-08-07 — both guards were sized for the
                     Santa Fe, which ran ~6.9 h/day at ~585 W.
                     rt 0.5 -> 0.2 h: the E080 runs 1.70 h/day measured and
                     falling as the slab dries. 0.5 h was 7 % of a Santa Fe
                     day but is 29 % of an E080 day, and in shoulder season it
                     would skip outright. 0.2 h sits just under one complete
                     cycle (runs measured 15.6-30.3 min = 0.26-0.51 h), so any
                     day with at least one full cycle now captures.
                     300 -> 150 W: this is the dangerous one. The failure this
                     chart exists to catch — refrigerant loss, the exact way
                     the Santa Fe died — makes watts FALL. A 300 W floor
                     against a 455 W machine silently SKIPS capture once the
                     unit is 34 % down, hiding the signal at precisely the
                     moment it matters. 150 W is still 2.6x the 57.8 W blower,
                     so fan-only can never be mistaken for a run. Let the SPC
                     limits judge; the guard only rejects nonsense. #}
                  {# 2026-08-07: reads the STEADY series, not the full-run one. #}
                  {# 2026-08-07 SECOND PASS — the runtime-hours guard was the wrong
                     VARIABLE, not merely the wrong number, so raising/lowering it
                     could not fix this. What sets the uncertainty of a daily point
                     is the number of COMPRESSOR CYCLES it averages, because
                     run-to-run variation dominates within-run scatter (12.85 W
                     over ~48 samples -> ~1.9 W SE). With the fixed 10-14 min
                     window that run-to-run sigma is 2.09 W, so a one-cycle day
                     carries ~2.1 W against a 2.1 W process sigma; two cycles
                     ~1.5 W; six ~0.9 W.
                     Capturing one-cycle days mixes subgroup sizes on one chart,
                     which inflates the limits and manufactures false signals - the
                     classic variable-subgroup-size defect.
                     So gate on counter.dehumidifier_cycles_today >= 2, which is a
                     direct statement about subgroup size and is INVARIANT to
                     setpoint changes. Runtime hours were not: 0.5 -> 0.2 -> 0.35 h
                     were three attempts to encode "enough cycles" in a proxy that
                     moves every time rh_on/rh_off/min_run move.
                     The counter is incremented by dehumidifier_cycle_start_capture
                     on each compressor start and reset at 00:00:00, so it is intact
                     at this 23:59 capture. A skipped day is a gap, not a bad point. #}
                  {% set w = states('sensor.dehumidifier_running_watts_latched') | float(-1) %}
                  {% set n = states('counter.dehumidifier_cycles_today') | int(0) %}
                  {{ w > 0 and n >= 2 and 150 < w <= 800 }}
            sequence:
              - variables:
                  # Snapshot the calendar date alongside the values.
                  # CLAUDE.md requires EOD captures to snapshot at trigger time to
                  # avoid midnight-boundary re-evaluation; the VALUES obeyed that but
                  # the stamp did not - it was written as {{ now().date() }} at
                  # execution time. Six captures fire together at 23:59:00, so if one
                  # ever slipped past midnight it would stamp TOMORROW against data
                  # from today, and the staleness detectors read that stamp.
                  capture_date: "{{ now().date() }}"
                  today_w: "{{ states('sensor.dehumidifier_running_watts_latched') | float(0) | round(1) }}"
                  d1: "{{ states('input_number.dehumidifier_running_watts_day_1') | float(0) }}"
                  d2: "{{ states('input_number.dehumidifier_running_watts_day_2') | float(0) }}"
                  d3: "{{ states('input_number.dehumidifier_running_watts_day_3') | float(0) }}"
                  d4: "{{ states('input_number.dehumidifier_running_watts_day_4') | float(0) }}"
                  d5: "{{ states('input_number.dehumidifier_running_watts_day_5') | float(0) }}"
                  d6: "{{ states('input_number.dehumidifier_running_watts_day_6') | float(0) }}"
              - service: input_number.set_value
                target: {entity_id: input_number.dehumidifier_running_watts_day_7}
                data: {value: "{{ d6 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.dehumidifier_running_watts_day_6}
                data: {value: "{{ d5 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.dehumidifier_running_watts_day_5}
                data: {value: "{{ d4 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.dehumidifier_running_watts_day_4}
                data: {value: "{{ d3 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.dehumidifier_running_watts_day_3}
                data: {value: "{{ d2 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.dehumidifier_running_watts_day_2}
                data: {value: "{{ d1 }}"}
              - service: input_number.set_value
                target: {entity_id: input_number.dehumidifier_running_watts_day_1}
                data: {value: "{{ today_w }}"}
              - service: input_datetime.set_datetime
                target: {entity_id: input_datetime.dehumidifier_spc_last_capture}
                data: {date: "{{ capture_date }}"}
              - service: system_log.write
                data:
                  level: info
                  message: "Dehumidifier SPC: captured day_1 = {{ today_w }} W"
        default:
          - service: system_log.write
            data:
              level: info
              message: >
                {% set w = states('sensor.dehumidifier_running_watts_steady_24h') %}
                {% set lw = states('sensor.dehumidifier_running_watts_latched') %}
                {% set rt = states('sensor.dehumidifier_runtime_today') | float(0) %}
                {% set n = states('counter.dehumidifier_cycles_today') | int(0) %}
                Dehumidifier SPC skipped — cycles={{ n }}, runtime={{ rt }} h,
                steady_watts_latched={{ lw }} (what the guard reads),
                live steady 24h statistic={{ w }} (full-run
                {{ states('sensor.dehumidifier_running_watts_24h') }}),
                steady_samples={{ states('sensor.dehumidifier_steady_sample_count_24h') }},
                threshold={{ states('input_number.dehumidifier_power_threshold') }} W
                (needs cycles >= 2 and 150 < steady_watts_24h <= 800).

  # ===============================================================
  # COOLING EFFICIENCY (kWh/CDD) SPC — EOD capture
  # Computes daily kWh/CDD from sem_ac_daily / hvac_cdd65_today.
  # Only captures on meaningful cooling days (CDD >= 0.5, AC > 0.1 kWh).
  # ===============================================================
  - id: capture_daily_cooling_kwh_cdd
    alias: "Capture Daily Cooling kWh/CDD"
    mode: single
    trigger:
      - platform: time
        at: "23:59:00"
    action:
      - variables:
          cdd: "{{ states('sensor.hvac_cdd65_today') | float(0) }}"
          ac_kwh: "{{ states('sensor.sem_ac_daily') | float(0) }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ cdd >= 0.5 and ac_kwh > 0.1 }}"
            sequence:
              - variables:
                  # Snapshot the calendar date alongside the values.
                  # CLAUDE.md requires EOD captures to snapshot at trigger time to
                  # avoid midnight-boundary re-evaluation; the VALUES obeyed that but
                  # the stamp did not - it was written as {{ now().date() }} at
                  # execution time. Six captures fire together at 23:59:00, so if one
                  # ever slipped past midnight it would stamp TOMORROW against data
                  # from today, and the staleness detectors read that stamp.
                  capture_date: "{{ now().date() }}"
                  today_kwh_cdd: "{{ (ac_kwh / cdd) | round(2) }}"
                  d1: "{{ states('input_number.cooling_kwh_cdd_day_1') | float(0) }}"
                  d2: "{{ states('input_number.cooling_kwh_cdd_day_2') | float(0) }}"
                  d3: "{{ states('input_number.cooling_kwh_cdd_day_3') | float(0) }}"
                  d4: "{{ states('input_number.cooling_kwh_cdd_day_4') | float(0) }}"
                  d5: "{{ states('input_number.cooling_kwh_cdd_day_5') | float(0) }}"
                  d6: "{{ states('input_number.cooling_kwh_cdd_day_6') | float(0) }}"
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ 0.1 < today_kwh_cdd <= 10 }}"
                    sequence:
                      - service: input_number.set_value
                        target: {entity_id: input_number.cooling_kwh_cdd_day_7}
                        data: {value: "{{ d6 }}"}
                      - service: input_number.set_value
                        target: {entity_id: input_number.cooling_kwh_cdd_day_6}
                        data: {value: "{{ d5 }}"}
                      - service: input_number.set_value
                        target: {entity_id: input_number.cooling_kwh_cdd_day_5}
                        data: {value: "{{ d4 }}"}
                      - service: input_number.set_value
                        target: {entity_id: input_number.cooling_kwh_cdd_day_4}
                        data: {value: "{{ d3 }}"}
                      - service: input_number.set_value
                        target: {entity_id: input_number.cooling_kwh_cdd_day_3}
                        data: {value: "{{ d2 }}"}
                      - service: input_number.set_value
                        target: {entity_id: input_number.cooling_kwh_cdd_day_2}
                        data: {value: "{{ d1 }}"}
                      - service: input_number.set_value
                        target: {entity_id: input_number.cooling_kwh_cdd_day_1}
                        data: {value: "{{ today_kwh_cdd }}"}
                      - service: input_datetime.set_datetime
                        target: {entity_id: input_datetime.cooling_kwh_cdd_spc_last_capture}
                        data: {date: "{{ capture_date }}"}
                      - service: system_log.write
                        data:
                          level: info
                          message: "Cooling kWh/CDD SPC: captured day_1 = {{ today_kwh_cdd }} ({{ ac_kwh }} kWh / {{ cdd }} CDD)"
                default:
                  - service: system_log.write
                    data:
                      level: info
                      message: >
                        Cooling kWh/CDD SPC skipped — value {{ today_kwh_cdd }} out of range
                        (needs 0.1 < kWh/CDD <= 10).
        default:
          - service: system_log.write
            data:
              level: info
              message: >
                Cooling kWh/CDD SPC skipped — CDD={{ cdd }}, AC={{ ac_kwh }} kWh
                (needs CDD >= 0.5 and AC > 0.1 kWh).

  # ===============================================================
  # SPC STARTUP SEEDING — auto-seed day slots on HA start
  # Uses 24h statistics if in valid range, else documented typical values.
  # Only seeds if day_1 is 0 (empty). Safe to re-run.
  # ===============================================================
  # ===============================================================
  # ROLLING-BUFFER BACKUP (2026-08-21)
  #
  # Every 7-day buffer, capture stamp and monthly accumulator in this system
  # exists in exactly one place: .storage/core.restore_state. That file is
  # gitignored (auth tokens), on the "never edit" list, and had no backup.
  # Losing it loses every buffer at once with nothing to rebuild from - the
  # recorder purges at 14 days and the InfluxDB CQs compute a different
  # statistic than the capture guards do. This was the "no help coming" hole
  # in the data layer.
  #
  # 00:20 is deliberate. restore_state is flushed every 15 minutes and on
  # clean shutdown, so a value written by the 23:59 captures is on disk by
  # 00:14 at the latest. 00:20 is late enough to be certain and clear of the
  # 00:15 energy export. The script reports STALE-FLUSH if a slot's
  # last_changed still predates its capture stamp, rather than quietly
  # backing up a value that had not landed.
  #
  # Restore: python3 /config/scripts/spc_buffer_export.py --restore LATEST
  # prints a reviewable replay plan; nothing is written back automatically.
  # ===============================================================
  - id: nightly_buffer_backup
    alias: "Nightly Rolling-Buffer Backup"
    description: "Append every buffer slot and capture stamp to an append-only CSV"
    mode: single
    trigger:
      - platform: time
        at: "00:20:00"
    condition:
      # CLAUDE.md: MUST wrap every shell_command call with this guard.
      - condition: state
        entity_id: input_boolean.ha_maintenance_mode
        state: "off"
    action:
      - service: shell_command.spc_buffer_export

  # ===============================================================
  # SPC CAPTURE WATCHDOG — notification
  # Mirrors notify_runtime_per_hdd_capture_stale in automations.yaml,
  # including the 2-hour debounce: the opportunity gate is computed from
  # today's running activity, so it can flip during the morning as an
  # appliance starts up. Two hours of continuous "on" means it is real.
  # ===============================================================
  - id: notify_spc_capture_stale
    alias: "Notify SPC Capture Stale"
    description: "Alert when an SPC pipeline has had the chance to capture and has not"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.spc_capture_stale_any
        to: "on"
        for:
          hours: 2
    action:
      - service: persistent_notification.create
        data:
          notification_id: spc_capture_stale
          title: "\u26a0\ufe0f SPC Capture Stale"
          message: >
            These SPC pipelines have run recently but have not captured a
            subgroup in over 2 days:
            {{ state_attr('binary_sensor.spc_capture_stale_any', 'stale_populations') }}


            Their control charts are drawing stale data or nothing at all.
            The nightly skip reason is logged at 23:59 — Settings > System >
            Logs, search "SPC skipped". Each line prints the latched value the
            guard read, the live 24h statistic, and the guard band.


            Last captures:
            {% for label, stem in [('Fridge', 'fridge'), ('Furnace', 'furnace'),
                                   ('AC', 'ac'), ('HWH Recirc', 'hwh_recirc'),
                                   ('Dehumidifier', 'dehumidifier'),
                                   ('Cooling kWh/CDD', 'cooling_kwh_cdd')] %}
            {#- format(), not 'input_datetime.' ~ stem: a bare domain literal is
                indistinguishable from a real entity id to any static checker, and
                scripts/validate_ha.py flags it. Building the whole id in one format
                string states the intent and is identical at runtime. -#}
            {% set eid = 'input_datetime.%s_spc_last_capture' | format(stem) %}
            {{ label }}: {{ states(eid) }}
            {% endfor %}

  - id: spc_seed_on_startup
    alias: "SPC Seed Slots on Startup"
    mode: single
    trigger:
      - platform: homeassistant
        event: start
    action:
      - delay: "00:00:30"  # Let entities initialize
      - service: automation.trigger
        target:
          entity_id: automation.spc_seed_slots_manual_trigger

  - id: spc_seed_slots_manual
    alias: "SPC Seed Slots (Manual Trigger)"
    mode: single
    trigger: []  # Manual trigger or called by startup automation
    # REWRITTEN 2026-08-21 — this automation used to manufacture data.
    #
    # For each population it wrote ONE value into day_1, day_2 AND day_3, and
    # that value fell back to a hard-coded "typical" constant whenever the live
    # 24h mean was out of band (which includes the very common case of the
    # source sensor being unavailable at startup -> float(0) -> out of band).
    # It then stamped *_spc_last_capture with today's date.
    #
    # Three defects followed, all of them observed on the dehumidifier on
    # 2026-08-21 (day_1..day_3 = 459.0, 459.0, 459.0, stamped 2026-08-08):
    #   1. A control chart contained points nobody measured.
    #   2. Three identical slots make sd = 0 BY CONSTRUCTION, which collapses
    #      UCL and LCL onto the centre line — the seeder, not the process, is
    #      what emptied the control band.
    #   3. The capture stamp could not distinguish measurement from seed, so
    #      the staleness banner under-reported a real measurement drought.
    #
    # Now: seed only from a MEASURED in-band mean, only into day_1 (one seed
    # event is one subgroup, not three), and stamp *_spc_last_seed. If there is
    # no valid measurement the slots are left at 0 and nothing is invented —
    # 0 renders as a chart gap and the limit sensors go unavailable below 2
    # valid slots, so an unseeded population is now self-evident rather than
    # disguised. See packages/spc.yaml limit sensors and
    # dashboards/cards/apexcharts/spc-running-watts-control-chart.yaml.
    action:
      # --- Fridge: seed day_1 from a measured mean, or not at all ---
      - variables:
          fridge_24h: "{{ states('sensor.fridge_running_watts_24h') | float(0) }}"
          fridge_ok: "{{ fridge_24h > 50 and fridge_24h < 400 }}"
          fridge_day1: "{{ states('input_number.fridge_running_watts_day_1') | float(0) }}"
      - choose:
          - conditions: "{{ fridge_day1 == 0 and fridge_ok }}"
            sequence:
              - service: input_number.set_value
                target: {entity_id: input_number.fridge_running_watts_day_1}
                data: {value: "{{ fridge_24h | round(1) }}"}
              - service: input_datetime.set_datetime
                target: {entity_id: input_datetime.fridge_spc_last_seed}
