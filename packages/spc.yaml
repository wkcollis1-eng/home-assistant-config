# ============================================================================
# packages/spc.yaml
# Statistical Process Control (XmR-style) monitoring for major appliances.
#
# STARTUP SEEDING: On HA restart, automation.spc_seed_on_startup seeds day_1
# INLINE from the live latched mean — it does NOT call scripts/spc_seed.py, and
# has not since the 2026-08-21 rewrite. (Corrected 2026-08-22; the old wording
# here sent a reader to a script that was wired to nothing.) spc_seed.py is now
# a manual CLI backfill tool, manifest-driven, run from a shell — see the
# shell_command section near the bottom of this file.
# Idempotent — only seeds appliances with empty/stale slots.
# Pattern mirrors the proven Dehumidifier Running-Watts SPC implementation
# in configuration.yaml (mean/sigma/upper/lower on a 7-day rolling buffer of
# CALENDAR-DAY, non-overlapping subgroups — not a trailing window sampled
# once a day, which autocorrelates and flattens the chart).
#
# STATUS: Fridge, Furnace, and AC all implemented, identical section
# structure. AC deliberately uses the SAME basic (temperature-blind) pattern
# for now, per instruction — see AC LIMITATION note below before trusting an
# "out of control" flag from it.
#
# To add another appliance, copy one whole section and swap:
#   - the source power entity (sensor.sem_<x>_power)
#   - the existing daily-energy entity (sensor.sem_<x>_daily)
#   - the threshold input_number default
#   - the day_1..7 input_number names
#   - the automation id
#
# FIX 2026-07-20 (charts: Furnace Daily unavailable, HWH Recirc Daily flat):
#   1. Threshold input_numbers now carry initial: values. A never-set
#      input_number sits at its YAML min (0 W here); at 0 W the "running"
#      gates count standby + low-mode time, inflating runtime_today and
#      dragging the computed daily mean below the capture guard band — the
#      EOD capture then skips every night. A skipped capture used to be
#      INVISIBLE: the "<X> Running Watts Daily" sensor kept re-reporting the
#      stale day_1 slot — a flat chart that looks like data (the HWH 144.5 W
#      symptom) or, if day_1 was never written at all, a permanently
#      unavailable sensor (the Furnace symptom).
#   2. Each capture automation now stamps input_datetime.<x>_spc_last_capture
#      on SUCCESS only; the Daily sensor's availability requires the stamp to
#      be from today or yesterday, so skip days now render as chart gaps
#      instead of phantom repeats (subgroup independence preserved).
#   3. Skip log lines now include the live threshold and the computed mean W,
#      so the failing guard is identifiable from one log line the next
#      morning (Settings -> System -> Logs, search "SPC skipped").
#   Deployment notes: expect a one-night gap on the healthy charts (stamps
#   start unset; only a real 23:59 capture sets them — or seed the three
#   healthy stamps to today via Developer Tools). Do NOT manually run the
#   capture automations mid-day to backfill: partial-day runtime against a
#   full-day energy counter (Kasa "today") writes an inflated point — that
#   mismatch is the most plausible origin of the frozen 144.5 W value.
#
# FIX 2026-07-20 part 2 (HWH energy basis — why the guard could never pass):
#   sensor.hwh_today_s_consumption read 0.195 kWh at ~16:45, i.e. ~11.6 W
#   continuous-equivalent on a plug whose calibrated recirc signal is only
#   ~0.078 kWh/FULL day. The residual (~8 W continuous, ~0.2 kWh/day) is
#   sub-threshold draw (controller/aquastat standby) that the old netting
#   design never subtracted — it only netted a fixed 0.003 kWh condensate
#   estimate. Projected capture math: (0.28 - 0.003)*1000/0.75 h ~= 370 W,
#   permanently outside the 80-200 W band -> nightly skip -> frozen day_1.
#   Fix: energy is now GATED AT SOURCE — hwh_recirc_gated_power reports plug
#   watts only above the 70 W threshold (else 0), a left-Riemann integration
#   accumulates it, and a daily utility_meter provides the calendar-day
#   recirc-only kWh. Standby AND condensate contribute exactly zero by
#   construction, so hwh_condensate_daily_kwh_estimate is retired (removed)
#   and the capture needs no netting estimates at all. The plug's own daily
#   counter stays in the skip log as plug_day_kwh: plug_day_kwh minus
#   recirc_kwh ~= standby+condensate energy, a free drift diagnostic.
#   Deploy note: on deployment day the integrator starts mid-day while
#   runtime_today has full-day history, so the first 23:59 capture will
#   likely log a low computed_w and skip — expected; clean from day 2.
#   Edge bias note (left method vs Kasa ~5-12 s polling): trailing on->off
#   edges overcount by up to one poll at ~104 W (~0.3 Wh/cycle), leading
#   edges undercount similarly; net daily bias is small vs the 78 Wh signal.
#
# PLACEHOLDER VALUES — status per appliance:
#   Fridge:  threshold/seeds now grounded in a real ~10h sample (see below),
#            barely differ from the original guesses.
#   Furnace: CONFIRMED to share one circuit between two distinct blower
#            speeds — a scheduled 15min/hr (2x7.5min) low-speed recirc mode
#            (~115-130W) and a high-speed AC-call mode (~778W, sigma ~11W).
#            Threshold raised to 300W to isolate high-speed only; the recirc
#            energy contribution is netted out of the daily capture calc
#            (see furnace_recirc_daily_kwh_estimate below) so it doesn't
#            inflate the high-speed mean. Real-data-calibrated, still only a
#            single 10h sample — expect the 7-day buffer to refine this.
#   AC:      still fully placeholder, untouched — no real data pulled yet.
#
# OPEN QUESTION — shared blower: CONFIRMED (user-provided) that furnace and
# AC share one blower motor, with a scheduled 15min/hr recirc mode layered
# on top. The recirc contamination is handled (see above); still worth
# confirming the ~778W cluster really is the AC-call speed once real AC
# power data is cross-referenced in time.
#
# SEASONAL CARRYOVER: both Furnace (heating season only) and AC (cooling
# season only) will have long stretches where the capture guard never fires
# (zero qualifying runtime). The 7-day buffer just goes stale during the
# off-season rather than resetting — so the first few "in-season" days each
# year compare against last season's tail end, not a clean start. Not fixed
# here; flagging so a stale-looking mean/sigma at season start isn't a
# surprise.
#
# AC LIMITATION (not solved here, per instruction — basic version first):
# compressor watts rise with outdoor condensing temperature (documented
# elsewhere as ~10.7 W/°F for this class of equipment), so raw watts conflate
# compressor health with outdoor weather. This version does NOT normalize
# for that — an "out of control" flag on a 95°F day may just mean it was
# 95°F, not a compressor problem. Revisit with temperature correlation once
# there's enough real data to see whether that confound actually matters in
# practice for your specific setup.
# E080 RETUNE 2026-08-07 (dehumidifier section only):
#   The Santa Fe Classic was replaced by an Aprilaire E080. Every
#   dehumidifier constant in this file described the old machine:
#     - capture guard rt >= 0.5 h    -> 0.2 h  (E080 runs 1.70 h/day, not 6.9)
#     - capture guard 300 < w        -> 150 <  (a failing unit draws LESS;
#                                               a 300 W floor hides the signal)
#     - mean/sigma fallbacks 570/12  -> 459/3.9 (STEADY-STATE, 17 runs)
#       then -> 459/2.1 on 2026-08-07 third pass, when the steady gate became a
#       FIXED WINDOW (minutes 10-14 of each run) instead of an open-ended tail.
#       CLEAR THE 7 DAY SLOTS when deploying this: the stored days were built
#       from the open-ended statistic (mean 456.6, sd 3.75) and mixing them with
#       fixed-window days (mean 458.9, sd 2.09) puts a 2.3 W step in the middle
#       of the chart and inflates sigma for a week.
#     - seed "typical" 570 W         -> 459 W
#     - reset-script 7x ~589 W days  -> cleared to 0 (see note there)
#     - statistics sampling_size 2000 -> 4000 (2000 = 2.78 h of run time at
#       the ~5 s Kasa cadence, which truncated 2026-08-05 and biased it
#       -0.56 W — a duty-dependent artefact)
#   RESOLVED 2026-08-07 with the basement temperature series: the apparent
#   456.6 -> 452.6 -> 448.6 W decline was NOT the machine and NOT ambient. It
#   was the compressor START RAMP growing as HA plug control lengthened off
#   periods. The SPC metric therefore moved from the full-run mean to a
#   WARM-UP-EXCLUDED steady-state mean, which is flat over the same window
#   (-0.014 +/- 0.066 W/h, r2 0.003). Full detail on the
#   dehumidifier_power_when_on_steady sensor below.
# ============================================================================

input_number:
  # --- Fridge SPC: gating threshold (tune once real data is seen) ---
  fridge_power_threshold:
    name: "Fridge Power Threshold"
    min: 0
    max: 300
    step: 1
    # initial added 2026-07-20: without it a never-touched input_number sits
    # at its YAML min (0 W), the running/compressor gate then passes on
    # standby/low-mode power, and the EOD capture guard band is never met.
    # NOTE initial semantics: value RESETS to this on every HA restart — UI
    # tuning does not survive a reboot; make permanent changes here in YAML.
    initial: 50
    unit_of_measurement: "W"
    mode: box
    icon: mdi:tune

