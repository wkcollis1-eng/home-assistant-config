input_datetime:
  # Last successful EOD capture date per SPC population. Stamped by each
  # capture automation on SUCCESS only (single writer), read by the matching
  # "<X> Running Watts Daily" availability gate below — a skipped capture now
  # makes the Daily sensor unavailable (a visible chart gap) instead of
  # silently replaying yesterday's day_1 as if it were a fresh subgroup.
  # input_datetime, not automation last_triggered: it survives restarts, and
  # last_triggered fires on skip nights too, so it cannot distinguish
  # captured from skipped.
  fridge_spc_last_capture:
    name: "Fridge SPC Last Capture"
    has_date: true
    has_time: false
    icon: mdi:calendar-check
  furnace_spc_last_capture:
    name: "Furnace SPC Last Capture"
    has_date: true
    has_time: false
    icon: mdi:calendar-check
  ac_spc_last_capture:
    name: "AC SPC Last Capture"
    has_date: true
    has_time: false
    icon: mdi:calendar-check
  hwh_recirc_spc_last_capture:
    name: "HWH Recirc SPC Last Capture"
    has_date: true
    has_time: false
    icon: mdi:calendar-check
  dehumidifier_spc_last_capture:
    name: "Dehumidifier SPC Last Capture"
    has_date: true
    has_time: false
    icon: mdi:calendar-check
  # --- SPC seed stamps (2026-08-21) ---------------------------------------
  # Separate from the *_spc_last_capture stamps ON PURPOSE. The seeder used to
  # write the capture stamp, so nothing downstream could tell a MEASURED day
  # from a seeded one — a fabricated value was indistinguishable from data.
  # The dehumidifier's three identical 459.0 W slots were exactly that, and
  # they were dated 2026-08-08 as if captured. Capture stamps now mean
  # measurement and nothing else; seeding records itself here.
  fridge_spc_last_seed:
    name: "Fridge SPC Last Seed"
    has_date: true
    has_time: false
  furnace_spc_last_seed:
    name: "Furnace SPC Last Seed"
    has_date: true
    has_time: false
  ac_spc_last_seed:
    name: "AC SPC Last Seed"
    has_date: true
    has_time: false
  hwh_recirc_spc_last_seed:
    name: "HWH Recirc SPC Last Seed"
    has_date: true
    has_time: false
  dehumidifier_spc_last_seed:
    name: "Dehumidifier SPC Last Seed"
    has_date: true
    has_time: false
  cooling_kwh_cdd_spc_last_capture:
    name: "Cooling kWh/CDD SPC Last Capture"
    has_date: true
    has_time: false
    icon: mdi:calendar-check

template:
  - binary_sensor:
      # Clean on/off state (not just availability-gating) so history_stats
      # below has a proper state to measure time-in-"on" against.
      - name: "Fridge Compressor Running"
        unique_id: fridge_compressor_running
        device_class: running
        state: >
          {% set p = states('sensor.sem_fridge_power') %}
          {{ p not in ['unknown', 'unavailable']
             and p | float(0) > states('input_number.fridge_power_threshold') | float(50) }}

      - name: "Furnace Blower Running"
        unique_id: furnace_blower_running
        device_class: running
        state: >
          {% set p = states('sensor.sem_furnace_power') %}
          {{ p not in ['unknown', 'unavailable']
             and p | float(0) > states('input_number.furnace_power_threshold') | float(300) }}

      - name: "AC Compressor Running"
        unique_id: ac_compressor_running
        device_class: running
        state: >
          {% set p = states('sensor.sem_ac_power') %}
          {{ p not in ['unknown', 'unavailable']
             and p | float(0) > states('input_number.ac_power_threshold') | float(300) }}

      # Moved here from `sensor:` — device_class: problem is a binary_sensor
      # device class, not a valid sensor one (confirmed by HA rejecting this
      # exact pattern at runtime). The dehumidifier's own equivalent sensor
      # almost certainly has the same defect — worth checking its logs too.
      - name: "Fridge Watts Out Of Control"
        unique_id: fridge_watts_out_of_control
        device_class: problem
        state: >
          {% set w = states('sensor.fridge_running_watts_latched') | float(-1) %}
          {% set u = states('sensor.fridge_running_watts_upper') | float(0) %}
          {% set l = states('sensor.fridge_running_watts_lower') | float(0) %}
          {% set n = states('input_number.fridge_running_watts_day_3') | float(-1) %}
          {{ w > 0 and u > 0 and n >= 0 and (w > u or w < l) }}

      - name: "Furnace Watts Out Of Control"
        unique_id: furnace_watts_out_of_control
        device_class: problem
        state: >
          {% set w = states('sensor.furnace_running_watts_latched') | float(-1) %}
          {% set u = states('sensor.furnace_running_watts_upper') | float(0) %}
          {% set l = states('sensor.furnace_running_watts_lower') | float(0) %}
          {% set n = states('input_number.furnace_running_watts_day_3') | float(-1) %}
          {{ w > 0 and u > 0 and n >= 0 and (w > u or w < l) }}

      - name: "AC Watts Out Of Control"
        unique_id: ac_watts_out_of_control
        device_class: problem
        state: >
          {% set w = states('sensor.ac_running_watts_latched') | float(-1) %}
          {% set u = states('sensor.ac_running_watts_upper') | float(0) %}
          {% set l = states('sensor.ac_running_watts_lower') | float(0) %}
          {% set n = states('input_number.ac_running_watts_day_3') | float(-1) %}
          {{ w > 0 and u > 0 and n >= 0 and (w > u or w < l) }}

      - name: "HWH Recirc Pump Running"
        unique_id: hwh_recirc_pump_running
        device_class: running
        state: >
          {% set p = states('sensor.hwh_current_consumption') %}
          {{ p not in ['unknown', 'unavailable']
             and p | float(0) > states('input_number.hwh_recirc_power_threshold') | float(70) }}

      - name: "HWH Recirc Watts Out Of Control"
        unique_id: hwh_recirc_watts_out_of_control
        device_class: problem
        state: >
          {% set w = states('sensor.hwh_recirc_running_watts_latched') | float(-1) %}
          {% set u = states('sensor.hwh_recirc_running_watts_upper') | float(0) %}
          {% set l = states('sensor.hwh_recirc_running_watts_lower') | float(0) %}
          {% set n = states('input_number.hwh_recirc_running_watts_day_3') | float(-1) %}
          {{ w > 0 and u > 0 and n >= 0 and (w > u or w < l) }}

      # Moved from configuration.yaml + fixed: was device_class: problem
      # under sensor:, which HA rejects (problem is a binary_sensor device
      # class only). Same defect as sensor.automation_failures_active,
      # left as-is elsewhere in configuration.yaml, out of scope here.
      - name: "Dehumidifier Watts Out Of Control"
        unique_id: dehumidifier_watts_out_of_control
        device_class: problem
        state: >
          {% set w = states('sensor.dehumidifier_running_watts_latched') | float(-1) %}
          {% set u = states('sensor.dehumidifier_running_watts_upper') | float(0) %}
          {% set l = states('sensor.dehumidifier_running_watts_lower') | float(0) %}
          {% set n = states('input_number.dehumidifier_running_watts_day_3') | float(-1) %}
          {{ w > 0 and u > 0 and n >= 0 and (w > u or w < l) }}

      - name: "Cooling kWh/CDD Out Of Control"
        unique_id: cooling_kwh_cdd_out_of_control
        device_class: problem
        # Only fires when we have valid 7-day data (day_3 seeded) and today's
        # kWh/CDD exceeds upper limit. Lower bound not checked — low kWh/CDD
        # means efficient or low usage, not a problem.
        state: >
          {% set cdd = states('sensor.hvac_cdd65_today') | float(0) %}
          {% set ac = states('sensor.sem_ac_daily') | float(0) %}
          {% set u = states('sensor.cooling_kwh_cdd_upper') | float(0) %}
          {% set n = states('input_number.cooling_kwh_cdd_day_3') | float(-1) %}
          {% if cdd >= 0.5 and ac > 0.1 and u > 0 and n >= 0 %}
            {{ (ac / cdd) > u }}
          {% else %}
            false
          {% endif %}


      # =================================================================
      # SPC CAPTURE WATCHDOG (2026-08-21)
      #
      # WHY THIS EXISTS. On 2026-08-21 an audit of stale-detector coverage
      # found 6 of 10 non-SPC pipelines had one (hdd, cdd, runtime_per_hdd,
      # runtime_per_cdd, furnace_cycle, monthly_tracking) and 0 of 6 SPC
      # pipelines did. That is the only reason the dehumidifier could stop
      # capturing on 2026-08-07 and HWH recirc on 2026-08-01 and go 14 and 20
      # days without a sound. The house was instrumented; the instruments
      # were not. These follow binary_sensor.runtime_per_hdd_capture_stale
      # in configuration.yaml, with one addition described below.
      #
      # THE OPPORTUNITY GATE. A bare "last capture is old" test is wrong for
      # this data: furnace (heating) and AC (cooling) legitimately go MONTHS
      # without capturing every off-season, and an alarm that cries all summer
      # is an alarm you switch off. So each detector asks the sharper
      # question — did this pipeline have the OPPORTUNITY to capture and fail
      # to take it? Opportunity is any qualifying activity today, the same
      # quantity the capture guard reads. Out of season it is zero and the
      # detector stays quiet with no calendar heuristic to maintain.
      #
      # Deliberately gated on activity > 0 rather than on the guard's own
      # threshold. If an appliance runs for three days and never once clears
      # its guard band, that IS the fault worth surfacing — it means the guard
      # no longer matches the machine. This system has had that exact failure
      # twice: the Santa Fe -> E080 swap left every dehumidifier constant
      # describing a machine that was gone, and the 300 W furnace floor hid
      # the low-speed recirc mode.
      #
      # NO availability: BLOCK, on purpose. Every other template sensor in
      # this file carries one; a watchdog must not. A watchdog that can go
      # unavailable fails in exactly the direction that hides the fault, which
      # is the whole class of bug this was built to catch.
      #
      # Threshold is 2 days, not 1: a single missed night is legitimate
      # (the guard band rejects thin or nonsense days by design). Two
      # consecutive misses while the appliance is running is a real signal.
      #
      # "Never captured" (1970 stamp, i.e. after script.spc_reset_*) plus
      # live activity reports stale. That is intended, not a false positive:
      # the buffer is empty and the chart is blank, and you want to be told
      # if the first capture does not land.
      # =================================================================
      - name: "Fridge SPC Capture Stale"
        unique_id: fridge_spc_capture_stale
        device_class: problem
        state: >
          {% set last = states('input_datetime.fridge_spc_last_capture') %}
          {% set act = states('sensor.fridge_runtime_today') | float(0) %}
          {% if act <= 0 %}
            false
          {% elif last in ['unknown', 'unavailable', 'none', ''] or last[:4] == '1970' %}
            true
          {% else %}
            {% set dt = last | as_datetime %}
            {% if dt is none %}
              {# Stamp present but unparseable. Report stale: a watchdog must
                 never fail quiet, which is the direction that hides the very
                 fault it exists to catch. #}
              true
            {% else %}
              {{ (now().date() - dt.date()).days > 2 }}
            {% endif %}
          {% endif %}
        attributes:
          last_capture: "{{ states('input_datetime.fridge_spc_last_capture') }}"
          activity_today: "{{ states('sensor.fridge_runtime_today') }}"
          capture_guard: "runtime >= 1.0 h"

      - name: "Furnace SPC Capture Stale"
        unique_id: furnace_spc_capture_stale
        device_class: problem
        state: >
          {% set last = states('input_datetime.furnace_spc_last_capture') %}
          {% set act = states('sensor.furnace_runtime_today') | float(0) %}
          {% if act <= 0 %}
            false
          {% elif last in ['unknown', 'unavailable', 'none', ''] or last[:4] == '1970' %}
            true
          {% else %}
            {% set dt = last | as_datetime %}
            {% if dt is none %}
              {# Stamp present but unparseable. Report stale: a watchdog must
                 never fail quiet, which is the direction that hides the very
                 fault it exists to catch. #}
              true
            {% else %}
              {{ (now().date() - dt.date()).days > 2 }}
            {% endif %}
          {% endif %}
        attributes:
          last_capture: "{{ states('input_datetime.furnace_spc_last_capture') }}"
          activity_today: "{{ states('sensor.furnace_runtime_today') }}"
          capture_guard: "runtime >= 1.0 h"

      - name: "AC SPC Capture Stale"
        unique_id: ac_spc_capture_stale
        device_class: problem
        state: >
          {% set last = states('input_datetime.ac_spc_last_capture') %}
          {% set act = states('sensor.ac_runtime_today') | float(0) %}
          {% if act <= 0 %}
            false
          {% elif last in ['unknown', 'unavailable', 'none', ''] or last[:4] == '1970' %}
            true
          {% else %}
            {% set dt = last | as_datetime %}
            {% if dt is none %}
              {# Stamp present but unparseable. Report stale: a watchdog must
                 never fail quiet, which is the direction that hides the very
                 fault it exists to catch. #}
              true
            {% else %}
              {{ (now().date() - dt.date()).days > 2 }}
            {% endif %}
          {% endif %}
        attributes:
          last_capture: "{{ states('input_datetime.ac_spc_last_capture') }}"
          activity_today: "{{ states('sensor.ac_runtime_today') }}"
          capture_guard: "runtime >= 0.5 h"

      - name: "HWH Recirc SPC Capture Stale"
        unique_id: hwh_recirc_spc_capture_stale
        device_class: problem
        state: >
          {% set last = states('input_datetime.hwh_recirc_spc_last_capture') %}
          {% set act = states('sensor.hwh_recirc_runtime_today') | float(0) %}
          {% if act <= 0 %}
            false
          {% elif last in ['unknown', 'unavailable', 'none', ''] or last[:4] == '1970' %}
            true
          {% else %}
            {% set dt = last | as_datetime %}
            {% if dt is none %}
              {# Stamp present but unparseable. Report stale: a watchdog must
                 never fail quiet, which is the direction that hides the very
                 fault it exists to catch. #}
              true
            {% else %}
              {{ (now().date() - dt.date()).days > 2 }}
            {% endif %}
          {% endif %}
        attributes:
          last_capture: "{{ states('input_datetime.hwh_recirc_spc_last_capture') }}"
          activity_today: "{{ states('sensor.hwh_recirc_runtime_today') }}"
          capture_guard: "runtime >= 0.1 h"

      - name: "Dehumidifier SPC Capture Stale"
        unique_id: dehumidifier_spc_capture_stale
        device_class: problem
        state: >
          {% set last = states('input_datetime.dehumidifier_spc_last_capture') %}
          {% set act = states('counter.dehumidifier_cycles_today') | int(0) %}
          {% if act <= 0 %}
            false
          {% elif last in ['unknown', 'unavailable', 'none', ''] or last[:4] == '1970' %}
            true
          {% else %}
            {% set dt = last | as_datetime %}
            {% if dt is none %}
              {# Stamp present but unparseable. Report stale: a watchdog must
                 never fail quiet, which is the direction that hides the very
                 fault it exists to catch. #}
              true
            {% else %}
              {{ (now().date() - dt.date()).days > 2 }}
            {% endif %}
          {% endif %}
        attributes:
          last_capture: "{{ states('input_datetime.dehumidifier_spc_last_capture') }}"
          activity_today: "{{ states('counter.dehumidifier_cycles_today') }}"
          capture_guard: "cycles >= 2"

      - name: "Cooling kWh/CDD SPC Capture Stale"
        unique_id: cooling_kwh_cdd_spc_capture_stale
        device_class: problem
        state: >
          {% set last = states('input_datetime.cooling_kwh_cdd_spc_last_capture') %}
          {% set act = states('sensor.hvac_cdd65_today') | float(0) %}
          {% if act <= 0 %}
            false
          {% elif last in ['unknown', 'unavailable', 'none', ''] or last[:4] == '1970' %}
            true
          {% else %}
            {% set dt = last | as_datetime %}
            {% if dt is none %}
              {# Stamp present but unparseable. Report stale: a watchdog must
                 never fail quiet, which is the direction that hides the very
                 fault it exists to catch. #}
              true
            {% else %}
              {{ (now().date() - dt.date()).days > 2 }}
            {% endif %}
          {% endif %}
        attributes:
          last_capture: "{{ states('input_datetime.cooling_kwh_cdd_spc_last_capture') }}"
          activity_today: "{{ states('sensor.hvac_cdd65_today') }}"
          capture_guard: "CDD >= 0.5 and AC > 0.1 kWh"

      # Single signal for "some SPC pipeline has stopped measuring". This is
      # the one to put on a dashboard and hang a notification off; the six
      # above are the detail view.
      - name: "SPC Capture Stale (Any)"
        unique_id: spc_capture_stale_any
        device_class: problem
        state: >
          {% set ns = namespace(bad=[]) %}
          {% for label, e in [
            ('Fridge', 'binary_sensor.fridge_spc_capture_stale'),
            ('Furnace', 'binary_sensor.furnace_spc_capture_stale'),
            ('AC', 'binary_sensor.ac_spc_capture_stale'),
            ('HWH Recirc', 'binary_sensor.hwh_recirc_spc_capture_stale'),
            ('Dehumidifier', 'binary_sensor.dehumidifier_spc_capture_stale'),
            ('Cooling kWh/CDD', 'binary_sensor.cooling_kwh_cdd_spc_capture_stale')
          ] %}
            {% if is_state(e, 'on') %}{% set ns.bad = ns.bad + [label] %}{% endif %}
          {% endfor %}
          {{ ns.bad | length > 0 }}
        attributes:
          stale_populations: >
            {% set ns = namespace(bad=[]) %}
            {% for label, e in [
              ('Fridge', 'binary_sensor.fridge_spc_capture_stale'),
              ('Furnace', 'binary_sensor.furnace_spc_capture_stale'),
              ('AC', 'binary_sensor.ac_spc_capture_stale'),
              ('HWH Recirc', 'binary_sensor.hwh_recirc_spc_capture_stale'),
              ('Dehumidifier', 'binary_sensor.dehumidifier_spc_capture_stale'),
              ('Cooling kWh/CDD', 'binary_sensor.cooling_kwh_cdd_spc_capture_stale')
            ] %}
              {% if is_state(e, 'on') %}{% set ns.bad = ns.bad + [label] %}{% endif %}
            {% endfor %}
            {{ ns.bad | join(', ') if ns.bad else 'none' }}

  - sensor:
      # ===============================================================
      # FRIDGE RUNNING-WATTS SPC (compressor health)
      # Gates on power > threshold directly, same pattern as the
      # dehumidifier: keeps the ~0W off-cycle samples out of the mean.
      # ===============================================================
      - name: "Fridge Power When On"
        unique_id: fridge_power_when_on
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {% set p = states('sensor.sem_fridge_power') %}
          {{ p not in ['unknown', 'unavailable']
             and p | float(0) > states('input_number.fridge_power_threshold') | float(50) }}
        state: "{{ states('sensor.sem_fridge_power') | float(0) }}"

      - name: "Fridge Running Watts Daily"
        unique_id: fridge_running_watts_daily
        unit_of_measurement: "W"
        state_class: measurement
        icon: mdi:chart-bar
        # Mirrors the most recent gated daily capture (input_number day_1).
        # Steps once nightly at 23:59, so ApexCharts draws one dated column
        # per day — same gated day_1..7 source as the SPC limits.
        availability: >
          {% set stamp = states('input_datetime.fridge_spc_last_capture') | as_datetime %}
          {{ stamp is not none
             and (now().date() - stamp.date()).days <= 1
             and states('input_number.fridge_running_watts_day_1') | float(0) > 0 }}
        state: "{{ states('input_number.fridge_running_watts_day_1') | float(0) | round(1) }}"

      - name: "Fridge Running Watts Mean 7d"
        unique_id: fridge_running_watts_mean_7d
        unit_of_measurement: "W"
        state_class: measurement
        icon: mdi:chart-bell-curve
        # 2026-08-21: below 2 valid slots there is no defensible centre
        # line, and the hard-coded fallback below drew a control band around
        # a number no measurement supports. Unavailable is the honest state —
        # the chart then draws no limits, and the out-of-control binary stays
        # quiet because it reads the limits through | float(0) and requires
        # u > 0. A 0 slot means "no valid subgroup that day" (cleared, or a
        # skipped capture) and is excluded here exactly as it is below.
        availability: >
          {% set days = [
            states('input_number.fridge_running_watts_day_1') | float(-1),
            states('input_number.fridge_running_watts_day_2') | float(-1),
            states('input_number.fridge_running_watts_day_3') | float(-1),
            states('input_number.fridge_running_watts_day_4') | float(-1),
            states('input_number.fridge_running_watts_day_5') | float(-1),
            states('input_number.fridge_running_watts_day_6') | float(-1),
            states('input_number.fridge_running_watts_day_7') | float(-1)
          ] %}
          {{ days | select('>', 0) | select('<=', 400) | list | length > 1 }}
        state: >
          {% set days = [
            states('input_number.fridge_running_watts_day_1') | float(-1),
            states('input_number.fridge_running_watts_day_2') | float(-1),
            states('input_number.fridge_running_watts_day_3') | float(-1),
            states('input_number.fridge_running_watts_day_4') | float(-1),
            states('input_number.fridge_running_watts_day_5') | float(-1),
            states('input_number.fridge_running_watts_day_6') | float(-1),
            states('input_number.fridge_running_watts_day_7') | float(-1)
          ] %}
          {% set valid = days | select('>', 0) | select('<=', 400) | list %}
          {% if valid | length > 0 %}
            {{ (valid | sum / valid | length) | round(1) }}
          {% else %}
            120
          {% endif %}

      - name: "Fridge Running Watts Sigma 7d"
        unique_id: fridge_running_watts_sigma_7d
        unit_of_measurement: "W"
        state_class: measurement
        icon: mdi:sigma
        # 2026-08-21: two gates, both meaning "this is not a sample".
        #   (a) fewer than 2 valid slots — nothing to compute a spread from;
        #   (b) sd = 0 across the valid slots — a repeated value, not a
        #       process (see the note further down).
        # Either way unavailable is the honest state: the chart draws no
        # limits, and the out-of-control binary stays quiet because it reads
        # the limits through | float(0) and requires u > 0. A 0 slot means
        # "no valid subgroup that day" (cleared, or a skipped capture) and is
        # excluded here exactly as it is below.
        availability: >
          {% set days = [
            states('input_number.fridge_running_watts_day_1') | float(-1),
            states('input_number.fridge_running_watts_day_2') | float(-1),
            states('input_number.fridge_running_watts_day_3') | float(-1),
            states('input_number.fridge_running_watts_day_4') | float(-1),
            states('input_number.fridge_running_watts_day_5') | float(-1),
            states('input_number.fridge_running_watts_day_6') | float(-1),
            states('input_number.fridge_running_watts_day_7') | float(-1)
          ] %}
          {% set valid = days | select('>', 0) | select('<=', 400) | list %}
          {% if valid | length > 1 %}
            {% set mean = valid | sum / valid | length %}
            {% set variance = namespace(sum=0) %}
            {% for v in valid %}
              {% set variance.sum = variance.sum + ((v - mean) ** 2) %}
            {% endfor %}
            {# 2026-08-21 second pass. sd = 0 across two or more
               subgroups is the signature of a REPEATED value, not of
               a perfect process: at 0.05 (half the slot
               resolution) genuine day-to-day variation always clears
               it. The first pass substituted the 8 fallback
               here, which drew a plausible-looking control band around
               a centre line nobody measured — worse than the collapse
               it replaced. Unavailable is the honest state; upper and
               lower follow via their is_number() guards. #}
            {{ ((variance.sum / (valid | length - 1)) ** 0.5) >= 0.05 }}
          {% else %}
            false
          {% endif %}
        state: >
          {% set days = [
            states('input_number.fridge_running_watts_day_1') | float(-1),
            states('input_number.fridge_running_watts_day_2') | float(-1),
            states('input_number.fridge_running_watts_day_3') | float(-1),
            states('input_number.fridge_running_watts_day_4') | float(-1),
            states('input_number.fridge_running_watts_day_5') | float(-1),
            states('input_number.fridge_running_watts_day_6') | float(-1),
            states('input_number.fridge_running_watts_day_7') | float(-1)
          ] %}
          {% set valid = days | select('>', 0) | select('<=', 400) | list %}
          {% if valid | length > 1 %}
            {% set mean = valid | sum / valid | length %}
            {% set variance = namespace(sum=0) %}
            {% for v in valid %}
              {% set variance.sum = variance.sum + ((v - mean) ** 2) %}
            {% endfor %}
            {% set sd = (variance.sum / (valid | length - 1)) ** 0.5 %}
