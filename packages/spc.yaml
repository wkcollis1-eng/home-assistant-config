            states('input_number.dehumidifier_running_watts_day_2') | float(-1),
            states('input_number.dehumidifier_running_watts_day_3') | float(-1),
            states('input_number.dehumidifier_running_watts_day_4') | float(-1),
            states('input_number.dehumidifier_running_watts_day_5') | float(-1),
            states('input_number.dehumidifier_running_watts_day_6') | float(-1),
            states('input_number.dehumidifier_running_watts_day_7') | float(-1)
          ] %}
          {{ days | select('>', 0) | select('<=', 800) | list | length > 1 }}
        state: >
          {% set days = [
            states('input_number.dehumidifier_running_watts_day_1') | float(-1),
            states('input_number.dehumidifier_running_watts_day_2') | float(-1),
