                  level: info
                  message: >-
                    SPC seed: Fridge NOT seeded — no measured mean in band
                    (sensor.fridge_running_watts_24h = {{ states('sensor.fridge_running_watts_24h') }}, needs 50 < w < 400).
                    Slots stay 0; the chart shows a gap and the limits stay
