  # --- Dehumidifier Running-Watts SPC: 7-day rolling slots ---
  # Moved from configuration.yaml — the original, longest-running population
  # in this file. dehumidifier_power_threshold stays in configuration.yaml
  # (shared with binary_sensor.dehumidifier_compressor_active, not part of
  # this move).
  # --- Dehumidifier SPC: compressor warm-up exclusion (added 2026-08-07) ---
  # Samples taken before the compressor has been running this long are NOT
  # counted toward the SPC mean. See the long note on
  # sensor.dehumidifier_power_when_on_steady for why this exists.
  # initial semantics per the 2026-07-20 note above: value RESETS on every
  # HA restart, so make permanent changes here in YAML, not in the UI.
  # 12 -> 10 (2026-08-07, second pass). Setpoints move to 55.5/52, which
  # shortens runs from ~17.5 min to ~15 min. At a 12-min exclusion a 15-min
  # run yields only 3 min of steady samples; at 10 min it yields 5 - a 67 %
  # gain in usable samples. Cost is a small known bias: from the fitted
  # plug-cut ramp W(t) = 464.0 - 44.8*exp(-t/5.90), minute 10 sits 8.2 W
  # below asymptote vs 5.9 W at minute 12. That bias is CONSTANT across days
  # at a fixed setpoint, so it shifts the centre line, not the trend - which
  # is what this chart is for. Re-baseline the centre line after the change.
  dehumidifier_spc_warmup_minutes:
    name: "Dehumidifier SPC Window Start"
    min: 0
    max: 30
    step: 1
    initial: 10
    unit_of_measurement: "min"
    mode: box
    icon: mdi:timer-sand

  # --- SPC WINDOW END (added 2026-08-07, third pass) ---
  # Turns the steady-state gate from an OPEN-ENDED tail into a FIXED WINDOW.
  # Measured on the 8 plug-cut runs available (14.6-30.3 min), dispersion of
  # the candidate daily statistic:
  #     minutes 12..end   mean 456.63  sd 3.75
  #     minutes 10..end   mean 456.95  sd 3.19
  #     minutes 10..14    mean 458.87  sd 2.09   <-- chosen
  #     minutes 10..13    mean 458.56  sd 2.15
  #     minutes  8..14    mean 457.77  sd 1.99   (rejected: minute 8 is still
  #                                               ~12 W into the ramp)
  # A 44 % cut in the process sigma, which tightens the control limits by the
  # same factor and lets the chart resolve a drift 44 % smaller. NOTE the
  # mechanism is NOT a run-length correction - regressing every candidate
  # against run length gives p > 0.93 in all cases. It is that an open-ended
  # tail averages in minutes 15-30 of the LONG runs, where entering air is
  # much drier and the operating point is simply different. A fixed window
  # compares like with like.
  #
  # CONSEQUENCE TO ACCEPT: a run shorter than the window end contributes
  # nothing. At the 55.5/52 band runs measure 14.6-15.3 min, so 14 fits with
  # little margin. If run lengths fall further, lower this to 13 (sd 2.15,
  # barely worse) rather than widening it back open.
  dehumidifier_spc_window_end_minutes:
    name: "Dehumidifier SPC Window End"
    min: 5
    max: 60
    step: 1
    initial: 14
    unit_of_measurement: "min"
    mode: box
    icon: mdi:timer-sand-complete

