            states('input_number.ac_min_per_cycle_day_7') | float(-1)
          ] %}
          {{ days | select('>', 0) | select('<=', 120) | list | count }}

      # Uses furnace runtime (gas burns when furnace runs, not per zone call)
      - name: "HVAC Daily Gas Cost Estimate"
        unique_id: hvac_daily_gas_cost_estimate
        unit_of_measurement: "$"
        state_class: measurement
        icon: mdi:currency-usd
        # Guarded 2026-10-11. Without it an unreadable runtime read $0.00, and an
        # unreadable gas_effective_rate fell back to 1.6818 against a live 4.6275
        # $/CCF [M] - a cost 64 % low [D: 1 - 1.6818 / 4.6275] with no sign of it.
        availability: >
          {{ states('sensor.hvac_furnace_runtime_today') | is_number
             and states('sensor.gas_effective_rate') | is_number }}
        state: >
          {% set runtime = states('sensor.hvac_furnace_runtime_today') | float(0) %}
          {% set rate = states('input_number.furnace_heating_rate_btu_hr') | float(100000) %}
          {% set gas_rate = states('sensor.gas_effective_rate') | float(1.6818) %}
          {# Gas INPUT basis: rate is the 100,000 BTU/hr INPUT rating, so     #}
          {# CCF burned = runtime x rate / 103,700. AFUE must NOT appear.     #}
          {# Fixed 2026-10-11: the old /(103700*0.95) overstated gas +5.26%,  #}
          {# the defect fixed 2026-07-03 in hvac_heating_efficiency_mtd and   #}
          {# missed in this twin.                                             #}
          {% set ccf_used = (runtime * rate) / 103700 %}
          {{ (ccf_used * gas_rate) | round(2) }}

      # Uses furnace blower runtime (heating) + AC compressor runtime (cooling)
      # blower_kw = 0.21: measured ECM draw per SYSTEM_SPECIFICATIONS.md (corrected from 0.5)
      # condenser_kw drawn from input_number: 4.9 kW measured steady-state per SYSTEM_SPECIFICATIONS.md
      # AC total = blower + condenser (blower runs during both heat and cool calls)
      - name: "HVAC Daily Electric Cost Estimate"
        unique_id: hvac_daily_electric_cost_estimate
        unit_of_measurement: "$"
        state_class: measurement
        icon: mdi:currency-usd
        # Guarded 2026-10-11. Without it an unreadable runtime counted as 0 h, and an
        # unreadable electricity_effective_rate fell back to 0.2733 against a live
        # 0.2553 $/kWh [M], 7.1 % high [D: 0.2733 / 0.2553 - 1]. The condenser kW is a
        # stored helper and keeps its 4.9 fallback. NOT caught here: the rate sensor
        # itself emits 0.2733 when the bill helpers are 0 - it is a number, so it passes.
        availability: >
          {{ states('sensor.hvac_furnace_runtime_today') | is_number
             and states('sensor.hvac_ac_runtime_today') | is_number
             and states('sensor.electricity_effective_rate') | is_number }}
        state: >
          {% set heat_runtime = states('sensor.hvac_furnace_runtime_today') | float(0) %}
          {% set ac_runtime = states('sensor.hvac_ac_runtime_today') | float(0) %}
          {% set blower_kw = 0.21 %}
          {% set condenser_kw = states('input_number.ac_condenser_kw') | float(4.9) %}
          {% set elec_rate = states('sensor.electricity_effective_rate') | float(0.2733) %}
          {% set heat_cost = heat_runtime * blower_kw * elec_rate %}
          {% set ac_cost = ac_runtime * (blower_kw + condenser_kw) * elec_rate %}
          {{ (heat_cost + ac_cost) | round(2) }}

      - name: "HVAC Daily Total Cost Estimate"
        unique_id: hvac_daily_total_cost_estimate
        unit_of_measurement: "$"
        state_class: measurement
        icon: mdi:currency-usd
        # Guarded 2026-10-11. The gas cost has been unavailable on bad inputs since
        # 1fad1c7; through float(0) alone this total then read electric-only
        # ($0.02 of $2.02 at 13:16 [M]) and looked like a quiet day.
        availability: >
          {{ states('sensor.hvac_daily_gas_cost_estimate') | is_number
             and states('sensor.hvac_daily_electric_cost_estimate') | is_number }}
        state: >
          {% set gas = states('sensor.hvac_daily_gas_cost_estimate') | float(0) %}
          {% set elec = states('sensor.hvac_daily_electric_cost_estimate') | float(0) %}
          {{ (gas + elec) | round(2) }}

      # AC-only cooling cost today = ac_runtime * (blower + condenser) kW * effective $/kWh.
      # Rate is captured nightly into ac_cost_year_acc and locked, so a mid-month
      # bill/rate change never reprices days already accumulated.
      - name: "HVAC AC Daily Cost"
        unique_id: hvac_ac_daily_cost
        unit_of_measurement: "$"
        state_class: total_increasing
        icon: mdi:currency-usd
        availability: >
          {{ states('sensor.hvac_ac_runtime_today') not in ['unknown', 'unavailable'] }}
        state: >
          {# 2026-07-03: condenser term is now SEM-METERED (sem_ac_daily kWh,
             CT on the AC circuit, x2 one-leg correction applied at source)
             replacing the runtime x 4.9 kW parametric model. Blower stays
             modeled (runtime x 0.21 kW) — it lives on the furnace circuit, so
             sem_ac_daily does not include it. Parametric fallback preserved
             for SEM outages so the daily capture never records 0. #}
          {% set ac_runtime = states('sensor.hvac_ac_runtime_today') | float(0) %}
          {% set blower_kw = 0.21 %}
          {% set rate = states('sensor.electricity_effective_rate') | float(0.2733) %}
          {% set sem_raw = states('sensor.sem_ac_daily') %}
          {% if sem_raw not in ['unknown', 'unavailable'] and is_number(sem_raw) %}
            {{ (((sem_raw | float(0)) + ac_runtime * blower_kw) * rate) | round(2) }}
          {% else %}
            {% set condenser_kw = states('input_number.ac_condenser_kw') | float(4.9) %}
            {{ (ac_runtime * (blower_kw + condenser_kw) * rate) | round(2) }}
          {% endif %}

      # Live AC year-to-date cost: locked accumulator (completed days) plus today's
      # running cost until the 23:59:45 capture folds it in. Resets each Jan 1.
      - name: "HVAC AC Cost Year To Date"
        unique_id: hvac_ac_cost_year_to_date
        unit_of_measurement: "$"
        state_class: total
        icon: mdi:cash-multiple
        state: >
          {% set acc = states('input_number.ac_cost_year_acc') | float(0) %}
          {% set today = states('sensor.hvac_ac_daily_cost') | float(0) %}
          {% set last = states('input_datetime.ac_cost_capture_last_ok') %}
          {% set captured_today = last[:10] == now().strftime('%Y-%m-%d')
             if last not in ['unknown', 'unavailable', '1970-01-01 00:00:00'] else false %}
          {{ (acc if captured_today else acc + today) | round(2) }}

      # === Gas heating cost summaries (season-indexed store) ===
      - name: "Gas Heat Season Cost Current"
        unique_id: gas_heat_season_cost_current
        unit_of_measurement: "$"
        state_class: total
        icon: mdi:cash
        state: >
          {% set ns = namespace(t=0.0) %}
          {% for i in range(1,13) %}{% set ns.t = ns.t + states('input_number.gas_heat_cs_' ~ i) | float(0) %}{% endfor %}
          {{ ns.t | round(2) }}

      - name: "Gas Heat Season Cost Last"
        unique_id: gas_heat_season_cost_last
        unit_of_measurement: "$"
        state_class: total
