            states('input_number.hdd_day_5') | float(-1),
            states('input_number.hdd_day_6') | float(-1),
            states('input_number.hdd_day_7') | float(-1)
          ] %}
          {% set valid = days | select('>=', 0) | select('<=', 65) | list %}
          {{ valid | sum | round(1) }}

