          {% if forecast | length < 7 %}
            false
          {% else %}
            {% set ns = namespace(ok=true) %}
            {% for day in forecast[:7] %}
              {% if not (is_number(day.temperature) and is_number(day.templow)) %}
                {% set ns.ok = false %}
