# ===============================================================
# CLIMATE NORMS - Daily lookup from historical climate data
# ===============================================================
# Reads climate_daily_norms.csv (18 years of data) to provide
# expected HDD/CDD values for today based on historical averages.
# Updates once daily at startup and midnight.
# 2026-09-23: now reads climate_daily_norms_bdl.csv - NCEI 1991-2020 normals
# for Bradley BDL, built by scripts/build_bdl_daily_norms.py. The 18-year file
# was not BDL (annual 6,128 vs 5,873 [M]); it is kept, unused.
# ===============================================================

command_line:
  - sensor:
      name: "BDL Degree Days"
      unique_id: bdl_degree_days
      # Fetches official Bradley/KBDL monthly HDD65/CDD65 from ACIS and upserts
      # /config/reports/bdl_degree_days.csv. The daily scan IS the monthly
      # capture: each completed month is written once ACIS has finalized it
      # (self-backfilling), so a not-yet-published month fills in automatically.
      command: "python3 /config/scripts/fetch_bdl_degree_days.py --csv /config/reports/bdl_degree_days.csv"
      command_timeout: 45
      scan_interval: 86400  # daily; ACIS finalizes a completed month within days
      value_template: "{{ value_json.latest_month }}"
      json_attributes:
        - latest_hdd
        - latest_cdd
        - trailing_12
        - trailing_12_sum
        - trailing_12_count
        - trailing_12_cdd_sum  # 2026-09-23
        - added
        - updated
        - rows
        - status  # "ok", or "stale" = ACIS unreachable, serving the CSV (2026-09-23)
        - detail  # why it is stale

  - sensor:
      name: "Climate Norms Today"
      unique_id: climate_norms_today
      command: "python3 /config/scripts/climate_norms_today.py"
      command_timeout: 30
      scan_interval: 3600  # Hourly update to ensure day rollover is captured
      value_template: "{{ value_json.status }}"
      json_attributes:
        - day_of_year
        - month
        - day
        - hdd_mean
        - hdd_min
        - hdd_max
        - hdd_p10
        - hdd_p90
        - hdd_mean_smoothed
        - cdd_mean
        - cdd_p10
        - cdd_p90
        - tmean
        - tmin
        - tmax
        - samples
        # 2026-09-23: BDL normals that replaced hard-coded dicts (R10)
        - month_hdd_normal
        - mtd_hdd_normal
        - annual_hdd_normal
        - annual_cdd_normal
        - source

  # 2026-09-23 (Bill: "switch to the NWS KBDL hourly observations"). Trailing
  # 24 h HDD65/CDD65 from Bradley's own METARs, 65 - (max+min)/2 as NWS/ACIS
  # define it. It is the primary basis of sensor.hvac_hdd65_today /
  # hvac_cdd65_today; the proxy chain is their fallback only when this is not
  # "ok". Scored vs ACIS BDL daily HDD: bias +0.06, sd 0.57, MAE 0.34 HDD/day
  # [M, n=752 days, replay of the script's own compute()]. Evidence and the
  # 5-minute-ob exclusion: header of scripts/kbdl_degree_days.py.
  - sensor:
      name: "KBDL Degree Days 24h"
      unique_id: kbdl_degree_days_24h
      command: "python3 /config/scripts/kbdl_degree_days.py"
      command_timeout: 45
      scan_interval: 600  # the 23:55 capture reads a value at most 10 min old
      value_template: "{{ value_json.status }}"  # ok / insufficient / error
      json_attributes:
        - hdd65
        - cdd65
        - tmax
        - tmin
        - n_obs
        - max_gap_h
        - window_start
        - window_end
        - last_obs
        - station
        - method
        - detail  # why it is not "ok"
