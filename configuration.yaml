        state: >
          {% set cur = states('input_number.gas_bill_ccf') | float(0) %}
          {% set ly = states('input_number.gas_bill_ccf_last_year') | float(0) %}
          {{ ((cur / ly - 1) * 100) | round(1) if ly > 0 and cur > 0 else 0 }}

      - name: "Electricity Bill Change YoY"
