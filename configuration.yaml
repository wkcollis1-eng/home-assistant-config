  # ===============================================================
  # BASEMENT TH NODE - display tuning (HA is the source of truth)
  # ===============================================================
  # basement-th-node.yaml imports these three via `platform: homeassistant`
  # and mirrors each into a restore_value global so the node keeps the last
  # known value through a WiFi/HA outage. They did NOT previously exist in
  # HA, so every import silently no-op'd and the node has been running on
  # its firmware NVS defaults (12 lx / 3 min / 30 %).
  #
  # No `initial:` on purpose - `initial` re-forces the value on every HA
  # restart and would defeat field tuning. Without it, a never-before-set
  # input_number lands on `min`, so each `min` below is chosen to be a SAFE
  # first-load value rather than the widest legal one:
  #   lux_wake  min 2   - firmware accept guard is x > 0; 2 lx wakes readily
  #                       and the self-glow latch breaker covers the rest
  #   blank_min min 2   - firmware accept guard is x >= 1
  #   contrast  min 20  - firmware accept guard is 5..100, but its own note
  #                       says <= 15 % may clamp dark on some SSD1306 stacks
  basement_display_lux_wake:
    name: "Basement Display Lux Wake"
    min: 2
    max: 200
    step: 0.5
    unit_of_measurement: "lx"
    mode: box
    icon: mdi:brightness-6

  basement_display_blank_min:
    name: "Basement Display Blank Delay"
    min: 2
    max: 30
    step: 1
    unit_of_measurement: "min"
    mode: box
    icon: mdi:timer-sand

  basement_display_contrast_pct:
    name: "Basement Display Contrast"
    min: 20
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: box
    icon: mdi:contrast-circle

  # Tolerance for the SHT45-vs-Shelly cross-check flag. Deliberately set
  # wide enough that it is a DRIFT detector, not a restatement of the
  # currently-open ~9 %RH disagreement. Tighten it after that is resolved.
  basement_rh_delta_tolerance:
    name: "Basement RH Cross-Check Tolerance"
    min: 0.5
    max: 15
    step: 0.5
    unit_of_measurement: "%"
    mode: box
    icon: mdi:approximate-equal

# ===============================================================
# INPUT SELECT
# ===============================================================
input_select:
  dehumidifier_last_stop_reason:
    name: "Dehumidifier Last Stop Reason"
    options:
      - conditions_cleared
      - max_runtime
      - rh_stall
      # dp_stall added 2026-07-30 with the DP-control conversion. rh_stall
      # is retained rather than renamed so historical states stay readable.
      - dp_stall
      - sensor_loss
      # Not a stop reason in the usual sense - it marks that HA has
      # handed the unit to its own humidistat, so the badge stops
      # reporting a stale HA stop that no longer describes anything.
      - local_control
      - unknown
    # NO `initial:`. 2026-08-24: this carried `initial: unknown`, and an
    # input_select with `initial:` does not restore - HA forces that value at
    # every start. The last stop reason was therefore erased by every restart,
    # which is the one moment you most want to know why the unit stopped.
    # `unknown` stays in options as the restore target for a fresh deploy.
    icon: mdi:information-outline

