      # === RUNTIME PER HDD STATISTICS (for control chart boundaries) ===
      - name: "HVAC Runtime per HDD 7-Day Mean"
        unique_id: hvac_runtime_per_hdd_7day_mean
        unit_of_measurement: "min/HDD"
        state_class: measurement
        icon: mdi:chart-bell-curve
        # Validates each day slot is within valid range (0-120), excludes corrupt values
        state: >
          {% set days = [
            states('input_number.runtime_per_hdd_day_1') | float(-1),
            states('input_number.runtime_per_hdd_day_2') | float(-1),
            states('input_number.runtime_per_hdd_day_3') | float(-1),
            states('input_number.runtime_per_hdd_day_4') | float(-1),
            states('input_number.runtime_per_hdd_day_5') | float(-1),
            states('input_number.runtime_per_hdd_day_6') | float(-1),
            states('input_number.runtime_per_hdd_day_7') | float(-1)
          ] %}
          {% set valid = days | select('>', 0) | select('<=', 120) | list %}
          {% if valid | length > 0 %}
            {{ (valid | sum / valid | length) | round(1) }}
          {% else %}
            10.6
          {% endif %}

      - name: "HVAC Runtime per HDD 7-Day Std Dev"
        unique_id: hvac_runtime_per_hdd_7day_stddev
        unit_of_measurement: "min/HDD"
        state_class: measurement
        icon: mdi:sigma
        # Validates each day slot is within valid range (0-120), excludes corrupt values
        state: >
          {% set days = [
            states('input_number.runtime_per_hdd_day_1') | float(-1),
            states('input_number.runtime_per_hdd_day_2') | float(-1),
            states('input_number.runtime_per_hdd_day_3') | float(-1),
            states('input_number.runtime_per_hdd_day_4') | float(-1),
            states('input_number.runtime_per_hdd_day_5') | float(-1),
            states('input_number.runtime_per_hdd_day_6') | float(-1),
            states('input_number.runtime_per_hdd_day_7') | float(-1)
          ] %}
          {% set valid = days | select('>', 0) | select('<=', 120) | list %}
          {% if valid | length > 1 %}
            {% set mean = valid | sum / valid | length %}
            {% set variance = namespace(sum=0) %}
            {% for v in valid %}
              {% set variance.sum = variance.sum + ((v - mean) ** 2) %}
            {% endfor %}
            {{ ((variance.sum / (valid | length - 1)) ** 0.5) | round(1) }}
          {% else %}
            1.1
          {% endif %}

      - name: "HVAC Runtime per HDD Upper Bound"
        unique_id: hvac_runtime_per_hdd_upper_bound
        unit_of_measurement: "min/HDD"
        state_class: measurement
        icon: mdi:arrow-up-bold
        # 2026-08-22: was a two-step fallback onto
        # sensor.hvac_runtime_per_hdd_7_day_{mean,std_dev}_2 - entities that have
        # never existed - and from there onto the literals 10 and 2. So whenever
        # the real mean or sd went missing this sensor published a control band
        # built from numbers nobody measured. Same defect the 24 SPC limit
        # sensors had until 2026-08-21; same fix. Unavailable is the honest
        # state, and it fails quiet: consumers read this through `| float(0)`
        # and gate on `upper > 0`.
        availability: >
          {{ is_number(states('sensor.hvac_runtime_per_hdd_7_day_mean'))
             and is_number(states('sensor.hvac_runtime_per_hdd_7_day_std_dev')) }}
        state: >
          {% set mean = states('sensor.hvac_runtime_per_hdd_7_day_mean') | float(0) %}
          {% set stddev = states('sensor.hvac_runtime_per_hdd_7_day_std_dev') | float(0) %}
          {{ (mean + (stddev * 2)) | round(1) }}
        attributes:
          # 'fallback_2' is gone with the branch that produced it. availability:
          # now guarantees both sources are numeric whenever this renders, so the
          # useful diagnostic is the sample count behind them, not which source
          # won.
          data_count: "{{ states('sensor.hvac_runtime_per_hdd_data_count') }}"

      - name: "HVAC Runtime per HDD Lower Bound"
        unique_id: hvac_runtime_per_hdd_lower_bound
        unit_of_measurement: "min/HDD"
        state_class: measurement
        icon: mdi:arrow-down-bold
        # 2026-08-22: was a two-step fallback onto
        # sensor.hvac_runtime_per_hdd_7_day_{mean,std_dev}_2 - entities that have
        # never existed - and from there onto the literals 10 and 2. So whenever
        # the real mean or sd went missing this sensor published a control band
        # built from numbers nobody measured. Same defect the 24 SPC limit
        # sensors had until 2026-08-21; same fix. Unavailable is the honest
