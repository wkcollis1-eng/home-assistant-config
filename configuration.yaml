# ===============================================================
# COMPLETE CONFIGURATION.YAML - ENERGY PERFORMANCE TRACKING
# ===============================================================
# Version: Final with Auto HDD + Live Weather + Santa Fe Dehumidifier
#
# INSTRUCTIONS:
# 1. Backup your current configuration.yaml
# 2. Replace ENTIRE contents with this file
# 3. Full restart required (Settings > System > Restart)
# ===============================================================

default_config:

# Load split-out package files (SEM-Meter energy monitoring lives in packages/)
homeassistant:
  packages: !include_dir_named packages

# Shell commands for CSV reports
shell_command:
  # testcmd / test_python removed 2026-08-22: install-time smoke tests, never
  # called by anything, and `echo hello` is indistinguishable from a live
  # command in an audit listing. ha_audit.py rule_shell_commands_guarded had
  # been reporting both as dead-shell-command.

  # ===============================================================
  # CSV MANAGEMENT - Python-based (maintainable, validated)
  # ===============================================================
  # Daily HVAC report - appends one row per day
  appenddailycsv: >-
    python3 /config/scripts/csv_manager.py append_daily --data '{
      "date": "{{ now().strftime('%Y-%m-%d') }}",
      "outdoor_high": {{ states('input_number.outdoor_temp_daily_high') | float(0) }},
      "outdoor_low": {{ states('input_number.outdoor_temp_daily_low') | float(0) }},
      "outdoor_mean": {{ ((states('input_number.outdoor_temp_daily_high') | float(0) + states('input_number.outdoor_temp_daily_low') | float(0)) / 2) | round(1) }},
      "hdd65": {{ states('sensor.hvac_hdd65_today') | float(0) }},
      "furnace_runtime_min": {{ (states('sensor.hvac_furnace_runtime_today') | float(0) * 60) }},
      "furnace_cycles": {{ states('sensor.hvac_furnace_cycles_today') | int(0) }},
      "avg_min_per_cycle": {{ states('sensor.hvac_furnace_min_per_cycle') | float(0) }},
      "zone_calls_total": {{ states('sensor.hvac_total_cycles_today') | int(0) }},
      "chaining_index": {{ states('sensor.hvac_chaining_index') | float(1) }},
      "runtime_1f_min": {{ (states('sensor.hvac_1f_heat_runtime_today') | float(0) * 60) }},
      "runtime_2f_min": {{ (states('sensor.hvac_2f_heat_runtime_today') | float(0) * 60) }},
      "basement_dew_point": {{ states('sensor.basement_dew_point') | float(0) }},
      "cdd65": {{ states('sensor.hvac_cdd65_today') | float(0) }},
      "ac_runtime_min": {{ (states('sensor.hvac_ac_runtime_today') | float(0) * 60) | round(1) }},
      "ac_cycles": {{ states('sensor.hvac_ac_cycles_today') | int(0) }},
      "ac_min_per_cycle": {{ states('sensor.hvac_ac_min_per_cycle') | float(0) }},
      "cool_calls_total": {{ states('sensor.hvac_total_cool_cycles_today') | int(0) }},
      "cool_runtime_1f_min": {{ (states('sensor.hvac_1f_cool_runtime_today') | float(0) * 60) | round(1) }},
      "cool_runtime_2f_min": {{ (states('sensor.hvac_2f_cool_runtime_today') | float(0) * 60) | round(1) }},
      "dehumidifier_kwh": {{ states('sensor.dehumidifier_energy_daily') | float(0) | round(3) }}
    }'

  # Monthly HVAC report - appends one row per month
  appendmonthlycsv: >-
    python3 /config/scripts/csv_manager.py append_monthly --data '{
      "month": "{{ now().strftime('%Y-%m') }}",
      "days": {{ states('input_number.outdoor_temp_days_month') | int(0) }},
      "mean_outdoor_temp": {{ states('sensor.outdoor_temp_mean_month') | float(0) }},
      "total_hdd65": {{ states('input_number.hdd_cumulative_month_auto') | float(0) }},
      "furnace_runtime_hours": {{ states('sensor.hvac_furnace_runtime_month_2') | float(0) }},
      "avg_runtime_per_hdd": {{ states('sensor.hvac_runtime_per_hdd_month') | float(0) }},
      "heating_efficiency_ccf_per_1k_hdd": {{ states('sensor.hvac_heating_efficiency_mtd') | float(0) }},
      "actual_runtime": {{ states('sensor.hvac_furnace_runtime_month_2') | float(0) }},
      "expected_runtime": {{ states('sensor.expected_runtime_month') | float(0) }},
      "efficiency_deviation_pct": {{ states('sensor.efficiency_deviation_month') | float(0) }},
      "gas_usage_ccf": {{ states('input_number.gas_bill_ccf') | float(0) }},
      "gas_cost": {{ states('input_number.gas_bill_amount') | float(0) }},
      "electric_kwh": {{ states('input_number.electricity_bill_kwh') | float(0) }},
      "total_cdd65": {{ states('input_number.cdd_cumulative_month_auto') | float(0) }},
      "ac_runtime_hours": {{ states('sensor.hvac_ac_runtime_month') | float(0) }},
      "avg_runtime_per_cdd": {{ states('sensor.hvac_runtime_per_cdd_month') | float(0) }},
      "dehumidifier_kwh": {{ states('sensor.dehumidifier_energy_monthly') | float(0) | round(2) }}
    }'

  # Rotate daily CSV at year boundary
  rotatedailycsv: "python3 /config/scripts/csv_manager.py rotate_daily"

  # Zone-specific setback log — positional args, no JSON quoting issues
  appendsetbacklog_1f: >-
    python3 /config/scripts/setback_csv.py 1F
    {{ states('input_number.hvac_1f_hold_setpoint') | float(0) }}
    {{ states('input_number.hvac_1f_setback_setpoint') | float(0) }}
    {{ states('input_number.hvac_1f_recovery_start_temp') | float(0) }}
    {{ states('input_number.hvac_1f_last_recovery_minutes') | float(0) }}
    {{ states('sensor.hvac_outdoor_temp_hartford_proxy') | float(0) }}

  appendsetbacklog_2f: >-
    python3 /config/scripts/setback_csv.py 2F
    {{ states('input_number.hvac_2f_hold_setpoint') | float(0) }}
    {{ states('input_number.hvac_2f_setback_setpoint') | float(0) }}
    {{ states('input_number.hvac_2f_recovery_start_temp') | float(0) }}
    {{ states('input_number.hvac_2f_last_recovery_minutes') | float(0) }}
    {{ states('sensor.hvac_outdoor_temp_hartford_proxy') | float(0) }}

  # Weekly backup of critical input_number values
  # backup_input_numbers RETIRED 2026-08-23 - see the note where its weekly
  # automation used to live in automations.yaml. It covered 54 of 128 buffer
  # entities; scripts/spc_buffer_export.py covers all 128 nightly, so this was a
  # strict subset. reports/input_number_backup.csv is kept as history.
  # Yearly rotation for setback log (archives previous-year rows per zone).
  # Fixed 2026-07-03: the old one-liner used GNU `date -d 'yesterday'`, which
  # fails under the BusyBox date that HAOS shell_command runs (HAOS issue
  # #2724) — the archive would have been named hvac_setback_1f_.csv and
  # OVERWRITTEN every subsequent year. csv_manager.py rotate_setback splits
  # rows by their actual date year and writes atomically.
  rotate_setback_log: "python3 /config/scripts/csv_manager.py rotate_setback"

frontend:
  themes: !include_dir_merge_named themes

# ===============================================================
# RECORDER - Database optimization
# ===============================================================
# 2026-07: Migrated from HA Green (eMMC) to ASRock N100DC (480GB NVMe)
# 2026-07-28: Simplified — record everything, NVMe handles it fine.
#             Previous exclusions broke SPC statistics sensors and dashboards.
recorder:
  purge_keep_days: 14
  commit_interval: 5
  exclude:
    entities:
      - sensor.time
      - sensor.date
      # --- SDR meter last_seen (excluded 2026-08-22) -----------------
      # rtlamr2mqtt moved to sleep_for: 0 on 2026-08-22, so every decoded
      # frame now publishes instead of one per ~118 s cycle. Measured
      # immediately after: 253 publishes/h across the three meters, i.e.
      # ~6,100 last_seen state changes/day where it used to be ~2,200 -
      # about +10% on top of the basement node's ~58k rows/day.
      #
      # Safe to exclude because the HISTORY carries no information: these
      # are ISO timestamps of the last decode, and sensor.<x>_meter_age
      # derives everything from the LIVE value. The dongle-health chart on
      # the SDR Meters view plots _age, not _last_seen, and _age is still
      # recorded. The stale binaries read _age too.
      #
      # Do NOT also exclude the _age sensors - those ARE the reception
      # instrument, and their rising baseline is the documented dongle
      # degradation signal.
      - sensor.gas_meter_last_seen
      - sensor.water_meter_last_seen
      - sensor.electric_meter_last_seen
      # --- Basement TH node churn control --------------------------
      # The node adds roughly 58k recorder rows/day (see handover note):
      # ~43k of that is five analog channels at 10 s, which is the whole
      # point of the node and stays. Excluded below are the channels with
      # no analytical value at 14-day retention:
      #   lux min/max 1m - exist only to tune the display wake threshold;
      #                    pure churn once that number is set
      #   node uptime    - sawtooth already implied by node_status +
      #                    node_reset_reason
      # NOT excluded, deliberately: free_heap and loop_time. Those are the
      # slow-drift variables that would eventually end this node, and they
      # are only ~1,440 rows/day each. Cheap insurance, keep the trend.
      - sensor.basement_th_node_basement_lux_min_1m
      - sensor.basement_th_node_basement_lux_max_1m
      - sensor.basement_th_node_node_uptime

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# ===============================================================
# LIVE WEATHER (Updates every 10 minutes)
# ===============================================================
rest:
  # Bradley/KBDL grid point (41.94,-72.68) — the METHODOLOGY.md HDD reference
  # station the Hartford proxy exists to track (fixed 2026-07-03; previous
  # coords 41.28,-72.81 were the Branford shoreline, ~42 km away, coastal bias).
  - resource: "https://api.open-meteo.com/v1/forecast?latitude=41.94&longitude=-72.68&current=temperature_2m&temperature_unit=fahrenheit"
    scan_interval: 600
    timeout: 30
    sensor:
      - name: "Outdoor Temp Live"
        unique_id: outdoor_temp_live
        value_template: "{{ value_json.current.temperature_2m }}"
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement

