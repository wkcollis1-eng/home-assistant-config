          {% set ly = states('input_number.electricity_bill_amount_last_year') | float(0) %}
          {{ ((cur / ly - 1) * 100) | round(1) if ly > 0 and cur > 0 else 0 }}

      - name: "Gas Bill Change YoY"
        unique_id: gas_bill_change_yoy
