  # ===============================================================
  # DEHUMIDIFIER RH STATISTICS — SENSOR RETIRED 2026-08-07
  # (notes below kept: the sampling_size lesson is general)
  # ===============================================================
  # Provides 60-min mean of the CONTROL RH sensor for stall detection.
  # Used by dehumidifier_rh_stall_shutdown to detect when the unit has made
  # < 0.3 %/hr RH improvement (stall condition).
  #
  # 2026-07-29 SOURCE + SIZING CHANGE. Old: the Shelly at a ~6-min cadence,
  # which put 8-12 readings in a 60-min window, so sampling_size 20 was
  # ample. New: the SHT45 node publishes every 10 s = 360 readings per hour.
  # sampling_size is a HARD CAP on the buffer, so leaving it at 20 would have
  # silently reduced max_age to decoration: the '60-min mean' would really be
  # a 200-second mean.
  #
  # That is not a cosmetic error. dehumidifier_rh_drop_rate_60min computes
  # 2 x (mean - current), which assumes a 1-hour window. Over a 200 s window
  # the mean lags current by only 100 s, so the estimator reads
  # 2 x r x (100/3600) = 0.056 x r. Real pulldown of 0.3-1.0 %/hr would have
  # reported 0.017-0.056 %/hr - permanently under the 0.30 %/hr stall
  # threshold - and every cycle past the 90-min gate would have been killed
  # as a false stall.
  #
  # 360 samples/hr needs >= 360; 400 gives margin. If the node's
  # update_interval is ever changed, recompute this: 3600 / interval_s.
  # ===============================================================

  # SENSOR RETIRED 2026-08-07 with dehumidifier_rh_drop_rate_60min, its
  # only consumer. The sizing lesson above is KEPT deliberately: it
  # applies to every statistics sensor in this file, and the cross-check
  # 24 h means below refer back to it by name.

  # ===============================================================
  # MOLD-LIMIT 60-MIN MEAN (AC-cycle smoothing)
  # ===============================================================
  # sensor.basement_mold_limited_dp is a pure function of air temperature, and
  # basement temperature dips when the house AC runs. Measured 2026-07-31: a
  # 26-min plateau at 69.85 F followed by a 31-min decline to 69.27 F, i.e. a
  # 0.72 degF excursion at about 1.14 degF/hr, still recovering at the end of
  # the export - so the full period is >= 60 min and is NOT bounded by that
  # sample. A 60-min window therefore averages roughly one period, which is
  # the best case; if the AC period lengthens in cooler weather the window
  # will straddle partial cycles and the mean will wobble. If the recommended
  # setpoint visibly hunts, lengthen max_age to 180 min (and sampling_size to
  # ~1200) rather than widening the holdback - the holdback costs runtime,
  # the window does not. This mean is what the
  # setpoint RECOMMENDATION reads, so retuning tracks the season rather than
  # the AC's duty cycle. sensor.basement_dp_headroom deliberately keeps using
  # the INSTANTANEOUS limit: a real-time excursion is a safety fact and must
  # not be averaged away.
  #
  # Cadence: the source follows the node temperature, ~328 samples/hr in the
  # 12 h export. 400 covers it with margin, same sizing as the RH/DP means.
  - platform: statistics
    name: "Basement Mold Limited DP Mean 60min"
    unique_id: basement_mold_limited_dp_mean_60min
    entity_id: sensor.basement_mold_limited_dp
    state_characteristic: mean
    max_age:
      minutes: 60
    sampling_size: 400
    precision: 2

  # ===============================================================
  # DEHUMIDIFIER DP STATISTICS — SENSOR RETIRED 2026-08-07
  # (notes below kept: the cadence measurement is still useful)
  # ===============================================================
  # Feeds dehumidifier_dp_drop_rate_60min. sampling_size is a HARD CAP on
  # the buffer, so it must exceed the samples arriving in the max_age
  # window or the '60-min mean' silently becomes a mean of the last N -
  # the exact trap documented on the RH statistics sensor above.
  #
  # Measured cadence: a 12 h export of sensor.basement_dew_point held 1492
  # points = ~122/hr (the template only writes on a changed value, so this
  # is slower than the node's 10 s publish rate). 400 gives >3x margin and
  # matches the RH sensor's sizing. Re-measure if the template's rounding
  # or the node's interval changes.
  # SENSOR RETIRED 2026-08-07 with dehumidifier_dp_drop_rate_60min, its
  # only consumer. The stall detector now reads sensor.basement_dp_rate.

  # ===============================================================
  # BASEMENT SENSOR CROSS-CHECK — 24 h MEANS
  # ===============================================================
  # The source deltas update once per 5 min (288/day), so sampling_size 320
  # covers the full 24 h window with margin. If the delta cadence is ever
  # raised, raise this too or max_age silently becomes decorative and the
  # 'mean' is really a mean of the last sampling_size samples.
  - platform: statistics
    name: "Basement RH Delta Mean 24h"
    unique_id: basement_rh_delta_mean_24h
    entity_id: sensor.basement_rh_delta_sht45_vs_shelly
    state_characteristic: mean
    max_age:
      hours: 24
    sampling_size: 1000
    precision: 2

  - platform: statistics
    name: "Basement DP Delta Mean 24h"
    unique_id: basement_dp_delta_mean_24h
    entity_id: sensor.basement_dp_delta_sht45_vs_shelly
    state_characteristic: mean
    max_age:
      hours: 24
    sampling_size: 1000
    precision: 2

  - platform: statistics
    name: "Basement Temp Delta Mean 24h"
    unique_id: basement_temp_delta_mean_24h
    entity_id: sensor.basement_temp_delta_sht45_vs_shelly
    state_characteristic: mean
    max_age:
      hours: 24
    sampling_size: 1000
    precision: 2

  # Rolling 2-min MAX of raw power → captures the startup inrush spike.
  # Charted as daily-max (chart 5). Kasa-sampling-limited: trend, not absolute.
  - platform: statistics
    name: "Dehumidifier Power Max 2min"
    unique_id: dehumidifier_power_max_2min
    entity_id: sensor.dehumidifier_current_consumption
    state_characteristic: value_max
    max_age:
      minutes: 2
    sampling_size: 60
    precision: 0


# ===============================================================
# CLIMATE NORMS - Daily lookup from historical climate data
# ===============================================================
# Reads climate_daily_norms.csv (18 years of data) to provide
# expected HDD/CDD values for today based on historical averages.
# Updates once daily at startup and midnight.
# ===============================================================

command_line:
  - sensor:
      name: "BDL Degree Days"
      unique_id: bdl_degree_days
      # Fetches official Bradley/KBDL monthly HDD65/CDD65 from ACIS and upserts
      # /config/reports/bdl_degree_days.csv. The daily scan IS the monthly
      # capture: each completed month is written once ACIS has finalized it
      # (self-backfilling), so a not-yet-published month fills in automatically.
      command: "python3 /config/scripts/fetch_bdl_degree_days.py --csv /config/reports/bdl_degree_days.csv"
      command_timeout: 45
      scan_interval: 86400  # daily; ACIS finalizes a completed month within days
      value_template: "{{ value_json.latest_month }}"
      json_attributes:
        - latest_hdd
        - latest_cdd
        - trailing_12
        - trailing_12_sum
        - trailing_12_count
        - added
        - updated
        - rows
        - status

  - sensor:
      name: "Climate Norms Today"
      unique_id: climate_norms_today
      command: "python3 /config/scripts/climate_norms_today.py"
      command_timeout: 30
      scan_interval: 3600  # Hourly update to ensure day rollover is captured
      value_template: "{{ value_json.status }}"
      json_attributes:
        - day_of_year
        - month
        - day
        - hdd_mean
        - hdd_min
        - hdd_max
        - hdd_p10
        - hdd_p90
        - hdd_mean_smoothed
        - cdd_mean
        - cdd_p10
        - cdd_p90
        - tmean
        - tmin
        - tmax
        - samples
