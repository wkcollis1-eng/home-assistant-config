    name: "Runtime/CDD Capture Last OK"
    has_date: true
    has_time: true
    icon: mdi:check-circle

  ac_min_per_cycle_capture_last_ok:
    name: "AC Min/Cycle Capture Last OK"
    has_date: true
    has_time: true
    icon: mdi:check-circle

# ===============================================================
# TEMPLATE SENSORS
# ===============================================================
template:
  - binary_sensor:
      - name: "HVAC 2F Call For Heat"
        unique_id: hvac_2f_call_for_heat
        state: >
          {% if states('climate.upstairs') not in ['unavailable', 'unknown'] %}
            {{ state_attr('climate.upstairs', 'hvac_action') == 'heating' }}
          {% else %}
            false
          {% endif %}

      - name: "HVAC 1F Call For Heat"
        unique_id: hvac_1f_call_for_heat
        state: >
          {% if states('climate.main_floor') not in ['unavailable', 'unknown'] %}
            {{ state_attr('climate.main_floor', 'hvac_action') == 'heating' }}
          {% else %}
            false
          {% endif %}

      # Furnace Running - ON when EITHER zone is calling for heat (actual furnace cycles)
      - name: "HVAC Furnace Running"
        unique_id: hvac_furnace_running
        device_class: running
        state: >
          {{ is_state('binary_sensor.hvac_1f_call_for_heat', 'on') or
             is_state('binary_sensor.hvac_2f_call_for_heat', 'on') }}

      - name: "HVAC 1F Call For Cool"
        unique_id: hvac_1f_call_for_cool
        state: >
          {% if states('climate.main_floor') not in ['unavailable', 'unknown'] %}
            {{ state_attr('climate.main_floor', 'hvac_action') == 'cooling' }}
          {% else %}
            false
          {% endif %}

      - name: "HVAC 2F Call For Cool"
        unique_id: hvac_2f_call_for_cool
        state: >
          {% if states('climate.upstairs') not in ['unavailable', 'unknown'] %}
            {{ state_attr('climate.upstairs', 'hvac_action') == 'cooling' }}
          {% else %}
            false
          {% endif %}

      # AC Running - ON when EITHER zone is calling for cool (actual compressor cycles)
      - name: "HVAC AC Running"
        unique_id: hvac_ac_running
        device_class: running
        state: >
          {{ is_state('binary_sensor.hvac_1f_call_for_cool', 'on') or
             is_state('binary_sensor.hvac_2f_call_for_cool', 'on') }}

      - name: "HVAC UA Degradation Alert"
        unique_id: hvac_ua_degradation_alert
        device_class: problem
        state: >
          {% set ua = states('sensor.hvac_building_load_ua_12m') | float(593) %}
          {% set baseline = states('input_number.building_ua_baseline') | float(593) %}
          {{ ua > (baseline * 1.10) }}

      # Furnace-level short cycling alert (replaces per-zone alerts)
      # Uses actual furnace cycles - overlapping zone calls count as one cycle
      - name: "HVAC Furnace Short Cycling Alert"
        unique_id: hvac_furnace_short_cycling_alert
        device_class: problem
        state: >
          {% set runtime = states('sensor.hvac_furnace_runtime_today') | float(0) %}
          {% set cycles = states('sensor.hvac_furnace_cycles_today') | int(0) %}
          {% set recovering_1f = is_state('input_boolean.hvac_1f_recovering', 'on') %}
          {% set recovering_2f = is_state('input_boolean.hvac_2f_recovering', 'on') %}
          {% if cycles > 4 and runtime > 0 and not recovering_1f and not recovering_2f %}
            {{ ((runtime * 60) / cycles) < 5 }}
          {% else %}
            false
          {% endif %}

      - name: "Baseline Deviation Alert"
        unique_id: baseline_deviation_alert
        device_class: problem
        state: >
          {% set eui_current = states('sensor.site_eui_estimate') | float(0) %}
          {% set eui_baseline = states('input_number.site_eui_baseline') | float(41.7) %}
          {{ eui_current > (eui_baseline * 1.05) and eui_current > 0 }}

      - name: "HVAC Filter Change Alert"
        unique_id: hvac_filter_change_alert
        device_class: problem
        state: >
          {{ states('input_number.hvac_filter_runtime_hours') | float(0) >= 1000 }}

      # short-cycle pct and pipeline status sensors are in the sensor: block below


      - name: "HVAC Runtime per HDD High Alert"
        unique_id: hvac_runtime_per_hdd_high_alert
        device_class: problem
        state: >
          {% set raw = states('sensor.hvac_runtime_per_hdd_7_day') %}
          {% set current = raw | float(-1) if raw not in ['unknown','unavailable'] else -1 %}
          {% if current < 0 %}
            {# was a fallback to sensor.hvac_runtime_per_hdd_7_day_2, which has
               never existed - states() returned 'unknown' and this always took
               the else-path. Collapsed to that path 2026-08-22; identical. #}
            {% set current = 0 %}
          {% endif %}
          {% set upper = states('sensor.hvac_runtime_per_hdd_upper_bound_1s') | float(0) %}
          {% set count = states('sensor.hvac_runtime_per_hdd_data_count') | int(0) %}
          {{ current > upper and upper > 0 and count >= 4 }}

      - name: "HVAC Runtime per HDD Low Alert"
        unique_id: hvac_runtime_per_hdd_low_alert
        device_class: problem
        state: >
          {% set raw = states('sensor.hvac_runtime_per_hdd_7_day') %}
          {% set current = raw | float(-1) if raw not in ['unknown','unavailable'] else -1 %}
          {% if current < 0 %}
            {# was a fallback to sensor.hvac_runtime_per_hdd_7_day_2, which has
               never existed - states() returned 'unknown' and this always took
               the else-path. Collapsed to that path 2026-08-22; identical. #}
            {% set current = 0 %}
          {% endif %}
          {% set lower = states('sensor.hvac_runtime_per_hdd_lower_bound_1s') | float(0) %}
          {% set count = states('sensor.hvac_runtime_per_hdd_data_count') | int(0) %}
          {{ current < lower and current > 0 and count >= 4 }}

      # AC short cycling — compressors more sensitive than furnaces;
      # threshold 8 min (vs 5 min for furnace) to protect refrigerant pressures
      - name: "HVAC AC Short Cycling Alert"
        unique_id: hvac_ac_short_cycling_alert
        device_class: problem
        state: >
          {% set runtime = states('sensor.hvac_ac_runtime_today') | float(0) %}
          {% set cycles = states('sensor.hvac_ac_cycles_today') | int(0) %}
          {% if cycles > 3 and runtime > 0 %}
            {{ ((runtime * 60) / cycles) < 8 }}
          {% else %}
            false
          {% endif %}

      - name: "HVAC Runtime per CDD High Alert"
        unique_id: hvac_runtime_per_cdd_high_alert
        device_class: problem
        state: >
          {% set raw = states('sensor.hvac_runtime_per_cdd_7_day') %}
          {% if raw in ['unknown', 'unavailable'] %}
            false
          {% else %}
            {% set val = raw | float(0) %}
            {% set upper = states('sensor.hvac_runtime_per_cdd_upper_bound') | float(0) %}
            {% set count = states('sensor.hvac_runtime_per_cdd_data_count') | int(0) %}
            {{ val > upper and upper > 0 and count >= 3 }}
          {% endif %}

      - name: "HVAC Runtime per CDD Low Alert"
        unique_id: hvac_runtime_per_cdd_low_alert
        device_class: problem
        state: >
          {% set raw = states('sensor.hvac_runtime_per_cdd_7_day') %}
          {% if raw in ['unknown', 'unavailable'] %}
            false
          {% else %}
            {% set val = raw | float(0) %}
            {% set lower = states('sensor.hvac_runtime_per_cdd_lower_bound') | float(0) %}
            {% set count = states('sensor.hvac_runtime_per_cdd_data_count') | int(0) %}
            {{ val < lower and lower > 0 and count >= 3 }}
          {% endif %}

      # ===============================================================
      # CAPTURE HEALTH MONITORING
      # ===============================================================
      - name: "HDD Capture Stale"
        unique_id: hdd_capture_stale
        device_class: problem
        state: >
          {% set last_ok = states('input_datetime.hdd_capture_last_ok') %}
          {% if last_ok in ['unknown', 'unavailable'] or last_ok == '1970-01-01 00:00:00' %}
            true
          {% else %}
            {% set dt = last_ok | as_datetime | as_local %}
            {{ (now() - dt).total_seconds() > 90000 }}
          {% endif %}

      - name: "AC Cost Capture Stale"
        unique_id: ac_cost_capture_stale
        device_class: problem
        state: >
          {% set last = states('input_datetime.ac_cost_capture_last_ok') %}
          {% set act = states('sensor.ac_runtime_today') | float(0) %}
          {% if act <= 0 %}
            false
          {% elif last in ['unknown', 'unavailable', 'none', ''] or last[:4] == '1970' %}
            true
          {% else %}
            {% set d = last | as_datetime %}
            {% if d is none %}
              true
            {% else %}
              {{ (now().date() - d.date()).days > 2 }}
            {% endif %}
          {% endif %}

      # Monthly archives. 35 days rather than the month-boundary arithmetic
      # used by monthly_report_stale: that pattern assumes the archive runs
      # WITHIN the current month, and these run at 23:58 on a day this
      # detector should not have to know. 35 days is true whether the archive
      # fires on the 1st or the last day, and needs no calendar special cases.
      # HDD / CDD Monthly Archive Stale: retired 2026-09-23 with their archives.

      - name: "Gas Heat Cost Archive Stale"
        unique_id: gas_heat_cost_archive_stale
        device_class: problem
        state: >
          {% set last = states('input_datetime.gas_heat_cost_archive_last_ok') %}
          {% if last in ['unknown', 'unavailable', 'none', ''] or last[:4] == '1970' %}
            false
          {% else %}
            {% set d = last | as_datetime | as_local %}
            {{ true if d is none else (now() - d).days > 35 }}
          {% endif %}

      - name: "Runtime per HDD Capture Stale"
        unique_id: runtime_per_hdd_capture_stale
        device_class: problem
        state: >
          {% set last_ok = states('input_datetime.runtime_per_hdd_capture_last_ok') %}
          {% if last_ok in ['unknown', 'unavailable'] or last_ok == '1970-01-01 00:00:00' %}
            true
          {% else %}
            {% set dt = last_ok | as_datetime | as_local %}
            {{ (now() - dt).total_seconds() > 90000 }}
          {% endif %}

      - name: "Monthly Report Stale"
        unique_id: monthly_report_stale
        device_class: problem
        state: >
          {# Alert if we're past day 1 of a new month and last capture was in a previous month #}
          {% set last = states('input_datetime.monthly_tracking_capture_last_ok') %}
          {% if last in ['unknown', 'unavailable', '1970-01-01 00:00:00'] %}
            false
          {% else %}
            {% set last_dt = last | as_datetime | as_local %}
            {% set last_month = last_dt.month %}
            {% set current_month = now().month %}
            {# Stale if: past day 1 AND last capture was in a different month #}
            {{ now().day > 1 and last_month != current_month }}
          {% endif %}

      - name: "Furnace Cycle Capture Stale"
        unique_id: furnace_cycle_capture_stale
        device_class: problem
        state: >
          {% set last_ok = states('input_datetime.furnace_cycle_capture_last_ok') %}
          {% if last_ok in ['unknown', 'unavailable'] or last_ok == '1970-01-01 00:00:00' %}
            true
          {% else %}
            {% set dt = last_ok | as_datetime | as_local %}
            {{ (now() - dt).total_seconds() > 90000 }}
          {% endif %}

      - name: "CDD Capture Stale"
        unique_id: cdd_capture_stale
        device_class: problem
        state: >
          {% set last = states('input_datetime.cdd_capture_last_ok') %}
          {% if last in ['unknown', 'unavailable', '1970-01-01 00:00:00'] %}
            false
          {% else %}
            {{ (now() - last | as_datetime | as_local).total_seconds() / 3600 > 26 }}
          {% endif %}

      - name: "Runtime per CDD Capture Stale"
        unique_id: runtime_per_cdd_capture_stale
        device_class: problem
        state: >
          {% set last = states('input_datetime.runtime_per_cdd_capture_last_ok') %}
          {% if last in ['unknown', 'unavailable', '1970-01-01 00:00:00'] %}
            false
          {% else %}
            {{ (now() - last | as_datetime | as_local).total_seconds() / 3600 > 26 }}
          {% endif %}

      - name: "CDD Pipeline Healthy"
        unique_id: cdd_pipeline_healthy
        icon: mdi:thermometer-check
        state: >
          {# 2026-09-23: the input is hvac_cdd65_today (KBDL, proxy fallback), not the proxy alone #}
          {% set input_ok = states('sensor.hvac_cdd65_today') not in ['unknown', 'unavailable'] %}
          {% set not_stale = is_state('binary_sensor.cdd_capture_stale', 'off') %}
          {% set rolling = states('sensor.cdd_rolling_7_day_auto') | float(-1) %}
          {{ input_ok and not_stale and rolling >= 0 }}

      - name: "Runtime per CDD Pipeline Healthy"
        unique_id: runtime_per_cdd_pipeline_healthy
        icon: mdi:chart-timeline-variant-shimmer
        state: >
          {% set cdd_healthy = is_state('binary_sensor.cdd_pipeline_healthy', 'on') %}
          {% set not_stale = is_state('binary_sensor.runtime_per_cdd_capture_stale', 'off') %}
          {% set count = states('sensor.hvac_runtime_per_cdd_data_count') | int(0) %}
          {{ cdd_healthy and not_stale and count >= 4 }}

      - name: "AC Min/Cycle Capture Stale"
        unique_id: ac_min_per_cycle_capture_stale
        device_class: problem
        state: >
          {% set last_ok = states('input_datetime.ac_min_per_cycle_capture_last_ok') %}
          {% if last_ok in ['unknown', 'unavailable', '1970-01-01 00:00:00'] %}
            true
          {% else %}
            {% set dt = last_ok | as_datetime | as_local %}
            {{ (now() - dt).total_seconds() > 90000 }}
          {% endif %}

      - name: "Furnace MPC Pipeline Healthy"
        unique_id: furnace_mpc_pipeline_healthy
        icon: mdi:sine-wave
        state: >
          {% set not_stale = is_state('binary_sensor.furnace_cycle_capture_stale', 'off') %}
          {% set count = states('sensor.hvac_furnace_cycle_data_count') | int(0) %}
          {{ not_stale and count >= 3 }}

      - name: "AC MPC Pipeline Healthy"
        unique_id: ac_mpc_pipeline_healthy
        icon: mdi:sine-wave
        state: >
          {% set not_stale = is_state('binary_sensor.ac_min_cycle_capture_stale', 'off') %}
          {% set count = states('sensor.hvac_ac_cycle_data_count') | int(0) %}
          {{ not_stale and count >= 3 }}

  - sensor:
      # === DASHBOARD SUMMARY SENSORS =======================================

      - name: "HVAC Furnace Short Cycle Pct 7d"
        unique_id: hvac_furnace_short_cycle_pct_7d
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:alert-circle-outline
        state: >
          {% set slots = [
            states('input_number.furnace_min_per_cycle_day_1') | float(-1),
            states('input_number.furnace_min_per_cycle_day_2') | float(-1),
            states('input_number.furnace_min_per_cycle_day_3') | float(-1),
            states('input_number.furnace_min_per_cycle_day_4') | float(-1),
            states('input_number.furnace_min_per_cycle_day_5') | float(-1),
            states('input_number.furnace_min_per_cycle_day_6') | float(-1),
            states('input_number.furnace_min_per_cycle_day_7') | float(-1)
          ] %}
          {% set valid = slots | select('>', 0) | select('<=', 60) | list %}
          {% if valid | length == 0 %}
            0
          {% else %}
            {% set short = valid | select('<', 8) | list %}
            {{ (short | length / valid | length * 100) | round(1) }}
          {% endif %}

      - name: "HVAC AC Short Cycle Pct 7d"
        unique_id: hvac_ac_short_cycle_pct_7d
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:alert-circle-outline
        state: >
          {% set slots = [
            states('input_number.ac_min_per_cycle_day_1') | float(-1),
            states('input_number.ac_min_per_cycle_day_2') | float(-1),
            states('input_number.ac_min_per_cycle_day_3') | float(-1),
            states('input_number.ac_min_per_cycle_day_4') | float(-1),
            states('input_number.ac_min_per_cycle_day_5') | float(-1),
            states('input_number.ac_min_per_cycle_day_6') | float(-1),
            states('input_number.ac_min_per_cycle_day_7') | float(-1)
          ] %}
          {% set valid = slots | select('>', 0) | select('<=', 120) | list %}
          {% if valid | length == 0 %}
            0
          {% else %}
            {% set short = valid | select('<', 10) | list %}
            {{ (short | length / valid | length * 100) | round(1) }}
          {% endif %}

      - name: "HVAC Pipeline Status"
        unique_id: hvac_pipeline_status
        icon: mdi:pipe-valve
        state: >
          {% set checks = [
            is_state('binary_sensor.hdd_capture_stale', 'off'),
            is_state('binary_sensor.cdd_capture_stale', 'off'),
            is_state('binary_sensor.furnace_cycle_capture_stale', 'off'),
            is_state('binary_sensor.ac_min_cycle_capture_stale', 'off'),
            is_state('binary_sensor.furnace_mpc_pipeline_healthy', 'on'),
          ] %}
          {% set fail_count = checks | reject | list | length %}
          {% if fail_count == 0 %}
            ok
          {% elif fail_count <= 2 %}
            degraded
          {% else %}
            fault
          {% endif %}
        attributes:
          hdd_capture: >
            {{ 'ok' if is_state('binary_sensor.hdd_capture_stale','off') else 'stale' }}
          cdd_capture: >
            {{ 'ok' if is_state('binary_sensor.cdd_capture_stale','off') else 'stale' }}
          furnace_mpc_capture: >
            {{ 'ok' if is_state('binary_sensor.furnace_cycle_capture_stale','off') else 'stale' }}
          ac_mpc_capture: >
            {{ 'ok' if is_state('binary_sensor.ac_min_cycle_capture_stale','off') else 'stale' }}
          monthly_tracking: >
            {{ 'ok' if is_state('binary_sensor.monthly_report_stale','off') else 'stale' }}

      # Uses live feed first (10 min updates), then Pirate Weather, then NWS/Open-Meteo
      # FAIL-FAST: Returns unavailable if ALL sources fail (no silent 35°F default)
      - name: "HVAC Outdoor Temp Hartford Proxy"
        unique_id: hvac_outdoor_temp_hartford_proxy
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        availability: >
          {% set live_state = states('sensor.outdoor_temp_live') %}
          {% set live = live_state | float(-999) %}
          {% set pw = state_attr('weather.pirateweather', 'temperature') %}
          {% set nws = state_attr('weather.local_weather_2','temperature') %}
          {% set om = state_attr('weather.home','temperature') %}
          {{ (live_state not in ['unknown', 'unavailable'] and live > -50) or
             (pw is number and pw > -50) or
             (nws is number and nws > -50) or
             (om is number and om > -50) }}
        state: >
          {% set live_state = states('sensor.outdoor_temp_live') %}
          {% set live = live_state | float(-999) %}
          {% set pw = state_attr('weather.pirateweather', 'temperature') %}
          {% set nws = state_attr('weather.local_weather_2','temperature') %}
          {% set om = state_attr('weather.home','temperature') %}
          {% if live_state not in ['unknown', 'unavailable'] and live > -50 %}
            {{ live | round(1) }}
          {% elif pw is number and pw > -50 %}
            {{ pw | round(1) }}
          {% elif nws is number and nws > -50 %}
            {{ nws | round(1) }}
          {% elif om is number and om > -50 %}
            {{ om | round(1) }}
          {% endif %}

      - name: "HVAC Outdoor Weather Source"
        unique_id: hvac_outdoor_weather_source
        # Reports actual source being used, or "No valid source" when all fail
        state: >
          {% set live_state = states('sensor.outdoor_temp_live') %}
          {% set live = live_state | float(-999) %}
          {% set pw = state_attr('weather.pirateweather', 'temperature') %}
          {% set nws = state_attr('weather.local_weather_2','temperature') %}
          {% set om = state_attr('weather.home','temperature') %}
          {% if live_state not in ['unknown', 'unavailable'] and live > -50 %}Live API (10min)
          {% elif pw is number and pw > -50 %}Pirate Weather
          {% elif nws is number and nws > -50 %}NWS/NOAA
          {% elif om is number and om > -50 %}Open-Meteo
          {% else %}No valid source{% endif %}

      - name: "HVAC HDD65 Today"
        unique_id: hvac_hdd65_today
        unit_of_measurement: "HDD"
        state_class: measurement
        icon: mdi:snowflake
        # Unavailable if outdoor temp proxy is unavailable (fail-fast)
        # ^ 2026-09-23: now unavailable only when KBDL AND the proxy are both out.
        # KBDL observations are the basis (sensor.kbdl_degree_days_24h, Bill's
        # answer to F4); the proxy mean is the fallback when KBDL is not "ok".
        # The proxy's mean method scored sd 1.42 HDD/day vs ACIS against KBDL's
        # 0.57 [M, n=752 days]. Attribute basis names the source (R8).
        availability: >
          {{ is_state('sensor.kbdl_degree_days_24h', 'ok')
             or states('sensor.hvac_outdoor_temp_hartford_proxy') not in ['unknown', 'unavailable'] }}
        state: >
          {% set k = state_attr('sensor.kbdl_degree_days_24h', 'hdd65') %}
          {% if is_state('sensor.kbdl_degree_days_24h', 'ok') and k is number %}
            {{ k | round(1) }}
          {% else %}
          {% set mean_raw = states('sensor.hvac_outdoor_temp_mean_24h') %}
          {% set mean_t = mean_raw | float(none) if mean_raw not in ['unknown', 'unavailable'] else none %}
          {% set proxy = states('sensor.hvac_outdoor_temp_hartford_proxy') %}
          {% set cur_t = proxy | float(none) if proxy not in ['unknown', 'unavailable'] else none %}
          {% set t = mean_t if mean_t is not none else cur_t %}
          {% if t is not none %}
            {{ [65 - t, 0] | max | round(1) }}
          {% endif %}
          {% endif %}
        attributes:
          basis: >
            {{ 'KBDL obs' if is_state('sensor.kbdl_degree_days_24h', 'ok')
                 and state_attr('sensor.kbdl_degree_days_24h', 'hdd65') is number
               else 'proxy' }}

      - name: "HVAC CDD65 Today"
        unique_id: hvac_cdd65_today
        unit_of_measurement: "CDD"
        state_class: measurement
        icon: mdi:sun-thermometer
        # Unavailable if outdoor temp proxy is unavailable (fail-fast)
        # ^ 2026-09-23: KBDL first, proxy fallback - same change and reason as
        # HVAC HDD65 Today above. KBDL CDD vs ACIS: bias -0.08, sd 0.39, MAE
        # 0.18 CDD/day [M, n=752 days].
        availability: >
          {{ is_state('sensor.kbdl_degree_days_24h', 'ok')
             or states('sensor.hvac_outdoor_temp_hartford_proxy') not in ['unknown', 'unavailable'] }}
        state: >
          {% set k = state_attr('sensor.kbdl_degree_days_24h', 'cdd65') %}
          {% if is_state('sensor.kbdl_degree_days_24h', 'ok') and k is number %}
            {{ k | round(1) }}
          {% else %}
          {% set mean_raw = states('sensor.hvac_outdoor_temp_mean_24h') %}
          {% set mean_t = mean_raw | float(none) if mean_raw not in ['unknown', 'unavailable'] else none %}
          {% set proxy = states('sensor.hvac_outdoor_temp_hartford_proxy') %}
          {% set cur_t = proxy | float(none) if proxy not in ['unknown', 'unavailable'] else none %}
          {% set t = mean_t if mean_t is not none else cur_t %}
          {% if t is not none %}
            {{ [t - 65, 0] | max | round(1) }}
          {% endif %}
          {% endif %}
        attributes:
          basis: >
            {{ 'KBDL obs' if is_state('sensor.kbdl_degree_days_24h', 'ok')
                 and state_attr('sensor.kbdl_degree_days_24h', 'cdd65') is number
               else 'proxy' }}

      # Indoor dew point from upstairs (drives 99% of cooling calls).
      # Magnus formula: DP = 243.04 * α / (17.625 - α) where α = ln(RH/100) + 17.625*T/(243.04+T)
      - name: "HVAC Indoor Dew Point"
        unique_id: hvac_indoor_dew_point
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        icon: mdi:water-thermometer
        availability: >
          {{ states('sensor.upstairs_current_temperature') not in ['unknown', 'unavailable']
             and states('sensor.upstairs_current_humidity') not in ['unknown', 'unavailable'] }}
        state: >
          {% set t_f = states('sensor.upstairs_current_temperature') | float(70) %}
          {% set rh = states('sensor.upstairs_current_humidity') | float(50) %}
          {% set t_c = (t_f - 32) * 5 / 9 %}
          {% set a, b = 17.625, 243.04 %}
          {% set gamma = (a * t_c / (b + t_c)) + (rh / 100) | log %}
          {% set dp_c = b * gamma / (a - gamma) %}
          {{ (dp_c * 9 / 5 + 32) | round(1) }}

