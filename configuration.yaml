        availability: >
          {{ states('sensor.hvac_1f_heat_runtime_month_2') not in ['unknown', 'unavailable'] and
             states('sensor.hvac_2f_heat_runtime_month_2') not in ['unknown', 'unavailable'] }}
        state: >
          {% set r1 = states('sensor.hvac_1f_heat_runtime_month_2') | float(0) %}
          {% set r2 = states('sensor.hvac_2f_heat_runtime_month_2') | float(0) %}
          {% set total = r1 + r2 %}
          {{ ((r2 / total) * 100) | round(1) if total > 0 else 50 }}

      # Uses furnace runtime (gas usage matches actual furnace operation)
      - name: "HVAC Heating Efficiency MTD"
        unique_id: hvac_heating_efficiency_mtd
        unit_of_measurement: "CCF/1k HDD"
        state_class: measurement
        icon: mdi:chart-bell-curve-cumulative
        availability: >
          {{ states('sensor.hvac_furnace_runtime_month_2') not in ['unknown', 'unavailable'] }}
        state: >
          {% set hdd = states('sensor.hvac_hdd65_cumulative_month') | float(0) %}
          {% set runtime = states('sensor.hvac_furnace_runtime_month_2') | float(0) %}
          {% set rate = states('input_number.furnace_heating_rate_btu_hr') | float(100000) %}
          {% if hdd >= 5 and runtime > 0 %}
            {# Gas INPUT basis: rate is the 100,000 BTU/hr INPUT rating, so     #}
            {# CCF burned = runtime x rate / 103,700 BTU/CCF. AFUE must NOT     #}
            {# appear here (it converts input->delivered, not runtime->input).  #}
            {# Fixed 2026-07-03: the old /(103700*0.95) overstated gas +5.26%,  #}
            {# reading a false +5.3% vs the metered 90.3 baseline.              #}
            {% set gas = (runtime * rate) / 103700 %}
            {{ ((gas / hdd) * 1000) | round(1) }}
          {% else %}{{ 0 }}{% endif %}

      # MTD UA estimate from furnace runtime (real-time)
      # Balance-point ratio aligns HDD65 → HDD59 equivalent per METHODOLOGY
      # Note: Runtime method excludes fireplace; rate is input_number.furnace_heating_rate_btu_hr,
      # the 100,000 BTU/hr nameplate INPUT, x 0.95 AFUE below = delivered heat.
      # CORRECTED 2026-10-11: this said "uses empirical 60,556 BTU/hr effective rate".
      # 60,556 was the helper's `initial:` until bb7eb28 (2026-08-24) removed it and
      # moved every template fallback to 100000; this comment was not updated then.
      - name: "HVAC Building Load UA Estimate"
        unique_id: hvac_building_load_ua_estimate
        unit_of_measurement: "BTU/hr-°F"
        state_class: measurement
        availability: >
          {{ states('sensor.hvac_furnace_runtime_month_2') not in ['unknown', 'unavailable'] }}
        state: >
          {% set runtime = states('sensor.hvac_furnace_runtime_month_2') | float(0) %}
          {% set hdd = states('sensor.hvac_hdd65_cumulative_month') | float(0) %}
          {% set rate = states('input_number.furnace_heating_rate_btu_hr') | float(100000) %}
          {% set bp_ratio = states('input_number.hdd_balance_point_ratio') | float(0.751) %}
          {% set days = now().day %}
          {% if hdd > 0 and runtime > 0 and days > 0 %}
            {% set avg_dt = (hdd * bp_ratio) / days %}
            {% set hours = days * 24 %}
            {# Delivered heat = input x 0.95 AFUE (METHODOLOGY: CCF x 103,700 x #}
            {# 0.95). Fixed 2026-07-03: raw input BTU overstated UA +5.26% vs   #}
            {# the ua_12m twin, which already applies x0.95 to metered CCF.     #}
            {{ ((runtime * rate * 0.95) / (avg_dt * hours)) | round(0) }}
          {% else %}{{ 593 }}{% endif %}

      - name: "Balance Point Temperature"
        unique_id: balance_point_temperature
        unit_of_measurement: "°F"
        device_class: temperature
        state: "{{ states('input_number.balance_point_baseline') | float(59) }}"

      - name: "Site EUI (Rolling 12M Bills)"
        unique_id: site_eui_estimate
        unit_of_measurement: "kBTU/ft²-yr"
        state_class: measurement
        state: >
          {% set months = ['jan','feb','mar','apr','may','jun',
                           'jul','aug','sep','oct','nov','dec'] %}
          {% set ns = namespace(kwh=0, ccf=0) %}
          {% for m in months %}
            {% set ns.kwh = ns.kwh + states('input_number.electric_archive_' ~ m ~ '_kwh') | float(0) %}
            {% set ns.ccf = ns.ccf + states('input_number.gas_archive_' ~ m ~ '_ccf') | float(0) %}
          {% endfor %}
          {% if ns.kwh > 0 or ns.ccf > 0 %}
            {{ ((ns.kwh * 3.412 + ns.ccf * 103.7) / 2440) | round(1) }}
          {% else %}{{ 41.7 }}{% endif %}

      # Rolling 12-month heating efficiency from archived monthly data
      # Uses ACTUAL Navien-metered DHW subtraction (not fixed ratio)
      # Updates when archives change (monthly), immune to midnight oscillation
      # 2026-09-23: HDD denominator is official BDL (ACIS trailing_12 on
      # sensor.bdl_degree_days); it was the HA proxy hdd_archive_*. Bill: every
      # degree-day comparison uses BDL. Proxy archive vs ACIS over the same 12
      # months: 5,988.1 vs 6,023 [M]; Apr 472.3 vs 412 (pre-fix coordinates).
      # Missing BDL data now reads unavailable/unknown, not 90.3: the old
      # fallback made absent data look exactly on-baseline (R8).
      - name: "HVAC Heating Efficiency 12M"
        unique_id: hvac_heating_efficiency_12m
        unit_of_measurement: "CCF/1k HDD"
        state_class: measurement
        icon: mdi:chart-bell-curve-cumulative
        availability: >
          {{ state_attr('sensor.bdl_degree_days', 'trailing_12_count') | int(0) == 12 }}
        state: >
          {% set months = ['jan','feb','mar','apr','may','jun',
                           'jul','aug','sep','oct','nov','dec'] %}
          {% set t12 = state_attr('sensor.bdl_degree_days', 'trailing_12') %}
          {% set ns = namespace(ccf=0, dhw=0, hdd=0) %}
          {% for m in months %}
            {% set ns.ccf = ns.ccf + states('input_number.gas_archive_' ~ m ~ '_ccf') | float(0) %}
            {% set ns.dhw = ns.dhw + states('input_number.dhw_archive_' ~ m) | float(0) %}
            {% set ns.hdd = ns.hdd + (t12[m] | float(0) if (t12 is mapping and m in t12) else 0) %}
          {% endfor %}
          {# Heating = Total Gas - Actual DHW (Navien-metered) #}
          {% set heating_ccf = ns.ccf - ns.dhw %}
          {% if ns.hdd >= 100 and heating_ccf > 0 %}
            {{ ((heating_ccf / ns.hdd) * 1000) | round(1) }}
          {% else %}
            {{ none }}
          {% endif %}

      # HVAC Heating Efficiency 12M (BDL) / HVAC Performance vs Baseline (BDL):
      # retired 2026-09-23. They began as BDL-denominator twins of
      # hvac_heating_efficiency_12m / hvac_performance_vs_baseline; the 2026-09-23
      # audit moved the BDL definition INTO those sensors, leaving the twins as
      # aliases (R10), and no dashboard read them after Bill's paste that day.

      # Rolling 12-month DHW total from Navien-metered archives
      - name: "DHW Gas 12M"
        unique_id: dhw_gas_12m
        unit_of_measurement: "CCF"
        state_class: measurement
        icon: mdi:water-boiler
        state: >
          {% set months = ['jan','feb','mar','apr','may','jun',
                           'jul','aug','sep','oct','nov','dec'] %}
          {% set ns = namespace(dhw=0) %}
          {% for m in months %}
            {% set ns.dhw = ns.dhw + states('input_number.dhw_archive_' ~ m) | float(0) %}
          {% endfor %}
          {{ ns.dhw | round(1) }}

      # Rolling 12-month building UA from archived monthly data
      # UA = (Furnace heat + Fireplace heat) / (HDD59-equivalent × 24 hours)
      # Matches METHODOLOGY.md: 0.95 AFUE (submittal-verified), balance-point-adjusted HDD, fireplace contribution
      # Uses ACTUAL Navien-metered DHW subtraction (not fixed ratio)
      # Updates when archives change (monthly), immune to midnight oscillation
      # 2026-09-23: HDD65 is official BDL (ACIS trailing_12), was the proxy
      # hdd_archive_* - same change and reason as hvac_heating_efficiency_12m.
      # The balance-point ratio is untouched (NO REBASE, Bill 2026-09-16).
      - name: "HVAC Building Load UA 12M"
        unique_id: hvac_building_load_ua_12m
        unit_of_measurement: "BTU/hr-°F"
        state_class: measurement
        icon: mdi:home-thermometer
        availability: >
          {{ state_attr('sensor.bdl_degree_days', 'trailing_12_count') | int(0) == 12 }}
        state: >
          {% set months = ['jan','feb','mar','apr','may','jun',
                           'jul','aug','sep','oct','nov','dec'] %}
          {% set t12 = state_attr('sensor.bdl_degree_days', 'trailing_12') %}
          {% set ns = namespace(ccf=0, dhw=0, hdd=0) %}
          {% for m in months %}
            {% set ns.ccf = ns.ccf + states('input_number.gas_archive_' ~ m ~ '_ccf') | float(0) %}
            {% set ns.dhw = ns.dhw + states('input_number.dhw_archive_' ~ m) | float(0) %}
            {% set ns.hdd = ns.hdd + (t12[m] | float(0) if (t12 is mapping and m in t12) else 0) %}
          {% endfor %}
          {# Heating = Total Gas - Actual DHW (Navien-metered) #}
          {% set heating_ccf = ns.ccf - ns.dhw %}
          {% set bp_ratio = states('input_number.hdd_balance_point_ratio') | float(0.751) %}
          {% set fp_heat = states('input_number.fireplace_annual_heat_mmbtu') | float(3.6) %}
          {% if ns.hdd >= 100 and heating_ccf > 0 %}
            {# UA = (CCF × 103700 BTU/CCF × 0.95 AFUE + fireplace MMBTU) / (HDD65 × BP_ratio × 24) #}
            {% set furnace_btu = heating_ccf * 103700 * 0.95 %}
            {% set fp_btu = fp_heat * 1000000 %}
            {{ ((furnace_btu + fp_btu) / (ns.hdd * bp_ratio * 24)) | round(0) }}
          {% else %}
            {{ none }}
          {% endif %}

      # 2026-09-23: availability added to both vs-baseline sensors. They read a
      # state of 0, i.e. exactly on baseline, whenever their 12M input was missing (R8).
      - name: "HVAC Performance vs Baseline"
        unique_id: hvac_performance_vs_baseline
        unit_of_measurement: "%"
        state_class: measurement
        availability: "{{ states('sensor.hvac_heating_efficiency_12m') | float(0) > 0 }}"
        state: >
          {% set current = states('sensor.hvac_heating_efficiency_12m') | float(0) %}
          {% set baseline = states('input_number.heating_efficiency_baseline') | float(102.0) %}
          {{ ((current / baseline - 1) * 100) | round(1) if current > 0 else 0 }}

      - name: "UA Performance vs Baseline"
        unique_id: ua_performance_vs_baseline
        unit_of_measurement: "%"
        state_class: measurement
        availability: "{{ states('sensor.hvac_building_load_ua_12m') | float(0) > 0 }}"
        state: >
          {% set current = states('sensor.hvac_building_load_ua_12m') | float(593) %}
          {% set baseline = states('input_number.building_ua_baseline') | float(593) %}
          {{ ((current / baseline - 1) * 100) | round(1) }}

      - name: "EUI vs Baseline"
        unique_id: eui_vs_baseline
        unit_of_measurement: "%"
        state_class: measurement
        state: >
          {% set current = states('sensor.site_eui_estimate') | float(0) %}
          {{ ((current / 41.7 - 1) * 100) | round(1) if current > 0 else 0 }}

      # 2026-09-23: unbilled months project from BDL HDD (ACIS trailing_12, the
      # last completed occurrence of that month - what hdd_archive_<m> held, on
      # the proxy basis). Unavailable without it: a missing month's HDD read as
      # 0 and silently dropped that month's heating from the projection.
      - name: "Projected Annual Gas CCF"
        unique_id: projected_annual_gas_ccf
        unit_of_measurement: "CCF"
        availability: >
          {{ state_attr('sensor.bdl_degree_days', 'trailing_12_count') | int(0) == 12 }}
        state: >
          {% set months = ['jan','feb','mar','apr','may','jun',
                           'jul','aug','sep','oct','nov','dec'] %}
          {% set t12 = state_attr('sensor.bdl_degree_days', 'trailing_12') %}
          {% set efficiency = states('sensor.hvac_heating_efficiency_12m') | float(102.0) %}
          {% set dhw_annual = states('sensor.dhw_gas_12m') | float(42) %}
          {% set dhw_monthly = dhw_annual / 12 %}
          {% set ns = namespace(actual=0, projected=0) %}
          {% for m in months %}
            {% set gas = states('input_number.gas_archive_' ~ m ~ '_ccf') | float(0) %}
            {% set hdd = t12[m] | float(0) if (t12 is mapping and m in t12) else 0 %}
            {% set dhw = states('input_number.dhw_archive_' ~ m) | float(dhw_monthly) %}
            {% if gas > 0 %}
              {# Month has been billed — use actual #}
              {% set ns.actual = ns.actual + gas %}
            {% else %}
              {# Unbilled — project heating from HDD × efficiency + DHW #}
              {% set heat_est = (hdd / 1000.0) * efficiency %}
              {% set ns.projected = ns.projected + heat_est + dhw %}
            {% endif %}
          {% endfor %}
          {{ (ns.actual + ns.projected) | round(0) }}

      - name: "Projected Annual Electricity kWh"
        unique_id: projected_annual_electricity_kwh
        unit_of_measurement: "kWh"
        state: >
          {% set months = ['jan','feb','mar','apr','may','jun',
                           'jul','aug','sep','oct','nov','dec'] %}
          {% set baseline = states('input_number.annual_electricity_baseline') | float(6730) %}
          {% set ns = namespace(total=0, billed=0) %}
          {% for m in months %}
            {% set kwh = states('input_number.electric_archive_' ~ m ~ '_kwh') | float(0) %}
            {% if kwh > 0 %}
              {% set ns.total = ns.total + kwh %}
              {% set ns.billed = ns.billed + 1 %}
            {% endif %}
          {% endfor %}
          {% if ns.billed == 0 %}
            {# No archive data at all — return baseline #}
            {{ baseline | round(0) }}
          {% elif ns.billed == 12 %}
            {# All 12 months billed — straight sum of actuals #}
            {{ ns.total | round(0) }}
          {% else %}
            {# Mix of actual + prior-year proxy: all 12 archive slots sum naturally.
               Billed months hold this year's actuals. Unbilled months hold last year's
               same-month values. Sum of all 12 is the best available full-year estimate. #}
            {% set ns2 = namespace(full=0) %}
            {% for m in months %}
              {% set ns2.full = ns2.full + states('input_number.electric_archive_' ~ m ~ '_kwh') | float(baseline / 12) %}
            {% endfor %}
            {{ ns2.full | round(0) }}
          {% endif %}

      - name: "Electricity Effective Rate"
        unique_id: electricity_effective_rate
        unit_of_measurement: "$/kWh"
        state: >
          {% set amt = states('input_number.electricity_bill_amount') | float(0) %}
          {% set kwh = states('input_number.electricity_bill_kwh') | float(1) %}
          {{ (amt / kwh) | round(4) if amt > 0 and kwh > 0 else 0.2733 }}

      - name: "Gas Effective Rate"
        unique_id: gas_effective_rate
        unit_of_measurement: "$/CCF"
        state: >
          {% set amt = states('input_number.gas_bill_amount') | float(0) %}
          {% set ccf = states('input_number.gas_bill_ccf') | float(1) %}
          {{ (amt / ccf) | round(4) if amt > 0 and ccf > 0 else 1.6818 }}

      - name: "Electricity Effective Rate Previous"
        unique_id: electricity_effective_rate_previous
        unit_of_measurement: "$/kWh"
        state: >
          {% set amt = states('input_number.electricity_bill_amount_previous') | float(0) %}
          {% set kwh = states('input_number.electricity_bill_kwh_previous') | float(1) %}
          {{ (amt / kwh) | round(4) if amt > 0 and kwh > 0 else 0.2722 }}

      - name: "Gas Effective Rate Previous"
        unique_id: gas_effective_rate_previous
        unit_of_measurement: "$/CCF"
        state: >
          {% set amt = states('input_number.gas_bill_amount_previous') | float(0) %}
          {% set ccf = states('input_number.gas_bill_ccf_previous') | float(1) %}
          {{ (amt / ccf) | round(4) if amt > 0 and ccf > 0 else 1.9660 }}

      - name: "Electricity Effective Rate Last Year"
        unique_id: electricity_effective_rate_last_year
        unit_of_measurement: "$/kWh"
        state: >
          {% set amt = states('input_number.electricity_bill_amount_last_year') | float(0) %}
          {% set kwh = states('input_number.electricity_bill_kwh_last_year') | float(1) %}
          {{ (amt / kwh) | round(4) if amt > 0 and kwh > 0 else 0.3152 }}

      - name: "Gas Effective Rate Last Year"
        unique_id: gas_effective_rate_last_year
        unit_of_measurement: "$/CCF"
        state: >
          {% set amt = states('input_number.gas_bill_amount_last_year') | float(0) %}
          {% set ccf = states('input_number.gas_bill_ccf_last_year') | float(1) %}
          {{ (amt / ccf) | round(4) if amt > 0 and ccf > 0 else 1.6613 }}

      - name: "Electricity Rate Change MoM"
        unique_id: electricity_rate_change_mom
        unit_of_measurement: "%"
        state: >
          {% set cur = states('sensor.electricity_effective_rate') | float(0) %}
          {% set prev = states('sensor.electricity_effective_rate_previous') | float(0) %}
          {{ ((cur / prev - 1) * 100) | round(1) if prev > 0 and cur > 0 else 0 }}

      - name: "Gas Rate Change MoM"
        unique_id: gas_rate_change_mom
        unit_of_measurement: "%"
        state: >
          {% set cur = states('sensor.gas_effective_rate') | float(0) %}
          {% set prev = states('sensor.gas_effective_rate_previous') | float(0) %}
          {{ ((cur / prev - 1) * 100) | round(1) if prev > 0 and cur > 0 else 0 }}

      - name: "Electricity Usage Change MoM"
        unique_id: electricity_usage_change_mom
        unit_of_measurement: "%"
        state: >
          {% set cur = states('input_number.electricity_bill_kwh') | float(0) %}
          {% set prev = states('input_number.electricity_bill_kwh_previous') | float(0) %}
          {{ ((cur / prev - 1) * 100) | round(1) if prev > 0 and cur > 0 else 0 }}

      - name: "Gas Usage Change MoM"
        unique_id: gas_usage_change_mom
        unit_of_measurement: "%"
        state: >
          {% set cur = states('input_number.gas_bill_ccf') | float(0) %}
          {% set prev = states('input_number.gas_bill_ccf_previous') | float(0) %}
          {{ ((cur / prev - 1) * 100) | round(1) if prev > 0 and cur > 0 else 0 }}

      - name: "Electricity Bill Change MoM"
        unique_id: electricity_bill_change_mom
        unit_of_measurement: "%"
        state: >
          {% set cur = states('input_number.electricity_bill_amount') | float(0) %}
          {% set prev = states('input_number.electricity_bill_amount_previous') | float(0) %}
          {{ ((cur / prev - 1) * 100) | round(1) if prev > 0 and cur > 0 else 0 }}

      - name: "Gas Bill Change MoM"
        unique_id: gas_bill_change_mom
        unit_of_measurement: "%"
        state: >
          {% set cur = states('input_number.gas_bill_amount') | float(0) %}
          {% set prev = states('input_number.gas_bill_amount_previous') | float(0) %}
          {{ ((cur / prev - 1) * 100) | round(1) if prev > 0 and cur > 0 else 0 }}

      - name: "Electricity Rate Change YoY"
        unique_id: electricity_rate_change_yoy
        unit_of_measurement: "%"
        state: >
          {% set cur = states('sensor.electricity_effective_rate') | float(0) %}
          {% set ly = states('sensor.electricity_effective_rate_last_year') | float(0) %}
          {{ ((cur / ly - 1) * 100) | round(1) if ly > 0 and cur > 0 else 0 }}

      - name: "Gas Rate Change YoY"
        unique_id: gas_rate_change_yoy
        unit_of_measurement: "%"
        state: >
          {% set cur = states('sensor.gas_effective_rate') | float(0) %}
          {% set ly = states('sensor.gas_effective_rate_last_year') | float(0) %}
          {{ ((cur / ly - 1) * 100) | round(1) if ly > 0 and cur > 0 else 0 }}

      - name: "Electricity Usage Change YoY"
        unique_id: electricity_usage_change_yoy
        unit_of_measurement: "%"
        state: >
          {% set cur = states('input_number.electricity_bill_kwh') | float(0) %}
          {% set ly = states('input_number.electricity_bill_kwh_last_year') | float(0) %}
          {{ ((cur / ly - 1) * 100) | round(1) if ly > 0 and cur > 0 else 0 }}

      - name: "Gas Usage Change YoY"
        unique_id: gas_usage_change_yoy
        unit_of_measurement: "%"
        state: >
          {% set cur = states('input_number.gas_bill_ccf') | float(0) %}
          {% set ly = states('input_number.gas_bill_ccf_last_year') | float(0) %}
          {{ ((cur / ly - 1) * 100) | round(1) if ly > 0 and cur > 0 else 0 }}

      - name: "Electricity Bill Change YoY"
        unique_id: electricity_bill_change_yoy
        unit_of_measurement: "%"
        state: >
          {% set cur = states('input_number.electricity_bill_amount') | float(0) %}
          {% set ly = states('input_number.electricity_bill_amount_last_year') | float(0) %}
          {{ ((cur / ly - 1) * 100) | round(1) if ly > 0 and cur > 0 else 0 }}

      - name: "Gas Bill Change YoY"
        unique_id: gas_bill_change_yoy
        unit_of_measurement: "%"
        state: >
          {% set cur = states('input_number.gas_bill_amount') | float(0) %}
          {% set ly = states('input_number.gas_bill_amount_last_year') | float(0) %}
          {{ ((cur / ly - 1) * 100) | round(1) if ly > 0 and cur > 0 else 0 }}

      - name: "Gas Usage This Month"
        unique_id: gas_usage_this_month
        unit_of_measurement: "CCF"
        state: "{{ states('input_number.gas_bill_ccf') | float(0) }}"

      - name: "Gas DHW Usage Month"
        unique_id: gas_dhw_usage_month
        unit_of_measurement: "CCF"
        state_class: measurement
        state: >
          {% set dhw_thm = states('input_number.dhw_bill_thm') | float(0) %}
          {% if dhw_thm > 0 %}
             {{ (dhw_thm * 0.9643) | round(2) }}
          {% else %}
             {{ (states('input_number.gas_bill_ccf') | float(0) * 0.271) | round(2) }}
          {% endif %}

      - name: "Gas Heating Usage Month"
        unique_id: gas_heating_usage_month
        unit_of_measurement: "CCF"
        state_class: measurement
        state: >
          {% set total = states('input_number.gas_bill_ccf') | float(0) %}
          {% set dhw_thm = states('input_number.dhw_bill_thm') | float(0) %}
          {% if dhw_thm > 0 %}
             {% set dhw_ccf = dhw_thm * 0.9643 %}
             {{ [total - dhw_ccf, 0] | max | round(2) }}
          {% else %}
             {{ (total * 0.729) | round(2) }}
          {% endif %}

      - name: "Gas Cost This Month"
        unique_id: gas_cost_this_month
        unit_of_measurement: "$"
        state: "{{ states('input_number.gas_bill_amount') | float(0) }}"

      - name: "Gas Heating Cost Month"
        unique_id: gas_heating_cost_month
        unit_of_measurement: "$"
        state: >
          {% set total_cost = states('input_number.gas_bill_amount') | float(0) %}
          {% set total_ccf = states('input_number.gas_bill_ccf') | float(0) %}
          {% set dhw_thm = states('input_number.dhw_bill_thm') | float(0) %}
          {% if dhw_thm > 0 and total_ccf > 0 %}
             {% set dhw_ccf = dhw_thm * 0.9643 %}
             {% set heating_ccf = [total_ccf - dhw_ccf, 0] | max %}
             {{ (total_cost * (heating_ccf / total_ccf)) | round(2) }}
          {% else %}
             {# Fallback to fixed 71.9% heating share #}
             {# 2026-10-15: 72.9% [D: 574.1/787]; 71.9% read Navien therms as CCF #}
             {{ (total_cost * 0.729) | round(2) }}
          {% endif %}

      - name: "Total Cost Month"
        unique_id: total_cost_month
        unit_of_measurement: "$"
        state: >
          {% set amt = states('input_number.electricity_bill_amount') | float(124) %}
          {% set days = states('input_number.electricity_bill_days') | float(30) %}
          {{ ((amt / days) * now().day) | round(2) if days > 0 else 0 }}

      - name: "Total Utility Cost Month"
        unique_id: total_utility_cost_month
        unit_of_measurement: "$"
        state: >
          {% set electric = states('input_number.electricity_bill_amount') | float(0) %}
          {% set gas = states('input_number.gas_bill_amount') | float(0) %}
          {{ (electric + gas) | round(2) }}

      - name: "HVAC Cathedral Ceiling Impact MTD"
        unique_id: hvac_cathedral_ceiling_impact_mtd
        unit_of_measurement: "$"
        state: >
          {% set r2 = states('sensor.hvac_2f_heat_runtime_month_2') | float(0) %}
          {% set rate = states('input_number.furnace_heating_rate_btu_hr') | float(100000) %}
          {% set gas_rate = states('sensor.gas_effective_rate') | float(1.6818) %}
          {{ ((r2 * rate * 0.15 / 103700) * gas_rate) | round(2) }}

      # === SETBACK RECOMMENDATION SENSOR ===
      # Recommends setback depth based on forecast overnight low
      # Thresholds adjustable as data is collected in hvac_setback_log.csv
      - name: "Recommended Setback Depth"
        unique_id: recommended_setback_depth
        unit_of_measurement: "°F"
        state_class: measurement
        icon: mdi:thermometer-chevron-down
        availability: "{{ is_number(states('sensor.pirate_weather_today_low')) }}"
        state: >
          {% set low = states('sensor.pirate_weather_today_low') | float(0) %}
          {% if low > 30 %}5
          {% elif low > 15 %}3
          {% else %}1{% endif %}
        attributes:
          forecast_low: "{{ states('sensor.pirate_weather_today_low') }}"
          guidance: >
            {% set low = states('sensor.pirate_weather_today_low') | float(0) %}
            {% if low > 30 %}Mild night - deeper setback saves gas
            {% elif low > 15 %}Moderate cold - balanced setback
            {% else %}Very cold - shallow setback avoids recovery penalty{% endif %}

      - name: "Expected Runtime Today"
        unique_id: expected_runtime_today
        unit_of_measurement: "h"
        state_class: measurement
        icon: mdi:timer-outline
        availability: >
          {% set expected = states('sensor.expected_hdd_today') %}
          {# the `or is_number(runtime_legacy)` term read
              sensor.hvac_runtime_per_hdd_7_day_2, which does not exist, so it
              was always False. Removed 2026-08-22; identical. #}
          {% set runtime_primary = states('sensor.hvac_runtime_per_hdd_7_day') %}
          {{ is_number(expected) and is_number(runtime_primary) }}
        state: >
          {% set expected_hdd = states('sensor.expected_hdd_today') | float(0) %}
          {% set runtime_state = states('sensor.hvac_runtime_per_hdd_7_day') %}
          {# fallback to ..._7_day_2 removed 2026-08-22 - it does not exist,
              so runtime_state stayed non-numeric and `| float(0)` below gave 0
              either way. Identical. #}
          {% set runtime_per_hdd = runtime_state | float(0) %}
          {% if expected_hdd > 0 %}
            {{ (expected_hdd * runtime_per_hdd / 60) | round(2) }}
          {% else %}
            0
          {% endif %}
        attributes:
          runtime_per_hdd_source: >
            {% if is_number(states('sensor.hvac_runtime_per_hdd_7_day')) %}
              sensor.hvac_runtime_per_hdd_7_day
            {% else %}
              unavailable
            {% endif %}

      # Uses furnace runtime (not sum of zone calls) for consistency with expected
      - name: "Efficiency Deviation Index"
        unique_id: efficiency_deviation_index
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:gauge
        availability: >
          {{ is_number(states('sensor.hvac_furnace_runtime_today')) and
             is_number(states('sensor.expected_runtime_today')) }}
        state: >
          {% set actual = states('sensor.hvac_furnace_runtime_today') | float(0) %}
          {% set expected = states('sensor.expected_runtime_today') | float(0) %}
          {% if expected > 0.1 %}
            {{ (((actual / expected) - 1) * 100) | round(1) }}
          {% else %}
            0
          {% endif %}
        attributes:
          interpretation: >
            {% set dev = this.state | float(0) %}
            {% if dev > 15 %}Working harder than expected
            {% elif dev < -15 %}Outperforming baseline
            {% else %}Normal performance{% endif %}

      - name: "Expected Runtime Month"
        unique_id: expected_runtime_month
        unit_of_measurement: "h"
        state_class: measurement
        icon: mdi:timer-outline
        state: >
          {{ states('input_number.expected_runtime_sum_month') | float(0) | round(2) }}

      # Uses furnace runtime (not sum of zone calls) for consistency with expected
      - name: "Efficiency Deviation Month"
        unique_id: efficiency_deviation_month
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:gauge
        availability: >
          {{ states('sensor.hvac_furnace_runtime_month_2') not in ['unknown', 'unavailable'] }}
        state: >
          {% set actual = states('sensor.hvac_furnace_runtime_month_2') | float(0) %}
          {% set expected = states('input_number.expected_runtime_sum_month') | float(0) %}
          {% if expected > 0.1 %}
            {{ (((actual / expected) - 1) * 100) | round(1) }}
          {% else %}
            0
          {% endif %}

      # Uses furnace runtime (not sum of zone calls) for accurate efficiency metric
      # Now uses same HDD source as sensor.hvac_runtime_per_hdd_month for consistency
      - name: "Runtime per HDD Month"
        unique_id: runtime_per_hdd_month_calc
        unit_of_measurement: "min/HDD"
        state_class: measurement
        icon: mdi:chart-timeline-variant
        availability: >
          {{ states('sensor.hvac_furnace_runtime_month_2') not in ['unknown', 'unavailable'] and
             states('sensor.hvac_hdd65_cumulative_month') not in ['unknown', 'unavailable'] }}
        state: >
          {% set runtime = states('sensor.hvac_furnace_runtime_month_2') | float(0) %}
          {% set hdd = states('sensor.hvac_hdd65_cumulative_month') | float(0) %}
          {% if hdd > 0 %}
            {{ ((runtime * 60) / hdd) | round(1) }}
          {% else %}
            0
          {% endif %}
      # RETIRED 2026-08-31 - sensor.ups_apparent_internal_resistance and
      # sensor.ups_ir_temperature_compensated lived here. Deleted, not fixed (R10:
      # the answer to a second copy is always removal). Recorded rather than tidied
      # away, because the reason matters and the entity ids will outlive the code:
      #
      #   1. SECOND COPY. The UPS-Monitor firmware already computes this three ways
      #      from the LIVE measured current -- apparent_ri (settled step, V1.16),
      #      last_onset_step_resistance and last_recharge_step_resistance. The
      #      dashboard already read the firmware's version, not this one.
      #   2. STALE CONSTANT. It divided by a hardcoded `typical_i = 1.18` A. The
      #      measured onset current has been 1.956 A [M, sensor.ups_monitor_last_
      #      onset_current, 2026-08-29] since the 18 V boost went on the bus, so it
      #      would have read high by [D: 1.956 / 1.18 = 1.66].
      #   3. IT WAS ABOUT TO WAKE UP. Its availability guard needs
      #      last_float_voltage, which was never written because
      #      binary_sensor.ups_monitor_battery_fully_charged has never once been on
      #      (threshold 13.25 V against a PSU that has never exceeded 13.2705 V [M]).
      #      ups-monitor V1.17 fixes that threshold -- which would have brought this
      #      sensor back to life publishing 198.1 mOhm where the truth is 119.5 [D],
      #      against a 96.6 mOhm dashboard baseline. A dead wrong number is harmless;
      #      a live one that looks like battery degradation is not.
      #
      # `i_load` was also assigned from last_outage_ah and never used.
      # Full analysis: DIY-LiFePO4-UPS/reports/UPS_Report_2026-08-31_Boost_Integration.md


  - binary_sensor:
      - name: "Climate Adjusted Efficiency Alert"
        unique_id: climate_adjusted_efficiency_alert
        device_class: problem
        icon: mdi:alert-circle
        state: >
          {% set deviation = states('sensor.efficiency_deviation_index') | float(0) %}
          {% set expected_hdd = states('sensor.expected_hdd_today') | float(0) %}
          {% set actual_hdd = states('sensor.hvac_hdd65_today') | float(0) %}
          {# Only alert if: deviation > 15%, expected HDD > 20, and actual > expected #}
          {{ deviation > 15 and expected_hdd > 20 and actual_hdd > expected_hdd }}

      # --- HDD Pipeline Health ---
      - name: "HDD Pipeline Healthy"
        unique_id: hdd_pipeline_healthy
        icon: mdi:thermometer-check
        state: >
          {# 2026-09-23: the input is hvac_hdd65_today (KBDL, proxy fallback), not the proxy alone #}
          {% set input_ok = states('sensor.hvac_hdd65_today') not in ['unknown', 'unavailable'] %}
          {% set not_stale = is_state('binary_sensor.hdd_capture_stale', 'off') %}
          {% set valid_days = states('sensor.hdd_valid_days_7d') | int(0) %}
          {{ input_ok and not_stale and valid_days >= 5 }}

      # --- Runtime/HDD Pipeline Health ---
      - name: "Runtime per HDD Pipeline Healthy"
        unique_id: runtime_per_hdd_pipeline_healthy
        icon: mdi:chart-timeline-variant-shimmer
        state: >
          {% set hdd_healthy = is_state('binary_sensor.hdd_pipeline_healthy', 'on') %}
          {% set not_stale = is_state('binary_sensor.runtime_per_hdd_capture_stale', 'off') %}
          {% set data_count = states('sensor.hvac_runtime_per_hdd_data_count') | int(0) %}
          {{ hdd_healthy and not_stale and data_count >= 4 }}

      # --- Automation Failure Tracking ---
      - name: "Automation Failures Active"
        unique_id: automation_failures_active
        device_class: problem
        icon: mdi:alert-circle
        state: "{{ states('counter.automation_failures_24h') | int(0) > 0 }}"



# PLATFORM SENSORS
# ===============================================================
sensor:
  - platform: time_date
    display_options:
      - "time"
      - "date"

  - platform: statistics
    name: "HVAC Outdoor Temp Mean 24h"
    unique_id: hvac_outdoor_temp_mean_24h
    entity_id: sensor.hvac_outdoor_temp_hartford_proxy
    state_characteristic: mean
    max_age:
      hours: 24

  # Mean DP split over 24h — correlate with kWh/CDD to separate sensible vs latent load
  - platform: statistics
    name: "HVAC DP Split Mean 24h"
    unique_id: hvac_dp_split_mean_24h
    entity_id: sensor.hvac_dp_split
    state_characteristic: mean
    max_age:
      hours: 24
    precision: 1

  - platform: history_stats
    name: "HVAC 2F Heat Cycles Today"
    unique_id: hvac_2f_heat_cycles_today
    entity_id: binary_sensor.hvac_2f_call_for_heat
    state: "on"
    type: count
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "HVAC 2F Heat Runtime Today"
    unique_id: hvac_2f_heat_runtime_today
    entity_id: binary_sensor.hvac_2f_call_for_heat
