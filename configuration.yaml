      # === MONTH METRICS ===
      - name: "HVAC Total Cycles Month"
        unique_id: hvac_total_cycles_month
        unit_of_measurement: "cycles"
        state_class: measurement
        availability: >
          {{ states('sensor.hvac_1f_heat_cycles_month_2') not in ['unknown', 'unavailable'] and
