# ===============================================================
# INPUT BOOLEAN HELPERS
# ===============================================================
input_boolean:
  # ---------------------------------------------------------------------
  # CREATED 2026-08-21. CLAUDE.md has mandated "MUST wrap every
  # shell_command call with ha_maintenance_mode guard" for a long time, but
  # the input_boolean itself had never been defined - the only reference in
  # the whole config was the guard added that day. A condition on a
  # non-existent entity evaluates to `unknown`, which never equals "off", so
  # the guard would have silently prevented the guarded automation from ever
  # running. A safety interlock that disables the thing it protects is the
  # same failure class as a watchdog that goes unavailable.
  # Turn ON before hand-editing config, running migrations, or restoring
  # buffers; guarded shell_commands then skip instead of racing you.
  ha_maintenance_mode:
    name: "HA Maintenance Mode"
    icon: mdi:wrench-clock
    initial: off

  hvac_1f_setback_active:
    name: "HVAC 1F Setback Active"
    icon: mdi:thermometer-minus

  hvac_2f_setback_active:
    name: "HVAC 2F Setback Active"
    icon: mdi:thermometer-minus

  hvac_1f_recovering:
    name: "HVAC 1F Recovering"
    icon: mdi:thermometer-plus

  hvac_2f_recovering:
    name: "HVAC 2F Recovering"
    icon: mdi:thermometer-plus

  # === LOCAL (UNIT) CONTROL - COMMISSIONING MODE (2026-08-03) ===
  # ON  = the E080 runs on its OWN onboard humidistat. HA, the ESP32-C3
  #       node and the SHT45 are MONITORING ONLY. HA will hold the plug
  #       powered and will not switch it off for any reason.
  # OFF = normal HA control (RH band + envelope guards).
  #
  # This exists because the commissioning question - "what does this
  # machine do on its own?" - cannot be answered while a controller is
  # sitting on top of it. It is also the only clean way to capture the
  # native power trace needed to retune dehumidifier_power_threshold,
  # which is currently 250 W and tuned to a machine that no longer
  # exists.
  #
  # WHAT THIS TURNS OFF, explicitly, so it is never a surprise:
  #   dehumidifier_auto_on              - RH band start
  #   dehumidifier_auto_off             - RH band stop + condensation veto
  #   dehumidifier_force_on_backstop    - mold ceiling + condensation limb
  #   dehumidifier_max_runtime_backstop - runtime cap
  #   dehumidifier_rh_stall_shutdown    - DP stall cut-out
  #   dehumidifier_sensor_loss_shutdown - dead-sensor cut-out
  #
  # That is EVERY HA-side stop. Accepted for a supervised commissioning
  # window and not beyond it, which is why there is a nagging reminder.
  # The residual protection is real but is all inside the E080: its own
  # humidistat (~50 % RH, below the 60 % mold ceiling), its suction-line
  # frost sensor, and its E4 insufficient-capacity diagnostic. Note that
  # a latched E4 clears only on a power cycle and is invisible to HA.
  dehumidifier_local_control:
    name: "Dehumidifier Local (Unit) Control"
    icon: mdi:tune-vertical

