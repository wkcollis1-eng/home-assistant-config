             and is_number(states('sensor.hvac_ac_cycle_sigma_7d')) }}
        state: >
          {% set mean = states('sensor.hvac_ac_cycle_mean_7d') | float(0) %}
          {% set stddev = states('sensor.hvac_ac_cycle_sigma_7d') | float(0) %}
