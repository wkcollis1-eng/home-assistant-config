            {% set avg = (high + low) / 2 %}
            {% set ns.total = ns.total + [65 - avg, 0] | max %}
          {% endfor %}
          {{ ns.total | round(1) }}

# ===============================================================
# ===============================================================
# UTILITY METERS (added 2026-06) - dehumidifier energy daily/monthly
# ===============================================================
utility_meter:
  dehumidifier_energy_daily:
    source: sensor.dehumidifier_energy
    name: "Dehumidifier Energy Daily"
    cycle: daily
  dehumidifier_energy_monthly:
    source: sensor.dehumidifier_energy
    name: "Dehumidifier Energy Monthly"
    cycle: monthly

# PLATFORM SENSORS
# ===============================================================
sensor:
  - platform: integration
    source: sensor.dehumidifier_current_consumption
    name: "Dehumidifier Energy"
    unique_id: dehumidifier_energy_kwh
    unit_prefix: k
    unit_time: h
    method: trapezoidal
    round: 3
    max_sub_interval:
      minutes: 5

  # dp slope (deg F/hr) over 30-min window -> drives removal/ingress rate sensors
  - platform: derivative
    source: sensor.basement_dew_point
    name: "Basement DP Rate"
    unique_id: basement_dp_rate
    unit_time: h
    time_window: "00:30:00"
    round: 2

  # =================================================================
  # CANONICAL RATE-OF-CHANGE SET (added 2026-08-07)
  # =================================================================
  # ONE estimator form for every rate in the dehumidifier stack:
  # platform: derivative, unit_time h, NATURAL SIGN.
  #
  # UNITS: derived automatically. unit_time: h makes the unit
  # <source unit>/h, which is already what each of these wants:
  #   basement_dew_point            degF     -> degF/h
  #   ..._basement_humidity         %        -> %/h
  #   ..._basement_temperature      degF     -> degF/h   <- the fix
  #   ..._basement_absolute_humidity g/m3    -> g/m3/h
  #
  # DO NOT add unit_of_measurement: here. It is a config-flow (UI
  # helper) field only and is NOT in the derivative YAML
  # PLATFORM_SCHEMA — HA rejects the whole platform entry with
  # "'unit_of_measurement' is an invalid option for 'sensor.derivative'",
  # which silently takes out every derivative sensor in the block,
  # including basement_dp_rate and therefore the removal/ingress
  # sensors and the stall detector that read it. The legacy YAML key
  # was `unit:` (deprecated, and reported not to behave); leaving the
  # unit derived is both correct and simpler.
  #
  #     NEGATIVE = the quantity is FALLING
  #     POSITIVE = the quantity is RISING
  #
  # For moisture that reads directly: negative = drying.
  #
  # TWO WINDOWS, one formula. The window is a parameter chosen per
  # job, and the choice is forced by arithmetic, not taste:
  #
  #   30 min — TREND / diagnostic, and the stall detector.
  #            Slope noise goes roughly as sigma*sqrt(2)/T. At the
  #            SHT45 dew-point scatter of ~0.05 degF documented on
  #            sensor.basement_dew_point, a 30-min window gives about
  #            0.14 degF/h — just under the 0.15 degF/h stall
  #            threshold. A 10-min window would give ~0.42 degF/h,
  #            nearly 3x the threshold, so the stall detector MUST
  #            stay on the 30-min series.
  #
  #   10 min — WITHIN-CYCLE. Measured E080 runs are 15.6 to 30.3 min,
  #            so a 30-min window can never fill inside a run: it
  #            always contains off-period data where dew point is
  #            RISING, which nets against the falling run data. The
  #            10-min pair below is what the removal/ingress sensors
  #            read. Against a productive signal of -3.9 to -5.4
  #            degF/h, ~0.42 degF/h of noise is 8-11 % — fine.
  #
  # NB the SHT45 itself is not the constraint (tau63 is seconds for
  # both RH and T). The constraints are the smoothing window and the
  # ~1-2 min transport lag from the machine end to the node alcove.
  # =================================================================

  # --- 30-min trend set -------------------------------------------
  - platform: derivative
    source: sensor.basement_th_node_basement_humidity
    name: "Basement RH Rate"
    unique_id: basement_rh_rate
    unit_time: h
    time_window: "00:30:00"
    round: 2

  # THE degC/h -> degF/h FIX, done at the root rather than by scaling.
  # sensor.basement_th_node_basement_temp_rate_30m is published by the
  # ESPHome node in degC/h, because the node derives its slope from the
  # SHT45 native Celsius reading while publishing temperature in degF.
  # Taking the derivative here off the node degF temperature gives
  # degF/h directly AND uses the same estimator as every other rate.
  # Scaling the node sensor by 9/5 would have left a fifth formula.
  # For the record: a rate is a difference per unit time, so only the
  # 9/5 scale applies and the +32 offset does NOT.
  # 1 degC/h = 1.8 degF/h, and 0 degC/h = 0 degF/h, not 32.
  - platform: derivative
    source: sensor.basement_th_node_basement_temperature
    name: "Basement Temp Rate"
    unique_id: basement_temp_rate
    unit_time: h
    time_window: "00:30:00"
    round: 2

  # Absolute humidity — the honest dehumidification metric. RH and dew
  # point both fall when the compressor merely heats the room; AH does
  # not. This is the series that would have caught the Santa Fe frosted
  # coil immediately (148 kWh/litre, AH never moved).
  - platform: derivative
    source: sensor.basement_th_node_basement_absolute_humidity
    name: "Basement AH Rate"
    unique_id: basement_ah_rate
    unit_time: h
    time_window: "00:30:00"
    round: 3

  # --- 10-min within-cycle pair -----------------------------------
  - platform: derivative
    source: sensor.basement_dew_point
    name: "Basement DP Rate 10m"
    unique_id: basement_dp_rate_10m
    unit_time: h
    time_window: "00:10:00"
    round: 2

  # CAVEAT worth keeping in view: the basement is ~60 % moisture-
  # buffered and dAH/dT = +0.204 g/m3/degF, so a 0.5 degF AC-driven
  # temperature swing injects real apparent AH rate. That artefact is
  # larger on shorter windows. Read this series against the compressor
  # trace, not on its own.
  - platform: derivative
    source: sensor.basement_th_node_basement_absolute_humidity
    name: "Basement AH Rate 10m"
    unique_id: basement_ah_rate_10m
    unit_time: h
    time_window: "00:10:00"
    round: 3

